<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雪山サバイバル</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:#e5e7e9;
  color:#202427;
}

body{
  min-height:100dvh;
}

button,a{
  font:inherit;
}

button{
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

.game{
  position:relative;
  width:min(100%,540px);
  height:100dvh;
  margin:0 auto;
  padding:
    calc(5px + env(safe-area-inset-top))
    6px
    calc(6px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:4px;
  overflow:hidden;
}


/* =========================
   TOP
========================= */

.topbar{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:36px 52px 80px minmax(0,1fr);
  gap:4px;
  align-items:center;
}

.back{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #999;
  border-radius:9px;
  background:#fff;
  color:#222;
  text-decoration:none;
  font-size:22px;
  font-weight:900;
  line-height:1;
}

.top-small{
  height:36px;
  padding:0 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #aaa;
  border-radius:9px;
  background:#fff;
  font-size:13px;
  font-weight:800;
  line-height:1;
  white-space:nowrap;
}

.place{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* =========================
   メーター
========================= */

.meters{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}

.meter{
  height:32px;
  min-width:0;
  padding:2px 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  border:1px solid #aaa;
  border-radius:9px;
  background:#fff;
}

.meter-icon{
  width:18px;
  height:18px;
  flex:0 0 18px;
}

.meter-outline{
  fill:none;
  stroke:#262626;
  stroke-width:1.5;
  stroke-linejoin:round;
  stroke-linecap:round;
}

.meter-value{
  min-width:0;
  font-size:13px;
  font-weight:900;
  line-height:1;
  white-space:nowrap;
}


/* =========================
   シーン
========================= */

.scene-wrap{
  position:relative;
  width:97%;
  margin:0 auto;
  flex:0 0 auto;
  padding-bottom:122px;
}

.scene{
  position:relative;
  width:100%;
  height:min(61dvh,570px);
  min-height:490px;
  overflow:hidden;
  border:1px solid #8c9296;
  border-radius:13px;
  background:#ddd;
}

.scene-background{
  position:absolute;
  inset:0;
  z-index:1;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  pointer-events:none;
  transition:
    filter .28s ease,
    transform .28s ease;
}

.scene-background.portrait-focus{
  filter:
    blur(4px)
    brightness(.93);
  transform:scale(1.025);
}


/* =========================
   拾える物
========================= */

.scene-objects{
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;
}

.scene-object{
  position:absolute;
  display:block;
  margin:0;
  padding:0;
  border:0;
  background:transparent;
  pointer-events:auto;
}

.scene-object img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  filter:
    drop-shadow(1px 0 0 #698594)
    drop-shadow(-1px 0 0 #698594)
    drop-shadow(0 1px 0 #698594)
    drop-shadow(0 -1px 0 #698594)
    drop-shadow(0 2px 2px rgba(0,0,0,.25));
}

.branch-object{
  width:76px;
  height:76px;
}

.branch-object img{
  width:58px;
  height:58px;
  margin:9px;
}

.stone-object{
  width:66px;
  height:66px;
}

.stone-object img{
  width:48px;
  height:48px;
  margin:9px;
}


/* =========================
   グラント
========================= */

.character-layer{
  position:absolute;
  inset:0;
  z-index:7;
  pointer-events:none;
}

.character-sprite{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:min(66%,340px);
  height:min(82%,470px);

  padding:0;

  display:none;

  pointer-events:auto;

  border:3px solid #87652c;
  border-radius:3px;

  outline:1px solid #c7a253;
  outline-offset:-8px;

  background:#f5f0e2;

  box-shadow:
    0 7px 18px rgba(0,0,0,.22),
    inset 0 0 0 1px rgba(255,255,255,.85);

  overflow:hidden;
}

.character-sprite.visible{
  display:block;
}

.character-sprite::before{
  content:"";
  position:absolute;
  inset:5px;
  z-index:3;
  border:1px solid rgba(111,77,24,.62);
  pointer-events:none;
}

.character-sprite img{
  position:absolute;

  left:50%;
  top:53%;

  width:142%;
  height:142%;

  transform:translate(-50%,-50%);

  object-fit:contain;
  object-position:center;

  pointer-events:none;

  filter:
    drop-shadow(
      0 3px 3px
      rgba(0,0,0,.16)
    );
}


/* =========================
   イベント一枚絵
========================= */

.event-layer{
  position:absolute;
  inset:0;
  z-index:20;
  display:none;
  background:#111;
  pointer-events:none;
}

.event-layer.visible{
  display:block;
}

.event-layer img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}


/* =========================
   扉
========================= */

.door-hotspot{
  position:absolute;
  z-index:12;
  display:none;
  padding:0;
  border:2px solid rgba(104,139,156,.88);
  border-radius:7px;

  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,.02) 10%,
      rgba(210,235,246,.22) 42%,
      rgba(255,255,255,.38) 50%,
      rgba(210,235,246,.18) 58%,
      rgba(255,255,255,.02) 90%
    );

  box-shadow:
    0 0 7px rgba(187,226,242,.75),
    inset 0 0 8px rgba(255,255,255,.18);

  overflow:hidden;
}

.door-hotspot.visible{
  display:block;
}

.door-hotspot::after{
  content:"";
  position:absolute;
  top:-30%;
  left:-70%;
  width:38%;
  height:160%;
  transform:rotate(13deg);

  background:
    linear-gradient(
      to right,
      transparent,
      rgba(255,255,255,.34),
      transparent
    );

  animation:doorSheen 3.2s ease-in-out infinite;
}

@keyframes doorSheen{
  0%,55%{
    left:-70%;
  }

  82%,100%{
    left:135%;
  }
}


/* =========================
   会話DIV
========================= */

.message-panel{
  position:absolute;

  left:9px;

  /*
    方向キーより上へ置く
  */
  top:calc(100% - 258px);

  z-index:30;

  /*
    横長
  */
  width:calc(100% - 18px);

  height:120px;

  padding:
    13px
    14px
    42px
    14px;

  overflow:hidden;

  border:1px solid #979797;
  border-radius:14px;

  background:rgba(255,255,255,.96);

  box-shadow:
    0 4px 12px
    rgba(0,0,0,.10);

  transition:
    width .20s ease,
    height .20s ease,
    top .20s ease;

  cursor:pointer;
}

.message-panel.closed{
  width:60px;
  height:54px;

  /*
    閉じたボタンも方向キーに重ならない
  */
  top:calc(100% - 180px);

  padding:0;
}

.message-panel.closed .message-text,
.message-panel.closed .message-progress,
.message-panel.closed .message-choice{
  display:none;
}

.message-text{
  height:64px;

  overflow:hidden;

  font-size:17px;
  line-height:1.42;

  font-weight:650;

  white-space:pre-wrap;
  word-break:break-word;

  pointer-events:none;
}

.message-progress{
  position:absolute;

  left:62px;
  bottom:13px;

  font-size:12px;
  line-height:1;

  color:#666;

  font-weight:700;

  pointer-events:none;
}


/*
  「次へ」ボタンは無し。

  選択がある時だけ
  このボタンが出る。
*/
.message-choice{
  position:absolute;

  right:12px;
  bottom:9px;

  min-width:132px;
  height:38px;

  padding:0 16px;

  border:2px solid #93651f;
  border-radius:10px;

  background:
    linear-gradient(
      180deg,
      #fff6df 0%,
      #e8c16e 100%
    );

  box-shadow:
    0 2px 8px
    rgba(106,70,17,.25);

  color:#3b2506;

  font-size:16px;
  font-weight:900;
}

.message-choice.hidden{
  display:none;
}


/*
  ◀ / ▶ は会話DIVの中
*/
.message-toggle{
  position:absolute;

  left:10px;
  bottom:8px;

  z-index:3;

  width:40px;
  height:36px;

  padding:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid #888;
  border-radius:8px;

  background:#d7d8d9;

  color:#222;

  font-size:18px;
  line-height:1;

  font-weight:900;
}


/* =========================
   視界効果
========================= */

.cold-vision{
  position:fixed;
  inset:0;
  z-index:50;
  pointer-events:none;

  background:
    rgba(
      255,
      255,
      255,
      var(--cold-opacity,0)
    );
}

.health-vision{
  position:fixed;
  inset:0;
  z-index:51;
  pointer-events:none;

  background:
    radial-gradient(
      circle at center,
      rgba(150,0,0,0) 31%,
      rgba(
        150,
        0,
        0,
        var(--red-opacity,0)
      )
      100%
    );
}


/* =========================
   方向キー
========================= */

.control-cluster{
  position:absolute;

  /*
    右端から離して
    全体を少し左へ
  */
  right:42px;

  bottom:
    calc(
      8px
      +
      env(safe-area-inset-bottom)
    );

  z-index:42;

  width:128px;
  height:160px;
}


/*
  目は↑の右上。
  右矢印には重ならない。
*/
.look-button{
  position:absolute;

  top:0;
  right:0;

  width:42px;
  height:42px;

  margin:0;
  padding:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid #8d8d8d;
  border-radius:11px;

  background:rgba(255,255,255,.88);

  color:#252525;
}

.look-button svg{
  width:25px;
  height:25px;

  fill:none;

  stroke:currentColor;
  stroke-width:1.8;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.look-button:disabled{
  opacity:.25;
}

.move-pad{
  position:absolute;

  left:0;
  top:42px;

  display:grid;

  grid-template-columns:
    repeat(3,36px);

  grid-template-rows:
    repeat(3,36px);

  gap:5px;
}

.direction,
.menu-key{
  width:36px;
  height:36px;

  padding:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border:
    1px solid
    rgba(55,55,55,.38);

  border-radius:10px;

  font-weight:900;
  line-height:1;
}

.direction{
  background:rgba(108,108,108,.57);
  color:#222;
  font-size:18px;
}

.direction.active{
  opacity:.88;
}

.direction.inactive{
  opacity:.13;
  background:rgba(130,130,130,.28);
}

.menu-key{
  background:rgba(82,82,82,.72);
  color:#fff;
  font-size:9px;
}

#moveUp{
  grid-column:2;
  grid-row:1;
}

#moveLeft{
  grid-column:1;
  grid-row:2;
}

#menuKey{
  grid-column:2;
  grid-row:2;
}

#moveRight{
  grid-column:3;
  grid-row:2;
}

#moveDown{
  grid-column:2;
  grid-row:3;
}


/* =========================
   MENU
========================= */

.game-menu-overlay{
  position:fixed;
  inset:0;
  z-index:120;
  display:none;
  align-items:center;
  justify-content:center;

  padding:
    calc(15px + env(safe-area-inset-top))
    12px
    calc(15px + env(safe-area-inset-bottom));

  background:rgba(30,30,30,.54);
}

.game-menu-overlay.open{
  display:flex;
}

.game-menu-window{
  position:relative;
  width:min(500px,100%);
  height:min(620px,78dvh);
  display:flex;
  flex-direction:column;
  border:1px solid #7f8386;
  border-radius:15px;
  background:#f7f7f7;
  overflow:hidden;
}

.menu-tabs-area{
  position:relative;
  flex:0 0 auto;
  min-height:54px;
  padding:10px 48px 0 8px;
  display:flex;
  align-items:flex-end;
  overflow-x:auto;
  background:#dfe2e4;
  border-bottom:1px solid #969a9d;
}

.menu-tab{
  position:relative;
  min-width:94px;
  height:38px;
  margin-right:-1px;
  padding:0 12px;
  border:1px solid #969a9d;
  border-bottom:0;
  border-radius:10px 10px 0 0;
  background:#cfd3d5;
  color:#333;
  font-size:14px;
  font-weight:800;
  white-space:nowrap;
}

.menu-tab.active{
  z-index:2;
  height:42px;
  background:#fff;
  color:#111;
}

.menu-tab.hidden{
  display:none;
}

.menu-close{
  position:absolute;
  top:8px;
  right:8px;
  z-index:5;
  width:36px;
  height:36px;
  border:1px solid #888;
  border-radius:9px;
  background:#fff;
  font-size:20px;
  font-weight:900;
}

.menu-content{
  flex:1 1 auto;
  min-height:0;
  padding:15px;
  overflow:auto;
  background:#fff;
}

.menu-panel{
  display:none;
}

.menu-panel.active{
  display:block;
}

.menu-panel-title{
  margin:0 0 12px;
  font-size:21px;
}

.placeholder,
.empty-message{
  padding:18px 8px;
  text-align:center;
  font-size:17px;
  line-height:1.6;
  color:#555;
}

.item-row{
  min-height:52px;
  padding:10px 4px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border-bottom:1px solid #ddd;
}

.item-name,
.item-count{
  font-size:17px;
  font-weight:800;
}


/* =========================
   DEAD
========================= */

.dead-modal{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.84);
}

.dead-modal.open{
  display:flex;
}

.dead-card{
  width:min(400px,100%);
  padding:24px 18px;
  border-radius:17px;
  background:#f6f6f6;
  text-align:center;
}

.dead-title{
  margin:0;
  font-size:34px;
}

.dead-reason{
  margin:15px 0 20px;
  font-size:17px;
  line-height:1.5;
}

.restart-button{
  width:100%;
  min-height:52px;
  border:1px solid #777;
  border-radius:13px;
  background:#fff;
  font-size:17px;
  font-weight:900;
}


/* =========================
   小さいスマホ
========================= */

@media(max-width:390px){

  .topbar{
    grid-template-columns:
      34px
      48px
      76px
      minmax(0,1fr);
  }

  .back{
    width:34px;
    height:34px;
  }

  .top-small{
    height:34px;
    font-size:12px;
  }

  .meter{
    height:30px;
  }

  .meter-value{
    font-size:12px;
  }

  .scene{
    min-height:470px;
  }

  .character-sprite{
    width:68%;
    height:80%;
  }

  .control-cluster{
    right:34px;
  }
}

</style>
</head>


<body>

<main id="game" class="game">

<header class="topbar">

  <a
    class="back"
    href="survival%20game_TOP.html"
    aria-label="戻る"
  >
    ←
  </a>

  <div id="day" class="top-small">
    Day.1
  </div>

  <div id="clock" class="top-small">
    08:00:00
  </div>

  <div
    id="currentPlace"
    class="top-small place"
  >
    針葉樹林
  </div>

</header>


<section class="meters">

<div class="meter">

<svg
  class="meter-icon"
  viewBox="0 0 24 24"
>
<defs>
<clipPath id="tempClip">
<rect
  id="tempClipRect"
  x="0"
  y="0"
  width="24"
  height="24"
></rect>
</clipPath>
</defs>

<path
  id="tempFill"
  clip-path="url(#tempClip)"
  d="M12 2C9.8 2 8 3.8 8 6v8.1C6.7 15.3 6 17 6 18.7 6 22 8.7 24 12 24s6-2 6-5.3c0-1.7-.7-3.4-2-4.6V6c0-2.2-1.8-4-4-4Z"
></path>

<path
  class="meter-outline"
  d="M12 2C9.8 2 8 3.8 8 6v8.1C6.7 15.3 6 17 6 18.7 6 22 8.7 24 12 24s6-2 6-5.3c0-1.7-.7-3.4-2-4.6V6c0-2.2-1.8-4-4-4Z"
></path>
</svg>

<div
  id="tempValue"
  class="meter-value"
>
36.7℃
</div>

</div>


<div class="meter">

<svg
  class="meter-icon"
  viewBox="0 0 24 24"
>
<defs>
<clipPath id="hungerClip">
<rect
  id="hungerClipRect"
  x="0"
  y="0"
  width="24"
  height="24"
></rect>
</clipPath>
</defs>

<path
  id="hungerFill"
  clip-path="url(#hungerClip)"
  d="M12 7C9.5 4.5 5.2 5.4 3.8 8.6 1.7 13.4 5.2 20.5 9.3 22c1.2.4 2-.3 2.7-.7.7.4 1.5 1.1 2.7.7 4.1-1.5 7.6-8.6 5.5-13.4C18.8 5.4 14.5 4.5 12 7Z"
></path>

<path
  class="meter-outline"
  d="M12 7C9.5 4.5 5.2 5.4 3.8 8.6 1.7 13.4 5.2 20.5 9.3 22c1.2.4 2-.3 2.7-.7.7.4 1.5 1.1 2.7.7 4.1-1.5 7.6-8.6 5.5-13.4C18.8 5.4 14.5 4.5 12 7Z"
></path>
</svg>

<div
  id="hungerValue"
  class="meter-value"
>
100
</div>

</div>


<div class="meter">

<svg
  class="meter-icon"
  viewBox="0 0 24 24"
>
<defs>
<clipPath id="staminaClip">
<rect
  id="staminaClipRect"
  x="0"
  y="0"
  width="24"
  height="24"
></rect>
</clipPath>
</defs>

<path
  id="staminaFill"
  clip-path="url(#staminaClip)"
  d="M12 21C10.7 19.8 4.3 15.5 2.6 11.6.6 7.2 3.5 3.5 7.4 3.5c2.1 0 3.6 1.2 4.6 2.6 1-1.4 2.5-2.6 4.6-2.6 3.9 0 6.8 3.7 4.8 8.1C19.7 15.5 13.3 19.8 12 21Z"
></path>

<path
  class="meter-outline"
  d="M12 21C10.7 19.8 4.3 15.5 2.6 11.6.6 7.2 3.5 3.5 7.4 3.5c2.1 0 3.6 1.2 4.6 2.6 1-1.4 2.5-2.6 4.6-2.6 3.9 0 6.8 3.7 4.8 8.1C19.7 15.5 13.3 19.8 12 21Z"
></path>
</svg>

<div
  id="staminaValue"
  class="meter-value"
>
100
</div>

</div>

</section>


<section class="scene-wrap">

<div
  id="scene"
  class="scene"
>

<div
  id="sceneBackground"
  class="scene-background"
></div>

<div
  id="objectLayer"
  class="scene-objects"
></div>


<div
  id="characterLayer"
  class="character-layer"
>

<button
  id="grantCharacter"
  class="character-sprite"
  type="button"
  aria-label="グラント"
>

<img
  id="grantCharacterImage"
  src="assets/survival/grant_normal.png"
  alt="グラント"
>

</button>

</div>


<div
  id="eventLayer"
  class="event-layer"
>

<img
  id="eventImage"
  alt="イベント"
>

</div>


<button
  id="doorHotspot"
  class="door-hotspot"
  type="button"
></button>

</div>


<div
  id="messagePanel"
  class="message-panel closed"
>

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}

  );

}


function renderClock(){

  const total =
    Math.floor(
      gameSeconds
    );

  const day =
    Math.floor(
      total
      /
      86400
    )
    +
    1;

  const secondsToday =
    total
    %
    86400;

  const hour =
    Math.floor(
      secondsToday
      /
      3600
    );

  const minute =
    Math.floor(
      (
        secondsToday
        %
        3600
      )
      /
      60
    );

  const second =
    secondsToday
    %
    60;


  document.getElementById(
    'day'
  ).textContent =
    'Day.'
    +
    day;


  document.getElementById(
    'clock'
  ).textContent =
    String(
      hour
    ).padStart(
      2,
      '0'
    )
    +
    ':'
    +
    String(
      minute
    ).padStart(
      2,
      '0'
    )
    +
    ':'
    +
    String(
      second
    ).padStart(
      2,
      '0'
    );

}


function setFillLevel(
  id,
  percent
){

  const value =
    clamp(
      percent,
      0,
      100
    );

  const height =
    24
    *
    value
    /
    100;

  const rect =
    document.getElementById(
      id
    );

  rect.setAttribute(
    'y',
    24 - height
  );

  rect.setAttribute(
    'height',
    height
  );

}


function normalColor(
  value
){

  if(
    value <= 20
  ){
    return '#c62828';
  }

  if(
    value <= 40
  ){
    return '#d6a000';
  }

  return '#151515';

}


function temperatureColor(){

  if(
    bodyTemperature < 33
  ){
    return '#c62828';
  }

  if(
    bodyTemperature < 35
  ){
    return '#d6a000';
  }

  return '#151515';

}

/* =========================
   会話
========================= */

function renderMessage(){

  if(
    !messagePages.length
  ){

    messageText.textContent =
      '';

    messageProgress.textContent =
      '';

    messageChoice.classList.add(
      'hidden'
    );

    return;

  }


  const page =
    messagePages[
      messageIndex
    ];


  messageText.textContent =
    typeof page
    ===
    'string'
      ?
      page
      :
      page.text;


  messageProgress.textContent =
    (
      messageIndex
      +
      1
    )
    +
    ' / '
    +
    messagePages.length;


  const last =
    messageIndex
    ===
    messagePages.length
    -
    1;


  const hasChoice =
    last
    &&
    typeof page
    ===
    'object'
    &&
    Boolean(
      page.action
    )
    &&
    Boolean(
      page.actionLabel
    );


  if(
    hasChoice
  ){

    messageChoice.textContent =
      page.actionLabel;

    messageChoice.classList.remove(
      'hidden'
    );

  }else{

    messageChoice.classList.add(
      'hidden'
    );

  }

}


function setMessageOpen(
  open
){

  messageOpen =
    open;


  messagePanel.classList.toggle(
    'closed',
    !open
  );


  messageToggle.textContent =
    open
      ?
      '◀'
      :
      '▶';


  renderDirections();

}


function showMessages(
  pages,
  options = {}
){

  messagePages =
    Array.isArray(
      pages
    )
      ?
      pages.slice()
      :
      [
        String(
          pages
        )
      ];


  messageIndex =
    0;


  finalMessageAction =
    options.finalAction
    ||
    null;


  renderMessage();

  setMessageOpen(
    true
  );

}


function hideMessage(){

  setMessageOpen(
    false
  );

}


function reopenMessage(){

  if(
    !messagePages.length
  ){
    return;
  }


  setMessageOpen(
    true
  );

}


/*
  会話DIVをタップした時

  次の文章あり
  → 次の文章

  最後でfinalActionあり
  → 実行

  最後で何も無し
  → 閉じる

  選択肢がある場合
  → DIVタップでは決定しない
*/
function advanceMessage(){

  if(
    !messagePages.length
  ){
    hideMessage();
    return;
  }


  const page =
    messagePages[
      messageIndex
    ];


  const last =
    messageIndex
    >=
    messagePages.length
    -
    1;


  const hasChoice =
    last
    &&
    typeof page
    ===
    'object'
    &&
    Boolean(
      page.action
    )
    &&
    Boolean(
      page.actionLabel
    );


  if(
    !last
  ){

    messageIndex++;

    renderMessage();

    return;

  }


  if(
    hasChoice
  ){

    /*
      選択肢がある時は
      選択ボタンを押すまで待つ
    */
    return;

  }


  if(
    finalMessageAction
  ){

    const action =
      finalMessageAction;


    finalMessageAction =
      null;


    hideMessage();


    action();

    return;

  }


  hideMessage();

}


/*
  横長の会話DIV本体をタップ
*/
messagePanel.addEventListener(
  'click',
  event=>{

    if(
      !messageOpen
    ){
      return;
    }


    if(
      event.target.closest(
        'button'
      )
    ){
      return;
    }


    advanceMessage();

  }
);


/*
  ◀ / ▶

  文は進めない。
  開閉だけ。
*/
messageToggle.addEventListener(
  'click',
  event=>{

    event.stopPropagation();


    if(
      messageOpen
    ){
      hideMessage();
    }else{
      reopenMessage();
    }

  }
);


/*
  選択肢
*/
messageChoice.addEventListener(
  'click',
  event=>{

    event.stopPropagation();


    if(
      !messageOpen
    ){
      return;
    }


    const page =
      messagePages[
        messageIndex
      ];


    if(
      typeof page
      !==
      'object'
      ||
      !page.action
    ){
      return;
    }


    const action =
      page.action;


    hideMessage();


    action();

  }
);


/* =========================
   時間・ステータス
========================= */

function applyDrain(
  seconds
){

  const minutes =
    seconds
    /
    60;


  bodyTemperature -=
    .008
    *
    minutes;


  hunger =
    clamp(
      hunger
      -
      .10
      *
      minutes,
      0,
      100
    );


  if(
    bodyTemperature
    <
    35
  ){

    stamina -=
      .08
      *
      minutes;

  }


  if(
    bodyTemperature
    <
    33
  ){

    stamina -=
      .30
      *
      minutes;

  }


  if(
    bodyTemperature
    <
    31
  ){

    stamina -=
      .55
      *
      minutes;

  }


  if(
    bodyTemperature
    <
    29
  ){

    stamina -=
      1.20
      *
      minutes;

  }


  stamina =
    clamp(
      stamina,
      0,
      100
    );


  renderMeters();

}


function advanceTime(
  seconds
){

  if(
    gameOver
  ){
    return;
  }


  gameSeconds +=
    seconds;


  applyDrain(
    seconds
  );


  renderClock();

}

function itemDef(
  id
){

  return typeof
    window.getSurvivalItem
    ===
    'function'
      ?
      window.getSurvivalItem(
        id
      )
      :
      null;

}


function renderSceneItems(){

  objectLayer.innerHTML =
    '';


  const scene =
    getScene();


  for(
    const item
    of
    scene.items
  ){

    if(
      pickedItems.has(
        item.id
      )
    ){
      continue;
    }


    const definition =
      itemDef(
        item.itemId
      );


    if(
      !definition
    ){
      continue;
    }


    const button =
      document.createElement(
        'button'
      );


    button.type =
      'button';


    button.className =
      'scene-object '
      +
      (
        item.itemId
        ===
        'branch_01'
          ?
          'branch-object'
          :
          'stone-object'
      );


    button.style.left =
      item.left
      +
      '%';


    button.style.top =
      item.top
      +
      '%';


    const image =
      document.createElement(
        'img'
      );


    image.src =
      definition.image
      ||
      '';


    image.alt =
      definition.name;


    button.appendChild(
      image
    );


    button.addEventListener(
      'click',
      ()=>{

        pickItem(
          item
        );

      }
    );


    objectLayer.appendChild(
      button
    );

  }

}


function pickItem(
  item
){

  if(
    isPaused()
  ){
    return;
  }


  const definition =
    itemDef(
      item.itemId
    );


  if(
    !definition
  ){
    return;
  }


  pickedItems.add(
    item.id
  );


  inventory[
    item.itemId
  ] =
    (
      inventory[
        item.itemId
      ]
      ||
      0
    )
    +
    1;


  renderSceneItems();

  renderInventory();


  showMessages(
    [
      definition.name
      +
      'を拾いました。'
    ]
  );

}


/* =========================
   扉
========================= */

function positionDoorHotspot(){

  if(
    currentScene
    !==
    'cabinFront'
  ){
    return;
  }


  const width =
    sceneElement.clientWidth;


  const height =
    sceneElement.clientHeight;


  const scale =
    Math.max(
      width
      /
      DOOR_META.sourceWidth,

      height
      /
      DOOR_META.sourceHeight
    );


  const renderedWidth =
    DOOR_META.sourceWidth
    *
    scale;


  const renderedHeight =
    DOOR_META.sourceHeight
    *
    scale;


  const offsetX =
    (
      width
      -
      renderedWidth
    )
    /
    2;


  const offsetY =
    (
      height
      -
      renderedHeight
    )
    /
    2;


  doorHotspot.style.left =
    (
      offsetX
      +
      DOOR_META.left
      *
      scale
    )
    +
    'px';


  doorHotspot.style.top =
    (
      offsetY
      +
      DOOR_META.top
      *
      scale
    )
    +
    'px';


  doorHotspot.style.width =
    (
      DOOR_META.width
      *
      scale
    )
    +
    'px';


  doorHotspot.style.height =
    (
      DOOR_META.height
      *
      scale
    )
    +
    'px';

}


function renderDoor(){

  if(
    getScene().hasDoor
  ){

    doorHotspot.classList.add(
      'visible'
    );


    requestAnimationFrame(
      positionDoorHotspot
    );

  }else{

    doorHotspot.classList.remove(
      'visible'
    );

  }

}


function inspectDoor(){

  if(
    isPaused()
  ){
    return;
  }


  showMessages(
    [

      '扉の近くの雪に、血の跡があります。',

      '血の跡は扉の中へ続いているようです。',

      '扉に手をかけます。',

      '……開いています。',

      {
        text:
          '中へ入りますか？',

        actionLabel:
          '中に入る',

        action:
          enterCabin
      }

    ]
  );

}


function enterCabin(){

  currentScene =
    'cabinInside';


  renderScene();


  showMessages(
    [
      '山小屋の中へ入ります。'
    ],
    {
      finalAction:
        ()=>{

          runSurvivalEvent(
            'cabin_grant_first_meeting'
          );

        }
    }
  );

}


doorHotspot.addEventListener(
  'click',
  inspectDoor
);


/* =========================
   イベント画像
========================= */

function showEventImage(
  src
){

  eventImage.src =
    src;


  eventLayer.classList.add(
    'visible'
  );

}


function hideEventImage(){

  eventLayer.classList.remove(
    'visible'
  );


  eventImage.removeAttribute(
    'src'
  );

}


/* =========================
   グラント
========================= */

function showGrantCharacter(
  src
){

  if(
    src
  ){

    grantCharacterImage.src =
      src;

  }


  grantCharacter.classList.add(
    'visible'
  );


  sceneBackground.classList.add(
    'portrait-focus'
  );

}


function hideGrantCharacter(){

  grantCharacter.classList.remove(
    'visible'
  );


  sceneBackground.classList.remove(
    'portrait-focus'
  );

}


function renderCharacter(){

  if(
    currentScene
    ===
    'cabinInside'
    &&
    metSurvivor
    &&
    !eventActive
  ){

    showGrantCharacter(
      (
        window.SURVIVAL_EVENTS
        &&
        SURVIVAL_EVENTS.assets.grantNormal
      )
      ||
      'assets/survival/grant_normal.png'
    );

  }else{

    hideGrantCharacter();

  }

}


/* =========================
   イベント
========================= */

function runSurvivalEvent(
  eventId
){

  if(
    !window.SURVIVAL_EVENTS
  ){
    return;
  }


  const data =
    SURVIVAL_EVENTS.getEvent(
      eventId
    );


  if(
    !data
  ){
    return;
  }


  if(
    !SURVIVAL_EVENTS.shouldRun(
      eventId
    )
  ){

    if(
      eventId
      ===
      'cabin_grant_first_meeting'
    ){

      metSurvivor =
        true;

    }


    renderCharacter();

    renderDirections();

    return;

  }


  eventActive =
    true;


  activeEventId =
    eventId;


  eventSteps =
    data.steps.slice();


  eventStepIndex =
    0;


  hideGrantCharacter();

  hideEventImage();

  renderDirections();

  runNextEventStep();

}


function runNextEventStep(){

  if(
    !eventActive
  ){
    return;
  }


  if(
    eventStepIndex
    >=
    eventSteps.length
  ){

    finishEvent();

    return;

  }


  const step =
    eventSteps[
      eventStepIndex++
    ];


  switch(
    step.type
  ){

    case 'background':

      setSceneBackground(
        step.image
      );

      runNextEventStep();

      break;


    case 'eventImage':

      showEventImage(
        step.image
      );


      showMessages(
        [
          step.speaker
            ?
            step.speaker
            +
            '\n「'
            +
            step.text
            +
            '」'
            :
            step.text
        ],
        {
          finalAction:
            runNextEventStep
        }
      );

      break;


    case 'returnToScene':

      hideEventImage();


      setSceneBackground(
        step.background
        ||
        getScene().image
      );


      runNextEventStep();

      break;


    case 'showCharacter':

      showGrantCharacter(
        step.image
      );


      runNextEventStep();

      break;


    case 'setFlag':

      if(
        step.flag
        ===
        'metSurvivor'
      ){

        metSurvivor =
          Boolean(
            step.value
          );

      }


      renderMenuUnlocks();


      runNextEventStep();

      break;


    case 'completeEvent':

      if(
        window.SURVIVAL_EVENTS
      ){

        SURVIVAL_EVENTS.markCompleted(
          activeEventId
        );

      }


      finishEvent();

      break;


    default:

      runNextEventStep();

  }

}


function finishEvent(){

  hideEventImage();


  eventActive =
    false;


  activeEventId =
    null;


  eventSteps =
    [];


  eventStepIndex =
    0;


  setSceneBackground(
    getScene().image
  );


  renderCharacter();

  renderMenuUnlocks();

  renderDirections();

}


grantCharacter.addEventListener(
  'click',
  ()=>{

    if(
      isPaused()
    ){
      return;
    }


    showMessages(
      [
        '負傷した男がこちらを見ています。'
      ]
    );

  }
);


/* =========================
   移動
========================= */

const directionButtons = {

  up:
    document.getElementById(
      'moveUp'
    ),

  down:
    document.getElementById(
      'moveDown'
    ),

  left:
    document.getElementById(
      'moveLeft'
    ),

  right:
    document.getElementById(
      'moveRight'
    )

};


function renderDirections(){

  const scene =
    getScene();


  const locked =
    messageOpen
    ||
    menuOpen
    ||
    eventActive
    ||
    gameOver;


  for(
    const direction
    of
    Object.keys(
      directionButtons
    )
  ){

    const button =
      directionButtons[
        direction
      ];


    const target =
      scene.moves[
        direction
      ];


    button.classList.toggle(
      'active',
      Boolean(
        target
      )
    );


    button.classList.toggle(
      'inactive',
      !target
    );


    button.disabled =
      locked
      ||
      !target;

  }


  document.getElementById(
    'lookButton'
  ).disabled =
    locked;


  document.getElementById(
    'menuKey'
  ).disabled =
    locked;

}


function move(
  direction
){

  if(
    isPaused()
  ){
    return;
  }


  const target =
    getScene().moves[
      direction
    ];


  if(
    !target
  ){
    return;
  }


  stamina =
    clamp(
      stamina
      -
      MOVE_STAMINA_COST,
      0,
      100
    );


  bodyTemperature -=
    MOVE_TEMP_DROP;


  advanceTime(
    MOVE_SECONDS
  );


  currentScene =
    target;


  renderScene();


  showMessages(
    getScene().messages
  );


  renderMeters();

}


Object.entries(
  directionButtons
).forEach(
  (
    [
      direction,
      button
    ]
  )=>{

    button.addEventListener(
      'click',
      ()=>{

        move(
          direction
        );

      }
    );

  }
);


document.getElementById(
  'lookButton'
).addEventListener(
  'click',
  ()=>{

    if(
      isPaused()
    ){
      return;
    }


    showMessages(
      getScene().look
    );

  }
);


/* =========================
   インベントリ
========================= */

function renderInventory(){

  const list =
    document.getElementById(
      'inventoryList'
    );


  const rows =
    [];


  for(
    const [
      id,
      count
    ]
    of
    Object.entries(
      inventory
    )
  ){

    if(
      count <= 0
    ){
      continue;
    }


    const definition =
      itemDef(
        id
      );


    rows.push(
      `
      <div class="item-row">

        <span class="item-name">
          ${
            definition
              ?
              definition.name
              :
              id
          }
        </span>

        <span class="item-count">
          × ${count}
        </span>

      </div>
      `
    );

  }


  list.innerHTML =
    rows.length
      ?
      rows.join(
        ''
      )
      :
      '<div class="empty-message">まだ何も持っていません。</div>';

}


/* =========================
   MENU
========================= */

const gameMenu =
  document.getElementById(
    'gameMenu'
  );


const menuTabs =
  document.querySelectorAll(
    '.menu-tab'
  );


const menuPanels = {

  inventory:
    document.getElementById(
      'menuPanelInventory'
    ),

  map:
    document.getElementById(
      'menuPanelMap'
    ),

  skills:
    document.getElementById(
      'menuPanelSkills'
    ),

  craft:
    document.getElementById(
      'menuPanelCraft'
    )

};


function renderMenuUnlocks(){

  for(
    const tab
    of
    menuTabs
  ){

    const name =
      tab.dataset.menuTab;


    tab.classList.toggle(
      'hidden',
      name
      !==
      'inventory'
      &&
      !metSurvivor
    );

  }

}


function selectMenu(
  name
){

  currentMenu =
    name;


  for(
    const tab
    of
    menuTabs
  ){

    tab.classList.toggle(
      'active',
      tab.dataset.menuTab
      ===
      name
    );

  }


  for(
    const [
      panelName,
      panel
    ]
    of
    Object.entries(
      menuPanels
    )
  ){

    panel.classList.toggle(
      'active',
      panelName
      ===
      name
    );

  }


  if(
    name
    ===
    'inventory'
  ){

    renderInventory();

  }

}


function openGameMenu(){

  if(
    isPaused()
  ){
    return;
  }


  menuOpen =
    true;


  gameMenu.classList.add(
    'open'
  );


  renderMenuUnlocks();


  selectMenu(
    'inventory'
  );


  renderDirections();

}


function closeGameMenu(){

  menuOpen =
    false;


  gameMenu.classList.remove(
    'open'
  );


  renderDirections();

}


document.getElementById(
  'menuKey'
).addEventListener(
  'click',
  openGameMenu
);


document.getElementById(
  'menuClose'
).addEventListener(
  'click',
  closeGameMenu
);


for(
  const tab
  of
  menuTabs
){

  tab.addEventListener(
    'click',
    ()=>{

      selectMenu(
        tab.dataset.menuTab
      );

    }
  );

}


/* =========================
   通常時間
========================= */

setInterval(
  ()=>{

    if(
      isPaused()
    ){
      return;
    }


    if(
      currentScene
      ===
      'cabinInside'
    ){
      return;
    }


    advanceTime(
      5
    );

  },
  1000
);


/* =========================
   RESET
========================= */

document.getElementById(
  'restartButton'
).addEventListener(
  'click',
  ()=>{

    window.location.reload();

  }
);


if(
  window.SURVIVAL_EVENTS
  &&
  SURVIVAL_EVENTS.isCompleted(
    'cabin_grant_first_meeting'
  )
){

  metSurvivor =
    true;

}


/* =========================
   START
========================= */

renderClock();

renderMeters();

renderInventory();

renderMenuUnlocks();

renderScene();

showMessages(
  getScene().messages
);

</script>
