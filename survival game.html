<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>雪山サバイバル</title>

  <style>

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      width:100%;
      height:100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

      background:#e7eaec;
      color:#202427;
    }

    body{
      min-height:100dvh;
    }

    button,
    a{
      font:inherit;
    }

    button{
      touch-action:manipulation;
      -webkit-user-select:none;
      user-select:none;
    }


    /* =========================
       ゲーム全体
    ========================= */

    .game{
      width:min(100%,540px);
      height:100dvh;

      margin:0 auto;

      padding:
        calc(8px + env(safe-area-inset-top))
        8px
        calc(8px + env(safe-area-inset-bottom));

      display:flex;
      flex-direction:column;

      gap:7px;

      overflow:hidden;
    }


    /* =========================
       上部
    ========================= */

    .topbar{
      display:grid;
      grid-template-columns:44px 1fr 44px;
      align-items:center;

      flex:0 0 auto;
    }

    .back{
      width:42px;
      height:42px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid #999;
      border-radius:13px;

      background:#fff;

      color:#222;
      text-decoration:none;

      font-size:22px;
      font-weight:900;
    }

    .title{
      margin:0;

      text-align:center;

      font-size:20px;
      font-weight:900;
    }


    /* =========================
       ステータス
    ========================= */

    .status{
      display:grid;

      grid-template-columns:
        1.2fr
        1fr
        1.4fr;

      gap:5px;

      flex:0 0 auto;
    }

    .status-box{
      min-height:59px;

      padding:6px 4px;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      border:1px solid #aaa;
      border-radius:12px;

      background:#fff;

      text-align:center;
    }

    .status-box small{
      display:block;

      font-size:17px;
      line-height:1.1;
    }

    .status-box strong{
      display:block;

      margin-top:3px;

      font-size:17px;
      line-height:1.15;
    }


    /* =====================================
       景色全体
    ===================================== */

    .scene{
      position:relative;

      width:100%;

      min-height:0;
      flex:1 1 auto;

      overflow:hidden;

      border:2px solid #8d9397;
      border-radius:16px;

      background:#ddd;
    }


    /* =====================================
       DIV 1
       背景画像
    ===================================== */

    .scene-background{
      position:absolute;

      inset:0;

      z-index:1;

      background-image:
        url("assets/survival/forest_01.png");

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      pointer-events:none;
    }


    /* =====================================
       DIV 2
       拾えるアイテム
    ===================================== */

    .scene-objects{
      position:absolute;

      inset:0;

      z-index:2;

      pointer-events:none;
    }


    .scene-object{
      position:absolute;

      display:block;

      padding:0;
      margin:0;

      border:0;

      background:transparent;

      cursor:pointer;

      pointer-events:auto;

      -webkit-tap-highlight-color:transparent;
    }


    .scene-object img{
      display:block;

      width:100%;
      height:100%;

      object-fit:contain;

      pointer-events:none;
    }


    .scene-object:active{
      transform:scale(.96);
    }


    /* =========================
       枝
    ========================= */

    #branchObject{
      width:43%;

      aspect-ratio:1 / 1;

      left:3%;
      bottom:0%;
    }


    /* =========================
       石
    ========================= */

    #stoneObject{
      width:27%;

      aspect-ratio:1 / 1;

      right:7%;
      bottom:7%;
    }


    /* 拾った後 */

    .scene-object.collected{
      display:none;
    }


    /* =====================================
       DIV 3
       タップ判定
    ===================================== */

    .scene-hotspots{
      position:absolute;

      inset:0;

      z-index:3;

      pointer-events:none;
    }


    .hotspot{
      position:absolute;

      padding:0;

      border:0;

      background:transparent;

      pointer-events:auto;
    }


    /* =========================
       場所名
    ========================= */

    .scene-name{
      position:absolute;

      left:50%;
      top:9px;

      transform:translateX(-50%);

      z-index:10;

      padding:6px 11px;

      border:1px solid rgba(0,0,0,.2);
      border-radius:11px;

      background:rgba(255,255,255,.82);

      font-size:17px;
      font-weight:900;

      white-space:nowrap;

      pointer-events:none;
    }


    /* =========================
       説明欄
    ========================= */

    .message{
      min-height:68px;

      padding:9px 11px;

      display:flex;
      align-items:center;

      flex:0 0 auto;

      border:1px solid #aaa;
      border-radius:14px;

      background:#fff;

      font-size:17px;
      line-height:1.5;
    }


    /* =========================
       下メニュー
    ========================= */

    .menu{
      display:grid;

      grid-template-columns:
        1fr
        1fr;

      gap:6px;

      flex:0 0 auto;
    }

    .menu-button{
      min-height:50px;

      border:1px solid #999;
      border-radius:14px;

      background:#fff;

      color:#222;

      font-size:17px;
      font-weight:900;
    }

    .menu-button:active{
      transform:translateY(1px);

      background:#eee;
    }


    /* =========================
       ITEM画面
    ========================= */

    .modal{
      position:fixed;

      inset:0;

      z-index:100;

      display:none;

      align-items:center;
      justify-content:center;

      padding:18px;

      background:rgba(0,0,0,.5);
    }

    .modal.open{
      display:flex;
    }

    .modal-card{
      width:min(430px,100%);

      max-height:80dvh;

      overflow:auto;

      padding:16px;

      border-radius:18px;

      background:#fff;
    }

    .modal-card h2{
      margin:0 0 12px;

      font-size:22px;
    }

    .pause-note{
      margin:0 0 12px;

      padding:9px;

      border-radius:11px;

      background:#eee;

      font-size:17px;
      line-height:1.45;

      text-align:center;
    }


    /* =========================
       ITEM一覧
    ========================= */

    .item-list{
      min-height:55px;

      font-size:17px;
      line-height:1.6;
    }

    .item-row{
      min-height:50px;

      padding:10px 4px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:12px;

      border-bottom:1px solid #ddd;
    }

    .item-row:last-child{
      border-bottom:0;
    }

    .item-name{
      font-size:17px;
      font-weight:700;
    }

    .item-count{
      flex:0 0 auto;

      font-size:17px;
      font-weight:900;
    }


    .close-button{
      width:100%;

      min-height:50px;

      margin-top:14px;

      border:1px solid #999;
      border-radius:13px;

      background:#fff;

      font-size:17px;
      font-weight:900;
    }


    @media(max-width:390px){

      .game{
        padding-left:6px;
        padding-right:6px;
      }

    }

  </style>
</head>



<body>

<main class="game">


  <!-- =========================
       上部
  ========================== -->

  <header class="topbar">

    <a
      class="back"
      href="survival%20game_TOP.html"
      aria-label="戻る"
    >
      ←
    </a>

    <h1 class="title">
      雪山サバイバル
    </h1>

    <span></span>

  </header>



  <!-- =========================
       ステータス
  ========================== -->

  <section class="status">

    <div class="status-box">

      <small id="day">
        1日目
      </small>

      <strong id="clock">
        08:00:00
      </strong>

    </div>


    <div class="status-box">

      <small>
        体温
      </small>

      <strong>
        寒い
      </strong>

    </div>


    <div class="status-box">

      <small>
        現在地
      </small>

      <strong>
        針葉樹林
      </strong>

    </div>

  </section>



  <!-- =====================================
       景色
  ====================================== -->

  <section class="scene">


    <div class="scene-name">
      雪山・針葉樹林
    </div>



    <!-- =========================
         DIV 1
         背景
    ========================== -->

    <div
      class="scene-background"
      aria-hidden="true"
    ></div>



    <!-- =========================
         DIV 2
         拾えるアイテム
    ========================== -->

    <div
      id="objectLayer"
      class="scene-objects"
    >


      <!-- 枝 -->

      <button
        id="branchObject"
        class="scene-object"
        type="button"
        aria-label="細い枝を拾う"
      >

        <img
          src="assets/survival/branch_01.png"
          alt=""
          draggable="false"
        >

      </button>



      <!-- 石 -->

      <button
        id="stoneObject"
        class="scene-object"
        type="button"
        aria-label="小石を拾う"
      >

        <img
          src="assets/survival/stone_01.png"
          alt=""
          draggable="false"
        >

      </button>


    </div>



    <!-- =========================
         DIV 3
         タップ判定
    ========================== -->

    <div
      id="hotspotLayer"
      class="scene-hotspots"
    ></div>


  </section>



  <!-- =========================
       説明欄
  ========================== -->

  <div
    id="message"
    class="message"
  >
    雪の積もった針葉樹林です。足元に拾えそうな物があります。
  </div>



  <!-- =========================
       下メニュー
  ========================== -->

  <nav class="menu">

    <button
      id="itemButton"
      class="menu-button"
      type="button"
    >
      ITEM
    </button>


    <button
      id="lookButton"
      class="menu-button"
      type="button"
    >
      周囲を見る
    </button>

  </nav>


</main>



<!-- =========================
     ITEM
========================== -->

<div
  id="itemModal"
  class="modal"
>

  <section class="modal-card">

    <h2>
      ITEM
    </h2>

    <p class="pause-note">
      ITEMを開いている間、ゲーム内時間は止まります。
    </p>

    <div
      id="itemList"
      class="item-list"
    >
      まだ何も持っていません。
    </div>

    <button
      id="closeItem"
      class="close-button"
      type="button"
    >
      閉じる
    </button>

  </section>

</div>



<script>

  /* =========================
     ゲーム時間
  ========================= */

  let gameSeconds =
    8 * 60 * 60;


  let menuOpen =
    false;



  /* =========================
     所持品
  ========================= */

  const inventory = {

    branch:0,

    stone:0

  };



  function renderClock(){

    const total =
      Math.floor(gameSeconds);


    const day =
      Math.floor(total / 86400) + 1;


    const secondInDay =
      total % 86400;


    const hour =
      Math.floor(
        secondInDay / 3600
      );


    const minute =
      Math.floor(
        (secondInDay % 3600) / 60
      );


    const second =
      secondInDay % 60;



    document
      .getElementById("day")
      .textContent =
        day + "日目";


    document
      .getElementById("clock")
      .textContent =
        [
          hour,
          minute,
          second
        ]
        .map(
          number =>
            String(number)
              .padStart(2,"0")
        )
        .join(":");

  }



  /* =========================
     ゲーム時間

     現実1秒
     ↓
     ゲーム内5秒
  ========================= */

  setInterval(()=>{

    if(menuOpen){
      return;
    }


    if(
      document.visibilityState
      !==
      "visible"
    ){
      return;
    }


    gameSeconds += 5;


    renderClock();

  },1000);



  /* =========================
     メッセージ表示
  ========================= */

  function setMessage(text){

    document
      .getElementById("message")
      .textContent =
        text;

  }



  /* =========================
     ITEM一覧更新
  ========================= */

  function renderInventory(){

    const itemList =
      document.getElementById(
        "itemList"
      );


    const rows = [];



    if(inventory.branch > 0){

      rows.push(
        `
          <div class="item-row">

            <span class="item-name">
              細い枝
            </span>

            <span class="item-count">
              × ${inventory.branch}
            </span>

          </div>
        `
      );

    }



    if(inventory.stone > 0){

      rows.push(
        `
          <div class="item-row">

            <span class="item-name">
              小石
            </span>

            <span class="item-count">
              × ${inventory.stone}
            </span>

          </div>
        `
      );

    }



    if(rows.length === 0){

      itemList.textContent =
        "まだ何も持っていません。";

      return;

    }



    itemList.innerHTML =
      rows.join("");

  }



  /* =========================
     枝を拾う
  ========================= */

  document
    .getElementById(
      "branchObject"
    )
    .addEventListener(
      "click",
      ()=>{

        const branchObject =
          document.getElementById(
            "branchObject"
          );


        if(
          branchObject
            .classList
            .contains("collected")
        ){
          return;
        }


        inventory.branch += 1;


        branchObject
          .classList
          .add("collected");


        gameSeconds += 10;


        renderClock();

        renderInventory();


        setMessage(
          "細い枝を拾いました。"
        );

      }
    );



  /* =========================
     石を拾う
  ========================= */

  document
    .getElementById(
      "stoneObject"
    )
    .addEventListener(
      "click",
      ()=>{

        const stoneObject =
          document.getElementById(
            "stoneObject"
          );


        if(
          stoneObject
            .classList
            .contains("collected")
        ){
          return;
        }


        inventory.stone += 1;


        stoneObject
          .classList
          .add("collected");


        gameSeconds += 10;


        renderClock();

        renderInventory();


        setMessage(
          "小石を拾いました。"
        );

      }
    );



  /* =========================
     ITEM
  ========================= */

  const itemModal =
    document.getElementById(
      "itemModal"
    );


  document
    .getElementById(
      "itemButton"
    )
    .addEventListener(
      "click",
      ()=>{

        menuOpen=true;


        renderInventory();


        itemModal
          .classList
          .add("open");

      }
    );



  document
    .getElementById(
      "closeItem"
    )
    .addEventListener(
      "click",
      ()=>{

        menuOpen=false;


        itemModal
          .classList
          .remove("open");

      }
    );



  /* =========================
     周囲を見る
  ========================= */

  document
    .getElementById(
      "lookButton"
    )
    .addEventListener(
      "click",
      ()=>{

        if(menuOpen){
          return;
        }


        gameSeconds += 30;


        renderClock();



        const branchLeft =
          inventory.branch === 0;


        const stoneLeft =
          inventory.stone === 0;



        if(
          branchLeft &&
          stoneLeft
        ){

          setMessage(
            "雪の積もった針葉樹林です。足元に細い枝と小石があります。正面には森の奥へ続く道が見えます。（30秒経過）"
          );

          return;

        }



        if(branchLeft){

          setMessage(
            "雪の積もった針葉樹林です。足元に細い枝があります。正面には森の奥へ続く道が見えます。（30秒経過）"
          );

          return;

        }



        if(stoneLeft){

          setMessage(
            "雪の積もった針葉樹林です。足元に小石があります。正面には森の奥へ続く道が見えます。（30秒経過）"
          );

          return;

        }



        setMessage(
          "雪の積もった針葉樹林です。正面には森の奥へ続く道が見えます。（30秒経過）"
        );

      }
    );



  renderClock();

  renderInventory();

</script>


</body>

</html>
