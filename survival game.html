<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>雪山サバイバル</title>

  <style>

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

      background:#e5e7e9;
      color:#202427;
    }

    body{
      min-height:100dvh;
    }

    button,
    a{
      font:inherit;
    }

    button{
      touch-action:manipulation;
      -webkit-user-select:none;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }


    /* ========================================
       全体
    ======================================== */

    .game{
      position:relative;

      width:min(100%,540px);
      height:100dvh;

      margin:0 auto;

      padding:
        calc(5px + env(safe-area-inset-top))
        6px
        calc(6px + env(safe-area-inset-bottom));

      display:flex;
      flex-direction:column;

      gap:4px;

      overflow:hidden;
    }


    /* ========================================
       TOP
    ======================================== */

    .topbar{
      flex:0 0 auto;

      display:grid;

      grid-template-columns:
        36px
        52px
        80px
        minmax(0,1fr);

      gap:4px;

      align-items:center;
    }

    .back{
      width:36px;
      height:36px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid #999;
      border-radius:9px;

      background:#fff;

      color:#222;
      text-decoration:none;

      font-size:22px;
      font-weight:900;

      line-height:1;
    }

    .top-small{
      height:36px;

      padding:0 5px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid #aaa;
      border-radius:9px;

      background:#fff;

      font-size:13px;
      line-height:1;

      font-weight:800;

      white-space:nowrap;
    }

    .place{
      min-width:0;

      overflow:hidden;
      text-overflow:ellipsis;
    }


    /* ========================================
       生存メーター
    ======================================== */

    .meters{
      flex:0 0 auto;

      display:grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:4px;
    }

    .meter{
      height:32px;

      min-width:0;

      padding:2px 5px;

      display:flex;
      align-items:center;
      justify-content:center;

      gap:4px;

      border:1px solid #aaa;
      border-radius:9px;

      background:#fff;
    }

    .meter-icon{
      width:18px;
      height:18px;

      flex:0 0 18px;
    }

    .meter-outline{
      fill:none;

      stroke:#262626;
      stroke-width:1.5;

      stroke-linejoin:round;
      stroke-linecap:round;
    }

    .meter-value{
      min-width:0;

      font-size:13px;
      line-height:1;

      font-weight:900;

      white-space:nowrap;
    }


    /* ========================================
       背景エリア

       前より縦長
       説明パネルはこの下端をまたいで表示
    ======================================== */

    .scene-wrap{
      position:relative;

      width:97%;

      margin:0 auto;

      flex:0 0 auto;

      padding-bottom:66px;
    }

    .scene{
      position:relative;

      width:100%;
      height:min(61dvh,570px);

      min-height:490px;

      overflow:hidden;

      border:1px solid #8c9296;
      border-radius:13px;

      background:#ddd;
    }

    .scene-background{
      position:absolute;

      inset:0;

      z-index:1;

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      pointer-events:none;
    }


    /* ========================================
       拾える物
    ======================================== */

    .scene-objects{
      position:absolute;

      inset:0;

      z-index:4;

      pointer-events:none;
    }

    .scene-object{
      position:absolute;

      display:block;

      margin:0;
      padding:0;

      border:0;

      background:transparent;

      pointer-events:auto;

      cursor:pointer;
    }

    .scene-object img{
      display:block;

      width:100%;
      height:100%;

      object-fit:contain;

      pointer-events:none;

      filter:
        drop-shadow(1px 0 0 #698594)
        drop-shadow(-1px 0 0 #698594)
        drop-shadow(0 1px 0 #698594)
        drop-shadow(0 -1px 0 #698594)
        drop-shadow(0 2px 2px rgba(0,0,0,.25));
    }

    .scene-object:active{
      transform:scale(.92);
    }

    .scene-object.hidden{
      display:none;
    }

    /*
      画像は小さめ。
      ただしbutton自体は画像より少し広めで
      タップしやすくする。
    */

    .branch-object{
      width:76px;
      height:76px;
    }

    .branch-object img{
      width:58px;
      height:58px;

      margin:9px;
    }

    .stone-object{
      width:66px;
      height:66px;
    }

    .stone-object img{
      width:48px;
      height:48px;

      margin:9px;
    }


    /* ========================================
       扉ホットスポット

       扉画像は使わない。

       cabin_front_01.png 上の
       元画像の扉座標からJSで位置計算する。
    ======================================== */

    .door-hotspot{
      position:absolute;

      z-index:12;

      display:none;

      padding:0;

      border:
        2px solid
        rgba(104,139,156,.88);

      border-radius:7px;

      background:
        linear-gradient(
          120deg,
          rgba(255,255,255,.02) 10%,
          rgba(210,235,246,.22) 42%,
          rgba(255,255,255,.38) 50%,
          rgba(210,235,246,.18) 58%,
          rgba(255,255,255,.02) 90%
        );

      box-shadow:
        0 0 7px rgba(187,226,242,.75),
        inset 0 0 8px rgba(255,255,255,.18);

      overflow:hidden;

      cursor:pointer;

      animation:
        doorGlow
        2.3s
        ease-in-out
        infinite;
    }

    .door-hotspot.visible{
      display:block;
    }

    .door-hotspot::after{
      content:"";

      position:absolute;

      top:-30%;
      left:-70%;

      width:38%;
      height:160%;

      transform:rotate(13deg);

      background:
        linear-gradient(
          to right,
          transparent,
          rgba(255,255,255,.34),
          transparent
        );

      animation:
        doorSheen
        3.2s
        ease-in-out
        infinite;
    }

    .door-hotspot:active{
      transform:scale(.97);
    }

    @keyframes doorGlow{

      0%,
      100%{
        box-shadow:
          0 0 5px rgba(187,226,242,.50),
          inset 0 0 6px rgba(255,255,255,.12);
      }

      50%{
        box-shadow:
          0 0 12px rgba(187,226,242,.92),
          inset 0 0 11px rgba(255,255,255,.24);
      }

    }

    @keyframes doorSheen{

      0%,
      55%{
        left:-70%;
      }

      82%{
        left:135%;
      }

      100%{
        left:135%;
      }

    }


    /* ========================================
       説明・会話パネル

       サイズ固定
       スクロールなし
       背景と背景外をまたぐ

       収納時は左へ消える
    ======================================== */

    .message-panel{
      position:absolute;

      left:9px;
      top:calc(100% - 122px);

      z-index:30;

      width:calc(100% - 60px);
      height:118px;

      padding:
        12px
        44px
        36px
        13px;

      overflow:hidden;

      border:1px solid #979797;
      border-radius:14px;

      background:rgba(255,255,255,.94);

      box-shadow:
        0 4px 12px
        rgba(0,0,0,.08);

      transform:translateX(0);

      transition:
        transform .24s ease;

      cursor:pointer;
    }

    .message-panel.closed{
      transform:
        translateX(
          calc(-100% - 20px)
        );
    }

    .message-text{
      height:66px;

      overflow:hidden;

      font-size:14px;
      line-height:1.48;

      font-weight:650;

      white-space:pre-wrap;

      word-break:break-word;
    }

    .message-progress{
      position:absolute;

      left:13px;
      bottom:10px;

      font-size:11px;
      line-height:1;

      color:#666;

      font-weight:700;
    }

    .message-next{
      position:absolute;

      right:10px;
      bottom:8px;

      min-width:65px;
      height:29px;

      padding:0 10px;

      border:1px solid #888;
      border-radius:8px;

      background:#f4f4f4;

      color:#222;

      font-size:12px;
      font-weight:900;
    }

    .message-next.hidden{
      display:none;
    }


    /* ========================================
       説明開閉

       必ず背景divより下
    ======================================== */

    .message-toggle{
      position:absolute;

      left:15px;
      bottom:7px;

      z-index:35;

      width:42px;
      height:42px;

      padding:0;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid #888;
      border-radius:10px;

      background:#d4d5d6;

      color:#222;

      font-size:20px;
      line-height:1;

      font-weight:900;
    }

    .message-toggle:active{
      transform:scale(.93);
    }


    /* ========================================
       視界効果
    ======================================== */

    .cold-vision{
      position:fixed;

      inset:0;

      z-index:50;

      pointer-events:none;

      background:
        rgba(
          255,
          255,
          255,
          var(--cold-opacity,0)
        );

      transition:
        background .7s ease;
    }

    .health-vision{
      position:fixed;

      inset:0;

      z-index:51;

      pointer-events:none;

      background:
        radial-gradient(
          circle at center,
          rgba(150,0,0,0) 31%,
          rgba(
            150,
            0,
            0,
            var(--red-opacity,0)
          )
          100%
        );

      transition:
        background .7s ease;
    }


    /* ========================================
       右下操作

       小さく
       右下へ
    ======================================== */

    .control-cluster{
      position:absolute;

      right:8px;
      bottom:
        calc(
          7px
          +
          env(safe-area-inset-bottom)
        );

      z-index:42;

      width:122px;

      display:flex;
      flex-direction:column;
      align-items:center;

      gap:6px;
    }


    /* ========================================
       周囲を見る
       目アイコン
    ======================================== */

    .look-button{
      align-self:flex-end;

      margin-right:39px;

      width:42px;
      height:42px;

      padding:0;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid #8d8d8d;
      border-radius:11px;

      background:rgba(255,255,255,.84);

      color:#252525;
    }

    .look-button svg{
      width:25px;
      height:25px;

      fill:none;

      stroke:currentColor;
      stroke-width:1.8;

      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .look-button:disabled{
      opacity:.25;
    }


    /* ========================================
       独立方向キー
    ======================================== */

    .move-pad{
      display:grid;

      grid-template-columns:
        repeat(3,38px);

      grid-template-rows:
        repeat(3,38px);

      gap:4px;
    }

    .direction,
    .menu-key{
      width:38px;
      height:38px;

      padding:0;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid rgba(55,55,55,.38);

      border-radius:10px;

      line-height:1;

      font-weight:900;
    }

    .direction{
      background:
        rgba(108,108,108,.57);

      color:#222;

      font-size:19px;
    }

    .direction.active{
      opacity:.88;
    }

    .direction.inactive{
      opacity:.13;

      background:
        rgba(150,150,150,.23);
    }

    .direction.active:active,
    .menu-key:active{
      transform:scale(.90);
    }

    .menu-key{
      background:
        rgba(75,75,75,.72);

      color:#fff;

      font-size:8px;

      letter-spacing:.02em;
    }

    #moveUp{
      grid-column:2;
      grid-row:1;
    }

    #moveLeft{
      grid-column:1;
      grid-row:2;
    }

    #menuKey{
      grid-column:2;
      grid-row:2;
    }

    #moveRight{
      grid-column:3;
      grid-row:2;
    }

    #moveDown{
      grid-column:2;
      grid-row:3;
    }


    /* ========================================
       メニュー
    ======================================== */

    .game-menu-overlay{
      position:fixed;

      inset:0;

      z-index:120;

      display:none;

      align-items:center;
      justify-content:center;

      padding:
        calc(12px + env(safe-area-inset-top))
        10px
        calc(12px + env(safe-area-inset-bottom));

      background:
        rgba(30,30,30,.52);
    }

    .game-menu-overlay.open{
      display:flex;
    }

    .game-menu-window{
      position:relative;

      width:min(500px,100%);
      height:min(610px,78dvh);

      display:flex;
      flex-direction:column;

      border:1px solid #85898b;
      border-radius:15px;

      background:#fff;

      overflow:hidden;
    }

    .menu-tabs-area{
      position:relative;

      flex:0 0 auto;

      min-height:54px;

      padding:
        10px
        48px
        0
        8px;

      display:flex;
      align-items:flex-end;

      overflow-x:auto;

      background:#dfe2e4;

      border-bottom:1px solid #969a9d;

      scrollbar-width:none;
    }

    .menu-tabs-area::-webkit-scrollbar{
      display:none;
    }

    .menu-tab{
      position:relative;

      min-width:92px;
      height:38px;

      margin-right:-1px;

      padding:0 10px;

      border:1px solid #969a9d;
      border-bottom:0;

      border-radius:
        10px
        10px
        0
        0;

      background:#cfd3d5;

      color:#333;

      font-size:13px;
      font-weight:800;

      white-space:nowrap;
    }

    .menu-tab.active{
      z-index:2;

      height:42px;

      background:#fff;

      color:#111;
    }

    .menu-tab.locked{
      display:none;
    }

    .menu-close{
      position:absolute;

      top:8px;
      right:8px;

      z-index:5;

      width:36px;
      height:36px;

      padding:0;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid #888;
      border-radius:9px;

      background:#fff;

      color:#222;

      font-size:20px;
      font-weight:900;
    }

    .menu-content{
      flex:1 1 auto;

      min-height:0;

      padding:15px;

      overflow:auto;

      background:#fff;
    }

    .menu-panel{
      display:none;
    }

    .menu-panel.active{
      display:block;
    }

    .menu-panel-title{
      margin:
        0
        0
        12px;

      font-size:19px;
    }

    .empty-message{
      padding:20px 8px;

      text-align:center;

      font-size:15px;

      color:#555;
    }

    .item-row{
      min-height:50px;

      padding:10px 4px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:12px;

      border-bottom:1px solid #ddd;
    }

    .item-name{
      font-size:15px;
      font-weight:700;
    }

    .item-count{
      font-size:15px;
      font-weight:900;
    }

    .placeholder{
      min-height:220px;

      padding:18px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px dashed #aaa;
      border-radius:12px;

      background:#f6f6f6;

      font-size:15px;
      line-height:1.6;

      text-align:center;
    }


    /* ========================================
       山小屋内部
       仮画面

       内部背景ができたら
       ここを画像に差し替えられる
    ======================================== */

    .cabin-interior-placeholder{
      position:absolute;

      inset:0;

      z-index:1;

      display:none;

      background:
        linear-gradient(
          90deg,
          #4b4037 0,
          #66574a 4%,
          #4f4339 8%,
          #69594b 12%,
          #51453b 16%,
          #655649 20%,
          #4c4037 24%,
          #68584b 28%,
          #50443a 32%,
          #66574a 36%,
          #4d4138 40%,
          #69594b 44%,
          #50443a 48%,
          #665649 52%,
          #4c4138 56%,
          #69594b 60%,
          #50443a 64%,
          #655649 68%,
          #4d4138 72%,
          #68584b 76%,
          #50443a 80%,
          #665649 84%,
          #4c4138 88%,
          #69594b 92%,
          #50443a 96%,
          #665649 100%
        );
    }

    .cabin-interior-placeholder.visible{
      display:block;
    }

    .cabin-dark{
      position:absolute;

      inset:0;

      background:
        rgba(0,0,0,.38);
    }

    .cabin-interior-text{
      position:absolute;

      left:50%;
      top:48%;

      transform:
        translate(-50%,-50%);

      width:85%;

      color:#eee;

      font-size:14px;
      line-height:1.6;

      text-align:center;

      text-shadow:
        0 2px 4px #000;
    }


    /* ========================================
       画面揺れ
    ======================================== */

    @keyframes shakeLight{

      0%{
        transform:translate(0,0);
      }

      20%{
        transform:translate(-2px,1px);
      }

      40%{
        transform:translate(2px,-1px);
      }

      60%{
        transform:translate(-1px,-1px);
      }

      80%{
        transform:translate(1px,1px);
      }

      100%{
        transform:translate(0,0);
      }

    }

    @keyframes shakeHeavy{

      0%{
        transform:translate(0,0);
      }

      10%{
        transform:translate(-4px,2px);
      }

      20%{
        transform:translate(4px,-3px);
      }

      30%{
        transform:translate(-3px,-2px);
      }

      40%{
        transform:translate(4px,3px);
      }

      50%{
        transform:translate(-4px,0);
      }

      60%{
        transform:translate(3px,-3px);
      }

      70%{
        transform:translate(-2px,3px);
      }

      80%{
        transform:translate(3px,1px);
      }

      90%{
        transform:translate(-2px,-1px);
      }

      100%{
        transform:translate(0,0);
      }

    }

    .game.shake-light{
      animation:
        shakeLight
        .32s
        linear;
    }

    .game.shake-heavy{
      animation:
        shakeHeavy
        .48s
        linear;
    }


    /* ========================================
       DEAD
    ======================================== */

    .dead-modal{
      position:fixed;

      inset:0;

      z-index:200;

      display:none;

      align-items:center;
      justify-content:center;

      padding:20px;

      background:
        rgba(0,0,0,.84);
    }

    .dead-modal.open{
      display:flex;
    }

    .dead-card{
      width:min(400px,100%);

      padding:24px 18px;

      border-radius:17px;

      background:#f6f6f6;

      text-align:center;
    }

    .dead-title{
      margin:0;

      font-size:34px;
    }

    .dead-reason{
      margin:
        15px
        0
        20px;

      font-size:17px;
      line-height:1.5;
    }

    .restart-button{
      width:100%;

      min-height:52px;

      border:1px solid #777;
      border-radius:13px;

      background:#fff;

      font-size:17px;
      font-weight:900;
    }


    /* ========================================
       小さいスマホ
    ======================================== */

    @media(max-width:390px){

      .topbar{
        grid-template-columns:
          34px
          48px
          76px
          minmax(0,1fr);
      }

      .back{
        width:34px;
        height:34px;
      }

      .top-small{
        height:34px;

        font-size:12px;
      }

      .meter{
        height:30px;
      }

      .meter-value{
        font-size:12px;
      }

      .scene{
        min-height:470px;
      }

      .message-panel{
        height:112px;

        top:
          calc(
            100%
            -
            116px
          );
      }

      .message-text{
        height:62px;

        font-size:13px;
      }

      .control-cluster{
        right:5px;
      }

    }

  </style>

</head>


<body>


<main
  id="game"
  class="game"
>


  <!-- ========================================
       TOP
  ======================================== -->

  <header class="topbar">


    <a
      class="back"
      href="survival%20game_TOP.html"
      aria-label="戻る"
    >
      ←
    </a>


    <div
      id="day"
      class="top-small"
    >
      Day.1
    </div>


    <div
      id="clock"
      class="top-small"
    >
      08:00:00
    </div>


    <div
      id="currentPlace"
      class="top-small place"
    >
      針葉樹林
    </div>


  </header>



  <!-- ========================================
       生存メーター
  ======================================== -->

  <section class="meters">


    <!-- 体温 -->

    <div class="meter">

      <svg
        class="meter-icon"
        viewBox="0 0 24 24"
      >

        <defs>

          <clipPath id="tempClip">

            <rect
              id="tempClipRect"
              x="0"
              y="0"
              width="24"
              height="24"
            ></rect>

          </clipPath>

        </defs>


        <path
          id="tempFill"
          clip-path="url(#tempClip)"
          d="
            M12 2
            C9.8 2 8 3.8 8 6
            V14.1
            C6.7 15.3 6 17 6 18.7
            C6 22 8.7 24 12 24
            C15.3 24 18 22 18 18.7

  function clamp(

    min,
    max
  ){

    return Math.max(
      min,
      Math.min(
        max,
        value
      )
    );

  }

  /* ========================================

  ======================================== */

  function renderClock(){

    const total =
      Math.floor(
        gameSeconds
      );


    const day =
      Math.floor(
        total / 86400
      )
      +
      1;


    const secondInDay =
      total % 86400;


    const hour =
      Math.floor(
        secondInDay / 3600
      );


    const minute =
      Math.floor(
        (
          secondInDay % 3600
        )
        /
        60
      );


    const second =
      secondInDay % 60;


    document
      .getElementById(
        "day"
      )
      .textContent =
        "Day."
        +
        day;


    document
      .getElementById(
        "clock"
      )
      .textContent =
        String(
          hour
        )
        .padStart(
          2,
          "0"
        )
        +
        ":"
        +
        String(
          minute
        )
        .padStart(
          2,
          "0"
        )
        +
        ":"
        +
        String(
          second
        )
        .padStart(
          2,
          "0"
        );

  }


  /* ========================================

  ======================================== */

  function setFillLevel(
    rectId,
    percent
  ){

    const value =
      clamp(
        percent,
        0,
        100
      );


    const height =
      24
      *
      value
      /
      100;


    const y =
      24
      -
      height;


    const rect =
      document.getElementById(
        rectId
      );


    rect.setAttribute(
      "y",
      y
    );


    rect.setAttribute(
      "height",
      height
    );

  }


  function normalColor(
    value
  ){

    if(
      value <= 20
    ){

      return "#c62828";

    }


    if(
      value <= 40
    ){

      return "#d6a000";

    }


    return "#151515";

  }


  function temperatureColor(){

    if(

    ){

      return "#c62828";

    }


    if(
      bodyTemperature < 35
    ){

      return "#d6a000";

    }


    return "#151515";

  }

  /* ========================================
     視界
  ======================================== */

  function coldOpacity(){

    if(
      bodyTemperature >= 35
    ){

      return 0;

    }


    if(
      bodyTemperature >= 33
    ){

      return (
        (
          35
          -
          bodyTemperature
        )
        /
        2
      )
      *
      .09;

    }


    if(
      bodyTemperature >= 31
    ){

      return (
        .09
        +
        (
          (
            33
            -
            bodyTemperature
          )
          /
          2
        )
        *
        .13
      );

    }


    return .34;

  }


  function redOpacity(){

    if(
      stamina > 35
    ){

      return 0;

    }


    if(
      stamina > 20
    ){

      return (
        (
          35
          -
          stamina
        )
        /
        15
      )
      *
      .13;

    }


    if(
      stamina > 10
    ){

      return (
        .13
        +
        (
          (
            20
            -
            stamina
          )
          /
          10
        )
        *
        .14
      );

    }


    return .34;

  }


  function updateVisualEffects(){

    document
      .getElementById(
        "coldVision"
      )
      .style
      .setProperty(
        "--cold-opacity",
        coldOpacity()
      );


    document
      .getElementById(
        "healthVision"
      )
      .style
      .setProperty(
        "--red-opacity",
        redOpacity()
      );

  }

  /* ========================================
     説明・会話
  ======================================== */

  function renderMessage(){

    if(
      messagePages.length === 0
    ){

      messageText.textContent =
        "";

      messageProgress.textContent =
        "";

      messageNext
        .classList
        .add(
          "hidden"
        );

      return;

    }


    const page =
      messagePages[
        messageIndex
      ];


    const text =
      typeof page === "string"
        ?
        page
        :
        page.text;


    messageText.textContent =
      text;


    messageProgress.textContent =
      (
        messageIndex
        +
        1
      )
      +
      " / "
      +
      messagePages.length;


    const isLast =
      messageIndex
      ===
      messagePages.length
      -
      1;


    if(
      !isLast
    ){

      messageNext.textContent =
        "次へ";


      messageNext
        .classList
        .remove(
          "hidden"
        );

    }else if(
      typeof page === "object"
      &&
      page.actionLabel
    ){

      messageNext.textContent =
        page.actionLabel;


      messageNext
        .classList
        .remove(
          "hidden"
        );

    }else{

      messageNext
        .classList
        .add(
          "hidden"
        );

    }

  }


  function setMessageOpen(
    open
  ){

    messageOpen =
      open;


    messagePanel
      .classList
      .toggle(
        "closed",
        !open
      );


    messageToggle.textContent =
      open
        ?
        "◀"
        :
        "▶";


    renderDirections();

  }


  function showMessages(
    pages,
    options={}
  ){

    if(
      messageTimer
    ){

      clearTimeout(
        messageTimer
      );

      messageTimer =
        null;

    }


    messagePages =
      Array.isArray(
        pages
      )
      ?
      pages.slice()
      :
      [
        String(
          pages
        )
      ];


    messageIndex =
      0;


    messageManual =
      Boolean(
        options.manual
      );


    finalMessageAction =
      options.finalAction
      ||
      null;


    renderMessage();


    setMessageOpen(
      true
    );


    /*
      1ページだけで
      actionもない通常説明だけ
      自動収納。

      複数ページの説明・会話は
      「次へ」で送る。
    */

    if(
      messagePages.length === 1
      &&
      !finalMessageAction
      &&
      !messageManual
    ){

      messageTimer =
        setTimeout(
          ()=>{

            hideMessage();

          },
          options.duration
          ||
          4300
        );

    }

  }


  function hideMessage(){

    if(
      messageTimer
    ){

      clearTimeout(
        messageTimer
      );

      messageTimer =
        null;

    }


    setMessageOpen(
      false
    );

  }


  function reopenMessage(){

    if(
      messagePages.length === 0
    ){

      return;

    }


    /*
      手動読み返し中も
      時計は停止。
    */

    messageManual =
      true;


    setMessageOpen(
      true
    );

  }


  function nextMessage(){

    if(
      messageIndex
      <
      messagePages.length
      -
      1
    ){

      messageIndex++;


      renderMessage();


      return;

    }


    const currentPage =
      messagePages[
        messageIndex
      ];


    if(
      typeof currentPage === "object"
      &&
      currentPage.action
    ){

      const action =
        currentPage.action;


      hideMessage();


      action();


      return;

    }


    if(
      finalMessageAction
    ){

      const action =
        finalMessageAction;


      finalMessageAction =
        null;


      hideMessage();


      action();


      return;

    }


    hideMessage();

  }


  messageToggle
    .addEventListener(
      "click",
      event=>{

        event.stopPropagation();


        if(
          messageOpen
        ){

          hideMessage();

        }else{

          reopenMessage();

        }

      }
    );


  /*
    説明文パネル自体を押しても収納。

    「次へ」だけは
    stopPropagationする。
  */

  messagePanel

    );

  function collectWarnings(){

    const result =
      [];


    if(
      bodyTemperature < 35
      &&

    ){

      warningFlags.cold35 =
        true;


      result.push(
        "身体が冷えてきました。"
      );

      );

    }


    if(
      bodyTemperature < 33
      &&

    ){

      warningFlags.cold33 =
        true;


      result.push(
        "震えが止まりません。"
      );


      result.push(
        "かなり身体が冷えています。"
      );


      shake(
        true
      );

    }


    if(
      bodyTemperature < 31
      &&
      !warningFlags.cold31
    ){

      warningFlags.cold31 =
        true;


      result.push(
        "意識がぼんやりします。"
      );


      result.push(
        "早く寒さをしのげる場所を探さなければ。"
      );


      shake(
        true
      );

    }


    if(
      hunger <= 40
      &&
      !warningFlags.hunger40
    ){

      warningFlags.hunger40 =
        true;


      result.push(
        "空腹を強く感じます。"
      );

    }


    if(
      hunger <= 20
      &&
      !warningFlags.hunger20
    ){

      warningFlags.hunger20 =
        true;


      result.push(
        "腹が痛みます。力が出ません。"
      );

    }


    if(
      hunger <= 0
      &&
      !warningFlags.hunger0
    ){

      warningFlags.hunger0 =
        true;


      result.push(
        "何か食べなければ、身体がもちません。"
      );

    }


    if(
      stamina <= 60
      &&
      !warningFlags.stamina60
    ){

      warningFlags.stamina60 =
        true;


      result.push(
        "身体が重く感じます。"
      );


      shake(
        false
      );

    }


    if(
      stamina <= 35
      &&
      !warningFlags.stamina35
    ){

      warningFlags.stamina35 =
        true;


      result.push(
        "かなり消耗しています。"
      );

    }


    if(
      stamina <= 20
      &&
      !warningFlags.stamina20
    ){

      warningFlags.stamina20 =
        true;


      result.push(
        "立っているのもつらくなってきました。"
      );


      shake(

      );

    }


    if(

    ){

      warningFlags.stamina10 =
        true;


      result.push(
        "もうほとんど身体が動きません。"
      );


      shake(
        true
      );

    }


    return result;

  }


  /* ========================================
     生存消耗
  ======================================== */

  function applyDrain(
    seconds
  ){

    const minutes =
      seconds
      /
      60;


    bodyTemperature -=
      .008
      *
      minutes;


    hunger -=
      .10
      *
      minutes;


    hunger =
      clamp(
        hunger,
        0,
        100
      );


    if(
      bodyTemperature < 35
    ){

      stamina -=
        .08
        *
        minutes;

    }


    if(
      bodyTemperature < 33
    ){

      stamina -=
        .30
        *
        minutes;

    }


    if(
      bodyTemperature < 31
    ){

      stamina -=
        .55
        *
        minutes;

    }


    if(
      bodyTemperature < 29
    ){

      stamina -=
        1.20
        *
        minutes;

    }


    if(
      hunger <= 0
    ){

      stamina -=
        .25
        *
        minutes;

    }


    stamina =
      clamp(
        stamina,
        0,
        100
      );


    renderMeters();


    checkDeath();

  }


  function advanceTime(
    seconds
  ){

    if(
      gameOver
    ){

      return [];

    }


    gameSeconds +=
      seconds;


    applyDrain(
      seconds
    );


    renderClock();


    if(
      gameOver
    ){

      return [];

    }


    return collectWarnings();

  }

  /* ========================================
     扉

     背景がcoverで切れても
     扉位置が合うように
     元画像座標から計算。
  ======================================== */

  function positionDoorHotspot(){

    if(
      currentScene
      !==
      "cabinFront"
    ){

      return;

    }


    const frameWidth =
      sceneElement.clientWidth;


    const frameHeight =
      sceneElement.clientHeight;


    const scale =
      Math.max(
        frameWidth
        /
        DOOR_META.sourceWidth,

        frameHeight
        /
        DOOR_META.sourceHeight
      );


    const renderedWidth =
      DOOR_META.sourceWidth
      *
      scale;


    const renderedHeight =
      DOOR_META.sourceHeight
      *
      scale;


    const offsetX =
      (
        frameWidth
        -
        renderedWidth
      )
      /
      2;


    const offsetY =
      (
        frameHeight
        -
        renderedHeight
      )
      /
      2;


    doorHotspot.style.left =
      (
        offsetX
        +
        DOOR_META.left
        *
        scale
      )
      +
      "px";


    doorHotspot.style.top =
      (
        offsetY
        +
        DOOR_META.top
        *
        scale
      )
      +
      "px";


    doorHotspot.style.width =
      (
        DOOR_META.width
        *
        scale
      )
      +
      "px";


    doorHotspot.style.height =
      (
        DOOR_META.height
        *
        scale
      )
      +
      "px";

  }

  function movementStaminaCost(){

      hunger <= 0

        *

      );

    if(
      hunger <= 20
    ){

      return (
        MOVE_STAMINA_COST
        *
        1.5
      );

    }


    return MOVE_STAMINA_COST;

  }

    direction

      isPaused()

    const scene =
      getScene();


    const target =
      scene.moves[

    if(

    stamina -=
      movementStaminaCost();


    stamina =
      clamp(

        0,

      MOVE_TEMP_DROP;

      getScene()
        .messages

    pages =
      pages.concat(
        warnings

    showMessages(

      of
      Object.entries(
        menuPanels
      )
    ){

      panel.classList.toggle(
        "active",
        panelName
          ===
          name
      );

    }


    if(
      name ===
      "inventory"
    ){

      renderInventory();

    }

  }


  function openGameMenu(
    name="inventory"
  ){

    if(
      gameOver
      ||
      messageOpen
    ){

      return;

    }


    menuOpen =
      true;


    gameMenu.classList.add(
      "open"
    );


    renderMenuUnlocks();


    selectMenu(
      name
    );


    renderDirections();

  }


  function closeGameMenu(){

    menuOpen =
      false;


    currentMenu =
      null;


    gameMenu.classList.remove(
      "open"
    );


    renderDirections();

  }


  /*
    MENUボタン

    未解放時：
    インベントリ → 閉じる

    男と出会った後：
    インベントリ
    → 地図
    → スキル
    → クラフト
    → 閉じる
  */

  document
    .getElementById(
      "menuKey"
    )
    .addEventListener(
      "click",
      ()=>{

        if(
          gameOver
          ||
          messageOpen
        ){

          return;

        }


        const menus =
          availableMenus();


        if(
          !menuOpen
        ){

          openGameMenu(
            menus[0]
          );


          return;

        }


        const index =
          menus.indexOf(
            currentMenu
          );


        if(
          index
          ===
          menus.length
          -
          1
        ){

          closeGameMenu();


          return;

        }


        selectMenu(
          menus[
            index
            +
            1
          ]
        );

      }
    );


  for(
    const tab
    of
    menuTabs
  ){

    tab.addEventListener(
      "click",
      ()=>{

        selectMenu(
          tab.dataset.menuTab
        );

      }
    );

  }


  document
    .getElementById(
      "menuClose"
    )
    .addEventListener(
      "click",
      closeGameMenu
    );


  /* ========================================
     自動時間

     通常の移動画面だけ。
  ======================================== */

  setInterval(
    ()=>{

      if(
        isPaused()
      ){

        return;

      }


      const warnings =
        advanceTime(
          5
        );


      if(
        warnings.length > 0
      ){

        showMessages(
          warnings
        );

      }

    },
    1000
  );


  /* ========================================
     リスタート
  ======================================== */

  document
    .getElementById(
      "restartButton"
    )
    .addEventListener(
      "click",
      ()=>{

        window.location.reload();

      }
    );


  /* ========================================
     初期表示
  ======================================== */

  renderClock();

  renderMeters();

  renderInventory();

  renderMenuUnlocks();

  renderScene();


  showMessages(
    getScene().messages
  );


</script>


</body>
</html>
