<!doctype html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>雪山サバイバル</title>

  <style>

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

      background:#e7eaec;
      color:#202427;
    }

    body{
      min-height:100dvh;
    }

    button,
    a{
      font:inherit;
    }

    button{
      touch-action:manipulation;
      -webkit-user-select:none;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }


    /* =========================
       ゲーム全体
    ========================= */

    .game{
      width:min(100%,540px);
      height:100dvh;

      margin:0 auto;

      padding:
        calc(5px + env(safe-area-inset-top))
        6px
        calc(5px + env(safe-area-inset-bottom));

      display:flex;
      flex-direction:column;

      gap:4px;

      overflow:hidden;
    }


    /* =========================
       上部
    ========================= */

    .topbar{
      flex:0 0 auto;

      display:grid;

      grid-template-columns:
        36px
        52px
        80px
        minmax(0,1fr);

      align-items:center;

      gap:4px;
    }

    .back{
      width:36px;
      height:36px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid #999;
      border-radius:9px;

      background:#fff;

      color:#222;
      text-decoration:none;

      font-size:22px;
      font-weight:900;

      line-height:1;
    }

    .top-small{
      height:36px;

      padding:0 5px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid #aaa;
      border-radius:9px;

      background:#fff;

      font-size:13px;
      line-height:1;

      font-weight:800;

      white-space:nowrap;
    }

    .place{
      min-width:0;

      overflow:hidden;
      text-overflow:ellipsis;
    }


    /* =========================
       生存メーター
    ========================= */

    .meters{
      flex:0 0 auto;

      display:grid;
      grid-template-columns:repeat(3,1fr);

      gap:4px;
    }

    .meter{
      height:32px;

      min-width:0;

      padding:2px 5px;

      display:flex;
      align-items:center;
      justify-content:center;

      gap:4px;

      border:1px solid #aaa;
      border-radius:9px;

      background:#fff;
    }

    .meter-icon{
      width:18px;
      height:18px;

      flex:0 0 18px;

      overflow:visible;
    }

    .meter-outline{
      fill:none;

      stroke:#262626;
      stroke-width:1.5;

      stroke-linejoin:round;
      stroke-linecap:round;
    }

    .meter-value{
      min-width:0;

      font-size:13px;
      line-height:1;

      font-weight:900;

      white-space:nowrap;
    }


    /* =========================
       背景
    ========================= */

    .scene{
      position:relative;

      width:96%;

      max-width:510px;

      aspect-ratio:1.25 / 1;

      margin:0 auto;

      flex:0 0 auto;

      overflow:hidden;

      border:1px solid #8c9296;
      border-radius:13px;

      background:#ddd;
    }

    .scene-background{
      position:absolute;

      inset:0;

      z-index:1;

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      pointer-events:none;
    }


    /* =========================
       拾えるアイテム
    ========================= */

    .scene-objects{
      position:absolute;

      inset:0;

      z-index:2;

      pointer-events:none;
    }

    .scene-object{
      position:absolute;

      display:block;

      margin:0;
      padding:0;

      border:0;

      background:transparent;

      cursor:pointer;

      pointer-events:auto;
    }

    .scene-object img{
      display:block;

      width:100%;
      height:100%;

      object-fit:contain;

      pointer-events:none;
    }

    .scene-object:active{
      transform:scale(.95);
    }

    .scene-object.hidden{
      display:none;
    }

    #branchObject{
      width:27%;

      aspect-ratio:1 / 1;

      left:4%;
      bottom:0;
    }

    #stoneObject{
      width:16%;

      aspect-ratio:1 / 1;

      right:8%;
      bottom:7%;
    }


    /* =========================
       説明文パネル
    ========================= */

    .scene-notice-shell{
      position:absolute;

      left:4%;
      right:4%;
      bottom:0;

      z-index:60;

      transform:
        translateY(
          calc(100% - 25px)
        );

      transition:
        transform .24s ease;

      pointer-events:none;
    }

    .scene-notice-shell.open{
      transform:translateY(0);
    }

    .scene-notice{
      min-height:72px;
      max-height:120px;

      overflow:auto;

      padding:9px 11px;

      border:
        1px solid
        rgba(70,70,70,.55);

      border-radius:
        11px
        11px
        0
        0;

      background:
        rgba(255,255,255,.93);

      font-size:17px;
      line-height:1.45;

      font-weight:600;

      white-space:pre-wrap;

      pointer-events:auto;
    }

    .notice-tab{
      width:54px;
      height:25px;

      margin:0 auto;

      padding:0;

      display:flex;
      align-items:center;
      justify-content:center;

      border:
        1px solid
        rgba(70,70,70,.55);

      border-top:0;

      border-radius:
        0
        0
        9px
        9px;

      background:
        rgba(220,220,220,.94);

      color:#333;

      font-size:16px;
      font-weight:900;

      pointer-events:auto;
    }


    /* =========================
       十字キーの場所
    ========================= */

    .movement-row{
      flex:1 1 auto;

      min-height:142px;

      display:flex;

      align-items:flex-end;
      justify-content:flex-end;

      padding-right:4px;
    }


    /* =========================
       十字キー
    ========================= */

    .move-pad{
      position:relative;

      width:138px;
      height:138px;

      flex:0 0 138px;
    }

    .direction{
      position:absolute;

      width:54px;
      height:54px;

      padding:0;

      display:flex;
      align-items:center;
      justify-content:center;

      border:
        1px solid
        rgba(45,45,45,.38);

      border-radius:11px;

      background:
        rgba(90,90,90,.58);

      color:#222;

      font-size:28px;
      line-height:1;

      font-weight:900;

      transition:
        opacity .12s ease,
        background .12s ease,
        transform .08s ease;
    }

    .direction.active{
      opacity:.86;
    }

    .direction.active:active{
      transform:scale(.92);

      background:
        rgba(60,60,60,.75);
    }

    .direction.inactive{
      opacity:.14;

      background:
        rgba(120,120,120,.28);
    }

    .move-pad.locked
    .direction.active{
      opacity:.27;
    }

    #moveUp{
      top:0;
      left:42px;
    }

    #moveDown{
      bottom:0;
      left:42px;
    }

    #moveLeft{
      left:0;
      top:42px;
    }

    #moveRight{
      right:0;
      top:42px;
    }

    .pad-center{
      position:absolute;

      left:52px;
      top:52px;

      width:34px;
      height:34px;

      border:
        1px solid
        rgba(45,45,45,.28);

      border-radius:9px;

      background:
        rgba(90,90,90,.30);

      pointer-events:none;
    }


    /* =========================
       下メニュー
    ========================= */

    .menu{
      flex:0 0 auto;

      display:grid;

      grid-template-columns:
        1fr
        1fr;

      gap:5px;
    }

    .menu-button{
      min-height:46px;

      border:1px solid #999;
      border-radius:11px;

      background:#fff;

      color:#222;

      font-size:17px;
      font-weight:900;
    }

    .menu-button:active{
      background:#eee;
    }


    /* =========================
       低体温
       白い視界
    ========================= */

    .cold-vision{
      position:fixed;

      inset:0;

      z-index:50;

      pointer-events:none;

      background:
        rgba(
          255,
          255,
          255,
          var(--cold-opacity,0)
        );

      transition:
        background .8s ease;
    }


    /* =========================
       体力低下
       赤い視界
    ========================= */

    .health-vision{
      position:fixed;

      inset:0;

      z-index:51;

      pointer-events:none;

      background:
        radial-gradient(
          circle at center,
          rgba(140,0,0,0) 30%,
          rgba(
            140,
            0,
            0,
            var(--red-opacity,0)
          )
          100%
        );

      transition:
        background .8s ease;
    }


    /* =========================
       画面揺れ
    ========================= */

    @keyframes shakeLight{

      0%{
        transform:translate(0,0);
      }

      20%{
        transform:translate(-2px,1px);
      }

      40%{
        transform:translate(2px,-1px);
      }

      60%{
        transform:translate(-1px,-1px);
      }

      80%{
        transform:translate(1px,1px);
      }

      100%{
        transform:translate(0,0);
      }

    }

    @keyframes shakeHeavy{

      0%{
        transform:translate(0,0);
      }

      10%{
        transform:translate(-4px,2px);
      }

      20%{
        transform:translate(4px,-3px);
      }

      30%{
        transform:translate(-3px,-2px);
      }

      40%{
        transform:translate(4px,3px);
      }

      50%{
        transform:translate(-4px,0);
      }

      60%{
        transform:translate(3px,-3px);
      }

      70%{
        transform:translate(-2px,3px);
      }

      80%{
        transform:translate(3px,1px);
      }

      90%{
        transform:translate(-2px,-1px);
      }

      100%{
        transform:translate(0,0);
      }

    }

    .game.shake-light{
      animation:
        shakeLight
        .32s
        linear;
    }

    .game.shake-heavy{
      animation:
        shakeHeavy
        .48s
        linear;
    }


    /* =========================
       ITEM
    ========================= */

    .modal{
      position:fixed;

      inset:0;

      z-index:100;

      display:none;

      align-items:center;
      justify-content:center;

      padding:18px;

      background:rgba(0,0,0,.5);
    }

    .modal.open{
      display:flex;
    }

    .modal-card{
      width:min(430px,100%);

      max-height:80dvh;

      overflow:auto;

      padding:16px;

      border-radius:18px;

      background:#fff;
    }

    .modal-card h2{
      margin:0 0 12px;

      font-size:22px;
    }

    .pause-note{
      margin:0 0 12px;

      padding:8px;

      border-radius:10px;

      background:#eee;

      font-size:17px;
      line-height:1.4;

      text-align:center;
    }

    .item-list{
      min-height:55px;

      font-size:17px;
      line-height:1.6;
    }

    .item-row{
      min-height:50px;

      padding:10px 4px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:12px;

      border-bottom:1px solid #ddd;
    }

    .item-row:last-child{
      border-bottom:0;
    }

    .item-name{
      font-size:17px;
      font-weight:700;
    }

    .item-count{
      flex:0 0 auto;

      font-size:17px;
      font-weight:900;
    }

    .close-button{
      width:100%;

      min-height:50px;

      margin-top:14px;

      border:1px solid #999;
      border-radius:13px;

      background:#fff;

      font-size:17px;
      font-weight:900;
    }


    /* =========================
       DEAD
    ========================= */

    .dead-modal{
      position:fixed;

      inset:0;

      z-index:200;

      display:none;

      align-items:center;
      justify-content:center;

      padding:20px;

      background:rgba(0,0,0,.84);
    }

    .dead-modal.open{
      display:flex;
    }

    .dead-card{
      width:min(400px,100%);

      padding:24px 18px;

      border-radius:17px;

      background:#f6f6f6;

      text-align:center;
    }

    .dead-title{
      margin:0;

      font-size:34px;
      letter-spacing:.08em;
    }

    .dead-reason{
      margin:15px 0 20px;

      font-size:17px;
      line-height:1.5;
    }

    .restart-button{
      width:100%;

      min-height:52px;

      border:1px solid #777;
      border-radius:13px;

      background:#fff;

      font-size:17px;
      font-weight:900;
    }


    @media(max-width:390px){

      .topbar{
        grid-template-columns:
          34px
          48px
          76px
          minmax(0,1fr);
      }

      .back{
        width:34px;
        height:34px;
      }

      .top-small{
        height:34px;

        font-size:12px;
      }

      .meter{
        height:30px;
      }

      .meter-icon{
        width:17px;
        height:17px;

        flex-basis:17px;
      }

      .meter-value{
        font-size:12px;
      }

      .movement-row{
        min-height:134px;
      }

      .move-pad{
        width:130px;
        height:130px;

        flex-basis:130px;
      }

      .direction{
        width:50px;
        height:50px;

        font-size:26px;
      }

      #moveUp{
        left:40px;
      }

      #moveDown{
        left:40px;
      }

      #moveLeft{
        top:40px;
      }

      #moveRight{
        top:40px;
      }

      .pad-center{
        left:49px;
        top:49px;

        width:32px;
        height:32px;
      }

    }

  </style>

</head>


<body>


<main
  id="game"
  class="game"
>


  <!-- =========================
       TOP
  ========================= -->

  <header class="topbar">


    <a
      class="back"
      href="survival%20game_TOP.html"
      aria-label="戻る"
    >
      ←
    </a>


    <div
      id="day"
      class="top-small"
    >
      Day.1
    </div>


    <div
      id="clock"
      class="top-small"
    >
      08:00:00
    </div>


    <div
      id="currentPlace"
      class="top-small place"
    >
      針葉樹林
    </div>


  </header>



  <!-- =========================
       生存メーター
  ========================= -->

  <section class="meters">


    <!-- 体温 -->

    <div
      class="meter"
      aria-label="体温"
    >

      <svg
        class="meter-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <defs>

          <clipPath id="tempClip">

            <rect
              id="tempClipRect"
              x="0"
              y="0"
              width="24"
              height="24"
            ></rect>

          </clipPath>

        </defs>


        <path
          id="tempFill"
          clip-path="url(#tempClip)"
          d="
            M12 2
            C9.8 2 8 3.8 8 6
            V14.1
            C6.7 15.3 6 17 6 18.7
            C6 22 8.7 24 12 24
            C15.3 24 18 22 18 18.7
            C18 17 17.3 15.3 16 14.1
            V6
            C16 3.8 14.2 2 12 2
            Z
          "
        ></path>


        <path
          class="meter-outline"
          d="
            M12 2
            C9.8 2 8 3.8 8 6
            V14.1
            C6.7 15.3 6 17 6 18.7
            C6 22 8.7 24 12 24
            C15.3 24 18 22 18 18.7
            C18 17 17.3 15.3 16 14.1
            V6
            C16 3.8 14.2 2 12 2
            Z
          "
        ></path>

      </svg>


      <div
        id="tempValue"
        class="meter-value"
      >
        36.7℃
      </div>

    </div>



    <!-- 空腹 -->

    <div
      class="meter"
      aria-label="空腹"
    >

      <svg
        class="meter-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <defs>

          <clipPath id="hungerClip">

            <rect
              id="hungerClipRect"
              x="0"
              y="0"
              width="24"
              height="24"
            ></rect>

          </clipPath>

        </defs>


        <path
          id="hungerFill"
          clip-path="url(#hungerClip)"
          d="
            M12 7
            C9.5 4.5 5.2 5.4 3.8 8.6
            C1.7 13.4 5.2 20.5 9.3 22
            C10.5 22.4 11.3 21.7 12 21.3
            C12.7 21.7 13.5 22.4 14.7 22
            C18.8 20.5 22.3 13.4 20.2 8.6
            C18.8 5.4 14.5 4.5 12 7
            Z
            M12.5 5.8
            C12.4 3.3 13.8 1.5 16.6 1
            C16.7 3.7 15.3 5.4 12.5 5.8
            Z
          "
        ></path>


        <path
          class="meter-outline"
          d="
            M12 7
            C9.5 4.5 5.2 5.4 3.8 8.6
            C1.7 13.4 5.2 20.5 9.3 22
            C10.5 22.4 11.3 21.7 12 21.3
            C12.7 21.7 13.5 22.4 14.7 22
            C18.8 20.5 22.3 13.4 20.2 8.6
            C18.8 5.4 14.5 4.5 12 7
            Z
            M12.5 5.8
            C12.4 3.3 13.8 1.5 16.6 1
            C16.7 3.7 15.3 5.4 12.5 5.8
            Z
          "
        ></path>

      </svg>


      <div
        id="hungerValue"
        class="meter-value"
      >
        100
      </div>

    </div>



    <!-- 体力 -->

    <div
      class="meter"
      aria-label="体力"
    >

      <svg
        class="meter-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <defs>

          <clipPath id="staminaClip">

            <rect
              id="staminaClipRect"
              x="0"
              y="0"
              width="24"
              height="24"
            ></rect>

          </clipPath>

        </defs>


        <path
          id="staminaFill"
          clip-path="url(#staminaClip)"
          d="
            M12 21
            C10.7 19.8 4.3 15.5 2.6 11.6
            C.6 7.2 3.5 3.5 7.4 3.5
            C9.5 3.5 11 4.7 12 6.1
            C13 4.7 14.5 3.5 16.6 3.5
            C20.5 3.5 23.4 7.2 21.4 11.6
            C19.7 15.5 13.3 19.8 12 21
            Z
          "
        ></path>


        <path
          class="meter-outline"
          d="
            M12 21
            C10.7 19.8 4.3 15.5 2.6 11.6
            C.6 7.2 3.5 3.5 7.4 3.5
            C9.5 3.5 11 4.7 12 6.1
            C13 4.7 14.5 3.5 16.6 3.5
            C20.5 3.5 23.4 7.2 21.4 11.6
            C19.7 15.5 13.3 19.8 12 21
            Z
          "
        ></path>

      </svg>


      <div
        id="staminaValue"
        class="meter-value"
      >
        100
      </div>

    </div>


  </section>



  <!-- =========================
       景色
  ========================= -->

  <section class="scene">


    <div
      id="sceneBackground"
      class="scene-background"
    ></div>



    <div
      id="objectLayer"
      class="scene-objects"
    >


      <button
        id="branchObject"
        class="scene-object"
        type="button"
        aria-label="細い枝を拾う"
      >

        <img
          src="assets/survival/branch_01.png"
          alt=""
          draggable="false"
        >

      </button>



      <button
        id="stoneObject"
        class="scene-object"
        type="button"
        aria-label="小石を拾う"
      >

        <img
          src="assets/survival/stone_01.png"
          alt=""
          draggable="false"
        >

      </button>


    </div>



    <!-- 説明パネル -->

    <div
      id="noticeShell"
      class="scene-notice-shell"
    >

      <div
        id="sceneNotice"
        class="scene-notice"
      ></div>


      <button
        id="noticeTab"
        class="notice-tab"
        type="button"
        aria-label="説明を開閉"
      >
        ▲
      </button>


    </div>


  </section>



  <!-- =========================
       十字キー
  ========================= -->

  <section class="movement-row">


    <div
      id="movePad"
      class="move-pad"
      aria-label="移動"
    >


      <button
        id="moveUp"
        class="direction"
        type="button"
        aria-label="前へ進む"
      >
        ▲
      </button>


      <button
        id="moveLeft"
        class="direction"
        type="button"
        aria-label="左へ進む"
      >
        ◀
      </button>


      <div
        class="pad-center"
        aria-hidden="true"
      ></div>


      <button
        id="moveRight"
        class="direction"
        type="button"
        aria-label="右へ進む"
      >
        ▶
      </button>


      <button
        id="moveDown"
        class="direction"
        type="button"
        aria-label="後ろへ戻る"
      >
        ▼
      </button>


    </div>


  </section>



  <!-- =========================
       下メニュー
  ========================= -->

  <nav class="menu">


    <button
      id="itemButton"
      class="menu-button"
      type="button"
    >
      ITEM
    </button>


    <button
      id="lookButton"
      class="menu-button"
      type="button"
    >
      周囲を見る
    </button>


  </nav>


</main>



<!-- 低体温の白い視界 -->

<div
  id="coldVision"
  class="cold-vision"
></div>



<!-- 体力低下の赤い視界 -->

<div
  id="healthVision"
  class="health-vision"
></div>



<!-- =========================
     ITEM
========================== -->

<div
  id="itemModal"
  class="modal"
>


  <section class="modal-card">

  /* =========================
     共通
  ========================= */

  function clamp(
    value,
    min,
    max
  ){

    return Math.max(
      min,
      Math.min(
        max,
        value
      )
    );

  }


  /* =========================
     時計
  ========================= */

  function renderClock(){

    const total =
      Math.floor(
        gameSeconds
      );

    const day =
      Math.floor(
        total / 86400
      ) + 1;

    const secondInDay =
      total % 86400;

    const hour =
      Math.floor(
        secondInDay / 3600
      );

    const minute =
      Math.floor(
        (
          secondInDay % 3600
        )
        /
        60
      );

    const second =
      secondInDay % 60;


    document
      .getElementById(
        "day"
      )
      .textContent =
        "Day." + day;


    document
      .getElementById(
        "clock"
      )
      .textContent =
        String(
          hour
        )
        .padStart(
          2,
          "0"
        )
        +
        ":"
        +
        String(
          minute
        )
        .padStart(
          2,
          "0"
        )
        +
        ":"
        +
        String(
          second
        )
        .padStart(
          2,
          "0"
        );

  }


  /* =========================
     メーター色
  ========================= */

  function normalMeterColor(
    value
  ){

    if(
      value <= 20
    ){

      return "#c62828";

    }


    if(
      value <= 40
    ){

      return "#d6a000";

    }


    return "#151515";

  }


  function temperatureColor(){

    if(
      bodyTemperature < 33
    ){

      return "#c62828";

    }


    if(
      bodyTemperature < 35
    ){

      return "#d6a000";

    }


    return "#151515";

  }


  /* =========================
     SVGメーター
  ========================= */

  function setSvgFillLevel(
    rectId,
    percent
  ){

    const value =
      clamp(
        percent,
        0,
        100
      );


    const height =
      24
      *
      value
      /
      100;


    const y =
      24
      -
      height;


    const rect =
      document
        .getElementById(
          rectId
        );


    rect.setAttribute(
      "y",
      y
    );


    rect.setAttribute(
      "height",
      height
    );

  }


  /* =========================
     メーター表示
  ========================= */

  function renderMeters(){


    const temperaturePercent =
      clamp(
        (
          (
            bodyTemperature
            -
            28
          )
          /
          (
            36.8
            -
            28
          )
        )
        *
        100,
        0,
        100
      );


    setSvgFillLevel(
      "tempClipRect",
      temperaturePercent
    );


    document
      .getElementById(
        "tempFill"
      )
      .style
      .fill =
        temperatureColor();


    document
      .getElementById(
        "tempValue"
      )
      .textContent =
        bodyTemperature
          .toFixed(1)
        +
        "℃";


    setSvgFillLevel(
      "hungerClipRect",
      hunger
    );


    document
      .getElementById(
        "hungerFill"
      )
      .style
      .fill =
        normalMeterColor(
          hunger
        );


    document
      .getElementById(
        "hungerValue"
      )
      .textContent =
        Math.round(
          hunger
        );


    setSvgFillLevel(
      "staminaClipRect",
      stamina
    );


    document
      .getElementById(
        "staminaFill"
      )
      .style
      .fill =
        normalMeterColor(
          stamina
        );


    document
      .getElementById(
        "staminaValue"
      )
      .textContent =
        Math.round(
          stamina
        );


    updateVisualEffects();

  }


  /* =========================
     白い視界
  ========================= */

  function coldOpacity(){

    if(
      bodyTemperature >= 35
    ){

      return 0;

    }


    if(
      bodyTemperature >= 33
    ){

      return (
        (
          35
          -
          bodyTemperature
        )
        /
        2
      )
      *
      0.09;

    }


    if(
      bodyTemperature >= 31
    ){

      return (
        0.09
        +
        (
          (
            33
            -
            bodyTemperature
          )
          /
          2
        )
        *
        0.13
      );

    }


    if(
      bodyTemperature >= 29
    ){

      return (
        0.22
        +
        (
          (
            31
            -
            bodyTemperature
          )
          /
          2
        )
        *
        0.13
      );

    }


    return 0.38;

  }


  /* =========================
     赤い視界
  ========================= */

  function redOpacity(){

    if(
      stamina > 35
    ){

      return 0;

    }


    if(
      stamina > 20
    ){

      return (
        (
          35
          -
          stamina
        )
        /
        15
      )
      *
      0.13;

    }


    if(
      stamina > 10
    ){

      return (
        0.13
        +
        (
          (
            20
            -
            stamina
          )
          /
          10
        )
        *
        0.14
      );

    }


    return 0.34;

  }


  function updateVisualEffects(){

    document
      .getElementById(
        "coldVision"
      )
      .style
      .setProperty(
        "--cold-opacity",
        coldOpacity()
      );


    document
      .getElementById(
        "healthVision"
      )
      .style
      .setProperty(
        "--red-opacity",
        redOpacity()
      );

  }


  /* =========================
     画面揺れ
  ========================= */

  function triggerShake(
    strength="light"
  ){

    const game =
      document
        .getElementById(
          "game"
        );


    game.classList.remove(
      "shake-light",
      "shake-heavy"
    );


    void game.offsetWidth;


    if(
      strength === "heavy"
    ){

      game.classList.add(
        "shake-heavy"
      );

    }else{

      game.classList.add(
        "shake-light"
      );

    }


    setTimeout(
      ()=>{

        game.classList.remove(
          "shake-light",
          "shake-heavy"
        );

      },
      600
    );

  }


  /* =========================
     説明パネル
  ========================= */

  const noticeShell =
    document
      .getElementById(
        "noticeShell"
      );

  const sceneNotice =
    document
      .getElementById(
        "sceneNotice"
      );

  const noticeTab =
    document
      .getElementById(
        "noticeTab"
      );


  function setNoticeOpen(
    open
  ){

    noticeOpen =
      open;


    if(open){

      noticeShell
        .classList
        .add(
          "open"
        );


      noticeTab
        .textContent =
          "▼";

    }else{

      noticeShell
        .classList
        .remove(
          "open"
        );


      noticeTab
        .textContent =
          "▲";

    }

  }


  function showNotice(
    text,
    duration=4500
  ){

    if(
      noticeTimer
    ){

      clearTimeout(
        noticeTimer
      );

    }


    lastNotice =
      text;


    sceneNotice
      .textContent =
        text;


    /*
      説明が開いている間は、
      必ずゲーム時間を停止する。
    */

    interactionLocked =
      true;


    setNoticeOpen(
      true
    );


    renderDirections();


    noticeTimer =
      setTimeout(
        ()=>{

          hideNotice();

        },
        duration
      );

  }


  function hideNotice(){

    if(
      noticeTimer
    ){

      clearTimeout(
        noticeTimer
      );

      noticeTimer =
        null;

    }


    setNoticeOpen(
      false
    );


    /*
      説明を閉じた時だけ
      通常移動画面へ戻る。
    */

    interactionLocked =
      false;


    renderDirections();

  }


  noticeTab
    .addEventListener(
      "click",
      ()=>{


        if(
          noticeOpen
        ){

          hideNotice();

          return;

        }


        if(
          !lastNotice
        ){

          return;

        }


        /*
          手動で読み返す場合も
          ゲーム時間を停止する。
        */

        interactionLocked =
          true;


        sceneNotice
          .textContent =
            lastNotice;


        setNoticeOpen(
          true
        );


        renderDirections();


        /*
          手動で開いた説明は
          勝手には閉じない。
          タブを押して閉じる。
        */

        if(
          noticeTimer
        ){

          clearTimeout(
            noticeTimer
          );

          noticeTimer =
            null;

        }


      }
    );


  /* =========================
     状態警告
  ========================= */

  function collectStatusWarnings(){

    const warnings =
      [];


    /* 体温 */

    if(
      bodyTemperature >= 35
    ){

      statusFlags.cold35 =
        false;

      statusFlags.cold33 =
        false;

      statusFlags.cold31 =
        false;

    }


    if(
      bodyTemperature < 35
      &&
      !statusFlags.cold35
    ){

      statusFlags.cold35 =
        true;

      warnings.push(
        "身体が冷えてきました。"
      );

      triggerShake(
        "light"
      );

    }


    if(
      bodyTemperature < 33
      &&
      !statusFlags.cold33
    ){

      statusFlags.cold33 =
        true;

      warnings.push(
        "震えが止まりません。\nかなり身体が冷えています。"
      );

      triggerShake(
        "heavy"
      );

    }


    if(
      bodyTemperature < 31
      &&
      !statusFlags.cold31
    ){

      statusFlags.cold31 =
        true;

      warnings.push(
        "意識がぼんやりします。\n早く寒さをしのげる場所を探さなければ。"
      );

      triggerShake(
        "heavy"
      );

    }


    /* 空腹 */

    if(
      hunger > 40
    ){

      statusFlags.hunger40 =
        false;

      statusFlags.hunger20 =
        false;

      statusFlags.hunger0 =
        false;

    }


    if(
      hunger <= 40
      &&
      !statusFlags.hunger40
    ){

      statusFlags.hunger40 =
        true;

      warnings.push(
        "空腹を強く感じます。"
      );

    }


    if(
      hunger <= 20
      &&
      !statusFlags.hunger20
    ){

      statusFlags.hunger20 =
        true;

      warnings.push(
        "腹が痛みます。\n力が出ません。"
      );

    }


    if(
      hunger <= 0
      &&
      !statusFlags.hunger0
    ){

      statusFlags.hunger0 =
        true;

      warnings.push(
        "何か食べなければ、身体がもちません。"
      );

    }


    /* 体力 */

    if(
      stamina > 60
    ){

      statusFlags.stamina60 =
        false;

      statusFlags.stamina35 =
        false;

      statusFlags.stamina20 =
        false;

      statusFlags.stamina10 =
        false;

    }


    if(
      stamina <= 60
      &&
      !statusFlags.stamina60
    ){

      statusFlags.stamina60 =
        true;

      warnings.push(
        "身体が重く感じます。"
      );

      triggerShake(
        "light"
      );

    }


    if(
      stamina <= 35
      &&
      !statusFlags.stamina35
    ){

      statusFlags.stamina35 =
        true;

      warnings.push(
        "かなり消耗しています。"
      );

    }


    if(
      stamina <= 20
      &&
      !statusFlags.stamina20
    ){

      statusFlags.stamina20 =
        true;

      warnings.push(
        "立っているのもつらくなってきました。"
      );

      triggerShake(
        "heavy"
      );

    }


    if(
      stamina <= 10
      &&
      !statusFlags.stamina10
    ){

      statusFlags.stamina10 =
        true;

      warnings.push(
        "もうほとんど身体が動きません。"
      );

      triggerShake(
        "heavy"
      );

    }


    return warnings;

  }


  /* =========================
     死亡
  ========================= */

  function checkDeath(){

    if(
      gameOver
    ){

      return;

    }


    if(
      stamina <= 0
    ){

      showDead(
        "体力が尽きました。"
      );

    }

  }


  function showDead(
    reason
  ){

    gameOver =
      true;

    interactionLocked =
      true;


    document
      .getElementById(
        "deadReason"
      )
      .textContent =
        reason;


    document
      .getElementById(
        "deadModal"
      )
      .classList
      .add(
        "open"
      );

  }


  /* =========================
     生存消耗
  ========================= */

  function applySurvivalDrain(
    seconds
  ){

    const minutes =
      seconds / 60;


    bodyTemperature -=
      0.008
      *
      minutes;


    hunger -=
      0.10
      *
      minutes;


    hunger =
      clamp(
        hunger,
        0,
        100
      );


    if(
      bodyTemperature < 35
    ){

      stamina -=
        0.08
        *
        minutes;

    }


    if(
      bodyTemperature < 33
    ){

      stamina -=
        0.30
        *
        minutes;

    }


    if(
      bodyTemperature < 31
    ){

      stamina -=
        0.55
        *
        minutes;

    }


    if(
      bodyTemperature < 29
    ){

      stamina -=
        1.20
        *
        minutes;

    }


    if(
      hunger <= 0
    ){

      stamina -=
        0.25
        *
        minutes;

    }


    stamina =
      clamp(
        stamina,
        0,
        100
      );


    renderMeters();

    checkDeath();

  }


  /* =========================
     時間経過
  ========================= */

  function advanceTime(
    seconds,
    showWarnings=true
  ){

    if(
      gameOver
    ){

      return [];

    }


    gameSeconds +=
      seconds;


    applySurvivalDrain(
      seconds
    );


    renderClock();


    if(
      gameOver
    ){

      return [];

    }


    const warnings =
      collectStatusWarnings();


    if(
      showWarnings
      &&
      warnings.length > 0
    ){

      showNotice(
        warnings.join(
          "\n\n"
        ),
        5000
      );

    }


    return warnings;

  }


  /* =========================
     自動時間

     通常の移動画面だけ進む。

     説明
     ITEM
     DEAD
     その他の操作中
     は停止。
  ========================= */

  setInterval(
    ()=>{


      if(
        menuOpen
        ||
        gameOver
        ||
        interactionLocked
        ||
        noticeOpen
      ){

        return;

      }


      if(
        document.visibilityState
        !==
        "visible"
      ){

        return;

      }


      advanceTime(
        5,
        true
      );


    },
    1000
  );

        `url("${scene.image}")`;


    document
      .getElementById(
        "currentPlace"
      )
      .textContent =
        scene.place;


    renderSceneObjects();

    renderDirections();


    if(
      showSceneMessage
    ){

      showNotice(
        scene.message,
        4300
      );

    }

  }


  /* =========================

  ========================= */

  function renderSceneObjects(){

    const scene =
      SCENES[
        currentScene
      ];


    const branch =
      document
        .getElementById(
          "branchObject"
        );


    const stone =
      document
        .getElementById(
          "stoneObject"
        );


    if(
      scene.objects
      &&
      inventory.branch === 0
    ){

      branch
        .classList
        .remove(
          "hidden"
        );

    }else{

      branch
        .classList
        .add(
          "hidden"
        );

    }


    if(
      scene.objects
      &&
      inventory.stone === 0
    ){

      stone
        .classList
        .remove(
          "hidden"
        );

    }else{

      stone
        .classList
        .add(
          "hidden"
        );

    }

  }


  /* =========================
     十字キー
  ========================= */

  const movePad =
    document
      .getElementById(
        "movePad"
      );


  const directionButtons = {

    up:
      document
        .getElementById(
          "moveUp"
        ),

    down:
      document
        .getElementById(
          "moveDown"
        ),

    left:
      document
        .getElementById(
          "moveLeft"
        ),

    right:
      document
        .getElementById(
          "moveRight"
        )

  };


  function renderDirections(){

    const scene =
      SCENES[
        currentScene
      ];


    const locked =
      interactionLocked
      ||
      menuOpen
      ||
      gameOver
      ||
      noticeOpen;


    movePad
      .classList
      .toggle(
        "locked",
        locked
      );


    for(
      const direction
      of
      Object.keys(
        directionButtons
      )
    ){

      const button =
        directionButtons[
          direction
        ];


      const target =
        scene.moves[
          direction
        ];


      if(
        target
      ){

        button
          .classList
          .add(
            "active"
          );


        button
          .classList
          .remove(
            "inactive"
          );

      }else{

        button
          .classList
          .remove(
            "active"
          );


        button
          .classList
          .add(
            "inactive"
          );

      }


      button.disabled =
        locked
        ||
        !target;

    }

  }


  /* =========================
     移動
  ========================= */

  function movementStaminaCost(){

    if(
      hunger <= 0
    ){

      return (
        MOVE_STAMINA_COST
        *
        1.8
      );

    }


    if(
      hunger <= 20
    ){

      return (
        MOVE_STAMINA_COST
        *
        1.5
      );

    }


    return MOVE_STAMINA_COST;

  }


  function move(
    direction
  ){

    if(
      gameOver
      ||
      menuOpen
      ||
      interactionLocked
      ||
      noticeOpen
    ){

      return;

    }


    const scene =
      SCENES[
        currentScene
      ];


    const target =
      scene.moves[
        direction
      ];


    if(
      !target
    ){

      return;

    }


    stamina -=
      movementStaminaCost();


    stamina =
      clamp(
        stamina,
        0,
        100
      );


    bodyTemperature -=
      MOVE_TEMP_DROP;


    const warnings =
      advanceTime(
        MOVE_SECONDS,
        false
      );


    if(
      gameOver
    ){

      return;

    }


    currentScene =
      target;


    renderScene(
      false
    );


    const nextScene =
      SCENES[
        currentScene
      ];


    let text =
      nextScene.message;


    if(
      warnings.length > 0
    ){

      text +=
        "\n\n"
        +
        warnings.join(
          "\n\n"
        );

    }


    showNotice(
      text,
      warnings.length > 0
        ? 5600
        : 4300
    );


    renderMeters();

  }


  directionButtons
    .up
    .addEventListener(
      "click",
      ()=>{

        move(
          "up"
        );

      }
    );


  directionButtons
    .down
    .addEventListener(
      "click",
      ()=>{

        move(
          "down"
        );

      }
    );


  directionButtons
    .left
    .addEventListener(
      "click",
      ()=>{

        move(
          "left"
        );

      }
    );


  directionButtons
    .right
    .addEventListener(
      "click",
      ()=>{

        move(
          "right"
        );

      }
    );


  /* =========================
     枝を拾う
  ========================= */

  document
    .getElementById(
      "branchObject"
    )
    .addEventListener(
      "click",
      ()=>{


        if(
          gameOver
          ||
          menuOpen
          ||
          interactionLocked
          ||
          noticeOpen
          ||
          currentScene !== "start"
          ||
          inventory.branch > 0
        ){

          return;

        }


        inventory.branch +=
          1;


        stamina -=
          0.5;


        stamina =
          clamp(
            stamina,
            0,
            100
          );


        const warnings =
          advanceTime(
            10,
            false
          );


        renderSceneObjects();

        renderInventory();

        renderMeters();


        let text =
          "細い枝を拾いました。";


        if(
          warnings.length > 0
        ){

          text +=
            "\n\n"
            +
            warnings.join(
              "\n\n"
            );

        }


        showNotice(
          text,
          3800
        );


      }
    );


  /* =========================
     石を拾う
  ========================= */

  document
    .getElementById(
      "stoneObject"
    )
    .addEventListener(
      "click",
      ()=>{


        if(
          gameOver
          ||
          menuOpen
          ||
          interactionLocked
          ||
          noticeOpen
          ||
          currentScene !== "start"
          ||
          inventory.stone > 0
        ){

          return;

        }


        inventory.stone +=
          1;


        stamina -=
          0.5;


        stamina =
          clamp(
            stamina,
            0,
            100
          );


        const warnings =
          advanceTime(
            10,
            false
          );


        renderSceneObjects();

        renderInventory();

        renderMeters();


        let text =
          "小石を拾いました。";


        if(
          warnings.length > 0
        ){

          text +=
            "\n\n"
            +
            warnings.join(
              "\n\n"
            );

        }


        showNotice(
          text,
          3800
        );


      }
    );


  /* =========================
     ITEM一覧
  ========================= */

  function renderInventory(){

    const itemList =
      document
        .getElementById(
          "itemList"
        );


    const rows =
      [];


    if(
      inventory.branch > 0
    ){

      rows.push(
        `
          <div class="item-row">

            <span class="item-name">
              細い枝
            </span>

            <span class="item-count">
              × ${inventory.branch}
            </span>

          </div>
        `
      );

    }


    if(
      inventory.stone > 0
    ){

      rows.push(
        `
          <div class="item-row">

            <span class="item-name">
              小石
            </span>

            <span class="item-count">
              × ${inventory.stone}
            </span>

          </div>
        `
      );

    }


    if(
      rows.length === 0
    ){

      itemList
        .textContent =
          "まだ何も持っていません。";

      return;

    }


    itemList
      .innerHTML =
        rows.join("");

  }


  /* =========================
     ITEM
  ========================= */

  const itemModal =
    document
      .getElementById(
        "itemModal"
      );


  document
    .getElementById(
      "itemButton"
    )
    .addEventListener(
      "click",
      ()=>{


        if(
          gameOver
        ){

          return;

        }


        menuOpen =
          true;


        renderInventory();


        itemModal
          .classList
          .add(
            "open"
          );


        renderDirections();


      }
    );


  document
    .getElementById(
      "closeItem"
    )
    .addEventListener(
      "click",
      ()=>{


        menuOpen =
          false;


        itemModal
          .classList
          .remove(
            "open"
          );


        renderDirections();


      }
    );


  /* =========================
     周囲を見る
  ========================= */

  document
    .getElementById(
      "lookButton"
    )
    .addEventListener(
      "click",
      ()=>{


        if(
          gameOver
          ||
          menuOpen
          ||
          interactionLocked
          ||
          noticeOpen
        ){

          return;

        }


        stamina -=
          0.7;


        stamina =
          clamp(
            stamina,
            0,
            100
          );


        const warnings =
          advanceTime(
            30,
            false
          );


        const scene =
          SCENES[
            currentScene
          ];


        let text =
          scene.look
          +
          "\n\n30秒経過";


        if(
          warnings.length > 0
        ){

          text +=
            "\n\n"
            +
            warnings.join(
              "\n\n"
            );

        }


        showNotice(
          text,
          4800
        );


      }
    );


  /* =========================
     最初から
  ========================= */

  document
    .getElementById(
      "restartButton"
    )
    .addEventListener(
      "click",
      ()=>{


        window
          .location
          .reload();


      }
    );


  /* =========================
     初期表示
  ========================= */

  renderClock();

  renderMeters();

  renderInventory();

  renderScene(
    false
  );


  showNotice(
    SCENES.start.message,
    4500
  );


</script>


</body>

</html>
