<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>雪山サバイバル</title>

  <style>

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

      background:#e7eaec;
      color:#202427;
    }

    body{
      min-height:100dvh;
    }

    button,
    a{
      font:inherit;
    }

    button{
      touch-action:manipulation;

      -webkit-user-select:none;
      user-select:none;

      -webkit-tap-highlight-color:transparent;
    }


    /* =========================
       ゲーム全体
    ========================= */

    .game{
      width:min(100%,540px);
      height:100dvh;

      margin:0 auto;

      padding:
        calc(5px + env(safe-area-inset-top))
        7px
        calc(5px + env(safe-area-inset-bottom));

      display:flex;
      flex-direction:column;

      gap:4px;

      overflow:hidden;
    }


    /* =========================
       TOP
    ========================= */

    .topbar{
      flex:0 0 auto;

      display:grid;

      grid-template-columns:
        36px
        52px
        78px
        minmax(0,1fr);

      align-items:center;

      gap:4px;
    }


    .back{
      width:36px;
      height:36px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid #999;
      border-radius:9px;

      background:#fff;

      color:#222;
      text-decoration:none;

      font-size:22px;
      font-weight:900;

      line-height:1;
    }


    .top-small{
      height:36px;

      padding:0 5px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid #aaa;
      border-radius:9px;

      background:#fff;

      font-size:14px;
      line-height:1;

      font-weight:800;

      white-space:nowrap;
    }


    .place{
      min-width:0;

      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }


    /* =========================
       生存メーター
    ========================= */

    .meters{
      flex:0 0 auto;

      display:grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:4px;
    }


    .meter{
      height:34px;

      min-width:0;

      padding:2px 5px;

      display:flex;
      align-items:center;
      justify-content:center;

      gap:4px;

      border:1px solid #aaa;
      border-radius:9px;

      background:#fff;
    }


    .meter-icon{
      width:20px;
      height:20px;

      flex:0 0 20px;

      overflow:visible;
    }


    .meter-outline{
      fill:none;

      stroke:#262626;
      stroke-width:1.5;

      stroke-linejoin:round;
      stroke-linecap:round;
    }


    .meter-value{
      min-width:0;

      font-size:14px;
      line-height:1;

      font-weight:900;

      white-space:nowrap;
    }


    /* =========================
       背景画像エリア

       横幅を少し短く
       縦も以前より短め
    ========================= */

    .scene{
      position:relative;

      width:94%;

      max-width:500px;

      aspect-ratio:4 / 3;

      margin:0 auto;

      flex:0 0 auto;

      overflow:hidden;

      border:1px solid #8c9296;
      border-radius:12px;

      background:#d9dcde;
    }


    .scene-background{
      position:absolute;

      inset:0;

      z-index:1;

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      transition:
        opacity .12s ease;

      pointer-events:none;
    }


    /* =========================
       拾える物
    ========================= */

    .scene-objects{
      position:absolute;

      inset:0;

      z-index:2;

      pointer-events:none;
    }


    .scene-object{
      position:absolute;

      display:block;

      margin:0;
      padding:0;

      border:0;

      background:transparent;

      pointer-events:auto;

      cursor:pointer;
    }


    .scene-object img{
      display:block;

      width:100%;
      height:100%;

      object-fit:contain;

      pointer-events:none;
    }


    .scene-object:active{
      transform:scale(.95);
    }


    .scene-object.hidden{
      display:none;
    }


    #branchObject{
      width:28%;

      aspect-ratio:1 / 1;

      left:5%;
      bottom:0;
    }


    #stoneObject{
      width:17%;

      aspect-ratio:1 / 1;

      right:9%;
      bottom:7%;
    }


    /* =========================
       下部
       メッセージ＋十字キー
    ========================= */

    .lower-row{
      width:100%;

      min-height:112px;

      flex:1 1 auto;

      display:grid;

      grid-template-columns:
        minmax(0,1fr)
        116px;

      gap:5px;

      align-items:end;
    }


    .message{
      align-self:stretch;

      min-height:84px;

      padding:8px 9px;

      display:flex;
      align-items:flex-start;

      border:1px solid #aaa;
      border-radius:11px;

      background:#fff;

      font-size:17px;
      line-height:1.42;

      overflow:auto;
    }


    /* =========================
       十字キー
    ========================= */

    .move-pad{
      position:relative;

      width:116px;
      height:116px;

      flex:0 0 116px;

      align-self:end;
    }


    .direction{
      position:absolute;

      width:44px;
      height:44px;

      padding:0;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid rgba(50,50,50,.35);
      border-radius:9px;

      background:rgba(90,90,90,.55);

      color:#111;

      font-size:23px;
      line-height:1;

      font-weight:900;

      transition:
        opacity .12s ease,
        background .12s ease,
        transform .08s ease;
    }


    .direction.active{
      opacity:.82;
    }


    .direction.active:active{
      transform:scale(.92);

      background:rgba(65,65,65,.72);
    }


    .direction.inactive{
      opacity:.16;

      background:rgba(100,100,100,.34);

      pointer-events:none;
    }


    #moveUp{
      top:0;
      left:36px;
    }


    #moveDown{
      bottom:0;
      left:36px;
    }


    #moveLeft{
      left:0;
      top:36px;
    }


    #moveRight{
      right:0;
      top:36px;
    }


    .pad-center{
      position:absolute;

      left:45px;
      top:45px;

      width:26px;
      height:26px;

      border:1px solid rgba(50,50,50,.25);
      border-radius:8px;

      background:rgba(90,90,90,.27);

      pointer-events:none;
    }


    /* =========================
       下メニュー
    ========================= */

    .menu{
      flex:0 0 auto;

      display:grid;

      grid-template-columns:
        1fr
        1fr;

      gap:5px;
    }


    .menu-button{
      min-height:46px;

      border:1px solid #999;
      border-radius:11px;

      background:#fff;

      color:#222;

      font-size:17px;
      font-weight:900;
    }


    .menu-button:active{
      background:#eee;
    }


    /* =========================
       ITEM
    ========================= */

    .modal{
      position:fixed;

      inset:0;

      z-index:100;

      display:none;

      align-items:center;
      justify-content:center;

      padding:18px;

      background:rgba(0,0,0,.5);
    }


    .modal.open{
      display:flex;
    }


    .modal-card{
      width:min(430px,100%);

      max-height:80dvh;

      overflow:auto;

      padding:16px;

      border-radius:18px;

      background:#fff;
    }


    .modal-card h2{
      margin:0 0 12px;

      font-size:22px;
    }


    .pause-note{
      margin:0 0 12px;

      padding:8px;

      border-radius:10px;

      background:#eee;

      font-size:17px;
      line-height:1.4;

      text-align:center;
    }


    .item-list{
      min-height:55px;

      font-size:17px;
      line-height:1.6;
    }


    .item-row{
      min-height:50px;

      padding:10px 4px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:12px;

      border-bottom:1px solid #ddd;
    }


    .item-row:last-child{
      border-bottom:0;
    }


    .item-name{
      font-size:17px;
      font-weight:700;
    }


    .item-count{
      flex:0 0 auto;

      font-size:17px;
      font-weight:900;
    }


    .close-button{
      width:100%;

      min-height:50px;

      margin-top:14px;

      border:1px solid #999;
      border-radius:13px;

      background:#fff;

      font-size:17px;
      font-weight:900;
    }


    /* =========================
       DEAD
    ========================= */

    .dead-modal{
      position:fixed;

      inset:0;

      z-index:200;

      display:none;

      align-items:center;
      justify-content:center;

      padding:20px;

      background:rgba(0,0,0,.83);
    }


    .dead-modal.open{
      display:flex;
    }


    .dead-card{
      width:min(400px,100%);

      padding:24px 18px;

      border-radius:17px;

      background:#f6f6f6;

      text-align:center;
    }


    .dead-title{
      margin:0;

      font-size:34px;
      letter-spacing:.08em;
    }


    .dead-reason{
      margin:15px 0 20px;

      font-size:17px;
      line-height:1.5;
    }


    .restart-button{
      width:100%;

      min-height:52px;

      border:1px solid #777;
      border-radius:13px;

      background:#fff;

      font-size:17px;
      font-weight:900;
    }


    @media(max-width:390px){

      .game{
        padding-left:5px;
        padding-right:5px;
      }


      .topbar{
        grid-template-columns:
          34px
          48px
          74px
          minmax(0,1fr);
      }


      .back{
        width:34px;
        height:34px;
      }


      .top-small{
        height:34px;

        font-size:13px;
      }


      .meter{
        height:32px;
      }


      .meter-icon{
        width:18px;
        height:18px;

        flex-basis:18px;
      }


      .meter-value{
        font-size:13px;
      }


      .lower-row{
        grid-template-columns:
          minmax(0,1fr)
          108px;
      }


      .move-pad{
        width:108px;
        height:108px;
      }


      .direction{
        width:42px;
        height:42px;
      }


      #moveUp{
        left:33px;
      }


      #moveDown{
        left:33px;
      }


      #moveLeft{
        top:33px;
      }


      #moveRight{
        top:33px;
      }


      .pad-center{
        left:42px;
        top:42px;

        width:24px;
        height:24px;
      }

    }

  </style>

</head>


<body>


<main class="game">


  <!-- =========================
       TOP
  ========================= -->

  <header class="topbar">


    <a

      href="survival%20game_TOP.html"

  </header>



  <!-- =========================

  ========================= -->

      </svg>


      <div
        id="hungerValue"
        class="meter-value"
      >
        100
      </div>

    </div>



    <!-- 体力 -->

    <div
      class="meter"
      aria-label="体力"
    >

      <svg
        class="meter-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <defs>

          <clipPath id="staminaClip">

      <div
        id="staminaValue"
        class="meter-value"

        100

    </div>


  </section>



  <!-- =========================
       背景
  ========================= -->

  <section class="scene">


    <div
      id="sceneBackground"
      class="scene-background"
    ></div>


    <div
      id="objectLayer"
      class="scene-objects"
    >


      <button
        id="branchObject"
        class="scene-object"
        type="button"
        aria-label="細い枝を拾う"
      >

        <img
          src="assets/survival/branch_01.png"
          alt=""
          draggable="false"
        >

      </button>


      <button
        id="stoneObject"
        class="scene-object"
        type="button"
        aria-label="小石を拾う"
      >

        <img
          src="assets/survival/stone_01.png"
          alt=""
          draggable="false"
        >

      </button>


    </div>


  </section>



  <!-- =========================
       説明＋十字キー
  ========================= -->

  <section class="lower-row">


    <div
      id="message"
      class="message"
    >
      雪の積もった針葉樹林です。足元に拾えそうな物があります。
    </div>



    <div
      class="move-pad"
      aria-label="移動"
    >


      <button
        id="moveUp"
        class="direction"
        type="button"
        aria-label="前へ進む"
      >
        ▲
      </button>


      <button
        id="moveLeft"
        class="direction"
        type="button"
        aria-label="左へ進む"
      >
        ◀
      </button>


      <div
        class="pad-center"
        aria-hidden="true"
      ></div>


      <button
        id="moveRight"
        class="direction"
        type="button"
        aria-label="右へ進む"
      >
        ▶
      </button>


      <button
        id="moveDown"
        class="direction"
        type="button"
        aria-label="後ろへ戻る"
      >
        ▼
      </button>


    </div>


  </section>



  <!-- =========================
       下メニュー
  ========================= -->

  <nav class="menu">


    <button
      id="itemButton"
      class="menu-button"
      type="button"
    >
      ITEM
    </button>


    <button
      id="lookButton"
      class="menu-button"
      type="button"
    >
      周囲を見る
    </button>


  </nav>


</main>



<!-- =========================
     ITEM
========================== -->

<div
  id="itemModal"
  class="modal"
>


  <section class="modal-card">


    <h2>
      ITEM
    </h2>


    <p class="pause-note">
      ITEMを開いている間、ゲーム内時間は止まります。
    </p>


    <div
      id="itemList"
      class="item-list"
    >
      まだ何も持っていません。
    </div>


    <button
      id="closeItem"
      class="close-button"
      type="button"
    >
      閉じる
    </button>


  </section>


</div>



<!-- =========================
     DEAD
========================== -->

<div
  id="deadModal"
  class="dead-modal"
>


  <section class="dead-card">


    <h2 class="dead-title">
      DEAD
    </h2>


    <p
      id="deadReason"
      class="dead-reason"
    ></p>


    <button
      id="restartButton"
      class="restart-button"
      type="button"
    >
      最初から
    </button>


  </section>


</div>

      objects:false,

      }

    },


    forest6:{

      image:
        "assets/survival/forest_04.jpeg",

      place:
        "林の出口",

      message:
        "木々の密度が少し低くなってきました。林を抜けられそうです。",

      look:

      objects:false,

      moves:{

    },


    forest7:{

      image:
        "assets/survival/forest_05.jpeg",

      place:
        "林の外れ",

      message:

      objects:false,

      moves:{

        left:null,

      }

    },


    cabinDistance:{

      image:
        "assets/survival/cabin_distance_01.png",

      place:
        "山小屋付近",

      message:
        "遠くに人工物が見えます。……山小屋のようです。",

      look:
        "雪の向こうに小さな山小屋があります。辿り着ければ寒さをしのげるかもしれません。",

      objects:false,

      moves:{
        up:"cabinFront",
        down:"forest7",
        left:null,
        right:null
      }

    },


    cabinFront:{

      image:
        "assets/survival/cabin_front_01.png",

      place:
        "山小屋",

      message:
        "ようやく山小屋の前まで辿り着きました。雪の上に赤黒い跡が見えます。",

      look:
        "山小屋の周囲を確認します。誰かがここへ入ったような血の跡が残っています。",

      objects:false,

      moves:{
        up:null,
        down:"cabinDistance",
        left:null,
        right:null
      }

    }


  };


  let currentScene =
    "start";


  /* =========================
     共通
  ========================= */

  function clamp(
    value,
    min,
    max
  ){

    return Math.max(
      min,
      Math.min(
        max,
        value
      )
    );

  }


  /* =========================
     時計
  ========================= */

  function renderClock(){

    const total =
      Math.floor(gameSeconds);

    const day =
      Math.floor(
        total / 86400
      ) + 1;

    const secondInDay =
      total % 86400;

    const hour =
      Math.floor(
        secondInDay / 3600
      );

    const minute =
      Math.floor(
        (secondInDay % 3600) / 60
      );

    const second =
      secondInDay % 60;


    document
      .getElementById("day")
      .textContent =
        "Day." + day;


    document
      .getElementById("clock")
      .textContent =
        String(hour)
          .padStart(2,"0")
        +
        ":"
        +
        String(minute)
          .padStart(2,"0")
        +
        ":"
        +
        String(second)
          .padStart(2,"0");

  }


  /* =========================
     メーター色
  ========================= */

  function normalMeterColor(
    percent
  ){

    if(percent <= 20){

      return "#c62828";

    }


    if(percent <= 40){

      return "#d6a000";

    }


    return "#151515";

  }


  function temperatureColor(){

    if(bodyTemperature < 33){

      return "#c62828";

    }


    if(bodyTemperature < 35){

      return "#d6a000";

    }


    return "#151515";

  }


  /* =========================
     SVG塗り量
  ========================= */

  function setSvgFillLevel(
    rectId,
    percent
  ){

    const value =
      clamp(
        percent,
        0,
        100
      );

    const height =
      24 * value / 100;

    const y =
      24 - height;


    const rect =
      document.getElementById(
        rectId
      );


    rect.setAttribute(
      "y",
      y
    );


    rect.setAttribute(
      "height",
      height
    );

  }


  /* =========================
     メーター表示
  ========================= */

  function renderMeters(){


    const temperaturePercent =
      clamp(
        (
          (
            bodyTemperature
            -
            28
          )
          /
          (
            36.8
            -
            28
          )
        )
        *
        100,
        0,
        100
      );


    setSvgFillLevel(
      "tempClipRect",
      temperaturePercent
    );


    document
      .getElementById(
        "tempFill"
      )
      .style.fill =
        temperatureColor();


    document
      .getElementById(
        "tempValue"
      )
      .textContent =
        bodyTemperature
          .toFixed(1)
        +
        "℃";


    setSvgFillLevel(
      "hungerClipRect",
      hunger
    );


    document
      .getElementById(
        "hungerFill"
      )
      .style.fill =
        normalMeterColor(
          hunger
        );


    document
      .getElementById(
        "hungerValue"
      )
      .textContent =
        Math.round(
          hunger
        );


    setSvgFillLevel(
      "staminaClipRect",
      stamina
    );


    document
      .getElementById(
        "staminaFill"
      )
      .style.fill =
        normalMeterColor(
          stamina
        );


    document
      .getElementById(
        "staminaValue"
      )
      .textContent =
        Math.round(
          stamina
        );

  }


  /* =========================
     生存消耗
  ========================= */

  function applySurvivalDrain(
    seconds
  ){

    const minutes =
      seconds / 60;


    bodyTemperature -=
      0.008
      *
      minutes;


    hunger -=
      0.10
      *
      minutes;


    hunger =
      clamp(
        hunger,
        0,
        100
      );


    if(
      bodyTemperature < 35
    ){

      stamina -=
        0.08
        *
        minutes;

    }


    if(
      bodyTemperature < 33
    ){

      stamina -=
        0.30
        *
        minutes;

    }


    if(
      hunger <= 0
    ){

      stamina -=
        0.25
        *
        minutes;

    }


    stamina =
      clamp(
        stamina,
        0,
        100
      );


    renderMeters();

    checkDeath();

  }


  /* =========================
     時間を進める
  ========================= */

  function advanceTime(
    seconds
  ){

    if(gameOver){
      return;
    }


    gameSeconds +=
      seconds;


    applySurvivalDrain(
      seconds
    );


    renderClock();

  }


  /* =========================
     自動時間

     現実1秒
     =
     ゲーム内5秒
  ========================= */

  setInterval(()=>{


    if(menuOpen){
      return;
    }


    if(gameOver){
      return;
    }


    if(
      document.visibilityState
      !==
      "visible"
    ){
      return;
    }


    advanceTime(
      5
    );


  },1000);


  /* =========================
     DEAD
  ========================= */

  function checkDeath(){

    if(gameOver){
      return;
    }


    if(stamina <= 0){

      showDead(
        "体力が尽きました。"
      );

    }

  }


  function showDead(
    reason
  ){

    gameOver=true;


    document
      .getElementById(
        "deadReason"
      )
      .textContent =
        reason;


    document
      .getElementById(
        "deadModal"
      )
      .classList
      .add(
        "open"
      );

  }


  /* =========================
     メッセージ
  ========================= */

  function setMessage(
    text
  ){

    document
      .getElementById(
        "message"
      )
      .textContent =
        text;

  }


  /* =========================
     シーン描画
  ========================= */

  function renderScene(){

    const scene =
      SCENES[
        currentScene
      ];


    document
      .getElementById(
        "sceneBackground"
      )
      .style
      .backgroundImage =
        `url("${scene.image}")`;


    document
      .getElementById(
        "currentPlace"
      )
      .textContent =
        scene.place;


    setMessage(
      scene.message
    );


    renderSceneObjects();

    renderDirections();

  }


  /* =========================
     アイテム描画
  ========================= */

  function renderSceneObjects(){

    const scene =
      SCENES[
        currentScene
      ];


    const branch =
      document.getElementById(
        "branchObject"
      );


    const stone =
      document.getElementById(
        "stoneObject"
      );


    if(
      scene.objects
      &&
      inventory.branch === 0
    ){

      branch
        .classList
        .remove(
          "hidden"
        );

    }else{

      branch
        .classList
        .add(
          "hidden"
        );

    }


    if(
      scene.objects
      &&
      inventory.stone === 0
    ){

      stone
        .classList
        .remove(
          "hidden"
        );

    }else{

      stone
        .classList
        .add(
          "hidden"
        );

    }

  }


  /* =========================
     十字キー
  ========================= */

  const directionButtons = {

    up:
      document.getElementById(
        "moveUp"
      ),

    down:
      document.getElementById(
        "moveDown"
      ),

    left:
      document.getElementById(
        "moveLeft"
      ),

    right:
      document.getElementById(
        "moveRight"
      )

  };


  function renderDirections(){

    const scene =
      SCENES[
        currentScene
      ];


    for(
      const direction
      of
      Object.keys(
        directionButtons
      )
    ){

      const button =
        directionButtons[
          direction
        ];


      const target =
        scene.moves[
          direction
        ];


      if(target){

        button
          .classList
          .add(
            "active"
          );


        button
          .classList
          .remove(
            "inactive"
          );


        button.disabled =
          false;

      }else{

        button
          .classList
          .remove(
            "active"
          );


        button
          .classList
          .add(
            "inactive"
          );


        button.disabled =
          true;

      }

    }

  }


  /* =========================
     移動
  ========================= */

  function move(
    direction
  ){

    if(
      gameOver
      ||
      menuOpen
    ){
      return;
    }


    const scene =
      SCENES[
        currentScene
      ];


    const target =
      scene.moves[
        direction
      ];


    if(!target){
      return;
    }


    stamina -=
      MOVE_STAMINA_COST;


    stamina =
      clamp(
        stamina,
        0,
        100
      );


    bodyTemperature -=
      MOVE_TEMP_DROP;


    advanceTime(
      MOVE_SECONDS
    );


    if(gameOver){
      return;
    }


    currentScene =
      target;


    renderScene();

    renderMeters();

  }


  directionButtons
    .up
    .addEventListener(
      "click",
      ()=>{
        move("up");
      }
    );


  directionButtons
    .down
    .addEventListener(
      "click",
      ()=>{
        move("down");
      }
    );


  directionButtons
    .left
    .addEventListener(
      "click",
      ()=>{
        move("left");
      }
    );


  directionButtons
    .right
    .addEventListener(
      "click",
      ()=>{
        move("right");
      }
    );


  /* =========================
     枝
  ========================= */

  document
    .getElementById(
      "branchObject"
    )
    .addEventListener(
      "click",
      ()=>{


        if(
          gameOver
          ||
          currentScene !== "start"
          ||
          inventory.branch > 0
        ){
          return;
        }


        inventory.branch +=
          1;


        stamina -=
          0.5;


        stamina =
          clamp(
            stamina,
            0,
            100
          );


        advanceTime(
          10
        );


        renderSceneObjects();

        renderInventory();

        renderMeters();


        setMessage(
          "細い枝を拾いました。"
        );


      }
    );


  /* =========================
     小石
  ========================= */

  document
    .getElementById(
      "stoneObject"
    )
    .addEventListener(
      "click",
      ()=>{


        if(
          gameOver
          ||
          currentScene !== "start"
          ||
          inventory.stone > 0
        ){
          return;
        }


        inventory.stone +=
          1;


        stamina -=
          0.5;


        stamina =
          clamp(
            stamina,
            0,
            100
          );


        advanceTime(
          10
        );


        renderSceneObjects();

        renderInventory();

        renderMeters();


        setMessage(
          "小石を拾いました。"
        );


      }
    );


  /* =========================
     ITEM一覧
  ========================= */

  function renderInventory(){

    const itemList =
      document.getElementById(
        "itemList"
      );


    const rows =
      [];


    if(
      inventory.branch > 0
    ){

      rows.push(
        `
          <div class="item-row">

            <span class="item-name">
              細い枝
            </span>

            <span class="item-count">
              × ${inventory.branch}
            </span>

          </div>
        `
      );

    }


    if(
      inventory.stone > 0
    ){

      rows.push(
        `
          <div class="item-row">

            <span class="item-name">
              小石
            </span>

            <span class="item-count">
              × ${inventory.stone}
            </span>

          </div>
        `
      );

    }


    if(
      rows.length === 0
    ){

      itemList.textContent =
        "まだ何も持っていません。";

      return;

    }


    itemList.innerHTML =
      rows.join("");

  }


  /* =========================
     ITEM
  ========================= */

  const itemModal =
    document.getElementById(
      "itemModal"
    );


  document
    .getElementById(
      "itemButton"
    )
    .addEventListener(
      "click",
      ()=>{


        if(gameOver){
          return;
        }


        menuOpen=true;


        renderInventory();


        itemModal
          .classList
          .add(
            "open"
          );


      }
    );


  document
    .getElementById(
      "closeItem"
    )
    .addEventListener(
      "click",
      ()=>{


        menuOpen=false;


        itemModal
          .classList
          .remove(
            "open"
          );


      }
    );


  /* =========================
     周囲を見る
  ========================= */

  document
    .getElementById(
      "lookButton"
    )
    .addEventListener(
      "click",
      ()=>{


        if(
          gameOver
          ||
          menuOpen
        ){
          return;
        }


        stamina -=
          0.7;


        stamina =
          clamp(
            stamina,
            0,
            100
          );


        advanceTime(
          30
        );


        const scene =
          SCENES[
            currentScene
          ];


        setMessage(
          scene.look
          +
          "（30秒経過）"
        );


      }
    );


  /* =========================
     最初から
  ========================= */

  document
    .getElementById(
      "restartButton"
    )
    .addEventListener(
      "click",
      ()=>{

        window
          .location
          .reload();

      }
    );


  /* =========================
     初期表示
  ========================= */

  renderClock();

  renderMeters();

  renderInventory();

  renderScene();


</script>
