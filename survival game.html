const $=id=>document.getElementById(id);

function setFillLevel(id,percent){const v=clamp(percent,0,100),h=24*v/100,r=$(id);r.setAttribute('y',24-h);r.setAttribute('height',h)}function normalColor(v){if(v<=20)return'#c62828';if(v<=40)return'#d6a000';return'#151515'}function temperatureColor(){if(bodyTemperature<33)return'#c62828';if(bodyTemperature<35)return'#d6a000';return'#151515'}

function getPageChoices(page){if(!page||typeof page!=='object')return[];if(Array.isArray(page.choices))return page.choices;if(page.action&&page.actionLabel)return[{label:page.actionLabel,action:page.action}];return[]}
function renderMessage(){messageChoices.innerHTML='';if(!messagePages.length){messageText.textContent='';messageProgress.textContent='';messageChoices.classList.add('hidden');return}const page=messagePages[messageIndex];messageText.textContent=typeof page==='string'?page:(page.text||'');messageProgress.textContent=(messageIndex+1)+' / '+messagePages.length;const choices=getPageChoices(page);if(!choices.length){messageChoices.classList.add('hidden');return}for(const choice of choices){const b=document.createElement('button');b.type='button';b.className='message-choice';b.textContent=choice.label;b.addEventListener('click',e=>{e.stopPropagation();if(!messageOpen)return;hideMessage();choice.action()});messageChoices.appendChild(b)}messageChoices.classList.remove('hidden')}
function setMessageOpen(open){messageOpen=open;messagePanel.classList.toggle('closed',!open);messageToggle.textContent=open?'◀':'▶';renderDirections()}
function showMessages(pages,options={}){messagePages=Array.isArray(pages)?pages.slice():[String(pages)];messageIndex=0;finalMessageAction=options.finalAction||null;renderMessage();setMessageOpen(true)}function hideMessage(){setMessageOpen(false)}function reopenMessage(){if(messagePages.length)setMessageOpen(true)}
function advanceMessage(){if(!messagePages.length){hideMessage();return}const page=messagePages[messageIndex],last=messageIndex>=messagePages.length-1;if(getPageChoices(page).length)return;if(!last){messageIndex++;renderMessage();return}if(finalMessageAction){const a=finalMessageAction;finalMessageAction=null;hideMessage();a();return}hideMessage()}
messagePanel.addEventListener('click',e=>{if(!messageOpen||e.target.closest('button'))return;advanceMessage()});messageToggle.addEventListener('click',e=>{e.stopPropagation();messageOpen?hideMessage():reopenMessage()});

function positionDoorHotspot(){if(currentScene!=='cabinFront')return;const w=sceneElement.clientWidth,h=sceneElement.clientHeight,scale=Math.max(w/DOOR_META.sourceWidth,h/DOOR_META.sourceHeight),rw=DOOR_META.sourceWidth*scale,rh=DOOR_META.sourceHeight*scale,ox=(w-rw)/2,oy=(h-rh)/2;doorHotspot.style.left=(ox+DOOR_META.left*scale)+'px';doorHotspot.style.top=(oy+DOOR_META.top*scale)+'px';doorHotspot.style.width=(DOOR_META.width*scale)+'px';doorHotspot.style.height=(DOOR_META.height*scale)+'px'}

function enterCabin(){currentScene='cabinInside';renderScene();showMessages(['山小屋の中へ入ります。'],{finalAction:()=>runSurvivalEvent('cabin_grant_first_meeting')})}doorHotspot.addEventListener('click',inspectDoor);
function showEventImage(src){eventImage.src=src;eventLayer.classList.add('visible')}function hideEventImage(){eventLayer.classList.remove('visible');eventImage.removeAttribute('src')}

function runSurvivalEvent(eventId){if(!window.SURVIVAL_EVENTS)return;const data=SURVIVAL_EVENTS.getEvent(eventId);if(!data)return;if(!SURVIVAL_EVENTS.shouldRun(eventId)){if(eventId==='cabin_grant_first_meeting'){metSurvivor=true;cabinExplorationUnlocked=true}renderMenuUnlocks();renderCharacter();renderDirections();return}eventActive=true;activeEventId=eventId;eventSteps=data.steps.slice();eventStepIndex=0;hideGrantCharacter();hideEventImage();renderDirections();runNextEventStep()}
function runNextEventStep(){if(!eventActive)return;if(eventStepIndex>=eventSteps.length){finishEvent();return}const step=eventSteps[eventStepIndex++];switch(step.type){case'background':setSceneBackground(step.image);runNextEventStep();break;case'eventImage':showEventImage(step.image);showMessages([step.speaker?step.speaker+'\n「'+step.text+'」':step.text],{finalAction:runNextEventStep});break;case'returnToScene':hideEventImage();setSceneBackground(step.background||getScene().image);runNextEventStep();break;case'showCharacter':showGrantCharacter(step.image);runNextEventStep();break;case'setFlag':setEventFlag(step.flag,step.value);runNextEventStep();break;case'startDialogue':startEventDialogue();break;case'completeEvent':SURVIVAL_EVENTS.markCompleted(activeEventId);finishEvent();break;default:runNextEventStep()}}

function move(direction){if(isPaused())return;const target=getScene().moves[direction];if(!target)return;stamina=clamp(stamina-MOVE_STAMINA_COST,0,100);if(!getScene().indoors)bodyTemperature-=MOVE_TEMP_DROP;advanceTime(MOVE_SECONDS);currentScene=target;renderScene();showMessages(getScene().messages);renderMeters()}
Object.entries(directionButtons).forEach(([d,b])=>b.addEventListener('click',()=>move(d)));$('lookButton').addEventListener('click',()=>{if(isPaused())return;showMessages(getScene().look)});
function renderInventory(){const list=$('inventoryList'),rows=[];for(const[id,count]of Object.entries(inventory)){if(count<=0)continue;const d=itemDef(id);rows.push(`<div class="item-row"><span class="item-name">${d?d.name:id}</span><span class="item-count">× ${count}</span></div>`)}list.innerHTML=rows.length?rows.join(''):'<div class="empty-message">まだ何も持っていません。</div>'}
const gameMenu=$('gameMenu'),menuTabs=document.querySelectorAll('.menu-tab'),menuPanels={inventory:$('menuPanelInventory'),map:$('menuPanelMap'),skills:$('menuPanelSkills'),craft:$('menuPanelCraft')};
function renderMenuUnlocks(){for(const tab of menuTabs){const name=tab.dataset.menuTab;tab.classList.toggle('hidden',name!=='inventory'&&!metSurvivor)}}function selectMenu(name){currentMenu=name;for(const tab of menuTabs)tab.classList.toggle('active',tab.dataset.menuTab===name);for(const[p,panel]of Object.entries(menuPanels))panel.classList.toggle('active',p===name);if(name==='inventory')renderInventory()}
function openGameMenu(){if(isPaused())return;menuOpen=true;gameMenu.classList.add('open');renderMenuUnlocks();selectMenu('inventory');renderDirections()}function closeGameMenu(){menuOpen=false;gameMenu.classList.remove('open');renderDirections()}$('menuKey').addEventListener('click',openGameMenu);$('menuClose').addEventListener('click',closeGameMenu);for(const tab of menuTabs)tab.addEventListener('click',()=>selectMenu(tab.dataset.menuTab));
setInterval(()=>{if(isPaused())return;advanceTime(5)},1000);$('restartButton').addEventListener('click',()=>window.location.reload());
if(window.SURVIVAL_EVENTS&&SURVIVAL_EVENTS.isCompleted('cabin_grant_first_meeting')){metSurvivor=true;cabinExplorationUnlocked=true}
renderClock();renderEnvironment();renderMeters();renderInventory();renderMenuUnlocks();renderScene();showMessages(getScene().messages);
</script>
</body>
</html>
