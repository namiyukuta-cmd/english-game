<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雪山サバイバル</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:#dfeaf2;
  color:#263845;
}

body{
  min-height:100dvh;
}

.game{
  width:min(100%,540px);
  min-height:100dvh;
  margin:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* 上の情報 */
.status{
  display:grid;
  grid-template-columns:1.3fr 1fr 1fr;
  gap:6px;
}

.status-box{
  padding:8px 5px;
  border:1px solid #b8cad5;
  border-radius:12px;
  background:white;
  text-align:center;
}

.status-box small{
  display:block;
  font-size:17px;
}

.status-box strong{
  display:block;
  margin-top:3px;
  font-size:18px;
}

/* 一人称の景色 */
.scene{
  position:relative;
  width:100%;
  height:500px;
  overflow:hidden;
  border:2px solid #b6cbd8;
  border-radius:17px;

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  /* 画像がまだ無い時の仮背景 */
  background-color:#edf6fb;
}

.scene-title{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;

  padding:7px 12px;
  border-radius:12px;
  background:rgba(255,255,255,.9);

  font-size:18px;
  font-weight:900;
  white-space:nowrap;
}

/* 景色の中のタップ場所 */
.hotspot{
  position:absolute;
  min-width:70px;
  min-height:48px;

  border:1px solid rgba(80,110,125,.7);
  border-radius:13px;

  background:rgba(255,255,255,.78);

  font-size:17px;
  font-weight:800;

  color:#294352;

  touch-action:manipulation;
}

.hotspot:active{
  transform:scale(.97);
}

/* 下の文章 */
.message{
  min-height:72px;
  padding:12px;

  border:1px solid #b8cad5;
  border-radius:15px;

  background:white;

  font-size:17px;
  line-height:1.6;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.menu button{
  min-height:54px;

  border:1px solid #9fb6c4;
  border-radius:14px;

  background:white;

  font-size:17px;
  font-weight:900;
}

/* ITEM */
.modal{
  position:fixed;
  inset:0;
  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(20,35,45,.45);

  z-index:100;
}

.modal.open{
  display:flex;
}

.modal-card{
  width:min(420px,100%);
  padding:18px;

  border-radius:20px;
  background:white;
}

.modal-card h2{
  margin-top:0;
  font-size:22px;
}

.item-row{
  padding:12px 0;
  border-bottom:1px solid #ddd;

  font-size:18px;
}

.close{
  width:100%;
  min-height:50px;

  margin-top:15px;

  border:1px solid #aaa;
  border-radius:13px;

  background:white;

  font-size:17px;
  font-weight:900;
}
</style>
</head>

<body>

<main class="game">

  <section class="status">

    <div class="status-box">
      <small id="day">1日目</small>
      <strong id="clock">08:00:00</strong>
    </div>

    <div class="status-box">
      <small>体温</small>
      <strong>寒い</strong>
    </div>

    <div class="status-box">
      <small>現在地</small>
      <strong id="placeName">針葉樹林</strong>
    </div>

  </section>


  <!-- 一人称の景色 -->
  <section id="scene" class="scene">

    <div id="sceneTitle" class="scene-title">
      針葉樹林
    </div>

    <!-- JSでここにタップ場所が追加される -->

  </section>


  <div id="message" class="message">
    雪の積もった針葉樹林です。
  </div>


  <nav class="menu">

    <button id="itemButton">
      🎒 ITEM
    </button>

    <button id="lookButton">
      👀 周囲を見る
    </button>

  </nav>

</main>


<!-- ITEM画面 -->
<div id="itemModal" class="modal">

  <section class="modal-card">

    <h2>ITEM</h2>

    <div id="itemList"></div>

    <button id="closeItem" class="close">
      閉じる
    </button>

  </section>

</div>


<script>

/* =========================
   景色データ
========================= */

const SCENES = {

  forest: {

    name:"針葉樹林",

    /*
      後で背景PNGを作ったら、

      assets/survival/forest_01.png

      のように置く
    */

    background:"",

    description:
      "雪の積もった針葉樹林です。少し先に倒木が見えます。",

    hotspots:[

      {
        id:"branch01",
        label:"🪾 細い枝",
        x:12,
        y:72,

        type:"item",
        item:"branch",

        time:20,

        text:"足元の細い枝を拾いました。"
      },

      {
        id:"fallenTree",
        label:"倒木",
        x:42,
        y:45,

        type:"move",
        scene:"fallenTree",

        time:120,

        text:"雪を踏みながら倒木へ向かいます。"
      },

      {
        id:"river",
        label:"凍った川 →",
        x:72,
        y:63,

        type:"move",
        scene:"river",

        time:420,

        text:"木々の間を抜け、凍った川へ向かいます。"
      }

    ]

  },


  fallenTree: {

    name:"倒木のそば",

    background:"",

    description:
      "大きな針葉樹が雪の上に倒れています。折れた枝がいくつもあります。",

    hotspots:[

      {
        id:"branch02",
        label:"🪾 太い枝",
        x:32,
        y:57,

        type:"item",
        item:"branch",

        time:35,

        text:"倒木から太い枝を拾いました。"
      },

      {
        id:"stone01",
        label:"🪨 小石",
        x:72,
        y:72,

        type:"item",
        item:"stone",

        time:25,

        text:"雪の中から小石を拾いました。"
      },

      {
        id:"backForest",
        label:"← 森へ戻る",
        x:5,
        y:12,

        type:"move",
        scene:"forest",

        time:120,

        text:"元いた森へ戻ります。"
      }

    ]

  },


  river: {

    name:"凍った川",

    background:"",

    description:
      "川は厚い氷に覆われています。岸には流木が引っかかっています。",

    hotspots:[

      {
        id:"driftwood",
        label:"🪾 流木",
        x:60,
        y:54,

        type:"item",
        item:"branch",

        time:80,

        text:"岸まで歩き、流木を拾いました。"
      },

      {
        id:"ice",
        label:"🧊 氷",
        x:37,
        y:67,

        type:"look",

        time:30,

        text:"川の表面はかなり厚く凍っています。"
      },

      {
        id:"backForest",
        label:"← 森へ戻る",
        x:5,
        y:12,

        type:"move",
        scene:"forest",

        time:420,

        text:"針葉樹林へ戻ります。"
      }

    ]

  }

};


/* =========================
   ゲーム状態
========================= */

let state = {

  currentScene:"forest",

  branch:0,
  stone:0,

  collected:[],

  gameSeconds:8 * 60 * 60

};

let menuOpen=false;


/* =========================
   景色表示
========================= */

const sceneElement=
  document.getElementById("scene");

const messageElement=
  document.getElementById("message");


function renderScene(){

  const data =
    SCENES[state.currentScene];

  document.getElementById("sceneTitle")
    .textContent=data.name;

  document.getElementById("placeName")
    .textContent=data.name;


  /*
    背景画像
  */

  if(data.background){

    sceneElement.style.backgroundImage =
      `url("${data.background}")`;

  }else{

    /*
      画像が無い間の仮背景
    */

    sceneElement.style.backgroundImage =
      "linear-gradient(180deg,#dcecf6 0%,#f8fcff 60%,#eef6fb 100%)";

  }


  /*
    古いhotspot削除
  */

  sceneElement
    .querySelectorAll(".hotspot")
    .forEach(el=>el.remove());


  /*
    新しいhotspot作成
  */

  data.hotspots.forEach(hotspot=>{

    /*
      拾った物は再表示しない
    */

    if(
      hotspot.type==="item" &&
      state.collected.includes(hotspot.id)
    ){
      return;
    }


    const button =
      document.createElement("button");

    button.className="hotspot";

    button.textContent=
      hotspot.label;

    button.style.left=
      hotspot.x+"%";

    button.style.top=
      hotspot.y+"%";


    button.addEventListener(
      "click",
      ()=>activateHotspot(hotspot)
    );


    sceneElement.appendChild(button);

  });


  messageElement.textContent=
    data.description;

}


/* =========================
   景色の中をタップ
========================= */

function activateHotspot(hotspot){

  if(menuOpen)return;


  /* 時間を進める */

  advanceTime(hotspot.time);


  /*
    アイテム
  */

  if(hotspot.type==="item"){

    state.collected.push(
      hotspot.id
    );


    if(hotspot.item==="branch"){

      state.branch++;

    }


    if(hotspot.item==="stone"){

      state.stone++;

    }


    messageElement.textContent =
      hotspot.text +
      "（"+formatDuration(hotspot.time)+"経過）";


    renderScene();

    return;

  }


  /*
    移動
  */

  if(hotspot.type==="move"){

    messageElement.textContent=
      hotspot.text;


    /*
      少しだけ間を置いて
      景色を切り替える
    */

    setTimeout(()=>{

      state.currentScene=
        hotspot.scene;

      renderScene();

    },400);

    return;

  }


  /*
    調べるだけ
  */

  if(hotspot.type==="look"){

    messageElement.textContent =
      hotspot.text +
      "（"+formatDuration(hotspot.time)+"経過）";

  }

}


/* =========================
   時間
========================= */

function advanceTime(seconds){

  state.gameSeconds += seconds;

  renderClock();

}


function renderClock(){

  const total =
    Math.floor(state.gameSeconds);

  const day =
    Math.floor(total / 86400) + 1;

  const sec =
    total % 86400;

  const hour =
    Math.floor(sec / 3600);

  const minute =
    Math.floor(
      (sec % 3600) / 60
    );

  const second =
    sec % 60;


  document.getElementById("day")
    .textContent =
      day+"日目";


  document.getElementById("clock")
    .textContent =
      [
        hour,
        minute,
        second
      ]
      .map(
        n=>String(n).padStart(2,"0")
      )
      .join(":");

}


function formatDuration(seconds){

  if(seconds < 60){

    return seconds+"秒";

  }

  const minutes =
    Math.floor(seconds / 60);

  const rest =
    seconds % 60;


  if(rest===0){

    return minutes+"分";

  }

  return minutes+"分"+rest+"秒";

}


/* =========================
   何もしなくても時間経過
========================= */

setInterval(()=>{

  /*
    ITEMを開いている時は止める
  */

  if(menuOpen)return;


  /*
    現実1秒
    ↓
    ゲーム内5秒
  */

  advanceTime(5);

},1000);


/* =========================
   ITEM
========================= */

const itemModal =
  document.getElementById("itemModal");


document
  .getElementById("itemButton")
  .addEventListener("click",()=>{

    menuOpen=true;

    renderItems();

    itemModal.classList.add("open");

  });


document
  .getElementById("closeItem")
  .addEventListener("click",()=>{

    menuOpen=false;

    itemModal.classList.remove("open");

  });


function renderItems(){

  const list =
    document.getElementById("itemList");

  const items=[];


  if(state.branch){

    items.push(
      `<div class="item-row">
        🪾 枝　×${state.branch}
      </div>`
    );

  }


  if(state.stone){

    items.push(
      `<div class="item-row">
        🪨 小石　×${state.stone}
      </div>`
    );

  }


  list.innerHTML =
    items.length
      ? items.join("")
      : `<div class="item-row">
          何も持っていません。
        </div>`;

}


/* =========================
   周囲を見る
========================= */

document
  .getElementById("lookButton")
  .addEventListener("click",()=>{

    if(menuOpen)return;

    advanceTime(30);

    messageElement.textContent =
      SCENES[state.currentScene].description +
      "（30秒経過）";

  });


/* =========================
   開始
========================= */

renderScene();
renderClock();

</script>

</body>
</html>
