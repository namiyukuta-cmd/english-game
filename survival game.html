<!doctype html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>雪山サバイバル</title>

  <style>

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

      background:#e7eaec;
      color:#202427;
    }

    body{
      min-height:100dvh;
    }

    button,
    a{
      font:inherit;
    }

    button{
      touch-action:manipulation;
      -webkit-user-select:none;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }


    /* =========================
       ゲーム全体
    ========================= */

    .game{
      width:min(100%,540px);
      height:100dvh;

      margin:0 auto;

      padding:
        calc(5px + env(safe-area-inset-top))
        6px
        calc(5px + env(safe-area-inset-bottom));

      display:flex;
      flex-direction:column;

      gap:4px;

      overflow:hidden;
    }


    /* =========================
       TOP
    ========================= */

    .topbar{
      flex:0 0 auto;

      display:grid;

      grid-template-columns:
        36px
        52px
        80px
        minmax(0,1fr);

      align-items:center;

      gap:4px;
    }

    .back{
      width:36px;
      height:36px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid #999;
      border-radius:9px;

      background:#fff;

      color:#222;
      text-decoration:none;

      font-size:22px;
      font-weight:900;

      line-height:1;
    }

    .top-small{
      height:36px;

      padding:0 5px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid #aaa;
      border-radius:9px;

      background:#fff;

      font-size:13px;
      line-height:1;

      font-weight:800;

      white-space:nowrap;
    }

    .place{
      min-width:0;

      overflow:hidden;
      text-overflow:ellipsis;
    }


    /* =========================
       生存メーター
    ========================= */

    .meters{
      flex:0 0 auto;

      display:grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:4px;
    }

    .meter{
      height:32px;

      min-width:0;

      padding:2px 5px;

      display:flex;
      align-items:center;
      justify-content:center;

      gap:4px;

      border:1px solid #aaa;
      border-radius:9px;

      background:#fff;
    }

    .meter-icon{
      width:18px;
      height:18px;

      flex:0 0 18px;

      overflow:visible;
    }

    .meter-outline{
      fill:none;

      stroke:#262626;
      stroke-width:1.5;

      stroke-linejoin:round;
      stroke-linecap:round;
    }

    .meter-value{
      min-width:0;

      font-size:13px;
      line-height:1;

      font-weight:900;

      white-space:nowrap;
    }


    /* =========================
       背景

       前より下へ長く
    ========================= */

    .scene{
      position:relative;

      width:96%;

      max-width:510px;

      aspect-ratio:1.10 / 1;

      margin:0 auto;

      flex:0 0 auto;

      overflow:hidden;

      border:1px solid #8c9296;
      border-radius:13px;

      background:#ddd;
    }

    .scene-background{
      position:absolute;

      inset:0;

      z-index:1;

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      pointer-events:none;
    }


    /* =========================
       拾える物
    ========================= */

    .scene-objects{
      position:absolute;

      inset:0;

      z-index:2;

      pointer-events:none;
    }

    .scene-object{
      position:absolute;

      display:block;

      margin:0;
      padding:0;

      border:0;

      background:transparent;

      cursor:pointer;

      pointer-events:auto;
    }

    .scene-object img{
      display:block;

      width:100%;
      height:100%;

      object-fit:contain;

      pointer-events:none;
    }

    .scene-object:active{
      transform:scale(.95);
    }

    .scene-object.hidden{
      display:none;
    }

    #branchObject{
      width:27%;

      aspect-ratio:1 / 1;

      left:4%;
      bottom:1%;
    }

    #stoneObject{
      width:16%;

      aspect-ratio:1 / 1;

      right:8%;
      bottom:8%;
    }


    /* =========================
       説明パネル

       左へ収納
    ========================= */

    .notice-shell{
      position:absolute;

      left:0;
      bottom:5%;

      z-index:60;

      width:92%;

      min-height:92px;

      transform:
        translateX(
          calc(-100% + 42px)
        );

      transition:
        transform .25s ease;

      pointer-events:none;
    }

    .notice-shell.open{
      transform:translateX(0);
    }

    .scene-notice{
      position:relative;

      width:100%;

      min-height:92px;
      max-height:148px;

      padding:
        12px
        52px
        12px
        14px;

      overflow:auto;

      border:
        1px solid
        rgba(70,70,70,.58);

      border-left:0;

      border-radius:
        0
        13px
        13px
        0;

      background:
        rgba(255,255,255,.94);

      font-size:17px;
      line-height:1.48;

      font-weight:650;

      white-space:pre-wrap;

      cursor:pointer;

      pointer-events:auto;
    }

    .notice-toggle{
      position:absolute;

      right:5px;
      bottom:5px;

      z-index:2;

      width:34px;
      height:34px;

      padding:0;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid #888;
      border-radius:9px;

      background:
        rgba(210,210,210,.96);

      color:#222;

      font-size:20px;
      line-height:1;

      font-weight:900;

      pointer-events:auto;
    }


    /* =========================
       十字キー置き場
    ========================= */

    .movement-row{
      flex:1 1 auto;

      min-height:168px;

      display:flex;

      justify-content:flex-end;
      align-items:center;

      padding:
        4px
        10px
        2px
        0;
    }


    /* =========================
       独立型 十字キー
    ========================= */

    .move-pad{
      display:grid;

      grid-template-columns:
        repeat(3,52px);

      grid-template-rows:
        repeat(3,52px);

      gap:7px;

      width:max-content;
      height:max-content;
    }

    .direction,
    .menu-key{
      width:52px;
      height:52px;

      padding:0;

      display:flex;
      align-items:center;
      justify-content:center;

      border:
        1px solid
        rgba(45,45,45,.40);

      border-radius:13px;

      color:#222;

      font-weight:900;

      line-height:1;

      transition:
        opacity .12s ease,
        transform .08s ease,
        background .12s ease;
    }

    .direction{
      background:
        rgba(100,100,100,.56);

      font-size:26px;
    }

    .direction.active{
      opacity:.88;
    }

    .direction.active:active{
      transform:scale(.91);

      background:
        rgba(60,60,60,.73);
    }

    .direction.inactive{
      opacity:.13;

      background:
        rgba(130,130,130,.28);
    }

    .menu-key{
      background:
        rgba(82,82,82,.70);

      color:#fff;

      font-size:11px;

      letter-spacing:.02em;
    }

    .menu-key:active{
      transform:scale(.91);
    }

    .move-pad.locked
    .direction.active{
      opacity:.23;
    }

    .move-pad.locked
    .menu-key{
      opacity:.42;
    }

    #moveUp{
      grid-column:2;
      grid-row:1;
    }

    #moveLeft{
      grid-column:1;
      grid-row:2;
    }

    #menuKey{
      grid-column:2;
      grid-row:2;
    }

    #moveRight{
      grid-column:3;
      grid-row:2;
    }

    #moveDown{
      grid-column:2;
      grid-row:3;
    }


    /* =========================
       周囲を見る
    ========================= */

    .bottom-actions{
      flex:0 0 auto;

      display:grid;

      grid-template-columns:1fr;

      gap:5px;
    }

    .action-button{
      min-height:46px;

      border:1px solid #999;
      border-radius:11px;

      background:#fff;

      color:#222;

      font-size:17px;
      font-weight:900;
    }

    .action-button:active{
      background:#eee;
    }


    /* =========================
       メニュー画面
    ========================= */

    .game-menu-overlay{
      position:fixed;

      inset:0;

      z-index:120;

      display:none;

      align-items:center;
      justify-content:center;

      padding:
        calc(15px + env(safe-area-inset-top))
        12px
        calc(15px + env(safe-area-inset-bottom));

      background:
        rgba(30,30,30,.54);
    }

    .game-menu-overlay.open{
      display:flex;
    }

    .game-menu-window{
      position:relative;

      width:min(500px,100%);

      height:min(620px,78dvh);

      display:flex;
      flex-direction:column;

      border:
        1px solid
        #7f8386;

      border-radius:15px;

      background:#f7f7f7;

      overflow:hidden;
    }


    /* =========================
       ブラウザ風タブ
    ========================= */

    .menu-tabs-area{
      position:relative;

      flex:0 0 auto;

      min-height:54px;

      padding:
        10px
        48px
        0
        8px;

      display:flex;
      align-items:flex-end;

      overflow-x:auto;

      background:#dfe2e4;

      border-bottom:
        1px solid
        #969a9d;

      scrollbar-width:none;
    }

    .menu-tabs-area::-webkit-scrollbar{
      display:none;
    }

    .menu-tab{
      position:relative;

      min-width:94px;
      height:38px;

      margin-right:-1px;

      padding:0 12px;

      border:
        1px solid
        #969a9d;

      border-bottom:0;

      border-radius:
        10px
        10px
        0
        0;

      background:#cfd3d5;

      color:#333;

      font-size:14px;
      font-weight:800;

      white-space:nowrap;
    }

    .menu-tab.active{
      z-index:2;

      height:42px;

      background:#fff;

      color:#111;
    }

    .menu-tab.hidden{
      display:none;
    }

    .menu-close{
      position:absolute;

      top:8px;
      right:8px;

      z-index:5;

      width:36px;
      height:36px;

      padding:0;

      display:flex;
      align-items:center;
      justify-content:center;

      border:
        1px solid
        #888;

      border-radius:9px;

      background:#fff;

      color:#222;

      font-size:20px;
      font-weight:900;
    }


    /* =========================
       メニュー内容
    ========================= */

    .menu-content{
      flex:1 1 auto;

      min-height:0;

      padding:15px;

      overflow:auto;

      background:#fff;
    }

    .menu-panel{
      display:none;
    }

    .menu-panel.active{
      display:block;
    }

    .menu-panel-title{
      margin:
        0
        0
        12px;

      font-size:21px;
    }

    .menu-panel-text{
      margin:0;

      font-size:17px;
      line-height:1.6;
    }

    .empty-message{
      padding:20px 8px;

      text-align:center;

      font-size:17px;

      color:#555;
    }


    /* =========================
       インベントリ
    ========================= */

    .item-list{
      font-size:17px;
      line-height:1.6;
    }

    .item-row{
      min-height:52px;

      padding:10px 4px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:12px;

      border-bottom:
        1px solid
        #ddd;
    }

    .item-row:last-child{
      border-bottom:0;
    }

    .item-name{
      font-size:17px;
      font-weight:700;
    }

    .item-count{
      flex:0 0 auto;

      font-size:17px;
      font-weight:900;
    }


    /* =========================
       地図
    ========================= */

    .map-placeholder{
      min-height:260px;

      padding:18px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:
        1px dashed
        #aaa;

      border-radius:12px;

      background:#f5f5f5;

      text-align:center;

      font-size:17px;
      line-height:1.6;
    }


    /* =========================
       スキル
    ========================= */

    .skill-list{
      display:grid;

      gap:9px;
    }

    .skill-row{
      padding:13px;

      border:
        1px solid
        #bbb;

      border-radius:10px;

      background:#fafafa;

      font-size:17px;
      line-height:1.5;
    }


    /* =========================
       クラフト
    ========================= */

    .craft-list{
      display:grid;

      gap:9px;
    }

    .craft-row{
      padding:13px;

      border:
        1px solid
        #bbb;

      border-radius:10px;

      background:#fafafa;

      font-size:17px;
      line-height:1.5;
    }


    /* =========================
       低体温
       白い視界
    ========================= */

    .cold-vision{
      position:fixed;

      inset:0;

      z-index:50;

      pointer-events:none;

      background:
        rgba(
          255,
          255,
          255,
          var(--cold-opacity,0)
        );

      transition:
        background .8s ease;
    }


    /* =========================
       体力低下
       赤い視界
    ========================= */

    .health-vision{
      position:fixed;

      inset:0;

      z-index:51;

      pointer-events:none;

      background:
        radial-gradient(
          circle at center,
          rgba(140,0,0,0) 28%,
          rgba(
            140,
            0,
            0,
            var(--red-opacity,0)
          )
          100%
        );

      transition:
        background .8s ease;
    }


    /* =========================
       揺れ
    ========================= */

    @keyframes shakeLight{

      0%{
        transform:translate(0,0);
      }

      20%{
        transform:translate(-2px,1px);
      }

      40%{
        transform:translate(2px,-1px);
      }

      60%{
        transform:translate(-1px,-1px);
      }

      80%{
        transform:translate(1px,1px);
      }

      100%{
        transform:translate(0,0);
      }

    }

    @keyframes shakeHeavy{

      0%{
        transform:translate(0,0);
      }

      10%{
        transform:translate(-4px,2px);
      }

      20%{
        transform:translate(4px,-3px);
      }

      30%{
        transform:translate(-3px,-2px);
      }

      40%{
        transform:translate(4px,3px);
      }

      50%{
        transform:translate(-4px,0);
      }

      60%{
        transform:translate(3px,-3px);
      }

      70%{
        transform:translate(-2px,3px);
      }

      80%{
        transform:translate(3px,1px);
      }

      90%{
        transform:translate(-2px,-1px);
      }

      100%{
        transform:translate(0,0);
      }

    }

    .game.shake-light{
      animation:
        shakeLight
        .32s
        linear;
    }

    .game.shake-heavy{
      animation:
        shakeHeavy
        .48s
        linear;
    }


    /* =========================
       DEAD
    ========================= */

    .dead-modal{
      position:fixed;

      inset:0;

      z-index:200;

      display:none;

      align-items:center;
      justify-content:center;

      padding:20px;

      background:
        rgba(0,0,0,.84);
    }

    .dead-modal.open{
      display:flex;
    }

    .dead-card{
      width:min(400px,100%);

      padding:24px 18px;

      border-radius:17px;

      background:#f6f6f6;

      text-align:center;
    }

    .dead-title{
      margin:0;

      font-size:34px;

      letter-spacing:.08em;
    }

    .dead-reason{
      margin:
        15px
        0
        20px;

      font-size:17px;
      line-height:1.5;
    }

    .restart-button{
      width:100%;

      min-height:52px;

      border:
        1px solid
        #777;

      border-radius:13px;

      background:#fff;

      font-size:17px;
      font-weight:900;
    }


    /* =========================
       小さい画面
    ========================= */

    @media(max-width:390px){

      .topbar{
        grid-template-columns:
          34px
          48px
          76px
          minmax(0,1fr);
      }

      .back{
        width:34px;
        height:34px;
      }

      .top-small{
        height:34px;

        font-size:12px;
      }

      .meter{
        height:30px;
      }

      .meter-icon{
        width:17px;
        height:17px;

        flex-basis:17px;
      }

      .meter-value{
        font-size:12px;
      }

      .scene{
        width:97%;

        aspect-ratio:1.10 / 1;
      }

      .movement-row{
        min-height:160px;

        padding-right:5px;
      }

      .move-pad{
        grid-template-columns:
          repeat(3,50px);

        grid-template-rows:
          repeat(3,50px);

        gap:6px;
      }

      .direction,
      .menu-key{
        width:50px;
        height:50px;
      }

      .direction{
        font-size:25px;
      }

      .menu-key{
        font-size:10px;
      }

      .menu-tab{
        min-width:88px;

        font-size:13px;
      }

    }

  </style>

</head>


<body>


<main
  id="game"
  class="game"
>


  <!-- =========================
       TOP
  ========================= -->

  <header class="topbar">


    <a
      class="back"
      href="survival%20game_TOP.html"
      aria-label="戻る"
    >
      ←
    </a>


    <div
      id="day"
      class="top-small"
    >
      Day.1
    </div>


    <div
      id="clock"
      class="top-small"
    >
      08:00:00
    </div>


    <div
      id="currentPlace"
      class="top-small place"
    >
      針葉樹林
    </div>


  </header>



  <!-- =========================
       生存メーター
  ========================= -->

  <section class="meters">


    <!-- 体温 -->

    <div
      class="meter"
      aria-label="体温"
    >

      <svg
        class="meter-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <defs>

          <clipPath id="tempClip">

            <rect
              id="tempClipRect"
              x="0"
              y="0"
              width="24"
              height="24"
            ></rect>

          </clipPath>

        </defs>


        <path
          id="tempFill"
          clip-path="url(#tempClip)"
          d="
            M12 2
            C9.8 2 8 3.8 8 6
            V14.1
            C6.7 15.3 6 17 6 18.7
            C6 22 8.7 24 12 24
            C15.3 24 18 22 18 18.7
            C18 17 17.3 15.3 16 14.1
            V6
            C16 3.8 14.2 2 12 2
            Z
          "
        ></path>


        <path
          class="meter-outline"
          d="
            M12 2
            C9.8 2 8 3.8 8 6
            V14.1
            C6.7 15.3 6 17 6 18.7
            C6 22 8.7 24 12 24
            C15.3 24 18 22 18 18.7
            C18 17 17.3 15.3 16 14.1
            V6
            C16 3.8 14.2 2 12 2
            Z
          "
        ></path>

      </svg>


      <div
        id="tempValue"
        class="meter-value"
      >
        36.7℃
      </div>

    </div>



    <!-- 空腹 -->

    <div
      class="meter"
      aria-label="空腹"
    >

      <svg
        class="meter-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <defs>

          <clipPath id="hungerClip">

            <rect
              id="hungerClipRect"
              x="0"
              y="0"
              width="24"
              height="24"
            ></rect>

          </clipPath>

        </defs>


        <path
          id="hungerFill"
          clip-path="url(#hungerClip)"
          d="
            M12 7
            C9.5 4.5 5.2 5.4 3.8 8.6
            C1.7 13.4 5.2 20.5 9.3 22
            C10.5 22.4 11.3 21.7 12 21.3
            C12.7 21.7 13.5 22.4 14.7 22
            C18.8 20.5 22.3 13.4 20.2 8.6
            C18.8 5.4 14.5 4.5 12 7
            Z
            M12.5 5.8
            C12.4 3.3 13.8 1.5 16.6 1
            C16.7 3.7 15.3 5.4 12.5 5.8
            Z
          "
        ></path>


        <path
          class="meter-outline"
          d="
            M12 7
            C9.5 4.5 5.2 5.4 3.8 8.6
            C1.7 13.4 5.2 20.5 9.3 22
            C10.5 22.4 11.3 21.7 12 21.3
            C12.7 21.7 13.5 22.4 14.7 22
            C18.8 20.5 22.3 13.4 20.2 8.6
            C18.8 5.4 14.5 4.5 12 7
            Z
            M12.5 5.8
            C12.4 3.3 13.8 1.5 16.6 1
            C16.7 3.7 15.3 5.4 12.5 5.8
            Z
          "
        ></path>

      </svg>


      <div
        id="hungerValue"
        class="meter-value"
      >
        100
      </div>

    </div>



    <!-- 体力 -->

    <div
      class="meter"
      aria-label="体力"
    >

      <svg
        class="meter-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <defs>

          <clipPath id="staminaClip">

            <rect
              id="staminaClipRect"
              x="0"
              y="0"
              width="24"
              height="24"
            ></rect>

          </clipPath>

        </defs>


        <path
          id="staminaFill"
          clip-path="url(#staminaClip)"
          d="
            M12 21

  /* =========================
     共通
  ========================= */

  function clamp(
    value,
    min,
    max
  ){

    return Math.max(
      min,
      Math.min(
        max,
        value
      )
    );

  }


  /* =========================
     現在ゲーム時間を
     進めてよいか
  ========================= */

  function isGamePaused(){

    return (
      gameOver
      ||
      noticeOpen
      ||
      menuOpen
      ||
      document.visibilityState
        !==
        "visible"
    );

  }


  /* =========================
     時計
  ========================= */

  function renderClock(){

    const total =
      Math.floor(
        gameSeconds
      );


    const day =
      Math.floor(
        total / 86400
      ) + 1;


    const secondInDay =
      total % 86400;


    const hour =
      Math.floor(
        secondInDay / 3600
      );


    const minute =
      Math.floor(
        (
          secondInDay % 3600
        )
        /
        60
      );


    const second =
      secondInDay % 60;


    document
      .getElementById(
        "day"
      )
      .textContent =
        "Day." + day;


    document
      .getElementById(
        "clock"
      )
      .textContent =
        String(
          hour
        )
        .padStart(
          2,
          "0"
        )
        +
        ":"
        +
        String(
          minute
        )
        .padStart(
          2,
          "0"
        )
        +
        ":"
        +
        String(
          second
        )
        .padStart(
          2,
          "0"
        );

  }


  /* =========================
     メーター色
  ========================= */

  function normalMeterColor(
    value
  ){

    if(
      value <= 20
    ){

      return "#c62828";

    }


    if(
      value <= 40
    ){

      return "#d6a000";

    }


    return "#151515";

  }


  function temperatureColor(){

    if(
      bodyTemperature < 33
    ){

      return "#c62828";

    }


    if(
      bodyTemperature < 35
    ){

      return "#d6a000";

    }


    return "#151515";

  }


  /* =========================
     SVGメーター
  ========================= */

  function setSvgFillLevel(
    rectId,
    percent
  ){

    const value =
      clamp(
        percent,
        0,
        100
      );


    const height =
      24
      *
      value
      /
      100;


    const y =
      24
      -
      height;


    const rect =
      document
        .getElementById(
          rectId
        );


    rect.setAttribute(
      "y",
      y
    );


    rect.setAttribute(
      "height",
      height
    );

  }


  /* =========================
     メーター描画
  ========================= */

  function renderMeters(){


    const temperaturePercent =
      clamp(
        (
          (
            bodyTemperature
            -
            28
          )
          /
          (
            36.8
            -
            28
          )
        )
        *
        100,
        0,
        100
      );


    setSvgFillLevel(
      "tempClipRect",
      temperaturePercent
    );


    document
      .getElementById(
        "tempFill"
      )
      .style
      .fill =
        temperatureColor();


    document
      .getElementById(
        "tempValue"
      )
      .textContent =
        bodyTemperature
          .toFixed(1)
        +
        "℃";


    setSvgFillLevel(
      "hungerClipRect",
      hunger
    );


    document
      .getElementById(
        "hungerFill"
      )
      .style
      .fill =
        normalMeterColor(
          hunger
        );


    document
      .getElementById(
        "hungerValue"
      )
      .textContent =
        Math.round(
          hunger
        );


    setSvgFillLevel(
      "staminaClipRect",
      stamina
    );


    document
      .getElementById(
        "staminaFill"
      )
      .style
      .fill =
        normalMeterColor(
          stamina
        );


    document
      .getElementById(
        "staminaValue"
      )
      .textContent =
        Math.round(
          stamina
        );


    updateVisualEffects();

  }


  /* =========================
     寒さ
     白い視界
  ========================= */

  function coldOpacity(){

    if(
      bodyTemperature >= 35
    ){

      return 0;

    }


    if(
      bodyTemperature >= 33
    ){

      return (
        (
          35
          -
          bodyTemperature
        )
        /
        2
      )
      *
      0.09;

    }


    if(
      bodyTemperature >= 31
    ){

      return (
        0.09
        +
        (
          (
            33
            -
            bodyTemperature
          )
          /
          2
        )
        *
        0.13
      );

    }


    if(
      bodyTemperature >= 29
    ){

      return (
        0.22
        +
        (
          (
            31
            -
            bodyTemperature
          )
          /
          2
        )
        *
        0.13
      );

    }


    return 0.38;

  }


  /* =========================
     体力
     赤い視界
  ========================= */

  function redOpacity(){

    if(
      stamina > 35
    ){

      return 0;

    }


    if(
      stamina > 20
    ){

      return (
        (
          35
          -
          stamina
        )
        /
        15
      )
      *
      0.13;

    }


    if(
      stamina > 10
    ){

      return (
        0.13
        +
        (
          (
            20
            -
            stamina
          )
          /
          10
        )
        *
        0.14
      );

    }


    return 0.34;

  }


  function updateVisualEffects(){

    document
      .getElementById(
        "coldVision"
      )
      .style
      .setProperty(
        "--cold-opacity",
        coldOpacity()
      );


    document
      .getElementById(
        "healthVision"
      )
      .style
      .setProperty(
        "--red-opacity",
        redOpacity()
      );

  }

  function triggerShake(
    strength="light"
  ){

    const game =
      document
        .getElementById(
          "game"
        );


    game.classList.remove(
      "shake-light",
      "shake-heavy"
    );


    void game.offsetWidth;


    if(
      strength === "heavy"
    ){

      game.classList.add(
        "shake-heavy"
      );

    }else{

      game.classList.add(
        "shake-light"
      );

    }


    setTimeout(
      ()=>{

        game.classList.remove(
          "shake-light",
          "shake-heavy"
        );

      },
      600
    );

  }

  function setNoticeOpen(
    open

    noticeOpen =
      open;


    noticeShell
      .classList
      .toggle(
        "open",
        open
      );


    updateNoticeButton();

    renderDirections();

  }


  function showNotice(
    text,
    duration=4500
  ){

    if(
      noticeTimer
    ){

      clearTimeout(
        noticeTimer
      );

      noticeTimer =
        null;

    }


    lastNotice =
      text;


    sceneNotice
      .textContent =
        text;


    setNoticeOpen(
      true
    );


    /*
      自動表示時は一定時間で収納。
      表示中は時計停止。
    */

    noticeTimer =
      setTimeout(
        ()=>{

          hideNotice();

        },
        duration
      );

  }


  function hideNotice(){

    if(
      noticeTimer
    ){

      clearTimeout(
        noticeTimer
      );

      noticeTimer =
        null;

    }


    setNoticeOpen(
      false
    );

  }


  function reopenNotice(){

    if(
      !lastNotice
    ){

      return;

    }


    if(
      noticeTimer
    ){

      clearTimeout(
        noticeTimer
      );

      noticeTimer =
        null;

    }


    sceneNotice
      .textContent =
        lastNotice;


    /*
      手動で読み返した場合は
      勝手に閉じない。

      開いている間は
      ゲーム時間停止。
    */

    setNoticeOpen(
      true
    );

  }


  noticeToggle
    .addEventListener(
      "click",
      event=>{


        event.stopPropagation();


        if(
          noticeOpen
        ){

          hideNotice();

        }else{

          reopenNotice();

        }


      }
    );


  /*
    説明文自体をタップしても収納
  */

  sceneNotice
    .addEventListener(
      "click",
      ()=>{


        if(
          noticeOpen
        ){

          hideNotice();

        }


      }
    );


  sceneNotice
    .addEventListener(
      "keydown",
      event=>{


        if(
          event.key === "Enter"
          ||
          event.key === " "
        ){

          event.preventDefault();

          hideNotice();

        }


      }

  /* =========================

  ========================= */

  function collectStatusWarnings(){

    const warnings =
      [];


    /* -------------------------

    ------------------------- */

    if(
      bodyTemperature >= 35
    ){

      statusFlags.cold35 =
        false;

      statusFlags.cold33 =
        false;

      statusFlags.cold31 =
        false;

    }


    if(
      bodyTemperature < 35
      &&
      !statusFlags.cold35
    ){

      statusFlags.cold35 =
        true;


      warnings.push(
        "身体が冷えてきました。"
      );


      triggerShake(
        "light"
      );

    }


    if(
      bodyTemperature < 33
      &&
      !statusFlags.cold33
    ){

      statusFlags.cold33 =
        true;


      warnings.push(
        "震えが止まりません。\nかなり身体が冷えています。"
      );


      triggerShake(
        "heavy"
      );

    }


    if(
      bodyTemperature < 31
      &&
      !statusFlags.cold31
    ){

      statusFlags.cold31 =
        true;


      warnings.push(
        "意識がぼんやりします。\n早く寒さをしのげる場所を探さなければ。"
      );


      triggerShake(
        "heavy"
      );

    }


    /* -------------------------
       空腹
    ------------------------- */

    if(
      hunger > 40
    ){

      statusFlags.hunger40 =
        false;

      statusFlags.hunger20 =
        false;

      statusFlags.hunger0 =
        false;

    }


    if(
      hunger <= 40
      &&
      !statusFlags.hunger40
    ){

      statusFlags.hunger40 =
        true;


      warnings.push(
        "空腹を強く感じます。"
      );

    }


    if(
      hunger <= 20
      &&
      !statusFlags.hunger20
    ){

      statusFlags.hunger20 =
        true;


      warnings.push(
        "腹が痛みます。\n力が出ません。"
      );

    }


    if(
      hunger <= 0
      &&
      !statusFlags.hunger0
    ){

      statusFlags.hunger0 =
        true;


      warnings.push(
        "何か食べなければ、身体がもちません。"
      );

    }


    /* -------------------------
       体力
    ------------------------- */

    if(
      stamina > 60
    ){

      statusFlags.stamina60 =
        false;

      statusFlags.stamina35 =
        false;

      statusFlags.stamina20 =
        false;

      statusFlags.stamina10 =
        false;

    }


    if(
      stamina <= 60
      &&
      !statusFlags.stamina60
    ){

      statusFlags.stamina60 =
        true;


      warnings.push(
        "身体が重く感じます。"
      );


      triggerShake(
        "light"
      );

    }


    if(
      stamina <= 35
      &&
      !statusFlags.stamina35
    ){

      statusFlags.stamina35 =
        true;


      warnings.push(
        "かなり消耗しています。"
      );

    }


    if(
      stamina <= 20
      &&
      !statusFlags.stamina20
    ){

      statusFlags.stamina20 =
        true;


      warnings.push(
        "立っているのもつらくなってきました。"
      );


      triggerShake(
        "heavy"
      );

    }


    if(
      stamina <= 10
      &&
      !statusFlags.stamina10
    ){

      statusFlags.stamina10 =
        true;


      warnings.push(
        "もうほとんど身体が動きません。"
      );


      triggerShake(
        "heavy"
      );

    }


    return warnings;

  }


  /* =========================
     DEAD
  ========================= */

  function checkDeath(){

    if(
      gameOver
    ){

      return;

    }


    if(
      stamina <= 0
    ){

      showDead(
        "体力が尽きました。"
      );

    }

  }


  function showDead(
    reason
  ){

    gameOver =
      true;


    hideNotice();

    closeGameMenu();


    document
      .getElementById(
        "deadReason"
      )
      .textContent =
        reason;


    document
      .getElementById(
        "deadModal"
      )
      .classList
      .add(
        "open"
      );


    renderDirections();

  }


  /* =========================
     生存消耗
  ========================= */

  function applySurvivalDrain(
    seconds
  ){

    const minutes =
      seconds / 60;


    bodyTemperature -=
      0.008
      *
      minutes;


    hunger -=
      0.10
      *
      minutes;


    hunger =
      clamp(
        hunger,
        0,
        100
      );


    if(
      bodyTemperature < 35
    ){

      stamina -=
        0.08
        *
        minutes;

    }


    if(
      bodyTemperature < 33
    ){

      stamina -=
        0.30
        *
        minutes;

    }


    if(
      bodyTemperature < 31
    ){

      stamina -=
        0.55
        *
        minutes;

    }


    if(
      bodyTemperature < 29
    ){

      stamina -=
        1.20
        *
        minutes;

    }


    if(
      hunger <= 0
    ){

      stamina -=
        0.25
        *
        minutes;

    }


    stamina =
      clamp(
        stamina,
        0,
        100
      );


    renderMeters();

    checkDeath();

  }


  /* =========================
     時間経過
  ========================= */

  function advanceTime(
    seconds,
    showWarnings=true
  ){

    if(
      gameOver
    ){

      return [];

    }


    gameSeconds +=
      seconds;


    applySurvivalDrain(
      seconds
    );


    renderClock();


    if(
      gameOver
    ){

      return [];

    }


    const warnings =
      collectStatusWarnings();


    if(
      showWarnings
      &&
      warnings.length > 0
    ){

      showNotice(
        warnings.join(
          "\n\n"
        ),
        5000
      );

    }


    return warnings;

  }


  /* =========================
     自動時間

     通常の移動画面だけ動く
  ========================= */

  setInterval(
    ()=>{


      if(
        isGamePaused()
      ){

        return;

      }


      advanceTime(
        5,
        true
      );


    },
    1000
  );


  /* =========================
     シーン描画
  ========================= */

  function renderScene(
    showMessage=true
  ){

    const scene =
      SCENES[
        currentScene
      ];


    document
      .getElementById(
        "sceneBackground"
      )
      .style
      .backgroundImage =
        `url("${scene.image}")`;


    document
      .getElementById(
        "currentPlace"
      )
      .textContent =
        scene.place;


    renderSceneObjects();

    renderDirections();


    if(
      showMessage
    ){

      showNotice(
        scene.message,
        4300
      );

    }

  }


  /* =========================
     拾える物
  ========================= */

  function renderSceneObjects(){

    const scene =
      SCENES[
        currentScene
      ];


    const branch =
      document
        .getElementById(
          "branchObject"
        );


    const stone =
      document
        .getElementById(
          "stoneObject"
        );


    branch
      .classList
      .toggle(
        "hidden",
        !(
          scene.objects
          &&
          inventory.branch === 0
        )
      );


    stone
      .classList
      .toggle(
        "hidden",
        !(
          scene.objects
          &&
          inventory.stone === 0
        )
      );

  }


  /* =========================
     十字キー
  ========================= */

  const movePad =
    document
      .getElementById(
        "movePad"
      );


  const directionButtons = {

    up:
      document
        .getElementById(
          "moveUp"
        ),

    down:
      document
        .getElementById(
          "moveDown"
        ),

    left:
      document
        .getElementById(
          "moveLeft"
        ),

    right:
      document
        .getElementById(
          "moveRight"
        )

  };


  function renderDirections(){

    const scene =
      SCENES[
        currentScene
      ];


    const locked =
      gameOver
      ||
      noticeOpen
      ||
      menuOpen;


    movePad
      .classList
      .toggle(
        "locked",
        locked
      );


    for(
      const direction
      of
      Object.keys(
        directionButtons
      )
    ){

      const button =
        directionButtons[
          direction
        ];


      const target =
        scene.moves[
          direction
        ];


      button
        .classList
        .toggle(
          "active",
          Boolean(
            target
          )
        );


      button
        .classList
        .toggle(
          "inactive",
          !target
        );


      button.disabled =
        locked
        ||
        !target;

    }


    document
      .getElementById(
        "menuKey"
      )
      .disabled =
        gameOver
        ||
        noticeOpen;

  }


  /* =========================
     移動体力消費
  ========================= */

  function movementStaminaCost(){

    if(
      hunger <= 0
    ){

      return (
        MOVE_STAMINA_COST
        *
        1.8
      );

    }


    if(
      hunger <= 20
    ){

      return (
        MOVE_STAMINA_COST
        *
        1.5
      );

    }


    return MOVE_STAMINA_COST;

  }


  /* =========================
     移動
  ========================= */

  function move(
    direction
  ){

    if(
      gameOver
      ||
      noticeOpen
      ||
      menuOpen
    ){

      return;

    }


    const scene =
      SCENES[
        currentScene
      ];


    const target =
      scene.moves[
        direction
      ];


    if(
      !target
    ){

      return;

    }


    stamina -=
      movementStaminaCost();


    stamina =
      clamp(
        stamina,
        0,
        100
      );


    bodyTemperature -=
      MOVE_TEMP_DROP;


    const warnings =
      advanceTime(
        MOVE_SECONDS,
        false
      );


    if(
      gameOver
    ){

      return;

    }


    currentScene =
      target;


    renderScene(
      false
    );


    const nextScene =
      SCENES[
        currentScene
      ];


    let text =
      nextScene.message;


    if(
      warnings.length > 0
    ){

      text +=
        "\n\n"
        +
        warnings.join(
          "\n\n"
        );

    }


    showNotice(
      text,
      warnings.length > 0
        ? 5600
        : 4300
    );


    renderMeters();

  }


  directionButtons
    .up
    .addEventListener(
      "click",
      ()=>{

        move(
          "up"
        );

      }
    );


  directionButtons
    .down
    .addEventListener(
      "click",
      ()=>{

        move(
          "down"
        );

      }
    );


  directionButtons
    .left
    .addEventListener(
      "click",
      ()=>{

        move(
          "left"
        );

      }
    );


  directionButtons
    .right
    .addEventListener(
      "click",
      ()=>{

        move(
          "right"
        );

      }
    );


  /* =========================
     枝
  ========================= */

  document
    .getElementById(
      "branchObject"
    )
    .addEventListener(
      "click",
      ()=>{


        if(
          gameOver
          ||
          noticeOpen
          ||
          menuOpen
          ||
          currentScene !== "start"
          ||
          inventory.branch > 0
        ){

          return;

        }


        inventory.branch +=
          1;


        stamina -=
          0.5;


        stamina =
          clamp(
            stamina,
            0,
            100
          );


        const warnings =
          advanceTime(
            10,
            false
          );


        renderSceneObjects();

        renderInventory();

        renderMeters();


        let text =
          "細い枝を拾いました。";


        if(
          warnings.length > 0
        ){

          text +=
            "\n\n"
            +
            warnings.join(
              "\n\n"
            );

        }


        showNotice(
          text,
          3800
        );


      }
    );


  /* =========================
     石
  ========================= */

  document
    .getElementById(
      "stoneObject"
    )
    .addEventListener(
      "click",
      ()=>{


        if(
          gameOver
          ||
          noticeOpen
          ||
          menuOpen
          ||
          currentScene !== "start"
          ||
          inventory.stone > 0
        ){

          return;

        }


        inventory.stone +=
          1;


        stamina -=
          0.5;


        stamina =
          clamp(
            stamina,
            0,
            100
          );


        const warnings =
          advanceTime(
            10,
            false
          );


        renderSceneObjects();

        renderInventory();

        renderMeters();


        let text =
          "小石を拾いました。";


        if(
          warnings.length > 0
        ){

          text +=
            "\n\n"
            +
            warnings.join(
              "\n\n"
            );

        }


        showNotice(
          text,
          3800
        );


      }
    );


  /* =========================
     周囲を見る
  ========================= */

  document
    .getElementById(
      "lookButton"
    )
    .addEventListener(
      "click",
      ()=>{


        if(
          gameOver
          ||
          noticeOpen
          ||
          menuOpen
        ){

          return;

        }


        stamina -=
          0.7;


        stamina =
          clamp(
            stamina,
            0,
            100
          );


        const warnings =
          advanceTime(
            30,
            false
          );


        const scene =
          SCENES[
            currentScene
          ];


        let text =
          scene.look
          +
          "\n\n30秒経過";


        if(
          warnings.length > 0
        ){

          text +=
            "\n\n"
            +
            warnings.join(
              "\n\n"
            );

        }


        showNotice(
          text,
          4800
        );


      }
    );


  /* =========================
     インベントリ
  ========================= */

  function renderInventory(){

    const list =
      document
        .getElementById(
          "inventoryList"
        );


    const rows =
      [];


    if(
      inventory.branch > 0
    ){

      rows.push(
        `
          <div class="item-row">

            <span class="item-name">
              細い枝
            </span>

            <span class="item-count">
              × ${inventory.branch}
            </span>

          </div>
        `
      );

    }


    if(
      inventory.stone > 0
    ){

      rows.push(
        `
          <div class="item-row">

            <span class="item-name">
              小石
            </span>

            <span class="item-count">
              × ${inventory.stone}
            </span>

          </div>
        `
      );

    }


    if(
      rows.length === 0
    ){

      list.innerHTML =
        `
          <div class="empty-message">
            まだ何も持っていません。
          </div>
        `;

      return;

    }


    list.innerHTML =
      rows.join("");

  }


  /* =========================
     メニュー解放
  ========================= */

  function getAvailableMenus(){

    if(
      metSurvivor
    ){

      return [
        "inventory",
        "map",
        "skills",
        "craft"
      ];

    }


    return [
      "inventory"
    ];

  }


  function renderMenuUnlocks(){

    const unlockable =
      [
        "map",
        "skills",
        "craft"
      ];


    unlockable
      .forEach(
        menuName=>{


          const tab =
            document
              .querySelector(
                `[data-menu-tab="${menuName}"]`
              );


          tab
            .classList
            .toggle(
              "hidden",
              !metSurvivor
            );


        }
      );

  }


  /*
    男と出会った時に
    この関数を呼べば解放される。
  */

  function unlockSurvivorMenus(){

    metSurvivor =
      true;


    renderMenuUnlocks();

  }


  /* =========================
     メニュー表示
  ========================= */

  const gameMenu =
    document
      .getElementById(
        "gameMenu"
      );


  const menuTabs =
    document
      .querySelectorAll(
        ".menu-tab"
      );


  const menuPanels = {

    inventory:
      document.getElementById(
        "menuPanelInventory"
      ),

    map:
      document.getElementById(
        "menuPanelMap"
      ),

    skills:
      document.getElementById(
        "menuPanelSkills"
      ),

    craft:
      document.getElementById(
        "menuPanelCraft"
      )

  };


  function selectMenu(
    menuName
  ){

    const available =
      getAvailableMenus();


    if(
      !available.includes(
        menuName
      )
    ){

      return;

    }


    currentMenu =
      menuName;


    menuTabs
      .forEach(
        tab=>{


          tab
            .classList
            .toggle(
              "active",
              tab.dataset.menuTab
                ===
                menuName
            );


        }
      );


    Object
      .entries(
        menuPanels
      )
      .forEach(
        (
          [
            name,
            panel
          ]
        )=>{


          panel
            .classList
            .toggle(
              "active",
              name === menuName
            );


        }
      );


    if(
      menuName === "inventory"
    ){

      renderInventory();

    }

  }


  function openGameMenu(
    menuName="inventory"
  ){

    if(
      gameOver
      ||
      noticeOpen
    ){

      return;

    }


    menuOpen =
      true;


    renderMenuUnlocks();


    gameMenu
      .classList
      .add(
        "open"
      );


    selectMenu(
      menuName
    );


    renderDirections();

  }


  function closeGameMenu(){

    menuOpen =
      false;


    currentMenu =
      null;


    gameMenu
      .classList
      .remove(
        "open"
      );


    renderDirections();

  }


  /* =========================
     MENU中央キー

     インベントリ
     ↓
     地図
     ↓
     スキル
     ↓
     クラフト
     ↓
     閉じる
  ========================= */

  document
    .getElementById(
      "menuKey"
    )
    .addEventListener(
      "click",
      ()=>{


        if(
          gameOver
          ||
          noticeOpen
        ){

          return;

        }


        const available =
          getAvailableMenus();


        if(
          !menuOpen
        ){

          openGameMenu(
            available[0]
          );

          return;

        }


        const index =
          available.indexOf(
            currentMenu
          );


        const nextIndex =
          index + 1;


        if(
          nextIndex
          >=
          available.length
        ){

          closeGameMenu();

          return;

        }


        selectMenu(
          available[
            nextIndex
          ]
        );


      }
    );


  /* =========================
     上部タブ
  ========================= */

  menuTabs
    .forEach(
      tab=>{


        tab
          .addEventListener(
            "click",
            ()=>{


              selectMenu(
                tab.dataset.menuTab
              );


            }
          );


      }
    );


  /* =========================
     Xで閉じる
  ========================= */

  document
    .getElementById(
      "menuClose"
    )
    .addEventListener(
      "click",
      ()=>{


        closeGameMenu();


      }
    );


  /* =========================
     DEAD 最初から
  ========================= */

  document
    .getElementById(
      "restartButton"
    )
    .addEventListener(
      "click",
      ()=>{


        window
          .location
          .reload();


      }
    );


  /* =========================
     初期表示
  ========================= */

  renderClock();

  renderMeters();

  renderInventory();

  renderMenuUnlocks();

  renderScene(
    false
  );


  showNotice(
    SCENES.start.message,
    4500
  );


</script>


</body>

</html>
