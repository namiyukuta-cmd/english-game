<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf6fb">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>雪山サバイバル</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#253947;background:#dfeaf1}
    body{min-height:100dvh;background:linear-gradient(180deg,#f2f9fd 0%,#e0edf4 100%)}
    button,a{font:inherit}
    button{touch-action:manipulation;-webkit-user-select:none;user-select:none}

    .shell{width:min(100%,540px);height:100dvh;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 9px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px;overflow:hidden}

    .topbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;flex:0 0 auto}
    .back{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:1px solid #b8cad6;border-radius:13px;background:#fff;color:#304957;text-decoration:none;font-size:22px;font-weight:900}
    .title{margin:0;text-align:center;font-size:20px;font-weight:900}

    .info-row{display:grid;grid-template-columns:1.25fr repeat(3,.75fr);gap:5px;flex:0 0 auto}
    .info{min-height:42px;padding:5px 4px;border:1px solid #c2d4de;border-radius:11px;background:rgba(255,255,255,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
    .info.time{background:#35596d;color:#fff;border-color:#35596d}
    .info small{display:block;font-size:17px;line-height:1.05;opacity:.78}
    .info strong{display:block;margin-top:2px;font-size:17px;line-height:1.08;white-space:nowrap}

    .field-wrap{position:relative;min-height:0;flex:1 1 auto;border:2px solid #b8cdd9;border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 6px 18px rgba(45,75,92,.08)}
    .field{position:absolute;inset:0;overflow:hidden;background:
      radial-gradient(ellipse at 15% 18%,#fff 0 42px,transparent 43px),
      radial-gradient(ellipse at 72% 13%,#fff 0 58px,transparent 59px),
      radial-gradient(ellipse at 45% 72%,rgba(255,255,255,.9) 0 70px,transparent 71px),
      linear-gradient(180deg,#f9fdff 0%,#edf6fb 45%,#f8fcff 100%)}
    .field::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(165deg,rgba(155,190,209,.08) 0 1px,transparent 1px 38px);pointer-events:none}
    .area-label{position:absolute;left:50%;top:7px;transform:translateX(-50%);z-index:6;padding:5px 9px;border:1px solid #d5e2ea;border-radius:10px;background:rgba(255,255,255,.9);font-size:17px;font-weight:800;white-space:nowrap;pointer-events:none}

    .tree{position:absolute;font-size:38px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12));pointer-events:none;z-index:1}
    .tree.small{font-size:31px;opacity:.92}

    .ground-item{position:absolute;width:46px;height:46px;padding:0;border:0;background:transparent;display:grid;place-items:center;font-size:27px;line-height:1;z-index:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12))}
    .ground-item::after{content:"";position:absolute;left:7px;right:7px;bottom:3px;height:7px;border-radius:50%;background:rgba(83,107,121,.12);z-index:-1}
    .ground-item.hidden{display:none}
    .ground-item:active{transform:scale(.94)}

    .player{position:absolute;width:46px;height:58px;margin-left:-23px;margin-top:-45px;z-index:5;transition-property:left,top;transition-timing-function:linear;filter:drop-shadow(0 3px 2px rgba(49,67,77,.22));pointer-events:none}
    .player.walking{animation:bob .25s ease-in-out infinite alternate}
    @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
    .hood{position:absolute;left:5px;top:0;width:36px;height:35px;border-radius:50% 50% 46% 46%;background:#d76d83;border:2px solid #7d4855;z-index:3}
    .hood::before{content:"";position:absolute;left:5px;top:5px;width:22px;height:22px;border-radius:50%;background:#ffe5cf;border:1px solid #b98a78}
    .hair{position:absolute;left:11px;top:7px;width:24px;height:10px;border-radius:50% 50% 35% 35%;background:#5b443d;z-index:4;clip-path:polygon(0 0,100% 0,92% 65%,75% 42%,60% 80%,43% 45%,25% 78%,8% 55%)}
    .eye{position:absolute;top:17px;width:3px;height:4px;border-radius:50%;background:#493238;z-index:5}
    .eye.left{left:16px}.eye.right{right:16px}
    .cheek{position:absolute;top:22px;width:5px;height:3px;border-radius:50%;background:#f3a2a8;z-index:5;opacity:.7}
    .cheek.left{left:11px}.cheek.right{right:11px}
    .scarf{position:absolute;left:8px;top:30px;width:30px;height:8px;border-radius:6px;background:#f0bf57;border:1px solid #9a7237;z-index:5}
    .scarf::after{content:"";position:absolute;right:1px;top:5px;width:8px;height:15px;border-radius:0 0 5px 5px;background:#f0bf57;border:1px solid #9a7237;border-top:0;transform:rotate(-10deg)}
    .coat{position:absolute;left:8px;top:34px;width:30px;height:20px;border-radius:9px 9px 7px 7px;background:#7ba7c5;border:2px solid #476d86;z-index:2}
    .coat::before{content:"";position:absolute;left:13px;top:1px;width:2px;height:15px;background:#d6e9f4}
    .leg{position:absolute;top:51px;width:8px;height:7px;border-radius:0 0 4px 4px;background:#554b50;z-index:1}
    .leg.left{left:12px}.leg.right{right:12px}

    .pickup-ring{position:absolute;width:54px;height:54px;margin-left:-27px;margin-top:-27px;border:2px solid rgba(79,128,153,.55);border-radius:50%;z-index:2;pointer-events:none;animation:ring .65s ease-out infinite;display:none}
    .pickup-ring.show{display:block}
    @keyframes ring{from{transform:scale(.65);opacity:.8}to{transform:scale(1.15);opacity:0}}

    .message{flex:0 0 auto;min-height:48px;padding:8px 11px;border:1px solid #c3d5df;border-radius:13px;background:#fff;font-size:17px;line-height:1.35;display:flex;align-items:center}

    .bottom-menu{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:6px;flex:0 0 auto}
    .menu-btn{min-height:50px;padding:6px;border:1px solid #9eb7c5;border-radius:14px;background:#fff;color:#294352;font-size:17px;font-weight:900}
    .menu-btn:active{transform:translateY(1px);background:#edf6fb}
    .menu-btn.fire{background:#35596d;color:#fff;border-color:#35596d}
    .menu-btn.fire[disabled]{opacity:.45}

    .modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(25,42,52,.42)}
    .modal.open{display:flex}
    .modal-card{width:min(440px,100%);max-height:80dvh;overflow:auto;padding:16px;border:2px solid #b8cdd9;border-radius:20px;background:#fafdff;box-shadow:0 22px 70px rgba(23,44,56,.28)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .modal-head h2{margin:0;font-size:22px}
    .close-btn{width:44px;height:44px;border:1px solid #b7cad5;border-radius:13px;background:#fff;font-size:22px;font-weight:900}
    .pause-note{margin:0 0 12px;padding:8px 10px;border-radius:12px;background:#eaf3f8;font-size:17px;line-height:1.4;color:#536c79;text-align:center}
    .item-list{display:grid;gap:8px}
    .item-row{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;padding:11px;border:1px solid #cadae3;border-radius:14px;background:#fff;font-size:17px}
    .item-row .icon{font-size:26px;text-align:center}
    .item-row strong{font-size:18px}
    .item-row .count{font-size:20px;font-weight:900}
    .empty-note{font-size:17px;line-height:1.5;color:#607784;text-align:center;padding:12px}

    @media(max-width:390px){
      .shell{padding-left:6px;padding-right:6px;gap:5px}
      .title{font-size:19px}
      .info-row{gap:4px}
      .info{padding-left:2px;padding-right:2px}
      .tree{font-size:34px}
      .ground-item{width:42px;height:42px;font-size:25px}
      .message{min-height:44px}
      .menu-btn{min-height:47px}
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="back" href="survival%20game_TOP.html" aria-label="サバイバルトップへ戻る">←</a>
      <h1 class="title">雪山サバイバル</h1>
      <span aria-hidden="true"></span>
    </header>

    <section class="info-row" aria-label="状態">
      <div class="info time"><small>1日目</small><strong id="clock">08:00:00</strong></div>
      <div class="info"><small>体温</small><strong id="warmth">寒い</strong></div>
      <div class="info"><small>空腹</small><strong id="hunger">平気</strong></div>
      <div class="info"><small>火</small><strong id="fireState">なし</strong></div>
    </section>

    <section class="field-wrap">
      <div id="field" class="field" aria-label="雪原。タップした場所へ移動します。">
        <div class="area-label">雪山・針葉樹林</div>

        <div class="tree" style="left:4%;top:13%">🌲</div>
        <div class="tree small" style="left:23%;top:6%">🌲</div>
        <div class="tree" style="right:4%;top:15%">🌲</div>
        <div class="tree small" style="right:22%;top:36%">🌲</div>
        <div class="tree" style="left:5%;bottom:9%">🌲</div>
        <div class="tree small" style="left:31%;bottom:25%">🌲</div>
        <div class="tree" style="right:7%;bottom:8%">🌲</div>

        <button class="ground-item" data-id="b1" data-kind="branch" data-x="24" data-y="26" style="left:18%;top:22%" aria-label="枝">🪾</button>
        <button class="ground-item" data-id="s1" data-kind="stone" data-x="61" data-y="21" style="left:55%;top:17%" aria-label="小石">🪨</button>
        <button class="ground-item" data-id="b2" data-kind="branch" data-x="46" data-y="45" style="left:40%;top:41%" aria-label="枝">🪾</button>
        <button class="ground-item" data-id="s2" data-kind="stone" data-x="78" data-y="48" style="left:72%;top:44%" aria-label="小石">🪨</button>
        <button class="ground-item" data-id="s3" data-kind="stone" data-x="23" data-y="67" style="left:17%;top:63%" aria-label="小石">🪨</button>
        <button class="ground-item" data-id="b3" data-kind="branch" data-x="61" data-y="75" style="left:55%;top:71%" aria-label="枝">🪾</button>
        <button class="ground-item" data-id="s4" data-kind="stone" data-x="82" data-y="78" style="left:76%;top:74%" aria-label="小石">🪨</button>

        <div id="pickupRing" class="pickup-ring" aria-hidden="true"></div>
        <div id="player" class="player" aria-label="主人公">
          <div class="hood"></div>
          <div class="hair"></div>
          <div class="eye left"></div><div class="eye right"></div>
          <div class="cheek left"></div><div class="cheek right"></div>
          <div class="scarf"></div>
          <div class="coat"></div>
          <div class="leg left"></div><div class="leg right"></div>
        </div>
      </div>
    </section>

    <div id="message" class="message" aria-live="polite">雪の上の枝や小石をタップすると、そこまで歩いて拾います。</div>

    <nav class="bottom-menu" aria-label="メニュー">
      <button id="itemBtn" class="menu-btn" type="button">🎒 ITEM</button>
      <button id="lookBtn" class="menu-btn" type="button">👀 周囲</button>
      <button id="fireBtn" class="menu-btn fire" type="button">🔥 焚き火</button>
    </nav>
  </main>

  <div id="itemModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="itemTitle">
    <section class="modal-card">
      <header class="modal-head">
        <h2 id="itemTitle">ITEM</h2>
        <button id="closeItem" class="close-btn" type="button" aria-label="閉じる">×</button>
      </header>
      <p class="pause-note">ITEMを開いている間、ゲーム内時間は止まります。</p>
      <div id="itemList" class="item-list"></div>
    </section>
  </div>

  <script>
    const SAVE_KEY='englishGameSurvivalSaveV2';

    // 時間倍率。ここを変えればゲーム内時間の速さを調整できます。
    const PASSIVE_GAME_SECONDS=5;       // 現実の1秒でゲーム内5秒
    const MOVE_SECONDS_PER_PIXEL=.55;   // 移動距離1pxにつきゲーム内0.55秒
    const START_TIME_SECONDS=8*60*60;   // 1日目 08:00:00

    const field=document.getElementById('field');
    const player=document.getElementById('player');
    const pickupRing=document.getElementById('pickupRing');
    const message=document.getElementById('message');
    const itemModal=document.getElementById('itemModal');
    const itemList=document.getElementById('itemList');
    const fireBtn=document.getElementById('fireBtn');
    const params=new URLSearchParams(location.search);

    const defaultState={
      xPct:50,
      yPct:85,
      branch:0,
      stone:0,
      food:0,
      fire:false,
      collected:[],
      gameSeconds:START_TIME_SECONDS
    };

    let state={...defaultState};
    let moving=false;
    let menuOpen=false;
    let moveTimer=null;
    let saveTick=0;

    function load(){
      if(params.get('new')==='1'){
        try{localStorage.removeItem(SAVE_KEY);}catch(e){}
        return;
      }
      try{
        const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
        if(saved&&typeof saved==='object') state={...defaultState,...saved};
      }catch(e){}
    }

    function save(){
      try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){}
    }

    function setMessage(text){message.textContent=text}

    function formatDuration(total){
      total=Math.max(0,Math.round(total));
      const m=Math.floor(total/60);
      const s=total%60;
      if(m===0)return s+'秒';
      if(s===0)return m+'分';
      return m+'分'+s+'秒';
    }

    function renderClock(){
      const total=Math.floor(state.gameSeconds);
      const day=Math.floor(total/86400)+1;
      const secInDay=((total%86400)+86400)%86400;
      const h=Math.floor(secInDay/3600);
      const m=Math.floor((secInDay%3600)/60);
      const s=secInDay%60;
      document.querySelector('.info.time small').textContent=day+'日目';
      document.getElementById('clock').textContent=[h,m,s].map(v=>String(v).padStart(2,'0')).join(':');
    }

    function advanceTime(seconds){
      state.gameSeconds+=Math.max(0,Math.round(seconds));
      renderClock();
    }

    function renderPlayer(){
      const rect=field.getBoundingClientRect();
      const x=rect.width*(state.xPct/100);
      const y=rect.height*(state.yPct/100);
      player.style.left=x+'px';
      player.style.top=y+'px';
    }

    function renderItems(){
      document.querySelectorAll('.ground-item').forEach(el=>{
        el.classList.toggle('hidden',state.collected.includes(el.dataset.id));
      });
    }

    function renderStatus(){
      document.getElementById('warmth').textContent=state.fire?'暖かい':'寒い';
      document.getElementById('hunger').textContent=state.food>=2?'少し安心':'平気';
      document.getElementById('fireState').textContent=state.fire?'あり':'なし';
      fireBtn.disabled=state.fire;
      fireBtn.textContent=state.fire?'🔥 燃焼中':'🔥 焚き火';
    }

    function renderInventory(){
      const rows=[];
      if(state.branch>0)rows.push(`<div class="item-row"><span class="icon">🪾</span><strong>枝</strong><span class="count">× ${state.branch}</span></div>`);
      if(state.stone>0)rows.push(`<div class="item-row"><span class="icon">🪨</span><strong>小石</strong><span class="count">× ${state.stone}</span></div>`);
      if(state.food>0)rows.push(`<div class="item-row"><span class="icon">🫐</span><strong>実</strong><span class="count">× ${state.food}</span></div>`);
      itemList.innerHTML=rows.length?rows.join(''):'<div class="empty-note">まだ何も持っていません。</div>';
    }

    function render(){
      renderPlayer();
      renderItems();
      renderStatus();
      renderClock();
      if(menuOpen)renderInventory();
    }

    function fieldPointFromEvent(e){
      const rect=field.getBoundingClientRect();
      const x=Math.max(24,Math.min(rect.width-24,e.clientX-rect.left));
      const y=Math.max(55,Math.min(rect.height-18,e.clientY-rect.top));
      return {x,y,xPct:x/rect.width*100,yPct:y/rect.height*100};
    }

    function getPlayerPixel(){
      const rect=field.getBoundingClientRect();
      return {x:rect.width*(state.xPct/100),y:rect.height*(state.yPct/100)};
    }

    function itemTarget(el){
      const fieldRect=field.getBoundingClientRect();
      const rect=el.getBoundingClientRect();
      const x=rect.left-fieldRect.left+rect.width/2;
      const y=rect.top-fieldRect.top+rect.height/2+14;
      return {x,y,xPct:x/fieldRect.width*100,yPct:y/fieldRect.height*100};
    }

    function showTargetRing(target){
      pickupRing.style.left=target.x+'px';
      pickupRing.style.top=target.y+'px';
      pickupRing.classList.add('show');
    }

    function hideTargetRing(){pickupRing.classList.remove('show')}

    function moveTo(target,collectEl=null){
      if(menuOpen)return;
      if(moveTimer)clearTimeout(moveTimer);

      const from=getPlayerPixel();
      const dx=target.x-from.x;
      const dy=target.y-from.y;
      const distance=Math.sqrt(dx*dx+dy*dy);
      if(distance<3){
        if(collectEl)collectItem(collectEl);
        return;
      }

      moving=true;
      const travelSeconds=Math.max(1,Math.round(distance*MOVE_SECONDS_PER_PIXEL));
      const animMs=Math.max(260,Math.min(1400,distance*4.2));

      player.classList.add('walking');
      player.style.transitionDuration=animMs+'ms';
      state.xPct=target.xPct;
      state.yPct=target.yPct;
      renderPlayer();
      if(collectEl)showTargetRing(target);else hideTargetRing();
      setMessage('雪の上を歩いています……');

      moveTimer=setTimeout(()=>{
        moving=false;
        player.classList.remove('walking');
        hideTargetRing();
        advanceTime(travelSeconds);
        if(collectEl){
          collectItem(collectEl,travelSeconds);
        }else{
          setMessage(formatDuration(travelSeconds)+'歩きました。');
          checkNearbyItem();
        }
        save();
      },animMs);
    }

    function collectItem(el,travelSeconds=0){
      if(!el||state.collected.includes(el.dataset.id))return;
      const kind=el.dataset.kind;
      state.collected.push(el.dataset.id);
      if(kind==='branch'){
        state.branch++;
        setMessage((travelSeconds?formatDuration(travelSeconds)+'歩いて、':'')+'枝を1本拾いました。');
      }else if(kind==='stone'){
        state.stone++;
        setMessage((travelSeconds?formatDuration(travelSeconds)+'歩いて、':'')+'小石を1個拾いました。');
      }
      renderItems();
      renderStatus();
      save();
    }

    function checkNearbyItem(){
      const p=getPlayerPixel();
      let nearest=null;
      let nearestDist=9999;
      document.querySelectorAll('.ground-item:not(.hidden)').forEach(el=>{
        const t=itemTarget(el);
        const d=Math.hypot(t.x-p.x,t.y-p.y);
        if(d<32&&d<nearestDist){nearest=el;nearestDist=d}
      });
      if(nearest)collectItem(nearest);
    }

    field.addEventListener('click',e=>{
      const item=e.target.closest('.ground-item');
      if(item){
        e.preventDefault();
        e.stopPropagation();
        moveTo(itemTarget(item),item);
        return;
      }
      moveTo(fieldPointFromEvent(e));
    });

    document.getElementById('itemBtn').addEventListener('click',()=>{
      if(moving)return;
      menuOpen=true;
      renderInventory();
      itemModal.classList.add('open');
    });

    function closeInventory(){
      menuOpen=false;
      itemModal.classList.remove('open');
      save();
    }

    document.getElementById('closeItem').addEventListener('click',closeInventory);
    itemModal.addEventListener('click',e=>{if(e.target===itemModal)closeInventory()});

    document.getElementById('lookBtn').addEventListener('click',()=>{
      if(moving||menuOpen)return;
      advanceTime(30);
      const texts=[
        '針葉樹の間に、まだ使えそうな物が落ちています。',
        '雪は深く、歩くのに時間がかかります。',
        '風が冷たいです。早めに火を確保した方がよさそうです。',
        '白い雪原が続いています。足元には枝や小石があります。'
      ];
      setMessage(texts[Math.floor(Math.random()*texts.length)]+'（30秒経過）');
      save();
    });

    fireBtn.addEventListener('click',()=>{
      if(moving||menuOpen)return;
      if(state.fire){setMessage('焚き火はすでに燃えています。');return}
      if(state.branch<3||state.stone<4){
        const need=[];
        if(state.branch<3)need.push('枝あと'+(3-state.branch)+'本');
        if(state.stone<4)need.push('小石あと'+(4-state.stone)+'個');
        setMessage('材料が足りません。'+need.join('、')+'必要です。');
        return;
      }
      state.branch-=3;
      state.stone-=4;
      state.fire=true;
      advanceTime(120);
      setMessage('枝と小石で焚き火を作りました。（2分経過）');
      renderStatus();
      save();
    });

    // フィールドを見ている間は、何もしなくても時間が進みます。
    setInterval(()=>{
      if(document.visibilityState!=='visible'||menuOpen||moving)return;
      advanceTime(PASSIVE_GAME_SECONDS);
      saveTick++;
      if(saveTick>=5){saveTick=0;save()}
    },1000);

    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
    window.addEventListener('beforeunload',save);
    window.addEventListener('resize',renderPlayer);

    load();
    render();
  </script>
</body>
</html>
