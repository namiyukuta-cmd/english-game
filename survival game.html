<!doctype html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>雪山サバイバル</title>


  <style>

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      width:100%;
      height:100%;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

      background:#e7eaec;
      color:#202427;
    }

    body{
      min-height:100dvh;
    }

    button,
    a{
      font:inherit;
    }

    button{
      touch-action:manipulation;

      -webkit-user-select:none;
      user-select:none;
    }



    /* =========================
       ゲーム全体
    ========================= */

    .game{
      width:min(100%,540px);
      height:100dvh;

      margin:0 auto;

      padding:
        calc(7px + env(safe-area-inset-top))
        7px
        calc(7px + env(safe-area-inset-bottom));

      display:flex;
      flex-direction:column;

      gap:6px;

      overflow:hidden;
    }



    /* =========================
       上部
    ========================= */

    .topbar{
      display:grid;

      grid-template-columns:
        44px
        1fr
        44px;

      align-items:center;

      flex:0 0 auto;
    }

    .back{
      width:42px;
      height:42px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid #999;
      border-radius:12px;

      background:#fff;

      color:#222;
      text-decoration:none;

      font-size:22px;
      font-weight:900;
    }

    .title{
      margin:0;

      text-align:center;

      font-size:20px;
      font-weight:900;
    }



    /* =========================
       日時・現在地
    ========================= */

    .world-status{
      min-height:38px;

      padding:4px 9px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:8px;

      border:1px solid #aaa;
      border-radius:11px;

      background:#fff;

      flex:0 0 auto;

      font-size:17px;
      font-weight:700;
    }

    .world-time{
      white-space:nowrap;
    }

    .world-place{
      overflow:hidden;

      white-space:nowrap;
      text-overflow:ellipsis;

      text-align:right;
    }



    /* =========================
       3つの生存メーター
    ========================= */

    .meters{
      display:grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:5px;

      flex:0 0 auto;
    }

    .meter{
      min-width:0;
      min-height:67px;

      padding:5px 6px;

      display:flex;
      align-items:center;
      justify-content:center;

      gap:5px;

      border:1px solid #aaa;
      border-radius:12px;

      background:#fff;
    }

    .meter-icon{
      width:38px;
      height:38px;

      flex:0 0 38px;

      overflow:visible;
    }

    .meter-outline{
      fill:none;

      stroke:#262626;
      stroke-width:1.5;

      stroke-linejoin:round;
      stroke-linecap:round;
    }

    .meter-fill{
      fill:#151515;
    }

    .meter-text{
      min-width:0;

      display:flex;
      flex-direction:column;

      justify-content:center;
    }

    .meter-label{
      font-size:17px;
      line-height:1;

      font-weight:700;

      white-space:nowrap;
    }

    .meter-value{
      margin-top:4px;

      font-size:17px;
      line-height:1;

      font-weight:900;

      white-space:nowrap;
    }



    /* =========================
       景色全体
    ========================= */

    .scene{
      position:relative;

      width:100%;

      min-height:0;

      flex:1 1 auto;

      overflow:hidden;

      border:2px solid #8d9397;
      border-radius:16px;

      background:#ddd;
    }



    /* =========================
       DIV 1
       背景
    ========================= */

    .scene-background{
      position:absolute;

      inset:0;

      z-index:1;

      background-image:
        url("assets/survival/forest_01.png");

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      pointer-events:none;
    }



    /* =========================
       DIV 2
       アイテム
    ========================= */

    .scene-objects{
      position:absolute;

      inset:0;

      z-index:2;

      pointer-events:none;
    }

    .scene-object{
      position:absolute;

      display:block;

      margin:0;
      padding:0;

      border:0;

      background:transparent;

      cursor:pointer;

      pointer-events:auto;

      -webkit-tap-highlight-color:transparent;
    }

    .scene-object img{
      display:block;

      width:100%;
      height:100%;

      object-fit:contain;

      pointer-events:none;
    }

    .scene-object:active{
      transform:scale(.96);
    }

    .scene-object.collected{
      display:none;
    }



    /* =========================
       枝
    ========================= */

    #branchObject{
      width:34%;

      aspect-ratio:1 / 1;

      left:4%;
      bottom:1%;
    }



    /* =========================
       石
    ========================= */

    #stoneObject{
      width:20%;

      aspect-ratio:1 / 1;

      right:8%;
      bottom:8%;
    }



    /* =========================
       DIV 3
       タップ判定
    ========================= */

    .scene-hotspots{
      position:absolute;

      inset:0;

      z-index:3;

      pointer-events:none;
    }

    .hotspot{
      position:absolute;

      padding:0;

      border:0;

      background:transparent;

      pointer-events:auto;
    }



    /* =========================
       場所名
    ========================= */

    .scene-name{
      position:absolute;

      left:50%;
      top:8px;

      transform:translateX(-50%);

      z-index:10;

      padding:5px 10px;

      border:1px solid rgba(0,0,0,.2);
      border-radius:10px;

      background:rgba(255,255,255,.82);

      font-size:17px;
      font-weight:900;

      white-space:nowrap;

      pointer-events:none;
    }



    /* =========================
       説明欄
    ========================= */

    .message{
      min-height:62px;

      padding:8px 10px;

      display:flex;
      align-items:center;

      flex:0 0 auto;

      border:1px solid #aaa;
      border-radius:13px;

      background:#fff;

      font-size:17px;
      line-height:1.45;
    }



    /* =========================
       下メニュー
    ========================= */

    .menu{
      display:grid;

      grid-template-columns:
        1fr
        1fr;

      gap:6px;

      flex:0 0 auto;
    }

    .menu-button{
      min-height:50px;

      border:1px solid #999;
      border-radius:13px;

      background:#fff;

      color:#222;

      font-size:17px;
      font-weight:900;
    }

    .menu-button:active{
      transform:translateY(1px);

      background:#eee;
    }



    /* =========================
       モーダル
    ========================= */

    .modal{
      position:fixed;

      inset:0;

      z-index:100;

      display:none;

      align-items:center;
      justify-content:center;

      padding:18px;

      background:rgba(0,0,0,.5);
    }

    .modal.open{
      display:flex;
    }

    .modal-card{
      width:min(430px,100%);

      max-height:80dvh;

      overflow:auto;

      padding:16px;

      border-radius:18px;

      background:#fff;
    }

    .modal-card h2{
      margin:0 0 12px;

      font-size:22px;
    }

    .pause-note{
      margin:0 0 12px;

      padding:9px;

      border-radius:11px;

      background:#eee;

      font-size:17px;
      line-height:1.45;

      text-align:center;
    }



    /* =========================
       ITEM一覧
    ========================= */

    .item-list{
      min-height:55px;

      font-size:17px;
      line-height:1.6;
    }

    .item-row{
      min-height:50px;

      padding:10px 4px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:12px;

      border-bottom:1px solid #ddd;
    }

    .item-row:last-child{
      border-bottom:0;
    }

    .item-name{
      font-size:17px;
      font-weight:700;
    }

    .item-count{
      flex:0 0 auto;

      font-size:17px;
      font-weight:900;
    }

    .close-button{
      width:100%;

      min-height:50px;

      margin-top:14px;

      border:1px solid #999;
      border-radius:13px;

      background:#fff;

      font-size:17px;
      font-weight:900;
    }



    /* =========================
       DEAD画面
    ========================= */

    .dead-modal{
      position:fixed;

      inset:0;

      z-index:200;

      display:none;

      align-items:center;
      justify-content:center;

      padding:20px;

      background:rgba(0,0,0,.83);
    }

    .dead-modal.open{
      display:flex;
    }

    .dead-card{
      width:min(400px,100%);

      padding:24px 18px;

      border-radius:17px;

      background:#f6f6f6;

      text-align:center;
    }

    .dead-title{
      margin:0;

      font-size:34px;
      letter-spacing:.08em;
    }

    .dead-reason{
      margin:15px 0 20px;

      font-size:17px;
      line-height:1.5;
    }

    .restart-button{
      width:100%;

      min-height:52px;

      border:1px solid #777;
      border-radius:13px;

      background:#fff;

      font-size:17px;
      font-weight:900;
    }



    @media(max-width:390px){

      .game{
        padding-left:6px;
        padding-right:6px;
      }

      .meter{
        padding-left:4px;
        padding-right:4px;

        gap:3px;
      }

      .meter-icon{
        width:34px;
        height:34px;

        flex-basis:34px;
      }

    }

  </style>

</head>


<body>


<main class="game">


  <!-- =========================
       上部
  ========================= -->

  <header class="topbar">

    <a
      class="back"
      href="survival%20game_TOP.html"
      aria-label="戻る"
    >
      ←
    </a>

    <h1 class="title">
      雪山サバイバル
    </h1>

    <span></span>

  </header>



  <!-- =========================
       日時・現在地
  ========================= -->

  <section class="world-status">

    <div class="world-time">

      <span id="day">
        1日目
      </span>

      <span id="clock">
        08:00
      </span>

    </div>


    <div
      id="currentPlace"
      class="world-place"
    >
      針葉樹林
    </div>

  </section>



  <!-- =========================
       生存メーター
  ========================= -->

  <section class="meters">


    <!-- =========================
         体温
    ========================== -->

    <div
      class="meter"
      aria-label="体温"
    >

      <svg
        class="meter-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <defs>

          <clipPath id="tempClip">

            <rect
              id="tempClipRect"
              x="0"
              y="0"
              width="24"
              height="24"
            ></rect>

          </clipPath>

        </defs>


        <path
          id="tempFill"
          class="meter-fill"
          clip-path="url(#tempClip)"
          d="
            M12 2
            C9.8 2 8 3.8 8 6
            V14.1
            C6.7 15.3 6 17 6 18.7
            C6 22 8.7 24 12 24
            C15.3 24 18 22 18 18.7
            C18 17 17.3 15.3 16 14.1
            V6
            C16 3.8 14.2 2 12 2
            Z
          "
        ></path>


        <path
          class="meter-outline"
          d="
            M12 2
            C9.8 2 8 3.8 8 6
            V14.1
            C6.7 15.3 6 17 6 18.7
            C6 22 8.7 24 12 24
            C15.3 24 18 22 18 18.7
            C18 17 17.3 15.3 16 14.1
            V6
            C16 3.8 14.2 2 12 2
            Z
          "
        ></path>

      </svg>


      <div class="meter-text">

        <div class="meter-label">
          体温
        </div>

        <div
          id="tempValue"
          class="meter-value"
        >
          36.7℃
        </div>

      </div>

    </div>



    <!-- =========================
         空腹
    ========================== -->

    <div
      class="meter"
      aria-label="空腹"
    >

      <svg
        class="meter-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <defs>

          <clipPath id="hungerClip">

            <rect
              id="hungerClipRect"
              x="0"
              y="0"
              width="24"
              height="24"
            ></rect>

          </clipPath>

        </defs>


        <path
          id="hungerFill"
          class="meter-fill"
          clip-path="url(#hungerClip)"
          d="
            M12 7
            C9.5 4.5 5.2 5.4 3.8 8.6
            C1.7 13.4 5.2 20.5 9.3 22
            C10.5 22.4 11.3 21.7 12 21.3
            C12.7 21.7 13.5 22.4 14.7 22
            C18.8 20.5 22.3 13.4 20.2 8.6
            C18.8 5.4 14.5 4.5 12 7
            Z
            M12.5 5.8
            C12.4 3.3 13.8 1.5 16.6 1
            C16.7 3.7 15.3 5.4 12.5 5.8
            Z
          "
        ></path>


        <path
          class="meter-outline"
          d="
            M12 7
            C9.5 4.5 5.2 5.4 3.8 8.6
            C1.7 13.4 5.2 20.5 9.3 22
            C10.5 22.4 11.3 21.7 12 21.3
            C12.7 21.7 13.5 22.4 14.7 22
            C18.8 20.5 22.3 13.4 20.2 8.6
            C18.8 5.4 14.5 4.5 12 7
            Z
            M12.5 5.8
            C12.4 3.3 13.8 1.5 16.6 1
            C16.7 3.7 15.3 5.4 12.5 5.8
            Z
          "
        ></path>

      </svg>


      <div class="meter-text">

        <div class="meter-label">
          空腹
        </div>

        <div
          id="hungerValue"
          class="meter-value"
        >
          100
        </div>

      </div>

    </div>



    <!-- =========================
         体力
    ========================== -->

    <div
      class="meter"
      aria-label="体力"
    >

      <svg
        class="meter-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <defs>

          <clipPath id="staminaClip">

            <rect
              id="staminaClipRect"
              x="0"
              y="0"
              width="24"
              height="24"
            ></rect>

          </clipPath>

        </defs>


        <path
          id="staminaFill"
          class="meter-fill"
          clip-path="url(#staminaClip)"
          d="
            M12 21
            C10.7 19.8 4.3 15.5 2.6 11.6
            C.6 7.2 3.5 3.5 7.4 3.5
            C9.5 3.5 11 4.7 12 6.1
            C13 4.7 14.5 3.5 16.6 3.5
            C20.5 3.5 23.4 7.2 21.4 11.6
            C19.7 15.5 13.3 19.8 12 21
            Z
          "
        ></path>


        <path
          class="meter-outline"
          d="
            M12 21
            C10.7 19.8 4.3 15.5 2.6 11.6
            C.6 7.2 3.5 3.5 7.4 3.5
            C9.5 3.5 11 4.7 12 6.1
            C13 4.7 14.5 3.5 16.6 3.5
            C20.5 3.5 23.4 7.2 21.4 11.6
            C19.7 15.5 13.3 19.8 12 21
            Z
          "
        ></path>

      </svg>


      <div class="meter-text">

        <div class="meter-label">
          体力
        </div>

        <div
          id="staminaValue"
          class="meter-value"
        >
          100
        </div>

      </div>

    </div>


  </section>



  <!-- =========================
       景色
  ========================= -->

  <section class="scene">


    <div class="scene-name">
      雪山・針葉樹林
    </div>



    <!-- 背景 -->

    <div
      class="scene-background"
      aria-hidden="true"
    ></div>



    <!-- アイテム -->

    <div
      id="objectLayer"
      class="scene-objects"
    >


      <!-- 枝 -->

      <button
        id="branchObject"
        class="scene-object"
        type="button"
        aria-label="細い枝を拾う"
      >

        <img
          src="assets/survival/branch_01.png"
          alt=""
          draggable="false"
        >

      </button>



      <!-- 石 -->

      <button
        id="stoneObject"
        class="scene-object"
        type="button"
        aria-label="小石を拾う"
      >

        <img
          src="assets/survival/stone_01.png"
          alt=""
          draggable="false"
        >

      </button>


    </div>



    <!-- タップ判定 -->

    <div
      id="hotspotLayer"
      class="scene-hotspots"
    ></div>


  </section>



  <!-- =========================
       説明
  ========================= -->

  <div
    id="message"
    class="message"
  >
    雪の積もった針葉樹林です。足元に拾えそうな物があります。
  </div>



  <!-- =========================
       下メニュー
  ========================= -->

  <nav class="menu">

    <button
      id="itemButton"
      class="menu-button"
      type="button"
    >
      ITEM
    </button>


    <button
      id="lookButton"
      class="menu-button"
      type="button"
    >
      周囲を見る
    </button>

  </nav>


</main>



<!-- =========================
     ITEM
========================== -->

<div
  id="itemModal"
  class="modal"
>

  <section class="modal-card">

    <h2>
      ITEM
    </h2>

    <p class="pause-note">
      ITEMを開いている間、ゲーム内時間は止まります。
    </p>

    <div
      id="itemList"
      class="item-list"
    >
      まだ何も持っていません。
    </div>

    <button
      id="closeItem"
      class="close-button"
      type="button"
    >
      閉じる
    </button>

  </section>

</div>



<!-- =========================
     DEAD
========================== -->

<div
  id="deadModal"
  class="dead-modal"
>

  <section class="dead-card">

    <h2 class="dead-title">
      DEAD
    </h2>

    <p
      id="deadReason"
      class="dead-reason"
    >
    </p>

    <button
      id="restartButton"
      class="restart-button"
      type="button"
    >
      最初から
    </button>

  </section>

</div>



<script>


  /* =========================
     基本状態
  ========================= */

  let gameSeconds =
    8 * 60 * 60;


  let menuOpen =
    false;


  let gameOver =
    false;



  /* =========================
     生存パラメータ
  ========================= */

  let bodyTemperature =
    36.7;


  let hunger =
    100;


  let stamina =
    100;



  /* =========================
     所持品
  ========================= */

  const inventory = {

    branch:0,

    stone:0

  };



  /* =========================
     数値制限
  ========================= */

  function clamp(
    value,
    min,
    max
  ){

    return Math.max(
      min,
      Math.min(
        max,
        value
      )
    );

  }



  /* =========================
     時計
  ========================= */

  function renderClock(){

    const total =
      Math.floor(gameSeconds);


    const day =
      Math.floor(total / 86400) + 1;


    const secondInDay =
      total % 86400;


    const hour =
      Math.floor(
        secondInDay / 3600
      );


    const minute =
      Math.floor(
        (secondInDay % 3600) / 60
      );


    document
      .getElementById("day")
      .textContent =
        day + "日目";


    document
      .getElementById("clock")
      .textContent =
        String(hour)
          .padStart(2,"0")
        +
        ":"
        +
        String(minute)
          .padStart(2,"0");

  }



  /* =========================
     メーター色
  ========================= */

  function normalMeterColor(
    percent
  ){

    if(percent <= 20){

      return "#c62828";

    }


    if(percent <= 40){

      return "#d6a000";

    }


    return "#151515";

  }



  function temperatureColor(){

    if(bodyTemperature < 33){

      return "#c62828";

    }


    if(bodyTemperature < 35){

      return "#d6a000";

    }


    return "#151515";

  }



  /* =========================
     SVGの中身を減らす
  ========================= */

  function setSvgFillLevel(
    rectId,
    percent
  ){

    const value =
      clamp(
        percent,
        0,
        100
      );


    const height =
      24 * value / 100;


    const y =
      24 - height;


    const rect =
      document.getElementById(
        rectId
      );


    rect.setAttribute(
      "y",
      y
    );


    rect.setAttribute(
      "height",
      height
    );

  }



  /* =========================
     メーター表示
  ========================= */

  function renderMeters(){


    /* -------------------------
       体温

       36.8℃付近を満タン
       28℃付近を空
    ------------------------- */

    const temperaturePercent =
      clamp(
        (
          (
            bodyTemperature
            -
            28
          )
          /
          (
            36.8
            -
            28
          )
        )
        *
        100,
        0,
        100
      );


    setSvgFillLevel(
      "tempClipRect",
      temperaturePercent
    );


    document
      .getElementById(
        "tempFill"
      )
      .setAttribute(
        "fill",
        temperatureColor()
      );


    document
      .getElementById(
        "tempValue"
      )
      .textContent =
        bodyTemperature
          .toFixed(1)
        +
        "℃";



    /* -------------------------
       空腹
    ------------------------- */

    setSvgFillLevel(
      "hungerClipRect",
      hunger
    );


    document
      .getElementById(
        "hungerFill"
      )
      .setAttribute(
        "fill",
        normalMeterColor(
          hunger
        )
      );


    document
      .getElementById(
        "hungerValue"
      )
      .textContent =
        Math.round(
          hunger
        );



    /* -------------------------
       体力
    ------------------------- */

    setSvgFillLevel(
      "staminaClipRect",
      stamina
    );


    document
      .getElementById(
        "staminaFill"
      )
      .setAttribute(
        "fill",
        normalMeterColor(
          stamina
        )
      );


    document
      .getElementById(
        "staminaValue"
      )
      .textContent =
        Math.round(
          stamina
        );

  }



  /* =========================
     死亡判定
  ========================= */

  function checkDeath(){

    if(gameOver){
      return;
    }



    /* 体力ゼロ */

    if(stamina <= 0){

      showDead(
        "体力が尽きました。"
      );

      return;
    }



    /* 極端な低体温 */

    if(bodyTemperature <= 28){

      showDead(
        "低体温に耐えられませんでした。"
      );

    }

  }



  /* =========================
     DEAD表示
  ========================= */

  function showDead(
    reason
  ){

    gameOver=true;


    document
      .getElementById(
        "deadReason"
      )
      .textContent =
        reason;


    document
      .getElementById(
        "deadModal"
      )
      .classList
      .add("open");

  }



  /* =========================
     時間経過による消耗
  ========================= */

  function applySurvivalDrain(
    seconds
  ){

    const minutes =
      seconds / 60;



    /* -------------------------
       現在は屋外

       体温が徐々に低下
    ------------------------- */

    bodyTemperature -=
      0.008
      *
      minutes;



    /* -------------------------
       空腹
    ------------------------- */

    hunger -=
      0.10
      *
      minutes;



    hunger =
      clamp(
        hunger,
        0,
        100
      );



    /* -------------------------
       低体温による体力低下
    ------------------------- */

    if(
      bodyTemperature < 35
    ){

      stamina -=
        0.08
        *
        minutes;

    }


    if(
      bodyTemperature < 33
    ){

      stamina -=
        0.30
        *
        minutes;

    }



    /* -------------------------
       空腹0でも即死しない

       代わりに体力が減る
    ------------------------- */

    if(
      hunger <= 0
    ){

      stamina -=
        0.25
        *
        minutes;

    }



    stamina =
      clamp(
        stamina,
        0,
        100
      );


    renderMeters();


    checkDeath();

  }



  /* =========================
     時間を進める
  ========================= */

  function advanceTime(
    seconds
  ){

    if(gameOver){
      return;
    }


    gameSeconds +=
      seconds;


    applySurvivalDrain(
      seconds
    );


    renderClock();

  }



  /* =========================
     自動時間経過

     現実1秒
     ↓
     ゲーム5秒
  ========================= */

  setInterval(()=>{

    if(menuOpen){
      return;
    }


    if(gameOver){
      return;
    }


    if(
      document.visibilityState
      !==
      "visible"
    ){
      return;
    }


    advanceTime(
      5
    );

  },1000);



  /* =========================
     メッセージ
  ========================= */

  function setMessage(
    text
  ){

    document
      .getElementById(
        "message"
      )
      .textContent =
        text;

  }



  /* =========================
     ITEM一覧
  ========================= */

  function renderInventory(){

    const itemList =
      document.getElementById(
        "itemList"
      );


    const rows =
      [];



    if(
      inventory.branch > 0
    ){

      rows.push(
        `
          <div class="item-row">

            <span class="item-name">
              細い枝
            </span>

            <span class="item-count">
              × ${inventory.branch}
            </span>

          </div>
        `
      );

    }



    if(
      inventory.stone > 0
    ){

      rows.push(
        `
          <div class="item-row">

            <span class="item-name">
              小石
            </span>

            <span class="item-count">
              × ${inventory.stone}
            </span>

          </div>
        `
      );

    }



    if(
      rows.length === 0
    ){

      itemList.textContent =
        "まだ何も持っていません。";


      return;

    }



    itemList.innerHTML =
      rows.join("");

  }



  /* =========================
     枝を拾う
  ========================= */

  document
    .getElementById(
      "branchObject"
    )
    .addEventListener(
      "click",
      ()=>{


        if(gameOver){
          return;
        }


        const object =
          document
            .getElementById(
              "branchObject"
            );


        if(
          object
            .classList
            .contains(
              "collected"
            )
        ){
          return;
        }


        inventory.branch +=
          1;


        stamina -=
          0.5;


        stamina =
          clamp(
            stamina,
            0,
            100
          );


        object
          .classList
          .add(
            "collected"
          );


        advanceTime(
          10
        );


        renderInventory();


        renderMeters();


        setMessage(
          "細い枝を拾いました。"
        );

      }
    );



  /* =========================
     石を拾う
  ========================= */

  document
    .getElementById(
      "stoneObject"
    )
    .addEventListener(
      "click",
      ()=>{


        if(gameOver){
          return;
        }


        const object =
          document
            .getElementById(
              "stoneObject"
            );


        if(
          object
            .classList
            .contains(
              "collected"
            )
        ){
          return;
        }


        inventory.stone +=
          1;


        stamina -=
          0.5;


        stamina =
          clamp(
            stamina,
            0,
            100
          );


        object
          .classList
          .add(
            "collected"
          );


        advanceTime(
          10
        );


        renderInventory();


        renderMeters();


        setMessage(
          "小石を拾いました。"
        );

      }
    );



  /* =========================
     ITEM
  ========================= */

  const itemModal =
    document.getElementById(
      "itemModal"
    );


  document
    .getElementById(
      "itemButton"
    )
    .addEventListener(
      "click",
      ()=>{


        if(gameOver){
          return;
        }


        menuOpen=true;


        renderInventory();


        itemModal
          .classList
          .add(
            "open"
          );

      }
    );



  document
    .getElementById(
      "closeItem"
    )
    .addEventListener(
      "click",
      ()=>{


        menuOpen=false;


        itemModal
          .classList
          .remove(
            "open"
          );

      }
    );



  /* =========================
     周囲を見る
  ========================= */

  document
    .getElementById(
      "lookButton"
    )
    .addEventListener(
      "click",
      ()=>{


        if(
          menuOpen
          ||
          gameOver
        ){
          return;
        }


        stamina -=
          0.7;


        stamina =
          clamp(
            stamina,
            0,
            100
          );


        advanceTime(
          30
        );



        const branchLeft =
          inventory.branch === 0;


        const stoneLeft =
          inventory.stone === 0;



        if(
          branchLeft
          &&
          stoneLeft
        ){

          setMessage(
            "足元に細い枝と小石があります。正面には森の奥へ続く道が見えます。（30秒経過）"
          );


          return;

        }



        if(
          branchLeft
        ){

          setMessage(
            "足元に細い枝があります。正面には森の奥へ続く道が見えます。（30秒経過）"
          );


          return;

        }



        if(
          stoneLeft
        ){

          setMessage(
            "足元に小石があります。正面には森の奥へ続く道が見えます。（30秒経過）"
          );


          return;

        }



        setMessage(
          "雪の積もった針葉樹林です。正面には森の奥へ続く道が見えます。（30秒経過）"
        );

      }
    );



  /* =========================
     最初から
  ========================= */

  document
    .getElementById(
      "restartButton"
    )
    .addEventListener(
      "click",
      ()=>{

        window.location.reload();

      }
    );



  /* =========================
     初期表示
  ========================= */

  renderClock();

  renderMeters();

  renderInventory();


</script>


</body>

</html>
