<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>Magic Battle</title>
  <link rel="stylesheet" href="css/magic-battle.css?v=20260903-6">
</head>
<body>
  <main id="battleShell" class="magic-battle-shell">
    <header class="battle-top">
      <button id="backBtn" class="battle-back" type="button" aria-label="逃げる">←</button>
      <h1>BATTLE</h1>
      <span class="battle-spacer"></span>
    </header>

    <section class="battle-status">
      <div id="playerHpBox" class="status-box"><small>YOUR HP</small><strong id="playerHp">5 / 5</strong></div>
      <div id="playerMpBox" class="status-box mp-box"><small>YOUR MP</small><strong id="playerMp">5 / 5</strong></div>
      <div class="status-box"><small>ENEMY HP</small><strong id="enemyHpTop">3 / 3</strong></div>
    </section>

    <section id="enemyCard" class="enemy-card">
      <div id="enemyVisual" class="enemy-visual">🐺</div>
      <h2 id="enemyName">Wolf</h2>
      <p id="enemyText">A wild animal blocks the way.</p>
      <div class="enemy-hp-row"><span>ENEMY HP</span><span id="enemyHpText">3 / 3</span></div>
      <div class="hp-track"><div id="enemyHpFill" class="hp-fill"></div></div>
    </section>

    <div id="battleMessage" class="battle-message" aria-live="polite">Choose an action.</div>

    <section id="commandGrid" class="command-grid">
      <button id="attackBtn" type="button">Pencil Knife<small>攻撃</small></button>
      <button id="magicBtn" type="button">Magic<small>魔法</small></button>
      <button id="itemBtn" type="button">Item<small>道具</small></button>
      <button id="runBtn" type="button">Run<small>逃げる</small></button>
    </section>

    <section id="actionPanel" class="action-panel hidden">
      <div class="action-panel-head">
        <strong id="actionPanelTitle">MAGIC</strong>
        <button id="closeActionPanel" type="button">×</button>
      </div>
      <div id="actionOptions" class="action-options"></div>
    </section>

    <button id="captureBtn" class="capture-button hidden" type="button">CAPTURE<small>捕まえる</small></button>

    <section id="capturePanel" class="capture-panel hidden" aria-live="polite" aria-modal="true" role="dialog">
      <div class="capture-dialog">
        <h2>CAPTURE</h2>
        <p class="capture-sub">英語と日本語のペアをそろえて捕まえる</p>
        <div id="wordProgress" class="word-progress">0 / 6</div>
        <div id="wordQuestion" class="word-question">同じ意味のペアを6組そろえる</div>
        <div id="wordOptions" class="word-options"></div>
        <div id="wordResult" class="word-result"></div>
        <button id="captureDone" class="capture-done hidden" type="button">探索に戻る</button>
      </div>
    </section>
  </main>

  <script src="js/magic-state.js?v=20260903-6"></script>
  <script src="data/magic-items.js?v=20260903-1"></script>
  <script src="js/magic-battle.js?v=20260903-7"></script>
</body>
</html>
