<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17130f">
  <title>D&D 依頼</title>
  <style>
    :root{color-scheme:dark;--bg:#17130f;--panel:#241f19;--panel2:#1b1713;--line:#6d5a43;--text:#f3eadc;--muted:#c6b69e;--accent:#d5bb8c;--paper:#e8d6b3;--ink:#352719}
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#33281f 0,#17130f 58%);color:var(--text);font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;padding:12px 12px calc(18px + env(safe-area-inset-bottom))}
    button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    main{width:min(760px,100%);margin:0 auto}
    header{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;margin-bottom:12px}
    header h1{margin:0;text-align:center;font-size:25px;letter-spacing:.04em}
    .back{width:48px;height:48px;border:1px solid var(--line);background:#231d17;color:var(--text);font-size:24px;display:grid;place-items:center}
    .intro{margin:0 0 12px;color:var(--muted);font-size:17px;line-height:1.65;text-align:center}
    .board{border:1px solid #715d44;background:linear-gradient(#d8c09a,#ead8b7);color:var(--ink);padding:12px;box-shadow:0 14px 32px rgba(0,0,0,.34)}
    .board-title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:2px 2px 10px;border-bottom:1px solid rgba(78,57,36,.42)}
    .board-title strong{font-size:21px}.board-title span{font-size:17px;color:#6c5840}
    .quest-list{display:grid;gap:9px;padding-top:10px}
    .quest-card{width:100%;border:1px solid rgba(83,61,39,.5);background:rgba(255,248,229,.38);color:var(--ink);padding:12px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;min-height:70px}
    .quest-card:active{transform:translateY(1px)}
    .quest-card strong{display:block;font-size:19px;line-height:1.45}.quest-card small{display:block;margin-top:4px;font-size:17px;color:#6f5940;line-height:1.45}
    .quest-meta{text-align:right;white-space:nowrap;font-size:17px;line-height:1.45}.quest-meta b{display:block;font-size:18px}
    .empty{padding:28px 12px;text-align:center;font-size:17px;line-height:1.7;color:#6f5a42}
    .detail{display:none}.detail.active{display:block}
    .list-view.hidden{display:none}
    .detail-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    .detail-head h2{margin:0;font-size:24px;line-height:1.4}.badge{border:1px solid rgba(77,55,34,.45);background:rgba(255,248,229,.35);padding:5px 8px;font-size:17px;white-space:nowrap}
    .detail-grid{display:grid;grid-template-columns:110px 1fr;border-top:1px solid rgba(78,57,36,.35);border-bottom:1px solid rgba(78,57,36,.35);margin-bottom:14px}
    .detail-grid div{padding:9px 5px;font-size:17px;line-height:1.55;border-bottom:1px solid rgba(78,57,36,.18)}
    .detail-grid div:nth-last-child(-n+2){border-bottom:none}.detail-grid .key{color:#6d583f}.detail-grid .value{font-weight:700}
    .detail-copy{font-size:18px;line-height:1.8;margin:0 0 14px}
    .objective{border:1px solid rgba(83,61,39,.45);background:rgba(255,248,229,.30);padding:12px;margin-bottom:14px}
    .objective span{display:block;font-size:17px;color:#6d583f;margin-bottom:5px}.objective strong{font-size:18px;line-height:1.6}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
    .actions button{min-height:52px;border:1px solid #775f43;background:#4a3827;color:#f6ead5;font-size:17px;font-weight:800;padding:10px}
    .actions .secondary{background:transparent;color:#4f3a26;border-color:#8d7454}
    .actions button:disabled{opacity:.48}
    .accepted{border:1px solid #836e51;background:rgba(89,72,50,.16);padding:12px;font-size:17px;line-height:1.65;margin-bottom:10px}
    .status{min-height:24px;margin:10px 2px 0;font-size:17px;line-height:1.55;color:var(--muted)}
    @media(max-width:520px){body{padding:10px 9px calc(14px + env(safe-area-inset-bottom))}.board{padding:10px}.quest-card{grid-template-columns:1fr auto;padding:10px}.quest-card strong{font-size:18px}.quest-card small,.quest-meta,.board-title span{font-size:17px}.detail-grid{grid-template-columns:92px 1fr}.actions{grid-template-columns:1fr}.actions button{min-height:54px}}
  </style>
</head>
<body>
<main>
  <header>
    <button id="backButton" class="back" type="button" aria-label="戻る">←</button>
    <h1>依頼</h1>
    <span></span>
  </header>
  <p id="intro" class="intro">現在のレベルで受けられる依頼が掲示されています。</p>

  <section class="board">
    <div id="listView" class="list-view">
      <div class="board-title"><strong id="boardTitle">依頼一覧</strong><span id="levelText">Lv.1</span></div>
      <div id="questList" class="quest-list"></div>
    </div>

    <div id="detailView" class="detail">
      <div class="detail-head"><h2 id="detailTitle"></h2><span id="detailLevel" class="badge"></span></div>
      <div class="detail-grid">
        <div class="key">報酬</div><div id="detailReward" class="value"></div>
        <div class="key">依頼元</div><div id="detailGiver" class="value"></div>
        <div class="key">詳しくは</div><div id="detailContact" class="value"></div>
      </div>
      <p id="detailDescription" class="detail-copy"></p>
      <div class="objective"><span>最初の目的</span><strong id="detailObjective"></strong></div>
      <div id="acceptedBox" class="accepted" hidden>この依頼は受注済みです。メイン画面の QUEST から進行状況を確認できます。</div>
      <div class="actions">
        <button id="acceptButton" type="button">この依頼を受ける</button>
        <button id="backListButton" class="secondary" type="button">一覧へ戻る</button>
      </div>
    </div>
  </section>
  <p id="status" class="status" aria-live="polite"></p>
</main>

<script src="data/dd-quests.js?v=20260825-1"></script>
<script src="js/dd-quest.js?v=20260825-2"></script>
</body>
</html>
