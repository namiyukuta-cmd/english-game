<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>Magic School</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fffaf8;color:#4e3e37}
    body{padding:10px}
    button{font:inherit;touch-action:manipulation}
    .school-shell{height:100%;max-width:760px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px}
    .school-head{display:flex;align-items:center;justify-content:space-between;border:2px solid #8b685b;border-radius:16px;background:#fff;padding:12px 14px}
    .school-head h1{margin:0;font-size:27px}
    .school-head span{font-size:14px;font-weight:900;color:#876d63}
    .school-main{min-height:0;border:2px solid #8b685b;border-radius:20px;background:#fff;padding:16px;display:flex;flex-direction:column;overflow:hidden}
    .place-label{font-size:13px;font-weight:900;color:#94766b;margin-bottom:10px}
    .places{display:grid;gap:10px}
    .place-button{width:100%;min-height:64px;border:2px solid #7d5e53;border-radius:15px;background:#efc4d0;color:#4d3b34;font-size:21px;font-weight:900;text-align:left;padding:12px 16px}
    .place-button small{display:block;font-size:14px;margin-top:4px}
    .school-view{display:none;height:100%;min-height:0;grid-template-rows:auto minmax(0,1fr) auto;gap:10px}
    .school-view.active{display:grid}
    .school-menu.hidden{display:none}
    .view-title{margin:0;font-size:28px}
    .dialogue-area{min-height:0;overflow-y:auto;padding:4px 0}
    .study-strip{border:3px solid #b34066;background:#fff1f5;border-radius:16px;padding:10px 12px;margin-bottom:10px}
    .study-title{font-size:12px;font-weight:1000;color:#8f2449;letter-spacing:.08em;margin-bottom:6px}
    .study-word{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
    .study-word b{font-size:28px;color:#8d163e}
    .study-word span{font-size:16px;font-weight:900}
    .dialogue-card{border:2px solid #d8bfb4;border-radius:16px;background:#fff;padding:14px 15px}
    .speaker{display:inline-block;font-size:12px;font-weight:1000;background:#eadfd9;border-radius:999px;padding:3px 9px;margin-bottom:8px}
    .english{font-size:26px;line-height:1.45;font-weight:900}
    .japanese{font-size:17px;line-height:1.6;margin:8px 0 0;color:#66514a}
    .learn-word{background:#ffe06f;color:#561c2f;border-radius:6px;padding:0 4px;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px}
    .quest-card{border:3px solid #9a6c7a;border-radius:16px;background:#fff8fa;padding:14px;margin-top:10px}
    .quest-card small{display:block;font-size:12px;font-weight:1000;color:#8f2449;margin-bottom:5px}
    .quest-card strong{display:block;font-size:24px;line-height:1.35}
    .quest-card p{font-size:16px;line-height:1.6;margin:7px 0 0}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .actions.one{grid-template-columns:1fr}
    .actions button{min-height:52px;border:2px solid #7d5e53;border-radius:13px;background:#fff;color:#4d3b34;font-size:17px;font-weight:900;padding:9px}
    .actions button.primary{background:#efc4d0}
    @media(max-width:480px){body{padding:7px}.school-head{padding:9px 11px}.school-head h1{font-size:23px}.school-main{padding:12px}.view-title{font-size:24px}.english{font-size:23px}.study-word b{font-size:25px}}
  </style>
</head>
<body>
  <main class="school-shell">
    <header class="school-head">
      <h1>Magic School</h1>
      <span>WORK</span>
    </header>

    <section class="school-main">
      <div id="schoolMenu" class="school-menu">
        <div class="place-label">PLACE / 行き先</div>
        <div class="places">
          <button id="classroomBtn" class="place-button" type="button">
            Magic Classroom
            <small>魔法教室</small>
          </button>
        </div>
      </div>

      <div id="classroomView" class="school-view">
        <h2 class="view-title">Magic Classroom</h2>
        <div id="classroomContent" class="dialogue-area" aria-live="polite"></div>
        <div id="classroomActions" class="actions"></div>
      </div>
    </section>
  </main>

  <script src="js/magic-state.js?v=20260903-2"></script>
  <script src="js/magic-school.js?v=20260903-1"></script>
</body>
</html>
