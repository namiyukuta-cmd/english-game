<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>英検5級 英単語タイピング</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#fff}
    button,input{font:inherit}
    .app{width:min(620px,100%);height:100svh;margin:auto;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr auto;gap:10px}
    .top{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px}
    .back{width:42px;height:42px;border:1px solid #3a4d67;border-radius:12px;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:22px}
    .title{text-align:center;font-weight:900;font-size:16px}.count{font-size:14px;color:#c9d5e5;white-space:nowrap}
    .field{position:relative;min-height:0;overflow:hidden;border:1px solid #2c405a;border-radius:20px;background:linear-gradient(#13243a,#09121f)}
    .field:before{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:42px 42px;pointer-events:none}
    .word{position:absolute;left:50%;top:8%;transform:translate(-50%,-50%) scale(.45);font-size:clamp(28px,9vw,50px);font-weight:950;letter-spacing:.02em;text-shadow:0 4px 14px #000;background:#132942;border:2px solid #75dcff;border-radius:18px;padding:10px 18px;white-space:nowrap;opacity:.9;will-change:top,transform}
    .word.fly{animation:flyIn 2.4s linear forwards}
    .word.hit{top:76%;transform:translate(-50%,-50%) scale(1);background:#4c2430;border-color:#ff9aac;animation:hit .25s ease}
    .impact{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:68%;height:8px;border-radius:999px;background:#1b2c42;box-shadow:0 0 28px #7ee7ff44}
    .impact:before{content:"YOU";position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:12px;color:#8094ac;font-weight:900}
    .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.on{animation:flash .18s ease}
    .quiz{display:none;padding:12px;border:1px solid #334964;border-radius:18px;background:#111e30}.quiz.show{display:block}
    .label{font-size:12px;color:#9db0c7;font-weight:800;margin-bottom:4px}.jp{font-size:28px;font-weight:950;margin:0 0 10px;color:#ffd75a}
    form{display:grid;grid-template-columns:1fr auto;gap:8px}
    input{min-width:0;height:52px;border:2px solid #47627f;border-radius:13px;background:#08111e;color:#fff;padding:0 13px;font-size:21px;font-weight:800;outline:none}
    input:focus{border-color:#77dcff}
    button{height:52px;border:0;border-radius:13px;background:#ffd54f;color:#172033;font-weight:900;padding:0 18px}
    .msg{min-height:25px;margin-top:8px;font-size:14px;font-weight:800}.msg.good{color:#78eca5}.msg.bad{color:#ff8c8c}
    .start-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#aabbd0;font-size:16px;line-height:1.7;padding:30px}
    .result{position:absolute;inset:0;background:#07111ff2;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.result.show{display:flex}
    .card{width:min(360px,100%);padding:24px 18px;border:1px solid #3b506b;border-radius:22px;background:#15243a;text-align:center}.card h2{margin:0 0 8px}.card p{color:#c0ccdc;line-height:1.7}.card a,.card button{width:100%;min-height:52px;margin-top:8px;text-decoration:none;display:flex;align-items:center;justify-content:center;border-radius:13px;font-weight:900}.again{background:#ffd54f;color:#172033}.to-top{border:1px solid #40536d;color:#fff;background:#111d2d}
    @keyframes flyIn{0%{top:7%;transform:translate(-50%,-50%) scale(.42);opacity:.65}70%{opacity:1}100%{top:76%;transform:translate(-50%,-50%) scale(1.15);opacity:1}}
    @keyframes hit{0%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(1)}}
    @keyframes flash{0%{opacity:.7}100%{opacity:0}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <a class="back" href="シューティングtop.html" aria-label="戻る">←</a>
      <div class="title">英単語タイピング</div>
      <div class="count"><span id="now">1</span> / 10</div>
    </header>

    <section class="field" id="field">
      <div class="start-msg" id="startMsg">英単語が飛んできます。<br>よく見て覚えてください。</div>
      <div class="word" id="word" hidden></div>
      <div class="impact"></div>
      <div class="flash" id="flash"></div>

      <div class="result" id="result">
        <div class="card">
          <h2>終了</h2>
          <p>10問終わりました。</p>
          <button class="again" id="again">もう一度</button>
          <a class="to-top" href="シューティングtop.html">TOPへ戻る</a>
        </div>
      </div>
    </section>

    <section class="quiz" id="quiz">
      <div class="label">さっき飛んできた英単語を入力してください</div>
      <p class="jp" id="jp"></p>
      <form id="form" autocomplete="off">
        <input id="answer" type="text" inputmode="text" autocapitalize="none" autocomplete="off" spellcheck="false" aria-label="英単語を入力">
        <button type="submit">決定</button>
      </form>
      <div class="msg" id="msg"></div>
    </section>
  </main>

  <script>
    const SAVE_KEY='eiken5TypingSave';
    const WORDS=[
      ["dog","犬"],["cat","猫"],["bird","鳥"],["fish","魚"],["book","本"],["pen","ペン"],["pencil","鉛筆"],["school","学校"],["teacher","先生"],["student","生徒"],
      ["father","父"],["mother","母"],["brother","兄・弟"],["sister","姉・妹"],["friend","友達"],["house","家"],["room","部屋"],["door","ドア"],["window","窓"],["table","テーブル"],
      ["apple","リンゴ"],["banana","バナナ"],["water","水"],["milk","牛乳"],["rice","ご飯"],["bread","パン"],["egg","卵"],["park","公園"],["station","駅"],["train","電車"],
      ["car","車"],["bus","バス"],["sun","太陽"],["moon","月"],["star","星"],["rain","雨"],["snow","雪"],["red","赤"],["blue","青"],["green","緑"],
      ["go","行く"],["come","来る"],["run","走る"],["walk","歩く"],["eat","食べる"],["drink","飲む"],["read","読む"],["write","書く"],["play","遊ぶ"],["study","勉強する"],
      ["good","良い"],["big","大きい"],["small","小さい"],["new","新しい"],["old","古い"],["happy","幸せな"],["today","今日"],["tomorrow","明日"],["morning","朝"],["night","夜"]
    ];

    const wordEl=document.getElementById('word');
    const startMsg=document.getElementById('startMsg');
    const quiz=document.getElementById('quiz');
    const jp=document.getElementById('jp');
    const form=document.getElementById('form');
    const answer=document.getElementById('answer');
    const msg=document.getElementById('msg');
    const now=document.getElementById('now');
    const flash=document.getElementById('flash');
    const result=document.getElementById('result');
    const again=document.getElementById('again');

    let questions=[];
    let index=0;
    let current=null;
    let locked=false;

    function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}

    function saveGame(){
      localStorage.setItem(SAVE_KEY,JSON.stringify({questions,index}));
    }

    function startGame(){
      questions=shuffle(WORDS).slice(0,10);
      index=0;
      result.classList.remove('show');
      saveGame();
      nextWord();
    }

    function continueGame(){
      try{
        const save=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
        if(save && Array.isArray(save.questions) && save.questions.length===10 && save.index>=0 && save.index<save.questions.length){
          questions=save.questions;
          index=save.index;
          result.classList.remove('show');
          nextWord();
          return;
        }
      }catch(e){}
      startGame();
    }

    function nextWord(){
      if(index>=questions.length){
        localStorage.removeItem(SAVE_KEY);
        result.classList.add('show');
        return;
      }
      locked=true;
      current=questions[index];
      now.textContent=index+1;
      quiz.classList.remove('show');
      answer.value='';
      msg.textContent='';
      msg.className='msg';
      startMsg.style.display='none';
      wordEl.hidden=false;
      wordEl.textContent=current[0];
      wordEl.className='word';
      void wordEl.offsetWidth;
      wordEl.classList.add('fly');
      saveGame();
    }

    wordEl.addEventListener('animationend',e=>{
      if(e.animationName!=='flyIn')return;
      wordEl.className='word hit';
      wordEl.textContent=current[1];
      flash.classList.remove('on');
      void flash.offsetWidth;
      flash.classList.add('on');
      jp.textContent=current[1];
      quiz.classList.add('show');
      locked=false;
      setTimeout(()=>answer.focus(),120);
    });

    form.addEventListener('submit',e=>{
      e.preventDefault();
      if(locked)return;
      const typed=answer.value.trim().toLowerCase();
      const correct=current[0].toLowerCase();
      if(typed===correct){
        locked=true;
        msg.textContent='正解：'+current[0]+' ＝ '+current[1];
        msg.className='msg good';
        index++;
        if(index<questions.length)saveGame();else localStorage.removeItem(SAVE_KEY);
        setTimeout(nextWord,650);
      }else{
        msg.textContent='ちがいます。もう一度入力してください。';
        msg.className='msg bad';
        answer.select();
      }
    });

    again.addEventListener('click',()=>{
      localStorage.removeItem(SAVE_KEY);
      startGame();
    });

    const params=new URLSearchParams(location.search);
    if(params.has('continue')){
      setTimeout(continueGame,500);
    }else{
      localStorage.removeItem(SAVE_KEY);
      setTimeout(startGame,500);
    }
  </script>
</body>
</html>
