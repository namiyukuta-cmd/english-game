<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>英検5級 英単語シューティング</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#fff}
    .app{width:min(620px,100%);height:100svh;margin:auto;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr;gap:10px}
    .top{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px}
    .back{width:42px;height:42px;border:1px solid #3a4d67;border-radius:12px;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
    .title{text-align:center;font-weight:900;font-size:16px}.title small{display:block;margin-top:2px;color:#8fa5c0;font-size:10px}.count{font-size:14px;color:#c9d5e5;white-space:nowrap}
    .field{position:relative;min-height:0;overflow:hidden;border:1px solid #2c405a;border-radius:20px;background:linear-gradient(#13243a,#09121f)}
    .field:before{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:42px 42px;pointer-events:none}
    .word{position:absolute;left:50%;top:8%;transform:translate(-50%,-50%);font-size:clamp(28px,9vw,50px);font-weight:950;letter-spacing:.02em;text-shadow:0 4px 14px #000;background:#132942;border:2px solid #75dcff;border-radius:18px;padding:10px 18px;white-space:nowrap;opacity:.9;will-change:top,transform}
    .word.fly{animation-name:flyIn;animation-timing-function:linear;animation-fill-mode:forwards}
    .word.hit{top:56%;transform:translate(-50%,-50%);background:#4c2430;border-color:#ff9aac}
    .impact{position:absolute;left:50%;bottom:30%;transform:translateX(-50%);width:68%;height:8px;border-radius:999px;background:#1b2c42;box-shadow:0 0 28px #7ee7ff44}
    .impact:before{content:"YOU";position:absolute;left:50%;top:-34px;transform:translateX(-50%);font-size:12px;color:#8094ac;font-weight:900}
    .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.on{animation:flash .18s ease}
    .start-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#aabbd0;font-size:16px;line-height:1.7;padding:30px}
    .error{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:30px;color:#c9d5e5;line-height:1.7}.error.show{display:flex}
    @keyframes flyIn{0%{top:7%;transform:translate(-50%,-50%);opacity:.65}70%{opacity:1}100%{top:56%;transform:translate(-50%,-50%);opacity:1}}
    @keyframes flash{0%{opacity:.7}100%{opacity:0}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <a class="back" href="シューティングtop.html" aria-label="戻る">←</a>
      <div class="title">英単語シューティング<small id="difficultyLabel">普通</small></div>
      <div class="count"><span id="now">1</span> / 10</div>
    </header>

    <section class="field">
      <div class="start-msg" id="startMsg">英単語が飛んできます。<br>よく見て覚えてください。</div>
      <div class="word" id="word" hidden></div>
      <div class="impact"></div>
      <div class="flash" id="flash"></div>
      <div class="error" id="error">問題データがありません。<br>「初めから」で開始してください。</div>
    </section>
  </main>

  <script>
    const SAVE_KEY='eiken5TypingSave';
    const DIFFICULTY_KEY='eiken5TypingDifficulty';
    const DIFFICULTY={
      easy:{label:'簡単',flight:3.2},
      normal:{label:'普通',flight:2.4},
      hard:{label:'難しい',flight:1.55}
    };
    const WORDS=[
      ["dog","犬"],["cat","猫"],["bird","鳥"],["fish","魚"],["book","本"],["pen","ペン"],["pencil","鉛筆"],["school","学校"],["teacher","先生"],["student","生徒"],
      ["father","父"],["mother","母"],["brother","兄・弟"],["sister","姉・妹"],["friend","友達"],["house","家"],["room","部屋"],["door","ドア"],["window","窓"],["table","テーブル"],
      ["apple","リンゴ"],["banana","バナナ"],["water","水"],["milk","牛乳"],["rice","ご飯"],["bread","パン"],["egg","卵"],["park","公園"],["station","駅"],["train","電車"],
      ["car","車"],["bus","バス"],["sun","太陽"],["moon","月"],["star","星"],["rain","雨"],["snow","雪"],["red","赤"],["blue","青"],["green","緑"],
      ["go","行く"],["come","来る"],["run","走る"],["walk","歩く"],["eat","食べる"],["drink","飲む"],["read","読む"],["write","書く"],["play","遊ぶ"],["study","勉強する"],
      ["good","良い"],["big","大きい"],["small","小さい"],["new","新しい"],["old","古い"],["happy","幸せな"],["today","今日"],["tomorrow","明日"],["morning","朝"],["night","夜"]
    ];

    const wordEl=document.getElementById('word');
    const startMsg=document.getElementById('startMsg');
    const flash=document.getElementById('flash');
    const now=document.getElementById('now');
    const error=document.getElementById('error');
    const difficultyLabel=document.getElementById('difficultyLabel');

    let save=null;
    let current=null;

    function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}

    function getDifficultyFromUrl(){
      const params=new URLSearchParams(location.search);
      const value=params.get('difficulty')||localStorage.getItem(DIFFICULTY_KEY)||'normal';
      return DIFFICULTY[value]?value:'normal';
    }

    function applyDifficulty(){
      const key=(save&&DIFFICULTY[save.difficulty])?save.difficulty:'normal';
      difficultyLabel.textContent=DIFFICULTY[key].label;
      wordEl.style.animationDuration=DIFFICULTY[key].flight+'s';
    }

    function createNewGame(){
      const difficulty=getDifficultyFromUrl();
      localStorage.setItem(DIFFICULTY_KEY,difficulty);
      save={questions:shuffle(WORDS).slice(0,10),index:0,difficulty};
      localStorage.setItem(SAVE_KEY,JSON.stringify(save));
      applyDifficulty();
      playCurrent();
    }

    function continueGame(){
      try{save=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){save=null}
      if(!save || !Array.isArray(save.questions) || save.index<0 || save.index>=save.questions.length){
        showError();
        return;
      }
      if(!DIFFICULTY[save.difficulty])save.difficulty='normal';
      applyDifficulty();
      playCurrent();
    }

    function showError(){
      startMsg.style.display='none';
      wordEl.hidden=true;
      error.classList.add('show');
    }

    function playCurrent(){
      current=save.questions[save.index];
      now.textContent=save.index+1;
      startMsg.style.display='none';
      wordEl.hidden=false;
      wordEl.textContent=current[0];
      wordEl.className='word';
      void wordEl.offsetWidth;
      wordEl.classList.add('fly');
    }

    wordEl.addEventListener('animationend',e=>{
      if(e.animationName!=='flyIn')return;
      wordEl.className='word hit';
      wordEl.textContent=current[1];
      flash.classList.remove('on');
      void flash.offsetWidth;
      flash.classList.add('on');
      setTimeout(()=>{location.href='文字タップ.html'},350);
    });

    const params=new URLSearchParams(location.search);
    if(params.has('continue')){
      setTimeout(continueGame,450);
    }else{
      localStorage.removeItem(SAVE_KEY);
      setTimeout(createNewGame,450);
    }
  </script>
</body>
</html>
