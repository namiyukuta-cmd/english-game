<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7fb">
  <title>掃除婦は朝寝る｜ヒント</title>
  <link rel="stylesheet" href="css/style.css?v=20260823-2217">
  <link rel="stylesheet" href="css/mystery.css?v=20260823-2217">
</head>
<body>
  <main class="mystery-app">
    <header class="mystery-titlebar"><a class="mystery-back" href="mystery-deduction.html">←</a><h1>掃除婦は朝寝る</h1><span></span></header>
    <p class="chapter-label" id="chapterLabel">HINT / ヒントを伝える</p>
    <section class="reading-stage">
      <div class="reading-page" id="pageBody"></div>
      <div class="page-footer">
        <div class="page-count" id="pageCount"></div>
        <button class="mystery-action reading-next" id="nextBtn" type="button">Next / 次へ</button>
      </div>
    </section>
  </main>
  <script src="data/mystery_cases.js?v=20260823-2111"></script>
  <script src="js/mystery-common.js?v=20260823-2155"></script>
  <script>
    const params=new URLSearchParams(location.search);
    if(params.get('phase')==='questioning') location.replace('mystery-questioning.html');
    if(!MysteryGame.loadState()) MysteryGame.startNew();
    const c=MysteryGame.currentCase();
    const state=MysteryGame.loadState()||{};
    let page=Math.min(Number(state.hintPage||0),2);
    const body=document.getElementById('pageBody');
    const next=document.getElementById('nextBtn');
    document.getElementById('chapterLabel').textContent=`UNIT ${c.unit} / HINT / ヒントを伝える`;

    function studyHtml(){
      return c.hint.study.map(x=>`<div class="short-line"><div class="speaker">主人公</div><div class="en">${MysteryGame.escapeHtml(x.en)}</div><div class="ja">${MysteryGame.escapeHtml(x.ja)}</div>${x.grammar?`<button class="grammar-toggle" type="button">文法を見る</button><div class="grammar-card"><div class="grammar-title">${MysteryGame.escapeHtml(x.grammar)}</div><div class="grammar-text">${MysteryGame.escapeHtml(x.explain||'')}</div></div>`:''}</div>`).join('');
    }
    function render(){
      if(page===0){
        body.innerHTML=`<div class="speaker">刑事</div><div class="en">${MysteryGame.escapeHtml(c.hint.detective.en)}</div><div class="ja">${MysteryGame.escapeHtml(c.hint.detective.ja)}</div>`;
      }else if(page===1){
        body.innerHTML=studyHtml();
        MysteryGame.bindGrammar(body);
      }else{
        body.innerHTML=`<div class="speaker">SCENE / 状況</div><div class="en">${MysteryGame.escapeHtml(c.hint.storyEn)}</div><div class="ja">${MysteryGame.escapeHtml(c.hint.storyJa)}</div>`;
      }
      document.getElementById('pageCount').textContent=`${page+1} / 3`;
      next.textContent=page<2?'Next / 次へ':'A few days later... / 数日後';
    }
    next.addEventListener('click',()=>{
      if(page<2){page++;MysteryGame.setStage('hint',{hintPage:page});render();}
      else{MysteryGame.setStage('later',{laterPage:0});location.href='mystery-later.html';}
    });
    render();
  </script>
</body>
</html>
