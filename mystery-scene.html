<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7fb">
  <title>掃除婦は朝寝る｜ヒント</title>
  <link rel="stylesheet" href="css/style.css?v=20260823-2230">
  <link rel="stylesheet" href="css/mystery.css?v=20260823-2230">
</head>
<body>
  <main class="mystery-app">
    <header class="mystery-titlebar"><a class="mystery-back" href="mystery-deduction.html">←</a><h1>掃除婦は朝寝る</h1><span></span></header>
    <p class="chapter-label" id="chapterLabel">HINT / ヒントを伝える</p>
    <section class="reading-stage">
      <div class="reading-page" id="pageBody"></div>
      <div class="page-footer">
        <div class="page-count" id="pageCount"></div>
        <button class="mystery-action reading-next" id="nextBtn" type="button">Next / 次へ</button>
      </div>
    </section>
  </main>
  <script src="data/mystery_cases.js?v=20260823-2111"></script>
  <script src="js/mystery-common.js?v=20260823-2155"></script>
  <script>
    const params=new URLSearchParams(location.search);
    if(params.get('phase')==='questioning') location.replace('mystery-questioning.html');
    if(!MysteryGame.loadState()) MysteryGame.startNew();
    const c=MysteryGame.currentCase();
    const state=MysteryGame.loadState()||{};
    const body=document.getElementById('pageBody');
    const next=document.getElementById('nextBtn');
    document.getElementById('chapterLabel').textContent=`UNIT ${c.unit} / HINT / ヒントを伝える`;

    function splitSentences(text,ja){
      const re=ja?/[^。！？]+[。！？]?/g:/[^.!?]+[.!?]?/g;
      return (String(text||'').match(re)||[String(text||'')]).map(x=>x.trim()).filter(Boolean);
    }
    function pairedPages(en,ja,speaker,extra){
      const e=splitSentences(en,false),j=splitSentences(ja,true);
      return Array.from({length:Math.max(e.length,j.length)},(_,i)=>Object.assign({speaker,en:e[i]||'',ja:j[i]||''},extra||{}));
    }

    const pages=[];
    pages.push(...pairedPages(c.hint.detective.en,c.hint.detective.ja,'刑事'));
    (c.hint.study||[]).forEach(x=>{
      const ps=pairedPages(x.en,x.ja,'主人公',{grammar:x.grammar||'',explain:x.explain||''});
      pages.push(...ps);
    });
    pages.push(...pairedPages(c.hint.storyEn,c.hint.storyJa,'SCENE / 状況'));

    let page=Math.min(Number(state.hintPage||0),Math.max(0,pages.length-1));

    function render(){
      const p=pages[page]||{speaker:'',en:'',ja:''};
      const grammar=p.grammar?`<button class="grammar-toggle" type="button">文法を見る</button><div class="grammar-card"><div class="grammar-title">${MysteryGame.escapeHtml(p.grammar)}</div><div class="grammar-text">${MysteryGame.escapeHtml(p.explain||'')}</div></div>`:'';
      body.innerHTML=`<div class="speaker">${MysteryGame.escapeHtml(p.speaker)}</div><div class="en">${MysteryGame.escapeHtml(p.en)}</div><div class="ja">${MysteryGame.escapeHtml(p.ja)}</div>${grammar}`;
      MysteryGame.bindGrammar(body);
      document.getElementById('pageCount').textContent=`${page+1} / ${pages.length}`;
      next.textContent=page<pages.length-1?'Next / 次へ':'A few days later... / 数日後';
    }
    next.addEventListener('click',()=>{
      if(page<pages.length-1){page++;MysteryGame.setStage('hint',{hintPage:page});render();}
      else{MysteryGame.setStage('later',{laterPage:0});location.href='mystery-later.html';}
    });
    render();
  </script>
</body>
</html>
