<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7fb">
  <title>掃除婦は朝寝る｜ヒント</title>
  <link rel="stylesheet" href="css/style.css?v=20260823-2155">
  <link rel="stylesheet" href="css/mystery.css?v=20260823-2155">
</head>
<body>
  <main class="mystery-app">
    <header class="mystery-titlebar"><a class="mystery-back" href="mystery-deduction.html">←</a><h1>掃除婦は朝寝る</h1><span></span></header>
    <p class="chapter-label" id="chapterLabel">HINT / ヒントを伝える</p>
    <div id="content"></div>
    <button class="mystery-action" id="nextBtn" type="button">A few days later... / 数日後</button>
  </main>
  <script src="data/mystery_cases.js?v=20260823-2111"></script>
  <script src="js/mystery-common.js?v=20260823-2155"></script>
  <script>
    const params=new URLSearchParams(location.search);
    if(params.get('phase')==='questioning') location.replace('mystery-questioning.html');
    if(!MysteryGame.loadState()) MysteryGame.startNew();
    const c=MysteryGame.currentCase();
    document.getElementById('chapterLabel').textContent=`UNIT ${c.unit} / HINT / ヒントを伝える`;
    let html=MysteryGame.sentenceCard(c.hint.detective,'刑事');
    html+=c.hint.study.map(x=>MysteryGame.sentenceCard(x,'主人公')).join('');
    html+=MysteryGame.storyCard(c.hint.storyEn,c.hint.storyJa);
    document.getElementById('content').innerHTML=html;
    MysteryGame.bindGrammar();
    document.getElementById('nextBtn').addEventListener('click',()=>{
      MysteryGame.setStage('later');
      location.href='mystery-later.html';
    });
  </script>
</body>
</html>
