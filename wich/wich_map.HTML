<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#111318" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Wich - Night Patrol Map</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111318;
      color: #eee9df;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body { min-height: 100dvh; }

    .app {
      width: 100%;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .app.impact {
      animation: screenImpact .42s ease-in-out 2;
    }

    header {
      min-height: 52px;
      padding: env(safe-area-inset-top) 12px 0;
      border-bottom: 1px solid #343840;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #171a20;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    header button {
      border: 1px solid #555b66;
      border-radius: 7px;
      background: #20242c;
      color: #eee9df;
      min-height: 36px;
      padding: 0 12px;
      font-size: 14px;
    }

    main {
      min-height: 0;
      padding: 8px;
    }

    .map {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) 74px;
      gap: 8px;
      overflow: hidden;
    }

    .explore-window {
      min-height: 0;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      scrollbar-width: none;
      border: 1px solid #343840;
      border-radius: 10px;
      background: #171a20;
    }

    .explore-window::-webkit-scrollbar { display: none; }

    .explore-grid {
      width: 100%;
      padding: 28px 6px 10px;
      display: grid;
      gap: 24px;
    }

    .explore-row {
      min-height: 132px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: center;
      gap: 5px;
      scroll-margin-top: 10px;
    }

    .card {
      min-width: 0;
      aspect-ratio: 2 / 3;
      perspective: 700px;
      position: relative;
    }

    .card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform .58s cubic-bezier(.2,.72,.2,1);
    }

    .card.open .card-inner { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border: 1px solid #555b66;
      border-radius: 8px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    .card-back {
      background:
        linear-gradient(135deg, transparent 46%, #3a404b 47%, #3a404b 53%, transparent 54%),
        linear-gradient(45deg, transparent 46%, #3a404b 47%, #3a404b 53%, transparent 54%),
        #20242c;
      background-size: 16px 16px;
    }

    .card-front {
      transform: rotateY(180deg);
      background: #253126;
      border-color: #52624f;
      color: #dbe2d3;
      font-size: clamp(12px, 3.4vw, 16px);
      font-weight: 700;
      letter-spacing: .08em;
    }

    .battle .card-front {
      background:
        radial-gradient(circle at center, rgba(137, 47, 54, .42), transparent 48%),
        linear-gradient(145deg, #4b1d22, #241014 72%);
      border-color: #a25d63;
      color: #ffe8e9;
      text-shadow: 0 2px 10px rgba(255, 80, 90, .45);
    }

    .card.shake {
      animation: shake .52s ease-in-out 3;
      z-index: 5;
    }

    .card.battle-pop .card-inner {
      transform: rotateY(180deg) translateY(-12px) scale(1.2);
      filter: drop-shadow(0 14px 20px rgba(0,0,0,.55));
    }

    .card.battle-launch {
      position: fixed;
      z-index: 100;
      margin: 0;
      aspect-ratio: auto;
      transition:
        left .72s cubic-bezier(.12,.82,.18,1),
        top .72s cubic-bezier(.12,.82,.18,1),
        width .72s cubic-bezier(.12,.82,.18,1),
        height .72s cubic-bezier(.12,.82,.18,1),
        transform .72s cubic-bezier(.12,.82,.18,1),
        filter .72s ease;
      filter: drop-shadow(0 0 18px rgba(255, 72, 86, .5));
    }

    .card.battle-launch.fullscreen {
      left: -3vw !important;
      top: -3dvh !important;
      width: 106vw !important;
      height: 106dvh !important;
      transform: rotate(360deg) scale(1.02);
      filter: drop-shadow(0 0 42px rgba(255, 72, 86, .75));
    }

    .card.battle-launch .card-front {
      transition: font-size .72s ease, letter-spacing .72s ease, border-radius .72s ease;
    }

    .card.battle-launch.fullscreen .card-front {
      font-size: clamp(54px, 17vw, 112px);
      letter-spacing: .16em;
      border-radius: 0;
    }

    .battle-flash {
      position: fixed;
      inset: 0;
      z-index: 90;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(circle at center, rgba(255, 90, 100, .34), transparent 52%),
        rgba(85, 0, 8, .2);
    }

    .battle-flash.active {
      animation: battleFlash .16s steps(2, end) 5;
    }

    .battle-lines {
      position: fixed;
      inset: -20%;
      z-index: 95;
      pointer-events: none;
      opacity: 0;
      background: repeating-conic-gradient(
        from 0deg at 50% 50%,
        rgba(255,255,255,.22) 0deg 1deg,
        transparent 1deg 11deg
      );
      transform: scale(.2) rotate(0deg);
    }

    .battle-lines.active {
      animation: burstLines .72s cubic-bezier(.1,.8,.2,1) forwards;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0) rotate(0); }
      20% { transform: translateX(-7px) rotate(-3deg); }
      40% { transform: translateX(7px) rotate(3deg); }
      60% { transform: translateX(-6px) rotate(-2deg); }
      80% { transform: translateX(6px) rotate(2deg); }
    }

    @keyframes screenImpact {
      0%,100% { transform: translate(0, 0); }
      25% { transform: translate(-5px, 3px); }
      50% { transform: translate(5px, -4px); }
      75% { transform: translate(-3px, -2px); }
    }

    @keyframes battleFlash {
      0%,100% { opacity: 0; }
      50% { opacity: 1; }
    }

    @keyframes burstLines {
      0% { opacity: 0; transform: scale(.18) rotate(0deg); }
      22% { opacity: .8; }
      100% { opacity: 0; transform: scale(1.25) rotate(18deg); }
    }

    .pawn-area {
      position: relative;
      min-height: 0;
      border: 1px solid #343840;
      border-radius: 10px;
      background: #171a20;
    }

    .pawn-home {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42px;
      height: 42px;
      transform: translate(-50%, -50%);
      border: 1px dashed #555b66;
      border-radius: 50%;
    }

    #pawn {
      position: fixed;
      z-index: 20;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid #8d826f;
      border-radius: 50%;
      background: #d8d0c0;
      color: #242018;
      font-size: 22px;
      line-height: 1;
      pointer-events: none;
      transition: left .62s cubic-bezier(.18,.8,.24,1), top .62s cubic-bezier(.18,.8,.24,1);
      transform: translate(-50%, -50%);
      box-shadow: 0 5px 12px rgba(0,0,0,.35);
    }

    #pawn.hop { animation: hop .62s ease; }

    @keyframes hop {
      0%,100% { margin-top: 0; }
      45% { margin-top: -18px; }
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <header>
      <h1>夜の見回り</h1>
      <button id="backToTop" type="button">戻る</button>
    </header>

    <main>
      <section class="map" aria-label="夜の見回りマップ">
        <div id="exploreWindow" class="explore-window" aria-label="探索カード置き場">
          <div class="explore-grid">
            <div class="explore-row" data-row="4">
              <div class="card forest"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
              <div class="card forest"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
              <div id="battleCard" class="card battle center"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">BATTLE</div></div></div>
              <div class="card forest"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
              <div class="card forest"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
            </div>

            <div class="explore-row" data-row="3">
              <div class="card forest"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
              <div class="card forest"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
              <div class="card forest center"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
              <div class="card forest"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
              <div class="card forest"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
            </div>

            <div class="explore-row" data-row="2">
              <div class="card forest"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
              <div class="card forest"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
              <div class="card forest center"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
              <div class="card forest"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
              <div class="card forest"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
            </div>

            <div class="explore-row" data-row="1">
              <div class="card forest"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
              <div class="card forest"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
              <div class="card forest center"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
              <div class="card forest"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
              <div class="card forest"><div class="card-inner"><div class="card-face card-back"></div><div class="card-face card-front">森</div></div></div>
            </div>
          </div>
        </div>

        <div class="pawn-area" aria-label="主人公ポーン置き場">
          <div id="pawnHome" class="pawn-home"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="battleFlash" class="battle-flash" aria-hidden="true"></div>
  <div id="battleLines" class="battle-lines" aria-hidden="true"></div>
  <div id="pawn" aria-hidden="true">♟</div>

  <script>
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const app = document.getElementById('app');
    const exploreWindow = document.getElementById('exploreWindow');
    const pawn = document.getElementById('pawn');
    const pawnHome = document.getElementById('pawnHome');
    const battleCard = document.getElementById('battleCard');
    const battleFlash = document.getElementById('battleFlash');
    const battleLines = document.getElementById('battleLines');
    const row1 = document.querySelector('[data-row="1"]');
    const row2 = document.querySelector('[data-row="2"]');
    const row3 = document.querySelector('[data-row="3"]');
    const row4 = document.querySelector('[data-row="4"]');
    let pawnTarget = pawnHome;

    document.getElementById('backToTop').addEventListener('click', () => {
      location.href = './wich_top.HTML';
    });

    function centerOf(element) {
      const r = element.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    function placePawn(element, hop = false) {
      pawnTarget = element;
      const p = centerOf(element);
      pawn.style.left = `${p.x}px`;
      pawn.style.top = `${p.y}px`;
      if (hop) {
        pawn.classList.remove('hop');
        void pawn.offsetWidth;
        pawn.classList.add('hop');
      }
    }

    async function scrollToRow(row, behavior = 'smooth') {
      const maxTop = exploreWindow.scrollHeight - exploreWindow.clientHeight;
      const wanted = row.offsetTop - Math.max(8, (exploreWindow.clientHeight - row.offsetHeight) / 2);
      exploreWindow.scrollTo({ top: Math.max(0, Math.min(maxTop, wanted)), behavior });
      await wait(700);
      if (pawnTarget !== pawnHome) placePawn(pawnTarget);
    }

    async function revealCards(cards) {
      cards.forEach((card, index) => {
        setTimeout(() => card.classList.add('open'), index * 90);
      });
      await wait(850);
    }

    async function launchBattleCard() {
      battleCard.classList.add('shake');
      await wait(1550);
      battleCard.classList.remove('shake');

      battleFlash.classList.add('active');
      app.classList.add('impact');
      battleCard.classList.add('open', 'battle-pop');
      await wait(620);
      battleCard.classList.remove('battle-pop');

      const rect = battleCard.getBoundingClientRect();
      battleCard.style.left = `${rect.left}px`;
      battleCard.style.top = `${rect.top}px`;
      battleCard.style.width = `${rect.width}px`;
      battleCard.style.height = `${rect.height}px`;
      document.body.appendChild(battleCard);
      battleCard.classList.add('battle-launch');

      await wait(40);
      battleLines.classList.add('active');
      battleCard.classList.add('fullscreen');
      await wait(780);

      battleFlash.classList.remove('active');
      app.classList.remove('impact');
      await wait(900);
    }

    async function runPatrol() {
      await wait(150);
      exploreWindow.scrollTop = exploreWindow.scrollHeight;
      placePawn(pawnHome);
      await wait(600);

      await scrollToRow(row1, 'auto');
      await revealCards([...row1.querySelectorAll('.card')]);
      placePawn(row1.querySelector('.center'), true);
      await wait(850);

      await scrollToRow(row2);
      await revealCards([...row2.querySelectorAll('.card')]);
      placePawn(row2.querySelector('.center'), true);
      await wait(850);

      await scrollToRow(row3);
      await revealCards([...row3.querySelectorAll('.card')]);
      placePawn(row3.querySelector('.center'), true);
      await wait(850);

      await scrollToRow(row4);
      placePawn(row3.querySelector('.center'));

      const lastCards = [...row4.querySelectorAll('.card')];
      await revealCards([lastCards[0], lastCards[1], lastCards[3], lastCards[4]]);
      await wait(700);

      await launchBattleCard();
    }

    exploreWindow.addEventListener('scroll', () => {
      if (pawnTarget !== pawnHome) placePawn(pawnTarget);
    }, { passive: true });

    window.addEventListener('resize', () => {
      if (!battleCard.classList.contains('battle-launch')) {
        placePawn(pawnTarget || pawnHome);
      }
    });

    runPatrol();
  </script>
</body>
</html>
