<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#111318" />
  <title>Wich - Night Patrol Map</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111318;
      color: #eee9df;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body { min-height: 100dvh; }

    .app {
      width: 100%;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      min-height: 52px;
      padding: env(safe-area-inset-top) 14px 0;
      border-bottom: 1px solid #343840;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #171a20;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    header button {
      border: 1px solid #555b66;
      border-radius: 7px;
      background: #20242c;
      color: #eee9df;
      min-height: 36px;
      padding: 0 12px;
      font-size: 14px;
    }

    main {
      min-height: 0;
      padding: 14px;
    }

    .map {
      width: 100%;
      height: 100%;
      border: 1px solid #343840;
      border-radius: 10px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      padding: 10px;
      background: #171a20;
      overflow: hidden;
    }

    .explore-grid {
      width: min(92%, 430px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-template-rows: repeat(2, auto);
      gap: 5px;
      align-self: start;
    }

    .explore-slot,
    .deck-slot {
      min-width: 0;
      aspect-ratio: 2 / 3;
      border: 1px dashed #555b66;
      border-radius: 7px;
      background: #20242c;
    }

    .lower-area {
      min-height: 0;
      position: relative;
      border-top: 1px solid #2d3138;
    }

    .deck-slot {
      position: absolute;
      right: 0;
      bottom: 0;
      width: clamp(58px, 15vw, 76px);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>夜の見回り</h1>
      <button id="backToTop" type="button">戻る</button>
    </header>

    <main>
      <section class="map" aria-label="夜の見回りマップ">
        <div class="explore-grid" aria-label="探索カード置き場">
          <div class="explore-slot" data-slot="1"></div>
          <div class="explore-slot" data-slot="2"></div>
          <div class="explore-slot" data-slot="3"></div>
          <div class="explore-slot" data-slot="4"></div>
          <div class="explore-slot" data-slot="5"></div>
          <div class="explore-slot" data-slot="6"></div>
          <div class="explore-slot" data-slot="7"></div>
          <div class="explore-slot" data-slot="8"></div>
          <div class="explore-slot" data-slot="9"></div>
          <div class="explore-slot" data-slot="10"></div>
        </div>

        <div class="lower-area" aria-label="カード操作エリア">
          <div class="deck-slot" aria-label="山札置き場"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    document.getElementById('backToTop').addEventListener('click', () => {
      location.href = './wich_top.HTML';
    });
  </script>
</body>
</html>
