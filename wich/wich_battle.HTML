<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#171014" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Wich - Battle</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171014;
      color: #f2e8e8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body { min-height: 100dvh; }

    .app {
      width: 100%;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      min-height: 52px;
      padding: env(safe-area-inset-top) 12px 0;
      border-bottom: 1px solid #563a40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #21161a;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    header button {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid #6c4d54;
      border-radius: 7px;
      background: #2d1f24;
      color: #f2e8e8;
      font-size: 14px;
    }

    main {
      min-height: 0;
      padding: 8px;
      display: grid;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .battle-section {
      min-height: 0;
      border: 1px solid #563a40;
      border-radius: 10px;
      overflow: hidden;
      background: #1e1418;
    }

    .enemy-area {
      padding: 8px;
      background: radial-gradient(circle at center, rgba(121,54,65,.16), transparent 54%), #1e1418;
    }

    .enemy-row {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .enemy-slot,
    .player-card,
    .dice-card,
    .hand-card {
      flex: 0 0 auto;
      aspect-ratio: 2 / 3;
      border: 1px solid #6c4d54;
      border-radius: 8px;
      background: #26191e;
      color: #d8bcc3;
      text-align: center;
    }

    .enemy-row.count-1 .enemy-slot { display: none; }
    .enemy-row.count-1 .enemy-slot:nth-child(2) { display: grid; width: min(30vw, 120px); }
    .enemy-row.count-2 .enemy-slot { display: grid; width: min(27vw, 108px); }
    .enemy-row.count-2 .enemy-slot:nth-child(2) { display: none; }
    .enemy-row.count-3 .enemy-slot { display: grid; width: min(25vw, 98px); }

    .enemy-slot,
    .player-card,
    .hand-card {
      position: relative;
      place-items: center;
      align-content: center;
      gap: 5px;
      padding: 7px;
    }

    .enemy-name,
    .card-name {
      font-size: 12px;
      font-weight: 800;
    }

    .hp,
    .base-value {
      font-size: 11px;
      color: #a98a92;
    }

    .enemy-hp-meter {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      height: 8px;
      overflow: hidden;
      border: 1px solid #6b4549;
      border-radius: 999px;
      background: #160e10;
      box-shadow: inset 0 1px 3px rgba(0,0,0,.75);
    }

    .enemy-hp-fill {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6f2027, #c24b4b 55%, #ef7a62);
      box-shadow: 0 0 8px rgba(231,83,62,.45);
      transition: width .08s linear;
    }

    .enemy-hp-meter.flash {
      animation: meterFlash .42s ease;
    }

    .enemy-slot.hit { animation: enemyHit .28s ease; }
    .enemy-slot.hp-flash { animation: hpFlash .5s ease; }

    .enemy-slot.burning {
      animation: enemyBurn .72s ease both;
      border-color: #ff9448;
      box-shadow: 0 0 18px rgba(255,97,32,.9), 0 0 42px rgba(255,45,0,.55), inset 0 0 24px rgba(255,84,0,.28);
    }

    .enemy-slot.burning::before,
    .enemy-slot.burning::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -8px;
      width: 72%;
      height: 82%;
      transform: translateX(-50%);
      pointer-events: none;
      border-radius: 50% 50% 35% 35%;
      filter: blur(4px);
      background:
        radial-gradient(ellipse at 50% 100%, rgba(255,255,180,.95) 0 18%, transparent 19%),
        radial-gradient(ellipse at 32% 72%, rgba(255,190,40,.95) 0 24%, transparent 25%),
        radial-gradient(ellipse at 68% 68%, rgba(255,95,15,.92) 0 27%, transparent 28%),
        radial-gradient(ellipse at 50% 42%, rgba(255,45,0,.75) 0 32%, transparent 33%);
      mix-blend-mode: screen;
      animation: flameRise .7s ease-out both;
    }

    .enemy-slot.burning::after {
      width: 52%;
      height: 66%;
      left: 42%;
      opacity: .8;
      animation-delay: .08s;
    }

    .damage-pop {
      position: absolute;
      left: 50%;
      top: 49%;
      z-index: 8;
      transform: translate(-50%, -50%);
      color: #ffddd2;
      font-size: 30px;
      font-weight: 950;
      text-shadow: 0 2px 4px #000, 0 0 14px rgba(255,45,0,.95);
      pointer-events: none;
      animation: damagePop .75s cubic-bezier(.13,.78,.2,1) both;
    }

    @keyframes enemyHit {
      0%,100% { transform: translateX(0); }
      35% { transform: translateX(-7px); }
      70% { transform: translateX(7px); }
    }

    @keyframes hpFlash {
      0%,100% { filter: brightness(1); }
      30% { filter: brightness(2.1); }
      60% { filter: brightness(1.35); }
    }

    @keyframes meterFlash {
      0%,100% { filter: brightness(1); }
      35% { filter: brightness(2.2); }
      65% { filter: brightness(1.45); }
    }

    @keyframes enemyBurn {
      0% { transform: scale(1); filter: brightness(1); }
      18% { transform: scale(1.08); filter: brightness(1.7); }
      42% { transform: translateX(-5px) rotate(-2deg) scale(1.03); }
      62% { transform: translateX(5px) rotate(2deg) scale(1.03); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    @keyframes flameRise {
      0% { opacity: 0; transform: translate(-50%,25%) scale(.45); }
      22% { opacity: 1; }
      70% { opacity: .95; }
      100% { opacity: 0; transform: translate(-50%,-42%) scale(1.22); }
    }

    @keyframes damagePop {
      0% { opacity: 0; transform: translate(-50%,-20%) scale(.45); }
      28% { opacity: 1; transform: translate(-50%,-50%) scale(1.22); }
      72% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%,-115%) scale(.9); }
    }

    .player-area {
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #21161a;
    }

    .player-card {
      display: grid;
      width: min(30vw, 120px);
      border-color: #725d66;
      background: #291d22;
    }

    .dice-zone {
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .dice-card {
      position: relative;
      width: min(22vw, 84px);
      border-color: #766d59;
      background: transparent;
      perspective: 700px;
    }

    .dice-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform .45s cubic-bezier(.2,.72,.2,1);
    }

    .dice-card.open .dice-inner { transform: rotateY(180deg); }

    .dice-face {
      position: absolute;
      inset: 0;
      border: 1px solid #766d59;
      border-radius: 8px;
      display: grid;
      place-items: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .dice-back {
      background: #29251d;
      color: #8f866e;
      font-size: 22px;
      font-weight: 900;
    }

    .dice-front {
      transform: rotateY(180deg);
      background: #342f24;
      color: #efe5c7;
      grid-template-rows: 1fr auto;
      padding: 8px 4px;
    }

    .dice-symbol {
      align-self: end;
      font-size: clamp(34px, 11vw, 50px);
      line-height: 1;
    }

    .dice-number {
      font-size: 12px;
      font-weight: 800;
    }

    .hand-area {
      padding: 8px 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: #21161a;
    }

    .hand-card {
      display: grid;
      width: calc((100% - 20px) / 5);
      max-width: 82px;
      border-color: #66515a;
      background: #291d22;
      transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease, opacity .22s ease, filter .22s ease;
    }

    .hand-card.active {
      transform: translateY(-10px) scale(1.04);
      border-color: #ff8a3d;
      box-shadow: 0 0 12px rgba(255,132,54,.95), 0 0 28px rgba(255,55,0,.55);
      animation: fireCardPulse .46s ease-in-out infinite alternate;
    }

    .hand-card.support-active {
      transform: translateY(-13px) scale(1.08);
      border-color: #ffc45a;
      box-shadow: 0 0 14px rgba(255,203,91,.95), 0 0 32px rgba(255,87,8,.7);
      filter: brightness(1.45);
      animation: supportPulse .34s ease-in-out 3 alternate;
    }

    .hand-card.used { opacity: .36; }

    @keyframes fireCardPulse {
      from { filter: brightness(1); }
      to { filter: brightness(1.55); }
    }

    @keyframes supportPulse {
      from { transform: translateY(-10px) scale(1.04); }
      to { transform: translateY(-15px) scale(1.12); }
    }

    .attack-focus {
      position: fixed;
      left: 50%;
      top: 49%;
      z-index: 42;
      width: 150px;
      height: 150px;
      transform: translate(-50%,-50%) scale(.35);
      opacity: 0;
      pointer-events: none;
      display: grid;
      place-items: center;
      transition: opacity .2s ease, transform .3s cubic-bezier(.18,.8,.22,1);
    }

    .attack-focus.show {
      opacity: 1;
      transform: translate(-50%,-50%) scale(1);
    }

    .focus-glow {
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      opacity: .88;
      filter: blur(8px);
      background: radial-gradient(circle, rgba(255,227,119,.55), rgba(255,91,18,.24) 48%, transparent 72%);
      animation: focusGlow .56s ease-in-out infinite alternate;
    }

    .focus-icon {
      position: relative;
      z-index: 2;
      font-size: 76px;
      line-height: 1;
      filter: drop-shadow(0 0 8px rgba(255,234,145,.95)) drop-shadow(0 0 22px rgba(255,73,7,.8));
      transition: filter .25s ease, transform .25s ease;
    }

    .focus-total {
      position: absolute;
      left: 50%;
      top: -7px;
      z-index: 5;
      transform: translateX(-50%);
      min-width: 48px;
      padding: 4px 9px;
      border-radius: 999px;
      color: #fff;
      background: rgba(34,18,18,.82);
      border: 1px solid rgba(255,122,64,.65);
      font-size: 17px;
      font-weight: 950;
      text-align: center;
      text-shadow: 0 2px 5px rgba(0,0,0,.85);
    }

    .focus-total.bump { animation: totalBump .35s ease; }

    .attack-focus.buffed .focus-icon {
      filter: drop-shadow(0 0 10px rgba(255,245,160,1)) drop-shadow(0 0 28px rgba(255,84,0,1));
      animation: buffedFire .34s ease-in-out infinite alternate;
    }

    .attack-focus.buffed::before,
    .attack-focus.buffed::after {
      content: "✦";
      position: absolute;
      z-index: 3;
      color: #ffc95c;
      font-size: 18px;
      text-shadow: 0 0 10px rgba(255,87,0,.95);
      animation: orbitSpark 1s linear infinite;
    }

    .attack-focus.buffed::after {
      animation-delay: -.5s;
      font-size: 13px;
    }

    @keyframes focusGlow {
      from { transform: scale(.88); opacity: .58; }
      to { transform: scale(1.16); opacity: 1; }
    }

    @keyframes totalBump {
      0%,100% { transform: translateX(-50%) scale(1); }
      45% { transform: translateX(-50%) scale(1.35); }
    }

    @keyframes buffedFire {
      from { transform: scale(1); }
      to { transform: scale(1.12); }
    }

    @keyframes orbitSpark {
      from { transform: rotate(0deg) translateX(52px) rotate(0deg); opacity: .55; }
      50% { opacity: 1; }
      to { transform: rotate(360deg) translateX(52px) rotate(-360deg); opacity: .55; }
    }

    .fx-layer {
      position: fixed;
      inset: 0;
      z-index: 45;
      overflow: hidden;
      pointer-events: none;
    }

    .fly-token {
      position: fixed;
      left: var(--sx);
      top: var(--sy);
      z-index: 55;
      transform: translate(-50%,-50%) scale(.55);
      opacity: 0;
      font-weight: 950;
      font-size: var(--font-size, 30px);
      color: var(--token-color, #fff);
      text-shadow: 0 2px 4px rgba(0,0,0,.9), 0 0 12px var(--token-glow, rgba(255,255,255,.65));
      animation: flyToken .58s cubic-bezier(.12,.78,.2,1) both;
    }

    @keyframes flyToken {
      0% { left: var(--sx); top: var(--sy); opacity: 0; transform: translate(-50%,-50%) scale(.45); }
      18% { opacity: 1; }
      78% { left: var(--tx); top: var(--ty); opacity: 1; transform: translate(-50%,-50%) scale(1.18); }
      100% { left: var(--tx); top: var(--ty); opacity: 0; transform: translate(-50%,-50%) scale(.72); }
    }

    .fire-flash {
      position: fixed;
      inset: 0;
      opacity: 0;
      background: radial-gradient(circle at 50% 38%, rgba(255,220,120,.34), transparent 26%), rgba(255,58,0,.16);
      animation: fireFlash .48s ease-out both;
    }

    .fire-stream {
      position: fixed;
      height: 34px;
      transform-origin: 0 50%;
      border-radius: 999px;
      opacity: 0;
      overflow: visible;
      background:
        radial-gradient(ellipse at 90% 50%, rgba(255,255,225,.98) 0 8%, rgba(255,217,72,.96) 9% 18%, transparent 19%),
        linear-gradient(90deg, rgba(255,210,70,.08), rgba(255,177,40,.95) 28%, rgba(255,72,7,.96) 68%, rgba(255,20,0,.18));
      box-shadow: 0 0 12px rgba(255,220,95,.95), 0 0 28px rgba(255,95,20,.92), 0 0 52px rgba(255,35,0,.62);
      animation: fireStream .62s cubic-bezier(.1,.76,.2,1) both;
    }

    .fire-stream::before,
    .fire-stream::after {
      content: "";
      position: absolute;
      left: 4%;
      right: 3%;
      top: 50%;
      height: 70px;
      transform: translateY(-50%);
      background:
        radial-gradient(ellipse at 15% 55%, rgba(255,226,100,.75) 0 7%, transparent 8%),
        radial-gradient(ellipse at 38% 38%, rgba(255,117,25,.72) 0 10%, transparent 11%),
        radial-gradient(ellipse at 61% 62%, rgba(255,56,8,.74) 0 11%, transparent 12%),
        radial-gradient(ellipse at 84% 35%, rgba(255,172,40,.76) 0 9%, transparent 10%);
      filter: blur(5px);
      animation: flameWave .23s ease-in-out infinite alternate;
    }

    .fire-stream::after {
      transform: translateY(-50%) scaleY(-1);
      opacity: .72;
      animation-delay: .08s;
    }

    .ember {
      position: fixed;
      width: var(--size);
      height: var(--size);
      margin-left: calc(var(--size) / -2);
      margin-top: calc(var(--size) / -2);
      border-radius: 50%;
      background: radial-gradient(circle, #fff7b0 0 18%, #ffb12f 20% 50%, #ff3d00 52% 76%, transparent 78%);
      box-shadow: 0 0 9px rgba(255,85,10,.9);
      opacity: 0;
      animation: emberFly var(--duration) ease-out var(--delay) both;
    }

    @keyframes fireFlash {
      0% { opacity: 0; }
      18% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes fireStream {
      0% { opacity: 0; transform: rotate(var(--angle)) scaleX(.02) scaleY(.35); }
      12% { opacity: 1; }
      42% { transform: rotate(var(--angle)) scaleX(1) scaleY(1.16); }
      72% { opacity: 1; transform: rotate(var(--angle)) scaleX(1.02) scaleY(.82); }
      100% { opacity: 0; transform: rotate(var(--angle)) scaleX(1.05) scaleY(.25); }
    }

    @keyframes flameWave {
      from { opacity: .45; filter: blur(6px); }
      to { opacity: 1; filter: blur(3px); }
    }

    @keyframes emberFly {
      0% { opacity: 0; transform: translate(0,0) scale(.45); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--dx),var(--dy)) scale(.08) rotate(var(--spin)); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>バトル</h1>
      <button id="backToMap" type="button">戻る</button>
    </header>

    <main>
      <section class="battle-section enemy-area" aria-label="敵カードエリア">
        <div id="enemyRow" class="enemy-row count-1">
          <div class="enemy-slot" data-enemy-slot="1">敵</div>
          <div id="enemyCard" class="enemy-slot" data-enemy-slot="2">
            <div class="enemy-name">敵</div>
            <div id="enemyHp" class="hp">HP 40</div>
            <div id="enemyHpMeter" class="enemy-hp-meter" aria-label="敵の体力メーター">
              <div id="enemyHpFill" class="enemy-hp-fill"></div>
            </div>
          </div>
          <div class="enemy-slot" data-enemy-slot="3">敵</div>
        </div>
      </section>

      <section class="battle-section player-area" aria-label="主人公とサイコロカードエリア">
        <div class="player-card" aria-label="主人公カード">
          <div class="card-name">主人公</div>
          <div class="hp">HP 20</div>
        </div>

        <div class="dice-zone" aria-label="サイコロカードエリア">
          <div id="diceCard" class="dice-card">
            <div class="dice-inner">
              <div class="dice-face dice-back">?</div>
              <div class="dice-face dice-front">
                <div id="diceSymbol" class="dice-symbol">⚀</div>
                <div id="diceNumber" class="dice-number">+1</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="battle-section hand-area" aria-label="手札エリア">
        <div class="hand-card" data-role="attack" data-base="3" data-element="fire" data-icon="🔥">
          <div class="card-name">火花</div>
          <div class="base-value">3</div>
        </div>
        <div class="hand-card" data-role="support" data-support="fire" data-bonus="2">
          <div class="card-name">火種</div>
          <div class="base-value">火 +2</div>
        </div>
        <div class="hand-card" data-role="attack" data-base="4" data-element="ice" data-icon="❄️">
          <div class="card-name">氷針</div>
          <div class="base-value">4</div>
        </div>
        <div class="hand-card" data-role="attack" data-base="1" data-element="fire" data-icon="🔥">
          <div class="card-name">呪火</div>
          <div class="base-value">1</div>
        </div>
        <div class="hand-card" data-role="attack" data-base="5" data-element="lightning" data-icon="⚡">
          <div class="card-name">雷光</div>
          <div class="base-value">5</div>
        </div>
      </section>
    </main>
  </div>

  <div id="attackFocus" class="attack-focus" aria-hidden="true">
    <div class="focus-glow"></div>
    <div id="focusIcon" class="focus-icon">🔥</div>
    <div id="focusTotal" class="focus-total">3</div>
  </div>

  <div id="fxLayer" class="fx-layer" aria-hidden="true"></div>

  <script>
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const diceFaces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
    const diceCard = document.getElementById('diceCard');
    const diceSymbol = document.getElementById('diceSymbol');
    const diceNumber = document.getElementById('diceNumber');
    const enemyCard = document.getElementById('enemyCard');
    const enemyHpText = document.getElementById('enemyHp');
    const enemyHpMeter = document.getElementById('enemyHpMeter');
    const enemyHpFill = document.getElementById('enemyHpFill');
    const fxLayer = document.getElementById('fxLayer');
    const attackFocus = document.getElementById('attackFocus');
    const focusIcon = document.getElementById('focusIcon');
    const focusTotal = document.getElementById('focusTotal');
    const handCards = [...document.querySelectorAll('.hand-card')];
    const enemyMaxHp = 40;
    let enemyHp = enemyMaxHp;

    document.getElementById('backToMap').addEventListener('click', () => {
      location.href = './wich_map.HTML';
    });

    function centerOf(element) {
      const r = element.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    function updateEnemyHpDisplay(hp) {
      enemyHpText.textContent = `HP ${hp}`;
      enemyHpFill.style.width = `${Math.max(0, Math.min(100, hp / enemyMaxHp * 100))}%`;
    }

    async function flyToken(text, source, target, options = {}) {
      const s = centerOf(source);
      const t = centerOf(target);
      const token = document.createElement('div');
      token.className = 'fly-token';
      token.textContent = text;
      token.style.setProperty('--sx', `${s.x}px`);
      token.style.setProperty('--sy', `${s.y}px`);
      token.style.setProperty('--tx', `${t.x}px`);
      token.style.setProperty('--ty', `${t.y}px`);
      token.style.setProperty('--font-size', options.fontSize || '32px');
      token.style.setProperty('--token-color', options.color || '#fff');
      token.style.setProperty('--token-glow', options.glow || 'rgba(255,255,255,.7)');
      fxLayer.appendChild(token);
      await wait(610);
      token.remove();
    }

    function setTotal(value) {
      focusTotal.textContent = String(value);
      focusTotal.classList.remove('bump');
      void focusTotal.offsetWidth;
      focusTotal.classList.add('bump');
    }

    async function revealDice() {
      diceCard.classList.remove('open');
      await wait(220);
      const roll = Math.floor(Math.random() * 6) + 1;
      diceSymbol.textContent = diceFaces[roll - 1];
      diceNumber.textContent = `+${roll}`;
      diceCard.classList.add('open');
      await wait(620);
      return roll;
    }

    async function showAttackInCenter(card) {
      const icon = card.dataset.icon || '✦';
      const base = Number(card.dataset.base || 0);
      focusIcon.textContent = icon;
      focusTotal.textContent = String(base);
      attackFocus.classList.remove('buffed');
      await flyToken(icon, card, attackFocus, {
        fontSize: '58px',
        color: '#fff0c2',
        glow: 'rgba(255,94,15,.95)'
      });
      attackFocus.classList.add('show');
      await wait(330);
      return base;
    }

    async function applySupport(supportCard, currentTotal) {
      const bonus = Number(supportCard.dataset.bonus || 0);
      supportCard.classList.add('support-active');
      await wait(200);
      await flyToken(`+${bonus}`, supportCard, attackFocus, {
        fontSize: '36px',
        color: '#ffe493',
        glow: 'rgba(255,137,24,.95)'
      });
      const next = currentTotal + bonus;
      setTotal(next);
      attackFocus.classList.add('buffed');
      await wait(350);
      supportCard.classList.remove('support-active');
      return next;
    }

    async function applyDice(currentTotal) {
      const roll = await revealDice();
      await flyToken(`+${roll}`, diceCard, attackFocus, {
        fontSize: '38px',
        color: '#fff7cc',
        glow: 'rgba(255,230,126,.9)'
      });
      const next = currentTotal + roll;
      setTotal(next);
      await wait(360);
      return { roll, total: next };
    }

    async function playFireEffect(sourceElement) {
      const sourceRect = sourceElement.getBoundingClientRect();
      const targetRect = enemyCard.getBoundingClientRect();
      const sx = sourceRect.left + sourceRect.width / 2;
      const sy = sourceRect.top + sourceRect.height / 2;
      const tx = targetRect.left + targetRect.width / 2;
      const ty = targetRect.top + targetRect.height / 2;
      const dx = tx - sx;
      const dy = ty - sy;
      const distance = Math.hypot(dx,dy);
      const angle = Math.atan2(dy,dx) * 180 / Math.PI;

      const flash = document.createElement('div');
      flash.className = 'fire-flash';
      fxLayer.appendChild(flash);

      const stream = document.createElement('div');
      stream.className = 'fire-stream';
      stream.style.left = `${sx}px`;
      stream.style.top = `${sy - 17}px`;
      stream.style.width = `${distance}px`;
      stream.style.setProperty('--angle', `${angle}deg`);
      fxLayer.appendChild(stream);

      for (let i = 0; i < 28; i += 1) {
        const ember = document.createElement('i');
        ember.className = 'ember';
        const progress = Math.random();
        ember.style.left = `${sx + dx * progress + (Math.random() - .5) * 18}px`;
        ember.style.top = `${sy + dy * progress + (Math.random() - .5) * 18}px`;
        ember.style.setProperty('--size', `${4 + Math.random() * 9}px`);
        ember.style.setProperty('--dx', `${(Math.random() - .5) * 80}px`);
        ember.style.setProperty('--dy', `${-35 - Math.random() * 95}px`);
        ember.style.setProperty('--spin', `${(Math.random() - .5) * 420}deg`);
        ember.style.setProperty('--duration', `${.42 + Math.random() * .48}s`);
        ember.style.setProperty('--delay', `${Math.random() * .18}s`);
        fxLayer.appendChild(ember);
      }

      enemyCard.classList.remove('burning');
      void enemyCard.offsetWidth;
      enemyCard.classList.add('burning');
      await wait(760);
      stream.remove();
      flash.remove();
      fxLayer.querySelectorAll('.ember').forEach(el => el.remove());
      enemyCard.classList.remove('burning');
    }

    async function damageEnemy(damage) {
      const oldHp = enemyHp;
      const newHp = Math.max(0, oldHp - damage);

      const pop = document.createElement('div');
      pop.className = 'damage-pop';
      pop.textContent = `-${damage}`;
      enemyCard.appendChild(pop);

      enemyCard.classList.remove('hp-flash');
      enemyHpMeter.classList.remove('flash');
      void enemyCard.offsetWidth;
      enemyCard.classList.add('hp-flash');
      enemyHpMeter.classList.add('flash');

      const diff = oldHp - newHp;
      const stepDelay = Math.max(22, Math.min(55, Math.floor(380 / Math.max(1, diff))));
      for (let hp = oldHp - 1; hp >= newHp; hp -= 1) {
        updateEnemyHpDisplay(hp);
        await wait(stepDelay);
      }

      enemyHp = newHp;
      updateEnemyHpDisplay(enemyHp);
      enemyCard.classList.remove('hit');
      void enemyCard.offsetWidth;
      enemyCard.classList.add('hit');
      await wait(430);
      pop.remove();
      enemyCard.classList.remove('hp-flash');
      enemyHpMeter.classList.remove('flash');
    }

    async function runAutoBattleDemo() {
      await wait(700);

      const attackCard = handCards.find(card => card.dataset.role === 'attack' && card.dataset.element === 'fire');
      if (!attackCard) return;

      attackCard.classList.add('active');
      await wait(360);

      let total = await showAttackInCenter(attackCard);

      const supportCard = handCards.find(card =>
        card.dataset.role === 'support' && card.dataset.support === attackCard.dataset.element
      );

      if (supportCard) total = await applySupport(supportCard, total);

      const diceResult = await applyDice(total);
      total = diceResult.total;

      await wait(220);
      await playFireEffect(attackFocus);
      await damageEnemy(total);

      attackCard.classList.remove('active');
      attackCard.classList.add('used');
      diceCard.classList.remove('open');
      attackFocus.classList.remove('show', 'buffed');
    }

    updateEnemyHpDisplay(enemyHp);
    runAutoBattleDemo();
  </script>
</body>
</html>
