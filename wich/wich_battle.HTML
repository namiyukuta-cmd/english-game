<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#171014" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Wich - Battle</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171014;
      color: #f2e8e8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body { min-height: 100dvh; }

    .app {
      width: 100%;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      min-height: 52px;
      padding: env(safe-area-inset-top) 12px 0;
      border-bottom: 1px solid #563a40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #21161a;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    header button {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid #6c4d54;
      border-radius: 7px;
      background: #2d1f24;
      color: #f2e8e8;
      font-size: 14px;
    }

    main {
      min-height: 0;
      padding: 8px;
      display: grid;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .battle-section {
      min-height: 0;
      border: 1px solid #563a40;
      border-radius: 10px;
      background: #1e1418;
      overflow: hidden;
    }

    .enemy-area {
      padding: 8px;
      background:
        radial-gradient(circle at center, rgba(121,54,65,.16), transparent 54%),
        #1e1418;
    }

    .enemy-row {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .enemy-slot,
    .player-card,
    .dice-card,
    .hand-card {
      flex: 0 0 auto;
      min-width: 0;
      aspect-ratio: 2 / 3;
      border: 1px solid #6c4d54;
      border-radius: 8px;
      background: #26191e;
      color: #d8bcc3;
      text-align: center;
    }

    .enemy-row.count-1 .enemy-slot { display: none; }

    .enemy-row.count-1 .enemy-slot:nth-child(2) {
      display: grid;
      width: min(30vw, 120px);
    }

    .enemy-row.count-2 .enemy-slot {
      display: grid;
      width: min(27vw, 108px);
    }

    .enemy-row.count-2 .enemy-slot:nth-child(2) { display: none; }

    .enemy-row.count-3 .enemy-slot {
      display: grid;
      width: min(25vw, 98px);
    }

    .enemy-slot,
    .player-card,
    .hand-card {
      place-items: center;
      align-content: center;
      gap: 5px;
      padding: 7px;
    }

    .enemy-name,
    .card-name {
      font-size: 12px;
      font-weight: 800;
    }

    .hp,
    .base-value,
    .result-value {
      font-size: 11px;
      color: #a98a92;
    }

    .enemy-slot.hit {
      animation: enemyHit .28s ease;
    }

    @keyframes enemyHit {
      0%,100% { transform: translateX(0); }
      35% { transform: translateX(-7px); }
      70% { transform: translateX(7px); }
    }

    .player-area {
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #21161a;
    }

    .player-card {
      display: grid;
      width: min(30vw, 120px);
      border-color: #725d66;
      background: #291d22;
    }

    .dice-zone {
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }

    .dice-card {
      position: relative;
      width: min(22vw, 84px);
      border-color: #766d59;
      background: transparent;
      perspective: 700px;
    }

    .dice-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform .45s cubic-bezier(.2,.72,.2,1);
    }

    .dice-card.open .dice-inner {
      transform: rotateY(180deg);
    }

    .dice-face {
      position: absolute;
      inset: 0;
      border: 1px solid #766d59;
      border-radius: 8px;
      display: grid;
      place-items: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .dice-back {
      background: #29251d;
      color: #8f866e;
      font-size: 22px;
      font-weight: 900;
    }

    .dice-front {
      transform: rotateY(180deg);
      background: #342f24;
      color: #efe5c7;
      grid-template-rows: 1fr auto;
      padding: 8px 4px;
    }

    .dice-symbol {
      align-self: end;
      font-size: clamp(34px, 11vw, 50px);
      line-height: 1;
    }

    .dice-number {
      font-size: 12px;
      font-weight: 800;
    }

    .hand-area {
      padding: 8px 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: #21161a;
    }

    .hand-card {
      display: grid;
      width: calc((100% - 20px) / 5);
      max-width: 82px;
      border-color: #66515a;
      background: #291d22;
      transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease, opacity .22s ease;
    }

    .hand-card.active {
      transform: translateY(-10px) scale(1.04);
      border-color: #c28a98;
      box-shadow: 0 8px 20px rgba(0,0,0,.4);
    }

    .hand-card.used {
      opacity: .36;
    }

    .result-value {
      min-height: 14px;
      color: #e5c8cf;
      font-weight: 800;
    }

    .battle-message {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      min-width: 170px;
      padding: 12px 18px;
      border: 1px solid #75525b;
      border-radius: 8px;
      background: rgba(30, 20, 24, .94);
      text-align: center;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    .battle-message.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>バトル</h1>
      <button id="backToMap" type="button">戻る</button>
    </header>

    <main>
      <section class="battle-section enemy-area" aria-label="敵カードエリア">
        <div id="enemyRow" class="enemy-row count-1">
          <div class="enemy-slot" data-enemy-slot="1">敵</div>
          <div id="enemyCard" class="enemy-slot" data-enemy-slot="2">
            <div class="enemy-name">敵</div>
            <div id="enemyHp" class="hp">HP 40</div>
          </div>
          <div class="enemy-slot" data-enemy-slot="3">敵</div>
        </div>
      </section>

      <section class="battle-section player-area" aria-label="主人公とサイコロカードエリア">
        <div class="player-card" aria-label="主人公カード">
          <div class="card-name">主人公</div>
          <div class="hp">HP 20</div>
        </div>

        <div id="diceZone" class="dice-zone" aria-label="サイコロカードエリア">
          <div id="diceCard" class="dice-card" data-dice-card="1">
            <div class="dice-inner">
              <div class="dice-face dice-back">?</div>
              <div class="dice-face dice-front">
                <div id="diceSymbol" class="dice-symbol">⚀</div>
                <div id="diceNumber" class="dice-number">+1</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="handArea" class="battle-section hand-area" aria-label="手札エリア">
        <div class="hand-card" data-base="3">
          <div class="card-name">火花</div>
          <div class="base-value">3</div>
          <div class="result-value"></div>
        </div>
        <div class="hand-card" data-base="2">
          <div class="card-name">風刃</div>
          <div class="base-value">2</div>
          <div class="result-value"></div>
        </div>
        <div class="hand-card" data-base="4">
          <div class="card-name">氷針</div>
          <div class="base-value">4</div>
          <div class="result-value"></div>
        </div>
        <div class="hand-card" data-base="1">
          <div class="card-name">呪火</div>
          <div class="base-value">1</div>
          <div class="result-value"></div>
        </div>
        <div class="hand-card" data-base="5">
          <div class="card-name">雷光</div>
          <div class="base-value">5</div>
          <div class="result-value"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="battleMessage" class="battle-message"></div>

  <script>
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
    const diceCard = document.getElementById('diceCard');
    const diceSymbol = document.getElementById('diceSymbol');
    const diceNumber = document.getElementById('diceNumber');
    const enemyCard = document.getElementById('enemyCard');
    const enemyHpText = document.getElementById('enemyHp');
    const battleMessage = document.getElementById('battleMessage');
    const handCards = [...document.querySelectorAll('.hand-card')];
    let enemyHp = 40;

    document.getElementById('backToMap').addEventListener('click', () => {
      location.href = './wich_map.HTML';
    });

    async function revealDice() {
      diceCard.classList.remove('open');
      await wait(220);

      const roll = Math.floor(Math.random() * 6) + 1;
      diceSymbol.textContent = diceFaces[roll - 1];
      diceNumber.textContent = `+${roll}`;

      diceCard.classList.add('open');
      await wait(650);
      return roll;
    }

    function hitEnemy(damage) {
      enemyHp = Math.max(0, enemyHp - damage);
      enemyHpText.textContent = `HP ${enemyHp}`;
      enemyCard.classList.remove('hit');
      void enemyCard.offsetWidth;
      enemyCard.classList.add('hit');
    }

    async function runAutoBattleDemo() {
      await wait(700);

      for (const card of handCards) {
        if (enemyHp <= 0) break;

        card.classList.add('active');
        await wait(420);

        const roll = await revealDice();
        const base = Number(card.dataset.base);
        const total = base + roll;
        card.querySelector('.result-value').textContent = `${base}+${roll}=${total}`;

        await wait(260);
        hitEnemy(total);
        await wait(520);

        card.classList.remove('active');
        card.classList.add('used');
        diceCard.classList.remove('open');
        await wait(320);
      }

      battleMessage.textContent = enemyHp <= 0 ? '勝利' : '1ターン終了';
      battleMessage.classList.add('show');
    }

    runAutoBattleDemo();
  </script>
</body>
</html>
