<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#16130f" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Wich</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #16130f;
      color: #eee9df;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .menu {
      width: min(100%, 420px);
      display: grid;
      gap: 14px;
    }

    h1 {
      margin: 0 0 22px;
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    button {
      width: 100%;
      min-height: 58px;
      border: 1px solid #746b5b;
      border-radius: 8px;
      background: #272219;
      color: #eee9df;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <main class="menu">
    <h1>魔女</h1>
    <button id="newGame" type="button">新しく始める</button>
    <button id="continueGame" type="button">続きから</button>
    <button id="settings" type="button">設定</button>
  </main>

  <script>
    document.getElementById('newGame').addEventListener('click', () => {
      location.href = './wich_top.HTML?mode=new';
    });

    document.getElementById('continueGame').addEventListener('click', () => {
      location.href = './wich_top.HTML?mode=continue';
    });

    document.getElementById('settings').addEventListener('click', () => {
      alert('設定画面はこれから作成します。');
    });
  </script>
</body>
</html>
