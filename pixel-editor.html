<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#fff7fb">
  <title>24×24 ドット絵メーカー</title>
  <style>
    *{box-sizing:border-box}
    :root{--bg:#fff7fb;--card:#fff;--ink:#3e3037;--line:#dccfd6;--accent:#e98aa8;--muted:#7d6e75}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
    .wrap{max-width:720px;margin:0 auto;padding:12px 12px 28px}
    .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .back{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:22px;color:var(--ink)}
    h1{margin:0;font-size:20px}
    .sub{margin:2px 0 0;color:var(--muted);font-size:12px}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
    .toolrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
    .current{width:34px;height:34px;border:2px solid #4b3e44;border-radius:8px;background:#2b2118;flex:0 0 auto}
    .status{font-size:13px;min-width:0;flex:1}
    .status strong{display:block;font-size:14px}
    button{font:inherit}
    .toolbtn,.action{min-height:42px;border:1px solid #cdbfc6;border-radius:10px;background:#fff;color:var(--ink);font-weight:700;padding:8px 12px}
    .toolbtn.active{background:#3e3037;color:#fff;border-color:#3e3037}
    .canvas-shell{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:10px;overflow:hidden}
    #grid{width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(24,1fr);touch-action:none;user-select:none;-webkit-user-select:none;border-top:1px solid rgba(65,52,58,.25);border-left:1px solid rgba(65,52,58,.25);background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
    .cell{padding:0;margin:0;border:0;border-right:1px solid rgba(65,52,58,.22);border-bottom:1px solid rgba(65,52,58,.22);background:transparent;min-width:0;min-height:0;touch-action:none}
    .palette{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
    .swatch{aspect-ratio:1/1;border:2px solid #d3c6cc;border-radius:8px;padding:0;min-width:0}
    .swatch.active{outline:3px solid #3e3037;outline-offset:1px}
    .transparent{background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0;background-color:#fff}
    .custom{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
    #customColor{width:48px;height:42px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:2px}
    .actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .action.primary{background:#3e3037;color:#fff;border-color:#3e3037}
    .message{min-height:18px;text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
    @media(min-width:560px){.palette{grid-template-columns:repeat(12,1fr)}.actions{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <button class="back" type="button" id="backBtn" aria-label="戻る">←</button>
      <div><h1>24×24 ドット絵メーカー</h1><p class="sub">色を選んで、マスをタップ／なぞって描きます</p></div>
    </div>

    <section class="panel toolrow">
      <div id="currentColor" class="current" aria-hidden="true"></div>
      <div class="status"><strong id="currentLabel">#2B2118</strong><span>選択中の色</span></div>
      <button id="eraserBtn" class="toolbtn" type="button">消しゴム</button>
    </section>

    <section class="canvas-shell"><div id="grid" aria-label="24×24キャンバス"></div></section>

    <section class="panel">
      <div id="palette" class="palette"></div>
      <div class="custom">
        <label for="customColor">好きな色</label>
        <input id="customColor" type="color" value="#8B5A3C">
        <button id="useCustom" class="toolbtn" type="button">この色を使う</button>
      </div>
    </section>

    <section class="panel actions">
      <button id="undoBtn" class="action" type="button">1つ戻る</button>
      <button id="clearBtn" class="action" type="button">全消去</button>
      <button id="savePngBtn" class="action primary" type="button">PNG保存</button>
      <button id="saveJsonBtn" class="action" type="button">座標保存</button>
    </section>
    <div id="message" class="message" aria-live="polite"></div>
  </main>

<script>
(() => {
  const SIZE=24;
  const COLORS=["#2B2118","#5A3825","#8B5A3C","#B97A56","#F3C9A7","#FFF3E6","#FFFFFF","#E34B45","#E98DA1","#F0C84B","#4A8FD8","#4FAE68","#6A4FC2","#222222","#8D8D8D"];
  const grid=document.getElementById('grid');
  const palette=document.getElementById('palette');
  const currentColor=document.getElementById('currentColor');
  const currentLabel=document.getElementById('currentLabel');
  const eraserBtn=document.getElementById('eraserBtn');
  const message=document.getElementById('message');
  let selected=COLORS[0];
  let pixels=Array.from({length:SIZE},()=>Array(SIZE).fill(null));
  let history=[];
  let drawing=false;
  let beforeStroke=null;

  function note(t){message.textContent=t;clearTimeout(note.t);note.t=setTimeout(()=>message.textContent='',1500)}
  function clone(){return pixels.map(r=>r.slice())}
  function saveLocal(){try{localStorage.setItem('englishGamePixel24',JSON.stringify(pixels))}catch(e){}}
  function loadLocal(){try{const p=JSON.parse(localStorage.getItem('englishGamePixel24'));if(Array.isArray(p)&&p.length===SIZE&&p.every(r=>Array.isArray(r)&&r.length===SIZE))pixels=p}catch(e){}}
  function updateTool(){
    if(selected===null){currentColor.className='current transparent';currentColor.style.background='';currentLabel.textContent='消しゴム';eraserBtn.classList.add('active')}
    else{currentColor.className='current';currentColor.style.background=selected;currentLabel.textContent=selected;eraserBtn.classList.remove('active')}
    document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('active',b.dataset.color===(selected===null?'transparent':selected)));
  }
  function renderCell(x,y){const c=grid.children[y*SIZE+x];c.style.background=pixels[y][x]||'transparent'}
  function render(){for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++)renderCell(x,y)}
  function paint(cell){const x=+cell.dataset.x,y=+cell.dataset.y;if(pixels[y][x]===selected)return;pixels[y][x]=selected;renderCell(x,y)}
  function start(cell){drawing=true;beforeStroke=clone();paint(cell)}
  function end(){if(!drawing)return;drawing=false;if(JSON.stringify(beforeStroke)!==JSON.stringify(pixels)){history.push(beforeStroke);if(history.length>100)history.shift();saveLocal()}beforeStroke=null}

  for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){
    const b=document.createElement('button');b.type='button';b.className='cell';b.dataset.x=x;b.dataset.y=y;b.setAttribute('aria-label',`${x},${y}`);
    b.addEventListener('pointerdown',e=>{e.preventDefault();start(b)});
    b.addEventListener('pointerenter',e=>{if(drawing&&(e.buttons||e.pointerType==='touch'))paint(b)});
    b.addEventListener('click',e=>{e.preventDefault()});
    grid.appendChild(b);
  }
  window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);

  const erase=document.createElement('button');erase.type='button';erase.className='swatch transparent';erase.dataset.color='transparent';erase.title='透明';erase.addEventListener('click',()=>{selected=null;updateTool()});palette.appendChild(erase);
  COLORS.forEach(color=>{const b=document.createElement('button');b.type='button';b.className='swatch';b.dataset.color=color;b.style.background=color;b.title=color;b.addEventListener('click',()=>{selected=color;updateTool()});palette.appendChild(b)});

  eraserBtn.addEventListener('click',()=>{selected=null;updateTool()});
  document.getElementById('useCustom').addEventListener('click',()=>{selected=document.getElementById('customColor').value.toUpperCase();updateTool()});
  document.getElementById('undoBtn').addEventListener('click',()=>{if(!history.length){note('戻せる操作がありません');return}pixels=history.pop();render();saveLocal()});
  document.getElementById('clearBtn').addEventListener('click',()=>{history.push(clone());pixels=Array.from({length:SIZE},()=>Array(SIZE).fill(null));render();saveLocal()});
  document.getElementById('backBtn').addEventListener('click',()=>{location.href='index.html'});

  function makeCanvas(scale){const c=document.createElement('canvas');c.width=SIZE*scale;c.height=SIZE*scale;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){const col=pixels[y][x];if(col){ctx.fillStyle=col;ctx.fillRect(x*scale,y*scale,scale,scale)}}return c}
  function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
  document.getElementById('savePngBtn').addEventListener('click',()=>{download(makeCanvas(20).toDataURL('image/png'),'pixel_24x24.png');note('PNGを保存しました')});
  document.getElementById('saveJsonBtn').addEventListener('click',()=>{
    const coordinates=[];for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++)if(pixels[y][x])coordinates.push({x,y,color:pixels[y][x]});
    const data={width:SIZE,height:SIZE,pixels,coordinates};
    const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));download(url,'pixel_24x24.json');setTimeout(()=>URL.revokeObjectURL(url),1000);note('座標データを保存しました')
  });

  loadLocal();render();updateTool();
})();
</script>
</body>
</html>
