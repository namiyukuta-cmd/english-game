<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#fff7fb">
  <title>24×24 ドット絵メーカー</title>
  <style>
    *{box-sizing:border-box}
    :root{--bg:#fff7fb;--card:#fff;--ink:#3e3037;--line:#dccfd6;--muted:#7d6e75}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
    .wrap{max-width:720px;margin:0 auto;padding:12px 12px 28px}
    .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .back{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:22px;color:var(--ink);flex:0 0 auto}
    h1{margin:0;font-size:20px}
    .sub{margin:2px 0 0;color:var(--muted);font-size:12px}
    .save-name{margin:3px 0 0;font-size:12px;font-weight:800;color:#a06479}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
    .toolrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
    .current{width:34px;height:34px;border:2px solid #4b3e44;border-radius:8px;background:#2b2118;flex:0 0 auto}
    .status{font-size:13px;min-width:0;flex:1}
    .status strong{display:block;font-size:14px}
    button{font:inherit}
    .toolbtn,.action{min-height:42px;border:1px solid #cdbfc6;border-radius:10px;background:#fff;color:var(--ink);font-weight:700;padding:8px 12px}
    .toolbtn.active{background:#3e3037;color:#fff;border-color:#3e3037}
    .zoomrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
    .zoomrow .toolbtn{min-width:48px}
    #zoomLabel{min-width:64px;text-align:center;font-weight:800}
    .canvas-shell{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:10px;overflow:auto;max-height:min(78vw,620px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
    #grid{width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(24,1fr);user-select:none;-webkit-user-select:none;border-top:1px solid rgba(65,52,58,.3);border-left:1px solid rgba(65,52,58,.3);background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0;transform-origin:top left}
    #grid.tap-mode{touch-action:pan-x pan-y}
    #grid.draw-mode{touch-action:none}
    .cell{padding:0;margin:0;border:0;border-right:1px solid rgba(65,52,58,.26);border-bottom:1px solid rgba(65,52,58,.26);background:transparent;min-width:0;min-height:0}
    .palette{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
    .swatch{aspect-ratio:1/1;border:2px solid #d3c6cc;border-radius:8px;padding:0;min-width:0}
    .swatch.active{outline:3px solid #3e3037;outline-offset:1px}
    .transparent{background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0;background-color:#fff}
    .custom{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
    #customColor{width:48px;height:42px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:2px}
    .actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .action.primary{background:#3e3037;color:#fff;border-color:#3e3037}
    .action.save{background:#d97898;color:#fff;border-color:#d97898}
    .message{min-height:18px;text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
    @media(min-width:560px){.palette{grid-template-columns:repeat(12,1fr)}.actions{grid-template-columns:repeat(3,1fr)}.canvas-shell{max-height:620px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <button class="back" type="button" id="backBtn" aria-label="戻る">←</button>
      <div>
        <h1>24×24 ドット絵メーカー</h1>
        <p class="sub">基本は1マスずつタップ。拡大すると細かく描けます</p>
        <p id="projectLabel" class="save-name">新しいドット絵</p>
      </div>
    </div>

    <section class="panel toolrow">
      <div id="currentColor" class="current" aria-hidden="true"></div>
      <div class="status"><strong id="currentLabel">#2B2118</strong><span>選択中の色</span></div>
      <button id="eraserBtn" class="toolbtn" type="button">消しゴム</button>
      <button id="drawModeBtn" class="toolbtn" type="button">なぞり塗り：OFF</button>
    </section>

    <div class="zoomrow" aria-label="拡大縮小">
      <button id="zoomOutBtn" class="toolbtn" type="button" aria-label="縮小">−</button>
      <span id="zoomLabel">100%</span>
      <button id="zoomInBtn" class="toolbtn" type="button" aria-label="拡大">＋</button>
      <button id="zoomResetBtn" class="toolbtn" type="button">100%</button>
    </div>

    <section class="canvas-shell" id="canvasShell"><div id="grid" class="tap-mode" aria-label="24×24キャンバス"></div></section>

    <section class="panel">
      <div id="palette" class="palette"></div>
      <div class="custom">
        <label for="customColor">好きな色</label>
        <input id="customColor" type="color" value="#8B5A3C">
        <button id="useCustom" class="toolbtn" type="button">この色を使う</button>
      </div>
    </section>

    <section class="panel actions">
      <button id="gameSaveBtn" class="action save" type="button">セーブ</button>
      <button id="undoBtn" class="action" type="button">1つ戻る</button>
      <button id="clearBtn" class="action" type="button">全消去</button>
      <button id="savePngBtn" class="action primary" type="button">PNG保存</button>
      <button id="saveJsonBtn" class="action" type="button">座標保存</button>
      <button id="saveListBtn" class="action" type="button">セーブ一覧</button>
    </section>
    <div id="message" class="message" aria-live="polite"></div>
  </main>

<script>
(() => {
  const SIZE=24;
  const SAVE_KEY='englishGamePixelSavesV1';
  const WORK_KEY='englishGamePixel24';
  const COLORS=["#2B2118","#5A3825","#8B5A3C","#B97A56","#F3C9A7","#FFF3E6","#FFFFFF","#E34B45","#E98DA1","#F0C84B","#4A8FD8","#4FAE68","#6A4FC2","#222222","#8D8D8D"];
  const ZOOMS=[100,150,200,300,400];
  const grid=document.getElementById('grid');
  const canvasShell=document.getElementById('canvasShell');
  const palette=document.getElementById('palette');
  const currentColor=document.getElementById('currentColor');
  const currentLabel=document.getElementById('currentLabel');
  const eraserBtn=document.getElementById('eraserBtn');
  const drawModeBtn=document.getElementById('drawModeBtn');
  const zoomLabel=document.getElementById('zoomLabel');
  const message=document.getElementById('message');
  const projectLabel=document.getElementById('projectLabel');

  let selected=COLORS[0];
  let pixels=blankPixels();
  let undoHistory=[];
  let drawing=false;
  let beforeStroke=null;
  let drawMode=false;
  let zoomIndex=0;
  let pointerStart=null;
  let currentSaveId=null;

  function blankPixels(){return Array.from({length:SIZE},()=>Array(SIZE).fill(null))}
  function validPixels(p){return Array.isArray(p)&&p.length===SIZE&&p.every(r=>Array.isArray(r)&&r.length===SIZE)}
  function clone(){return pixels.map(r=>r.slice())}
  function note(t){message.textContent=t;clearTimeout(note.t);note.t=setTimeout(()=>message.textContent='',1800)}

  function readSaveData(){
    try{
      const d=JSON.parse(localStorage.getItem(SAVE_KEY));
      if(d&&d.slots&&typeof d.slots==='object')return {next:Number(d.next)||1,slots:d.slots};
    }catch(e){}
    return {next:1,slots:{}};
  }
  function writeSaveData(d){localStorage.setItem(SAVE_KEY,JSON.stringify(d))}
  function saveWorking(){try{localStorage.setItem(WORK_KEY,JSON.stringify(pixels))}catch(e){}}
  function updateProjectLabel(){projectLabel.textContent=currentSaveId?'ドット絵セーブ'+currentSaveId:'新しいドット絵'}

  function loadInitial(){
    const q=new URLSearchParams(location.search);
    const requested=q.get('save');
    const mode=q.get('mode');
    if(requested){
      const data=readSaveData();
      const slot=data.slots[requested];
      if(slot&&validPixels(slot.pixels)){
        currentSaveId=requested;
        pixels=slot.pixels.map(r=>r.slice());
        saveWorking();
        updateProjectLabel();
        return;
      }
      pixels=blankPixels();
      currentSaveId=null;
      updateProjectLabel();
      setTimeout(()=>note('セーブデータが見つかりませんでした'),50);
      return;
    }
    if(mode==='new'){
      pixels=blankPixels();
      currentSaveId=null;
      saveWorking();
      updateProjectLabel();
      return;
    }
    try{
      const old=JSON.parse(localStorage.getItem(WORK_KEY));
      if(validPixels(old))pixels=old;
    }catch(e){}
    updateProjectLabel();
  }

  function saveGame(){
    const data=readSaveData();
    if(!currentSaveId){
      let n=Math.max(1,Number(data.next)||1);
      let id=String(n).padStart(3,'0');
      while(data.slots[id]){n++;id=String(n).padStart(3,'0')}
      currentSaveId=id;
      data.next=n+1;
    }
    data.slots[currentSaveId]={
      id:currentSaveId,
      name:'ドット絵セーブ'+currentSaveId,
      width:SIZE,
      height:SIZE,
      pixels:clone(),
      updatedAt:new Date().toISOString()
    };
    writeSaveData(data);
    saveWorking();
    updateProjectLabel();
    window.history.replaceState(null,'','pixel-editor.html?save='+encodeURIComponent(currentSaveId));
    note('ドット絵セーブ'+currentSaveId+'に保存しました');
  }

  function updateTool(){
    if(selected===null){currentColor.className='current transparent';currentColor.style.background='';currentLabel.textContent='消しゴム';eraserBtn.classList.add('active')}
    else{currentColor.className='current';currentColor.style.background=selected;currentLabel.textContent=selected;eraserBtn.classList.remove('active')}
    document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('active',b.dataset.color===(selected===null?'transparent':selected)));
  }
  function updateDrawMode(){
    drawModeBtn.textContent='なぞり塗り：'+(drawMode?'ON':'OFF');
    drawModeBtn.classList.toggle('active',drawMode);
    grid.classList.toggle('draw-mode',drawMode);
    grid.classList.toggle('tap-mode',!drawMode);
  }
  function updateZoom(keepCenter=true){
    const oldW=grid.getBoundingClientRect().width||1;
    const cx=(canvasShell.scrollLeft+canvasShell.clientWidth/2)/oldW;
    const cy=(canvasShell.scrollTop+canvasShell.clientHeight/2)/oldW;
    const z=ZOOMS[zoomIndex];
    grid.style.width=z+'%';
    zoomLabel.textContent=z+'%';
    requestAnimationFrame(()=>{
      if(!keepCenter)return;
      const newW=grid.getBoundingClientRect().width||1;
      canvasShell.scrollLeft=Math.max(0,cx*newW-canvasShell.clientWidth/2);
      canvasShell.scrollTop=Math.max(0,cy*newW-canvasShell.clientHeight/2);
    });
  }
  function renderCell(x,y){grid.children[y*SIZE+x].style.background=pixels[y][x]||'transparent'}
  function render(){for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++)renderCell(x,y)}
  function paint(cell){const x=+cell.dataset.x,y=+cell.dataset.y;if(pixels[y][x]===selected)return false;pixels[y][x]=selected;renderCell(x,y);return true}
  function commitSingle(cell){const before=clone();if(!paint(cell))return;undoHistory.push(before);if(undoHistory.length>100)undoHistory.shift();saveWorking()}
  function startDraw(cell){drawing=true;beforeStroke=clone();paint(cell)}
  function endDraw(){if(!drawing)return;drawing=false;if(JSON.stringify(beforeStroke)!==JSON.stringify(pixels)){undoHistory.push(beforeStroke);if(undoHistory.length>100)undoHistory.shift();saveWorking()}beforeStroke=null}

  for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){
    const b=document.createElement('button');
    b.type='button';b.className='cell';b.dataset.x=x;b.dataset.y=y;b.setAttribute('aria-label',x+','+y);
    b.addEventListener('pointerdown',e=>{
      pointerStart={x:e.clientX,y:e.clientY,cell:b};
      if(drawMode){e.preventDefault();startDraw(b)}
    });
    b.addEventListener('pointerenter',e=>{if(drawMode&&drawing&&(e.buttons||e.pointerType==='touch'))paint(b)});
    b.addEventListener('pointerup',e=>{
      if(drawMode)return;
      if(!pointerStart)return;
      const moved=Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y);
      if(moved<8&&pointerStart.cell===b){e.preventDefault();commitSingle(b)}
      pointerStart=null;
    });
    b.addEventListener('click',e=>e.preventDefault());
    grid.appendChild(b);
  }
  window.addEventListener('pointerup',()=>{if(drawMode)endDraw();else pointerStart=null});
  window.addEventListener('pointercancel',()=>{if(drawMode)endDraw();else pointerStart=null});

  const erase=document.createElement('button');
  erase.type='button';erase.className='swatch transparent';erase.dataset.color='transparent';erase.title='透明';
  erase.addEventListener('click',()=>{selected=null;updateTool()});palette.appendChild(erase);
  COLORS.forEach(color=>{
    const b=document.createElement('button');b.type='button';b.className='swatch';b.dataset.color=color;b.style.background=color;b.title=color;
    b.addEventListener('click',()=>{selected=color;updateTool()});palette.appendChild(b);
  });

  eraserBtn.addEventListener('click',()=>{selected=null;updateTool()});
  drawModeBtn.addEventListener('click',()=>{drawMode=!drawMode;updateDrawMode();note(drawMode?'指でなぞって連続で塗れます':'1マスずつタップするモードです')});
  document.getElementById('useCustom').addEventListener('click',()=>{selected=document.getElementById('customColor').value.toUpperCase();updateTool()});
  document.getElementById('gameSaveBtn').addEventListener('click',saveGame);
  document.getElementById('undoBtn').addEventListener('click',()=>{if(!undoHistory.length){note('戻せる操作がありません');return}pixels=undoHistory.pop();render();saveWorking()});
  document.getElementById('clearBtn').addEventListener('click',()=>{undoHistory.push(clone());pixels=blankPixels();render();saveWorking()});
  document.getElementById('backBtn').addEventListener('click',()=>{location.href='pixel-start.html'});
  document.getElementById('saveListBtn').addEventListener('click',()=>{location.href='pixel-saves.html'});

  document.getElementById('zoomInBtn').addEventListener('click',()=>{if(zoomIndex<ZOOMS.length-1){zoomIndex++;updateZoom()}else note('これ以上拡大できません')});
  document.getElementById('zoomOutBtn').addEventListener('click',()=>{if(zoomIndex>0){zoomIndex--;updateZoom()}else note('これ以上縮小できません')});
  document.getElementById('zoomResetBtn').addEventListener('click',()=>{zoomIndex=0;updateZoom(false);canvasShell.scrollLeft=0;canvasShell.scrollTop=0});

  function makeCanvas(scale){
    const c=document.createElement('canvas');c.width=SIZE*scale;c.height=SIZE*scale;
    const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
    for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){const col=pixels[y][x];if(col){ctx.fillStyle=col;ctx.fillRect(x*scale,y*scale,scale,scale)}}
    return c;
  }
  function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
  document.getElementById('savePngBtn').addEventListener('click',()=>{download(makeCanvas(20).toDataURL('image/png'),(currentSaveId?'pixel_'+currentSaveId:'pixel_24x24')+'.png');note('PNGを保存しました')});
  document.getElementById('saveJsonBtn').addEventListener('click',()=>{
    const coordinates=[];
    for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++)if(pixels[y][x])coordinates.push({x,y,color:pixels[y][x]});
    const data={width:SIZE,height:SIZE,pixels,coordinates};
    const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
    download(url,(currentSaveId?'pixel_'+currentSaveId:'pixel_24x24')+'.json');
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    note('座標データを保存しました');
  });

  loadInitial();
  render();
  updateTool();
  updateDrawMode();
  updateZoom(false);
})();
</script>
</body>
</html>
