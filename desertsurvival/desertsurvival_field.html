<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#17140f">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Desert Survival - Field</title>
  <link rel="stylesheet" href="./css/desertsurvival.css?v=20260910-hud1">
</head>
<body class="screen screen-field">
  <main id="fieldRoot" class="field-root">
    <canvas id="worldCanvas" class="world-canvas" aria-label="砂漠フィールド"></canvas>

    <header class="field-hud">
      <section id="playerHud" class="player-hud" aria-label="プレイヤー状態・時間・天気"></section>
      <button id="miniMapBtn" class="mini-map-button" type="button" aria-label="全体マップを開く">
        <canvas id="miniMapCanvas" width="150" height="150"></canvas>
      </button>
    </header>

    <div id="pickupToast" class="pickup-toast" hidden aria-live="polite"></div>

    <div class="field-bottom-left">
      <button id="itemBtn" class="round-action icon-action" type="button" aria-label="所持品">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V6.5A5 5 0 0112 2a5 5 0 015 4.5V8"/><path d="M5 8h14l1 13H4L5 8z"/><path d="M9 12h6"/></svg>
      </button>
      <a id="craftBtn" class="round-action icon-action" href="./desertsurvival_craft.html" aria-label="クラフト">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5l5 5"/><path d="M13 6l5 5-7.5 7.5a2.1 2.1 0 01-3 0l-2-2a2.1 2.1 0 010-3L13 6z"/><path d="M5 19l-2 2"/></svg>
      </a>
    </div>

    <div class="field-bottom-right">
      <button id="runBtn" class="round-action" type="button" hidden aria-hidden="true">RUN</button>
      <div id="movePad" class="move-pad" aria-label="移動スティック">
        <div id="moveKnob" class="move-knob"></div>
      </div>
    </div>

    <section id="mapOverlay" class="overlay" hidden aria-label="全体マップ">
      <div class="overlay-head">
        <h2>WORLD MAP</h2>
        <button id="closeMapBtn" class="close-btn" type="button" aria-label="全体マップを閉じる">×</button>
      </div>
      <canvas id="worldMapCanvas" class="world-map-canvas"></canvas>
    </section>
  </main>

  <script type="module" src="./js/field3d.js?v=20260910-hud1"></script>
</body>
</html>
