<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fff7fb">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ドット絵差分ツール</title>
<style>
*{box-sizing:border-box}
:root{--bg:#fff7fb;--card:#fff;--ink:#3e3037;--line:#dccfd6;--muted:#7d6e75;--accent:#d97898;--dark:#3e3037}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:10px 10px 30px}
.top{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;margin-bottom:10px}
.top h1{margin:0;text-align:center;font-size:19px}
.back{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:21px;font-weight:900;text-decoration:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:9px}
.title{font-size:14px;font-weight:900;margin:0 0 8px}
.note{font-size:12px;line-height:1.5;color:var(--muted);margin:6px 0 0}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.btn,.filelabel{min-height:42px;border:1px solid #cdbfc6;border-radius:10px;background:#fff;color:var(--ink);font-weight:800;padding:8px 11px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.filelabel input{display:none}
.btn.primary{background:var(--dark);color:#fff;border-color:var(--dark)}
.btn.save{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.btn.big{min-height:50px;font-size:15px;flex:1}
.btn:disabled{opacity:.4}
.frame-head{display:grid;grid-template-columns:48px 1fr 48px;gap:7px;align-items:center}
.frame-no{text-align:center;font-weight:900;font-size:15px}
.canvasbox{border:1px solid var(--line);border-radius:12px;overflow:auto;padding:8px;background-color:#fff;background-image:linear-gradient(45deg,#e7e7e7 25%,transparent 25%),linear-gradient(-45deg,#e7e7e7 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e7e7e7 75%),linear-gradient(-45deg,transparent 75%,#e7e7e7 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#editCanvas{display:block;width:100%;height:auto;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}
.movebox{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,44px);gap:5px;justify-content:center;margin-top:8px}
.movebox .up{grid-column:2}.movebox .left{grid-column:1;grid-row:2}.movebox .down{grid-column:2;grid-row:2}.movebox .right{grid-column:3;grid-row:2}
.selection-info{text-align:center;font-size:12px;font-weight:800;color:var(--muted);min-height:18px;margin-top:6px}
.frames{display:flex;gap:7px;overflow-x:auto;padding:5px 1px 2px;-webkit-overflow-scrolling:touch}
.frame{flex:0 0 72px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:4px;text-align:center}
.frame.active{border-color:var(--accent)}
.frame canvas{display:block;width:60px;height:60px;image-rendering:pixelated;background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0}
.frame span{display:block;font-size:10px;font-weight:900;margin-top:3px}
.check{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
label.field{display:grid;gap:4px;font-size:12px;font-weight:800}
input[type=range]{width:100%}
input[type=text],input[type=number],select{width:100%;min-height:40px;border:1px solid #cdbfc6;border-radius:9px;background:#fff;color:var(--ink);padding:7px;font:inherit}
input[type=color]{width:48px;height:42px;border:1px solid #cdbfc6;border-radius:9px;background:#fff;padding:2px}
details{border-top:1px solid var(--line);margin-top:9px;padding-top:8px}
summary{font-size:13px;font-weight:900;cursor:pointer}
.advanced{display:grid;gap:8px;margin-top:9px}
.advanced-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.previewrow{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center}
.previewbox{border:1px solid var(--line);border-radius:12px;padding:6px;background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0}
#previewCanvas{display:block;width:106px;height:106px;image-rendering:pixelated;margin:auto}
.status{min-height:18px;margin-top:7px;text-align:center;color:var(--muted);font-size:12px}
.zoomrow{display:flex;gap:6px;justify-content:center;margin:7px 0}
.zoomrow .btn{min-width:60px;min-height:36px;padding:5px 9px}
.savegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
#fallback{display:grid;gap:6px;margin-top:7px}
@media(max-width:480px){.previewrow{grid-template-columns:108px 1fr}.quick .btn{padding:7px 5px;font-size:12px}.savegrid .btn{font-size:12px;padding:7px 6px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top">
  <a class="back" href="story-menu.html">←</a>
  <h1>ドット絵差分ツール</h1>
  <span></span>
</header>

<section class="panel">
  <p class="title">元絵</p>
  <div class="row">
    <label class="filelabel">画像を選ぶ<input id="fileInput" type="file" accept="image/*"></label>
    <label class="filelabel">続きから<input id="projectInput" type="file" accept=".json,application/json"></label>
  </div>
  <p id="sourceInfo" class="note">まず元になるPNGを選んでください。</p>
</section>

<section class="panel">
  <div class="frame-head">
    <button id="prevBtn" class="btn" type="button">←</button>
    <div id="frameNo" class="frame-no">1 / 1</div>
    <button id="nextBtn" class="btn" type="button">→</button>
  </div>

  <div class="row" style="margin-top:8px">
    <button id="duplicateBtn" class="btn primary big" type="button">複製して次の差分を作る</button>
  </div>

  <div class="quick" style="margin-top:9px">
    <button id="selectBtn" class="btn active" type="button">範囲選択</button>
    <button id="penBtn" class="btn" type="button">描く</button>
    <button id="eraserBtn" class="btn" type="button">消す</button>
  </div>

  <div class="canvasbox"><canvas id="editCanvas"></canvas></div>

  <div class="zoomrow">
    <button class="btn viewZoom active" data-z="100" type="button">全体</button>
    <button class="btn viewZoom" data-z="150" type="button">1.5倍</button>
    <button class="btn viewZoom" data-z="220" type="button">2.2倍</button>
  </div>

  <div id="selectionInfo" class="selection-info">腕や脚を指で囲んでください</div>

  <div class="movebox">
    <button id="moveUp" class="btn up" type="button">↑</button>
    <button id="moveLeft" class="btn left" type="button">←</button>
    <button id="moveDown" class="btn down" type="button">↓</button>
    <button id="moveRight" class="btn right" type="button">→</button>
  </div>

  <div class="row" style="justify-content:center;margin-top:7px">
    <button id="undoBtn" class="btn" type="button">戻す</button>
    <button id="clearSelectionBtn" class="btn" type="button">選択解除</button>
  </div>

  <details>
    <summary>細かく描く・その他の操作</summary>
    <div class="advanced">
      <div class="row">
        <input id="colorPick" type="color" value="#111111" aria-label="色">
        <button id="pickerBtn" class="btn" type="button">スポイト</button>
        <label class="field" style="min-width:110px">ペン太さ
          <select id="brushSize"><option value="1">1px</option><option value="2">2px</option><option value="3">3px</option></select>
        </label>
      </div>
      <div class="row">
        <label class="check"><input id="gridToggle" type="checkbox">マス線</label>
        <label class="check"><input id="onionToggle" type="checkbox" checked>前の絵を薄く表示</label>
      </div>
      <label class="field">前の絵の濃さ <span id="onionText">25%</span>
        <input id="onionOpacity" type="range" min="5" max="70" value="25">
      </label>
      <div class="advanced-grid">
        <button id="flipSelectionBtn" class="btn" type="button">選択部分を左右反転</button>
        <button id="deleteFrameBtn" class="btn" type="button">このフレーム削除</button>
        <button id="clearFrameBtn" class="btn" type="button">この絵を全消去</button>
        <button id="addBlankBtn" class="btn" type="button">空フレーム追加</button>
      </div>
    </div>
  </details>
</section>

<section class="panel">
  <p class="title">フレーム</p>
  <div id="frames" class="frames"></div>
</section>

<section class="panel">
  <p class="title">動きを見る</p>
  <div class="previewrow">
    <div class="previewbox"><canvas id="previewCanvas" width="106" height="106"></canvas></div>
    <div>
      <div class="row">
        <button id="playBtn" class="btn primary" type="button">▶ 再生</button>
        <button id="stopBtn" class="btn" type="button">■ 停止</button>
      </div>
      <label class="field" style="margin-top:8px">速さ <span id="fpsText">6 fps</span>
        <input id="fps" type="range" min="1" max="16" value="6">
      </label>
    </div>
  </div>
</section>

<section class="panel">
  <p class="title">保存</p>
  <label class="field" style="margin-bottom:8px">保存名<input id="baseName" type="text" value="sprite"></label>
  <div class="savegrid">
    <button id="saveCurrentBtn" class="btn save" type="button">この1枚PNG</button>
    <button id="saveAllBtn" class="btn save" type="button">全部PNG</button>
    <button id="sheetBtn" class="btn primary" type="button">スプライトシート</button>
    <button id="projectBtn" class="btn" type="button">作業データ保存</button>
  </div>
  <div id="fallback"></div>
  <div id="status" class="status"></div>
</section>
</main>

<script>
(() => {
const fileInput=document.getElementById('fileInput');
const projectInput=document.getElementById('projectInput');
const editCanvas=document.getElementById('editCanvas');
const ctx=editCanvas.getContext('2d');
const previewCanvas=document.getElementById('previewCanvas');
const pctx=previewCanvas.getContext('2d');
const framesEl=document.getElementById('frames');
const frameNo=document.getElementById('frameNo');
const selectionInfo=document.getElementById('selectionInfo');
const sourceInfo=document.getElementById('sourceInfo');
const colorPick=document.getElementById('colorPick');
const brushSize=document.getElementById('brushSize');
const gridToggle=document.getElementById('gridToggle');
const onionToggle=document.getElementById('onionToggle');
const onionOpacity=document.getElementById('onionOpacity');
const onionText=document.getElementById('onionText');
const fps=document.getElementById('fps');
const fpsText=document.getElementById('fpsText');
const baseName=document.getElementById('baseName');
const status=document.getElementById('status');
const fallback=document.getElementById('fallback');

let W=32,H=32;
let frames=[blank(32,32)];
let current=0;
let mode='select';
let selection=null;
let dragStart=null;
let drawing=false;
let beforeStroke=null;
let undo=[];
let previewTimer=null;
let previewIndex=0;
let viewZoom=100;

function blank(w,h){return new Uint8ClampedArray(w*h*4)}
function clone(a){return new Uint8ClampedArray(a)}
function safeName(s){return (s||'sprite').trim().replace(/[\\/:*?"<>|]+/g,'_').replace(/\.png$/i,'')||'sprite'}
function note(t){status.textContent=t;clearTimeout(note.t);note.t=setTimeout(()=>status.textContent='',2200)}
function checker(c,w,h,size=12){
  c.clearRect(0,0,w,h);c.fillStyle='#fff';c.fillRect(0,0,w,h);c.fillStyle='#e9e9e9';
  for(let y=0;y<h;y+=size)for(let x=0;x<w;x+=size)if(((x/size)+(y/size))%2===0)c.fillRect(x,y,size,size);
}
function rawCanvas(frame){
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const q=c.getContext('2d');const d=q.createImageData(W,H);d.data.set(frame);q.putImageData(d,0,0);return c;
}
function setPx(frame,x,y,r,g,b,a){
  if(x<0||y<0||x>=W||y>=H)return;
  const i=(y*W+x)*4;frame[i]=r;frame[i+1]=g;frame[i+2]=b;frame[i+3]=a;
}
function getPx(frame,x,y){
  const i=(y*W+x)*4;return [frame[i],frame[i+1],frame[i+2],frame[i+3]];
}
function normRect(a,b){
  let x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),x2=Math.max(a.x,b.x),y2=Math.max(a.y,b.y);
  return {x,y,w:x2-x+1,h:y2-y+1};
}
function clampRect(r){
  const x=Math.max(0,Math.min(W-1,r.x)),y=Math.max(0,Math.min(H-1,r.y));
  return {x,y,w:Math.max(1,Math.min(W-x,r.w)),h:Math.max(1,Math.min(H-y,r.h))};
}
function updateInfo(){
  frameNo.textContent=(current+1)+' / '+frames.length;
  document.getElementById('prevBtn').disabled=current===0;
  document.getElementById('nextBtn').disabled=current===frames.length-1;
  selectionInfo.textContent=selection
    ? '選択：'+selection.w+'×'+selection.h+'px　矢印で1pxずつ動かせます'
    : (mode==='select'?'腕や脚を指で囲んでください':'指で描けます');
}
function setMode(m){
  mode=m;selection=null;dragStart=null;
  ['select','pen','eraser','picker'].forEach(n=>{
    const el=document.getElementById(n==='select'?'selectBtn':n+'Btn');
    if(el)el.classList.toggle('active',n===m);
  });
  updateInfo();draw();
}
function draw(){
  const scale=Math.max(6,Math.floor(620/Math.max(W,H)));
  editCanvas.width=W*scale;editCanvas.height=H*scale;
  editCanvas.style.width=viewZoom+'%';editCanvas.style.maxWidth='none';
  ctx.imageSmoothingEnabled=false;
  checker(ctx,editCanvas.width,editCanvas.height,Math.max(8,scale*2));

  if(onionToggle.checked&&current>0){
    ctx.save();ctx.globalAlpha=Number(onionOpacity.value)/100;
    ctx.drawImage(rawCanvas(frames[current-1]),0,0,W,H,0,0,W*scale,H*scale);ctx.restore();
  }
  ctx.drawImage(rawCanvas(frames[current]),0,0,W,H,0,0,W*scale,H*scale);

  if(gridToggle.checked&&scale>=6){
    ctx.save();ctx.strokeStyle='rgba(62,48,55,.18)';ctx.lineWidth=1;ctx.beginPath();
    for(let x=0;x<=W;x++){const px=x*scale+.5;ctx.moveTo(px,0);ctx.lineTo(px,H*scale)}
    for(let y=0;y<=H;y++){const py=y*scale+.5;ctx.moveTo(0,py);ctx.lineTo(W*scale,py)}
    ctx.stroke();ctx.restore();
  }
  if(selection){
    ctx.save();
    ctx.strokeStyle='#d97898';ctx.lineWidth=Math.max(2,scale*.22);
    ctx.setLineDash([Math.max(4,scale*.6),Math.max(3,scale*.4)]);
    ctx.strokeRect(selection.x*scale+.5,selection.y*scale+.5,selection.w*scale,selection.h*scale);
    ctx.restore();
  }
  drawPreview(current);updateInfo();
}
function point(e){
  const r=editCanvas.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/r.width*W);
  const y=Math.floor((e.clientY-r.top)/r.height*H);
  return {x:Math.max(0,Math.min(W-1,x)),y:Math.max(0,Math.min(H-1,y))};
}
function drawPreview(i){
  checker(pctx,previewCanvas.width,previewCanvas.height,10);
  const raw=rawCanvas(frames[i]||frames[0]);pctx.imageSmoothingEnabled=false;
  const s=Math.min(previewCanvas.width/W,previewCanvas.height/H),dw=W*s,dh=H*s;
  pctx.drawImage(raw,0,0,W,H,(previewCanvas.width-dw)/2,(previewCanvas.height-dh)/2,dw,dh);
}
function renderFrames(){
  framesEl.replaceChildren();
  frames.forEach((f,i)=>{
    const b=document.createElement('button');b.type='button';b.className='frame'+(i===current?' active':'');
    const c=document.createElement('canvas');c.width=60;c.height=60;
    const q=c.getContext('2d');checker(q,60,60,8);q.imageSmoothingEnabled=false;
    const raw=rawCanvas(f),s=Math.min(60/W,60/H),dw=W*s,dh=H*s;
    q.drawImage(raw,0,0,W,H,(60-dw)/2,(60-dh)/2,dw,dh);
    const sp=document.createElement('span');sp.textContent=String(i+1);
    b.append(c,sp);b.addEventListener('click',()=>goFrame(i));framesEl.appendChild(b);
  });
}
function goFrame(i){
  current=Math.max(0,Math.min(frames.length-1,i));selection=null;undo=[];renderFrames();draw();
  requestAnimationFrame(()=>framesEl.children[current]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}));
}
function pushUndo(){undo.push(clone(frames[current]));if(undo.length>40)undo.shift()}
function hexRgb(hex){const n=parseInt(hex.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255]}
function paint(p,erase=false){
  const n=Math.max(1,Number(brushSize.value)||1),half=Math.floor(n/2),rgb=hexRgb(colorPick.value);
  for(let yy=p.y-half;yy<p.y-half+n;yy++)for(let xx=p.x-half;xx<p.x-half+n;xx++){
    if(erase)setPx(frames[current],xx,yy,0,0,0,0);
    else setPx(frames[current],xx,yy,rgb[0],rgb[1],rgb[2],255);
  }
  draw();
}

editCanvas.addEventListener('pointerdown',e=>{
  e.preventDefault();const p=point(e);editCanvas.setPointerCapture?.(e.pointerId);
  if(mode==='select'){dragStart=p;selection={x:p.x,y:p.y,w:1,h:1};draw();return}
  if(mode==='picker'){
    const c=getPx(frames[current],p.x,p.y);
    if(c[3]){
      colorPick.value='#'+[c[0],c[1],c[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
      setMode('pen');
    }
    return;
  }
  drawing=true;beforeStroke=clone(frames[current]);paint(p,mode==='eraser');
});
editCanvas.addEventListener('pointermove',e=>{
  if(mode==='select'&&dragStart){
    e.preventDefault();selection=clampRect(normRect(dragStart,point(e)));draw();return;
  }
  if(drawing){e.preventDefault();paint(point(e),mode==='eraser')}
});
function endPointer(){
  if(mode==='select'&&dragStart){dragStart=null;draw();return}
  if(drawing){
    drawing=false;
    if(beforeStroke){undo.push(beforeStroke);if(undo.length>40)undo.shift()}
    beforeStroke=null;renderFrames();draw();
  }
}
editCanvas.addEventListener('pointerup',endPointer);
editCanvas.addEventListener('pointercancel',endPointer);

function moveSelection(dx,dy){
  if(!selection){note('先に動かしたい部分を囲んでください');return}
  const nx=Math.max(0,Math.min(W-selection.w,selection.x+dx));
  const ny=Math.max(0,Math.min(H-selection.h,selection.y+dy));
  dx=nx-selection.x;dy=ny-selection.y;if(!dx&&!dy)return;
  pushUndo();
  const src=frames[current],temp=[];
  for(let y=0;y<selection.h;y++)for(let x=0;x<selection.w;x++){
    temp.push(getPx(src,selection.x+x,selection.y+y));
  }
  for(let y=0;y<selection.h;y++)for(let x=0;x<selection.w;x++){
    const c=temp[y*selection.w+x];
    if(c[3])setPx(src,selection.x+x,selection.y+y,0,0,0,0);
  }
  for(let y=0;y<selection.h;y++)for(let x=0;x<selection.w;x++){
    const c=temp[y*selection.w+x];
    if(c[3])setPx(src,nx+x,ny+y,c[0],c[1],c[2],c[3]);
  }
  selection={...selection,x:nx,y:ny};renderFrames();draw();
}
function flipSelection(){
  if(!selection){note('先に反転したい部分を囲んでください');return}
  pushUndo();const src=frames[current],temp=[];
  for(let y=0;y<selection.h;y++)for(let x=0;x<selection.w;x++)temp.push(getPx(src,selection.x+x,selection.y+y));
  for(let y=0;y<selection.h;y++)for(let x=0;x<selection.w;x++){
    const c=temp[y*selection.w+(selection.w-1-x)];
    setPx(src,selection.x+x,selection.y+y,c[0],c[1],c[2],c[3]);
  }
  renderFrames();draw();
}

document.getElementById('selectBtn').addEventListener('click',()=>setMode('select'));
document.getElementById('penBtn').addEventListener('click',()=>setMode('pen'));
document.getElementById('eraserBtn').addEventListener('click',()=>setMode('eraser'));
document.getElementById('pickerBtn').addEventListener('click',()=>setMode('picker'));
document.getElementById('clearSelectionBtn').addEventListener('click',()=>{selection=null;draw()});
document.getElementById('moveUp').addEventListener('click',()=>moveSelection(0,-1));
document.getElementById('moveDown').addEventListener('click',()=>moveSelection(0,1));
document.getElementById('moveLeft').addEventListener('click',()=>moveSelection(-1,0));
document.getElementById('moveRight').addEventListener('click',()=>moveSelection(1,0));
document.getElementById('flipSelectionBtn').addEventListener('click',flipSelection);
document.getElementById('undoBtn').addEventListener('click',()=>{
  if(!undo.length){note('戻せる操作がありません');return}
  frames[current]=undo.pop();renderFrames();draw();
});

document.getElementById('duplicateBtn').addEventListener('click',()=>{
  frames.splice(current+1,0,clone(frames[current]));current++;selection=null;undo=[];renderFrames();draw();note('複製しました。動かしたい部分を囲んでください');
});
document.getElementById('addBlankBtn').addEventListener('click',()=>{
  frames.splice(current+1,0,blank(W,H));current++;selection=null;undo=[];renderFrames();draw();
});
document.getElementById('deleteFrameBtn').addEventListener('click',()=>{
  if(frames.length===1){note('最後の1枚は削除できません');return}
  frames.splice(current,1);current=Math.min(current,frames.length-1);selection=null;undo=[];renderFrames();draw();
});
document.getElementById('clearFrameBtn').addEventListener('click',()=>{
  pushUndo();frames[current]=blank(W,H);selection=null;renderFrames();draw();
});
document.getElementById('prevBtn').addEventListener('click',()=>goFrame(current-1));
document.getElementById('nextBtn').addEventListener('click',()=>goFrame(current+1));

document.querySelectorAll('.viewZoom').forEach(b=>b.addEventListener('click',()=>{
  viewZoom=Number(b.dataset.z);document.querySelectorAll('.viewZoom').forEach(x=>x.classList.toggle('active',x===b));draw();
}));
gridToggle.addEventListener('change',draw);
onionToggle.addEventListener('change',draw);
onionOpacity.addEventListener('input',()=>{onionText.textContent=onionOpacity.value+'%';draw()});

function loadImage(file){
  if(!file)return;
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    W=Math.min(128,img.naturalWidth);H=Math.min(128,img.naturalHeight);
    const c=document.createElement('canvas');c.width=W;c.height=H;
    const q=c.getContext('2d',{willReadFrequently:true});q.imageSmoothingEnabled=false;q.drawImage(img,0,0,W,H);
    frames=[new Uint8ClampedArray(q.getImageData(0,0,W,H).data)];current=0;selection=null;undo=[];
    baseName.value=(file.name||'sprite').replace(/\.[^.]+$/,'')||'sprite';
    sourceInfo.textContent='読み込み：'+img.naturalWidth+'×'+img.naturalHeight+' → 編集 '+W+'×'+H+'px';
    URL.revokeObjectURL(url);renderFrames();draw();note('読み込みました');
  };
  img.onerror=()=>{URL.revokeObjectURL(url);note('画像を読み込めませんでした')};img.src=url;
}
fileInput.addEventListener('change',()=>loadImage(fileInput.files[0]));

fps.addEventListener('input',()=>{fpsText.textContent=fps.value+' fps';if(previewTimer){stopPreview();startPreview()}});
function startPreview(){
  stopPreview();previewIndex=0;drawPreview(0);
  previewTimer=setInterval(()=>{previewIndex=(previewIndex+1)%frames.length;drawPreview(previewIndex)},1000/Number(fps.value));
}
function stopPreview(){if(previewTimer){clearInterval(previewTimer);previewTimer=null}drawPreview(current)}
document.getElementById('playBtn').addEventListener('click',startPreview);
document.getElementById('stopBtn').addEventListener('click',stopPreview);

function blobOf(c){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error()),'image/png'))}
function saveBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
document.getElementById('saveCurrentBtn').addEventListener('click',async()=>{
  saveBlob(await blobOf(rawCanvas(frames[current])),safeName(baseName.value)+'_'+String(current+1).padStart(2,'0')+'.png');note('保存しました');
});
document.getElementById('sheetBtn').addEventListener('click',async()=>{
  const c=document.createElement('canvas');c.width=W*frames.length;c.height=H;const q=c.getContext('2d');q.imageSmoothingEnabled=false;
  frames.forEach((f,i)=>q.drawImage(rawCanvas(f),i*W,0));saveBlob(await blobOf(c),safeName(baseName.value)+'_sheet.png');note('保存しました');
});
document.getElementById('saveAllBtn').addEventListener('click',async()=>{
  const files=[],name=safeName(baseName.value);fallback.replaceChildren();
  for(let i=0;i<frames.length;i++)files.push(new File([await blobOf(rawCanvas(frames[i]))],name+'_'+String(i+1).padStart(2,'0')+'.png',{type:'image/png'}));
  try{
    if(navigator.share&&(!navigator.canShare||navigator.canShare({files}))){await navigator.share({files,title:'ドット絵差分'});note(files.length+'枚を共有しました');return}
  }catch(e){if(e&&e.name==='AbortError'){note('キャンセルしました');return}}
  files.forEach(file=>{const u=URL.createObjectURL(file),a=document.createElement('a');a.className='btn';a.href=u;a.download=file.name;a.textContent=file.name;a.addEventListener('click',()=>setTimeout(()=>URL.revokeObjectURL(u),1500),{once:true});fallback.appendChild(a)});
  note('下から保存してください');
});
document.getElementById('projectBtn').addEventListener('click',()=>{
  const data={version:2,width:W,height:H,name:safeName(baseName.value),frames:frames.map(f=>Array.from(f))};
  saveBlob(new Blob([JSON.stringify(data)],{type:'application/json'}),safeName(baseName.value)+'_project.json');note('作業データを保存しました');
});
projectInput.addEventListener('change',async()=>{
  const file=projectInput.files[0];if(!file)return;
  try{
    const d=JSON.parse(await file.text()),w=Number(d.width),h=Number(d.height);
    if(!w||!h||!Array.isArray(d.frames)||!d.frames.length)throw new Error();
    const need=w*h*4,arr=d.frames.map(a=>{if(!Array.isArray(a)||a.length!==need)throw new Error();return new Uint8ClampedArray(a)});
    W=w;H=h;frames=arr;current=0;selection=null;undo=[];if(d.name)baseName.value=d.name;
    sourceInfo.textContent='作業データ：'+W+'×'+H+'px / '+frames.length+'フレーム';renderFrames();draw();note('読み込みました');
  }catch(e){note('作業データを読み込めませんでした')}
});

onionText.textContent=onionOpacity.value+'%';fpsText.textContent=fps.value+' fps';
renderFrames();draw();setMode('select');
})();
</script>
</body>
</html>
