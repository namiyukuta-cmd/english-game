<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DD TRPG</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#17130f;color:#2f2418;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans JP",sans-serif}
button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}

#gameScreen{position:relative;width:100%;height:100dvh;min-height:560px;overflow:hidden;display:grid;grid-template-rows:92px minmax(0,1fr) auto;background:#e9d8b8}

#topBar{position:relative;z-index:20;display:grid;grid-template-columns:54px minmax(0,1fr) 110px;min-height:92px;background:#33271e;color:#f1dfc1;border-bottom:1px solid #6d563c}
#topLeft{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 2px}
#topCenter{min-width:0;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:5px 4px}
#dateTime{font-size:14px;font-weight:700}
#currentLocation{margin-top:2px;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#statusLine{margin-top:5px;display:flex;justify-content:center;gap:12px;font-size:13px}

#topRight{display:grid;grid-template-columns:46px 46px;grid-template-rows:38px 38px;justify-content:end;align-content:start;gap:4px 5px;padding:6px 5px}
#loadButton{grid-column:1;grid-row:1}
#saveButton{grid-column:2;grid-row:1}
#logButton{grid-column:2;grid-row:2}

.system-button{width:46px;height:38px;border:1px solid #776047;border-radius:7px;background:#49382a;color:#f2dfbe;padding:2px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:10px;font-weight:700}
.system-button .icon{font-size:17px;line-height:1}
.system-button .label{margin-top:2px;font-size:8px}

#mainArea{min-height:0;display:grid;grid-template-rows:minmax(180px,45%) minmax(100px,1fr);overflow:hidden}
#sceneArea{position:relative;min-height:0;border-bottom:1px solid #9e8765;background:#cab591;overflow:hidden}
#sceneImage{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat}
#scenePlaceholder{position:absolute;inset:0;display:grid;place-items:center;color:#66533d;font-size:15px}
#messageArea{min-height:0;overflow-y:auto;background:#f1e3c9;padding:12px 14px 18px}
#speakerName{margin-bottom:5px;font-size:15px;font-weight:800;color:#5e4630}
#messageText{margin:0;font-size:15px;line-height:1.75;white-space:pre-wrap}

#actionArea{position:relative;z-index:15;min-height:68px;display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:7px 50px calc(7px + env(safe-area-inset-bottom)) 7px;background:#30241b;border-top:1px solid #71593f}
.action-button{min-width:60px;min-height:44px;border:1px solid #806849;border-radius:7px;background:#ead4ae;color:#352719;padding:6px 9px;font-size:14px;font-weight:800}

#menuDock{position:absolute;z-index:70;right:0;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:5px;overflow:visible}
#sideMenuItems{width:80px;display:flex;flex-direction:column;gap:5px;padding:6px 6px 6px 0;border:1px solid #6d553d;border-right:none;border-radius:9px 0 0 9px;background:rgba(45,33,24,.97);box-shadow:-4px 4px 12px rgba(0,0,0,.25);transform:translateX(100%);opacity:0;pointer-events:none;transition:transform .18s ease-out,opacity .14s ease-out}
#menuDock.open #sideMenuItems{transform:translateX(0);opacity:1;pointer-events:auto}
.menu-button{width:74px;min-height:43px;border:1px solid #806748;border-right:none;border-radius:7px 0 0 7px;background:#ead3ab;color:#362819;font-size:12px;font-weight:800}
#menuToggleButton{width:34px;height:46px;min-height:46px;border:1px solid #6b533b;border-right:none;border-radius:8px 0 0 8px;background:#3b2c21;color:#f0ddbd;font-size:18px;padding:0;position:relative;z-index:2}

#windowLayer{position:absolute;z-index:50;inset:92px 8px 76px 8px;pointer-events:none}
#gameWindow{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;border:2px solid #6e563d;border-radius:10px;background:#f0e1c5;box-shadow:0 8px 25px rgba(0,0,0,.38);pointer-events:auto}
#windowHeader{min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:5px 7px 5px 12px;background:#d6bd94;border-bottom:1px solid #866e4f}
#windowTitle{font-size:17px;font-weight:800}
#windowCloseButton{width:38px;height:38px;border:1px solid #7c6245;border-radius:50%;background:#f2dec0;color:#3a2a1d;font-size:20px;font-weight:700}
#windowContent{flex:1;min-height:0;overflow:auto;padding:10px 12px 14px;font-size:15px;line-height:1.7}

.skill-summary{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 7px;padding:6px 8px;border:1px solid #a48a64;border-radius:6px;background:#e1c9a2;font-size:13px;font-weight:700}
.skill-legend{font-size:11px;font-weight:600;color:#70583f;text-align:right;white-space:nowrap}
.skill-list{border:1px solid #ad936d;border-radius:7px;overflow:hidden;background:#f8ead0}
.skill-row{padding:4px 6px 5px;border-bottom:1px solid #d1b891;background:#f8ead0}
.skill-row:last-child{border-bottom:0}
.skill-main{display:grid;grid-template-columns:minmax(0,1fr) 40px 44px 24px;gap:5px;align-items:center;min-height:30px}
.skill-name{min-width:0;font-size:14px;font-weight:850;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skill-name small{margin-left:5px;color:#765f45;font-size:11px;font-weight:700}
.skill-ability,.skill-mod{height:28px;display:grid;place-items:center;border:1px solid #a98d67;border-radius:5px;background:#dfc8a5;font-size:11px;font-weight:800}
.skill-mod{background:#ead6b5;font-size:14px}
.skill-prof{width:21px;height:21px;border:2px dashed #927b5f;border-radius:50%;justify-self:center;display:grid;place-items:center;color:#f5e8d2;font-size:9px;font-weight:900}
.skill-prof.on{border-style:solid;border-color:#6d352a;background:#8a3d31}
.skill-prof.expertise{border-style:double;border-width:3px;border-color:#6d352a;background:#8a3d31}
.skill-desc-inline{margin-top:1px;padding:0 2px 1px;color:#6b543c;font-size:11px;line-height:1.35}

.inventory-screen{font-size:17px;line-height:1.55}
.inventory-money{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.inventory-money span{min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid #a98d67;border-radius:6px;background:#dfc8a5;font-size:17px}
.inventory-money strong{font-size:19px}
.inventory-weight{margin-bottom:16px;text-align:right;font-size:17px}
.inventory-weight strong{font-size:18px}
.inventory-title{margin:14px 0 7px;font-size:19px}
.inventory-row{width:100%;min-height:58px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;margin-bottom:7px;padding:9px 11px;border:1px solid #a98d67;border-radius:7px;background:#f8ead0;color:#342719;text-align:left;cursor:pointer}
.inventory-row:focus-visible,.item-back:focus-visible,.item-actions button:focus-visible{outline:3px solid #704f30;outline-offset:2px}
.inventory-name{min-width:0;display:flex;flex-direction:column}
.inventory-name strong{font-size:17px;line-height:1.35}
.inventory-name small{margin-top:2px;font-size:17px;line-height:1.35;color:#715a40}
.inventory-quantity{font-size:17px;font-weight:800;white-space:nowrap}
.inventory-row.equipped{background:#dfc8a5;border-color:#8d704d}
.inventory-empty{margin:7px 0 13px;font-size:17px;color:#715a40}
.item-back{min-height:48px;margin-bottom:10px;padding:8px 12px;border:1px solid #a98d67;border-radius:6px;background:#ead6b5;color:#352719;font-size:17px;font-weight:750}
.item-detail{font-size:17px}
.item-detail h2{margin:4px 0;font-size:22px;line-height:1.4}
.item-ja{margin:0 0 10px;font-size:17px;color:#715a40}
.item-owned-count{margin:8px 0;font-size:17px}
.item-equipped-label{margin:8px 0;padding:8px 10px;border-left:4px solid #806849;background:#dfc8a5;font-size:17px;font-weight:800}
.item-stat{min-height:48px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #c4aa84;font-size:17px}
.item-stat strong{font-size:18px;text-align:right}
.item-actions{display:grid;gap:8px;margin-top:16px}
.item-actions:empty{display:none}
.item-actions button{min-height:52px;border:1px solid #806849;border-radius:7px;background:#ead4ae;color:#352719;font-size:17px;font-weight:800}

@media(max-width:430px){
  #topBar{grid-template-columns:50px minmax(0,1fr) 104px}
  #topRight{grid-template-columns:43px 43px}
  #dateTime{font-size:13px}
  #currentLocation{font-size:15px}
  #statusLine{gap:8px;font-size:12px}
  .system-button{width:43px}
  #messageText{font-size:15px}
  .action-button{min-width:58px;font-size:14px}
  .skill-main{grid-template-columns:minmax(0,1fr) 38px 42px 22px;gap:4px}
  .skill-name{font-size:13px}
  .skill-name small{font-size:10px}
  .skill-desc-inline{font-size:10px}
}
</style>
</head>
<body>
<div id="gameScreen">
  <header id="topBar">
    <div id="topLeft">
      <button id="topButton" class="system-button" type="button">
        <span class="icon">⌂</span><span class="label">TOP</span>
      </button>
    </div>

    <div id="topCenter">
      <div id="dateTime"><span id="gameDate">Day 1</span> ・ <span id="gameTime">08:00</span></div>
      <div id="currentLocation">Brackenford</div>
      <div id="statusLine">
        <span>HP <strong id="miniHp">12/12</strong></span>
        <span>AC <strong id="miniAc">14</strong></span>
        <span>Lv. <strong id="miniLevel">1</strong></span>
      </div>
    </div>

    <div id="topRight">
      <button id="loadButton" class="system-button" type="button">
        <span class="icon">⇩</span><span class="label">LOAD</span>
      </button>
      <button id="saveButton" class="system-button" type="button">
        <span class="icon">▣</span><span class="label">SAVE</span>
      </button>
      <button id="logButton" class="system-button" type="button">
        <span class="icon">≡</span><span class="label">LOG</span>
      </button>
    </div>
  </header>

  <main id="mainArea">
    <section id="sceneArea">
      <div id="sceneImage"></div>
      <div id="scenePlaceholder">MAP / SCENE</div>
    </section>
    <section id="messageArea">
      <div id="speakerName">Brackenford</div>
      <p id="messageText">石造りの建物が並ぶ町だ。
通りには旅人と商人の姿が見える。</p>
    </section>
  </main>

  <div id="actionArea">
    <button class="action-button" type="button">移動</button>
    <button class="action-button" type="button">話す</button>
    <button class="action-button" type="button">調べる</button>
  </div>

  <div id="menuDock">
    <nav id="sideMenuItems">
      <button class="menu-button" data-window="quest" type="button">QUEST</button>
      <button class="menu-button" data-window="inventory" type="button">ITEM</button>
      <button class="menu-button" data-window="skill" type="button">SKILL</button>
      <button class="menu-button" data-window="player" type="button">CHAR</button>
      <button class="menu-button" data-window="memo" type="button">MEMO</button>
    </nav>
    <button id="menuToggleButton" type="button" aria-label="メニューを開く" aria-expanded="false">◀</button>
  </div>

  <div id="windowLayer" hidden>
    <section id="gameWindow">
      <header id="windowHeader">
        <div id="windowTitle">ITEM</div>
        <button id="windowCloseButton" type="button" aria-label="窓を閉じる">×</button>
      </header>
      <div id="windowContent">ここにITEM・QUEST・CHARなどを表示</div>
    </section>
  </div>
</div>

<script src="data/dd-items.js?v=20260826-1"></script>
<script src="js/dd-inventory.js?v=20260826-1"></script>
<script src="js/dd-inventory-ui.js?v=20260826-1"></script>
<script src="js/dd-github.js?v=20260826-1"></script>
<script src="js/dd-save.js?v=20260826-1"></script>
<script>
const topButton=document.getElementById('topButton');
const loadButton=document.getElementById('loadButton');
const saveButton=document.getElementById('saveButton');

topButton.addEventListener('click',()=>{
  location.href='DD_top.html';
});

loadButton.addEventListener('click',()=>{
  location.href='DD_saves.html';
});

saveButton.addEventListener('click',async()=>{
  if(saveButton.disabled)return;
  saveButton.disabled=true;
  try{
    const raw=localStorage.getItem('ddActiveGame');
    if(!raw)throw new Error('セーブするゲームデータがありません。');
    const game=JSON.parse(raw);
    const saved=await DDSave.openSaveDialog(game);
    localStorage.setItem('ddActiveGame',JSON.stringify(saved));
  }catch(error){
    if(error&&error.message==='セーブをキャンセルしました。')return;
    alert(error&&error.message?error.message:'セーブに失敗しました。');
  }finally{
    saveButton.disabled=false;
  }
});

const menuDock=document.getElementById('menuDock');
const menuToggleButton=document.getElementById('menuToggleButton');

menuToggleButton.addEventListener('click',()=>{
  const opening=!menuDock.classList.contains('open');
  menuDock.classList.toggle('open',opening);
  menuToggleButton.textContent=opening?'▶':'◀';
  menuToggleButton.setAttribute('aria-expanded',opening?'true':'false');
  menuToggleButton.setAttribute('aria-label',opening?'メニューを閉じる':'メニューを開く');
});

const windowLayer=document.getElementById('windowLayer');
const windowTitle=document.getElementById('windowTitle');
const windowContent=document.getElementById('windowContent');
const windowCloseButton=document.getElementById('windowCloseButton');
const windowNames={quest:'QUEST',inventory:'ITEM',skill:'SKILLS',player:'CHAR',memo:'MEMO'};

if(window.DDInventory)DDInventory.getGame();

const skillDefs=[
  {name:'Acrobatics',ja:'軽業',ability:'dex',desc:'バランスを保つ、足場の悪い場所を渡る、身軽な動きをする時に使う。'},
  {name:'Animal Handling',ja:'動物使い',ability:'wis',desc:'動物を落ち着かせる、扱う、意図を読む時に使う。'},
  {name:'Arcana',ja:'魔法学',ability:'int',desc:'呪文、魔法の品、魔法現象などについて知識を思い出す時に使う。'},
  {name:'Athletics',ja:'運動',ability:'str',desc:'登る、跳ぶ、泳ぐ、押す・引くなど、力を使う行動に使う。'},
  {name:'Deception',ja:'ペテン',ability:'cha',desc:'嘘を信じ込ませる、正体や意図をごまかす時に使う。'},
  {name:'History',ja:'歴史',ability:'int',desc:'過去の出来事、人物、国、戦争などの知識を思い出す時に使う。'},
  {name:'Insight',ja:'看破',ability:'wis',desc:'相手の態度や言葉から、本音、嘘、意図などを読み取る時に使う。'},
  {name:'Intimidation',ja:'威圧',ability:'cha',desc:'脅しや迫力で、相手を従わせようとする時に使う。'},
  {name:'Investigation',ja:'捜査',ability:'int',desc:'手掛かりを探し、情報を組み合わせて答えを導く時に使う。'},
  {name:'Medicine',ja:'医術',ability:'wis',desc:'傷や病気の状態を判断し、応急処置などを行う時に使う。'},
  {name:'Nature',ja:'自然',ability:'int',desc:'動植物、天候、地形など、自然界についての知識を思い出す時に使う。'},
  {name:'Perception',ja:'知覚',ability:'wis',desc:'見る、聞く、匂いを嗅ぐなどで、周囲の異変に気づく時に使う。'},
  {name:'Performance',ja:'芸能',ability:'cha',desc:'歌、演奏、演技、踊りなどで、人を楽しませる時に使う。'},
  {name:'Persuasion',ja:'説得',ability:'cha',desc:'話し合い、礼儀、理屈などで、相手の考えや行動を動かす時に使う。'},
  {name:'Religion',ja:'宗教',ability:'int',desc:'神々、信仰、聖職、宗教儀式などについて知識を思い出す時に使う。'},
  {name:'Sleight of Hand',ja:'手先の早業',ability:'dex',desc:'スリ、こっそり物を隠すなど、細かな手作業をごまかす時に使う。'},
  {name:'Stealth',ja:'隠密',ability:'dex',desc:'姿や音を隠し、相手に気づかれずに動く時に使う。'},
  {name:'Survival',ja:'生存',ability:'wis',desc:'追跡、道探し、野外での危険回避や食料確保などに使う。'}
];

function escHtml(value){
  return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function fmtMod(value){return value>=0?`+${value}`:String(value);}
function abilityMod(score){return Math.floor(((Number(score)||10)-10)/2);}
function proficiencyBonusFromLevel(level){
  const lv=Math.max(1,Math.min(20,Math.floor(Number(level)||1)));
  return Math.min(6,2+Math.floor((lv-1)/4));
}
function activeGame(){
  try{return JSON.parse(localStorage.getItem('ddActiveGame')||'null');}catch(_){return null;}
}
function renderSkillWindow(){
  const game=activeGame();
  const character=game&&game.character?game.character:{};
  const abilities=character.abilities||{};
  const level=Math.max(1,Math.floor(Number(character.level)||1));
  const proficiencyBonus=proficiencyBonusFromLevel(level);
  const proficient=new Set((Array.isArray(character.skills)?character.skills:[]).map(v=>String(v).toLowerCase()));
  const expertiseSource=character.classChoices&&Array.isArray(character.classChoices.expertise)?character.classChoices.expertise:[];
  const expertise=new Set(expertiseSource.map(v=>String(v).toLowerCase()));

  const rows=skillDefs.map(skill=>{
    const key=skill.name.toLowerCase();
    const isExpert=expertise.has(key);
    const isProficient=isExpert||proficient.has(key);
    const base=abilityMod(abilities[skill.ability]);
    const total=base+(isExpert?proficiencyBonus*2:isProficient?proficiencyBonus:0);
    const profClass=isExpert?'skill-prof expertise':isProficient?'skill-prof on':'skill-prof';
    const profMark=isExpert?'E':isProficient?'●':'';
    const profLabel=isExpert?'Expertise':isProficient?'習熟':'未習熟';
    return `<div class="skill-row">
      <div class="skill-main">
        <div class="skill-name">${escHtml(skill.name)}<small>${escHtml(skill.ja)}</small></div>
        <div class="skill-ability">${skill.ability.toUpperCase()}</div>
        <div class="skill-mod">${fmtMod(total)}</div>
        <div class="${profClass}" aria-label="${profLabel}" title="${profLabel}">${profMark}</div>
      </div>
      <div class="skill-desc-inline">${escHtml(skill.desc)}</div>
    </div>`;
  }).join('');

  return `<div class="skill-summary"><span>Lv.${level}　習熟ボーナス ${fmtMod(proficiencyBonus)}</span><span class="skill-legend">● 習熟　E Expertise</span></div><div class="skill-list">${rows}</div>`;
}

document.querySelectorAll('.menu-button').forEach(button=>{
  button.addEventListener('click',()=>{
    const type=button.dataset.window;
    windowTitle.textContent=windowNames[type]||type;
    if(type==='skill')windowContent.innerHTML=renderSkillWindow();
    else if(type==='inventory')DDInventoryUI.render(windowContent);
    else windowContent.innerHTML=`<p>${windowNames[type]} の内容をここに表示します。</p>`;
    windowLayer.hidden=false;
  });
});

windowCloseButton.addEventListener('click',()=>{windowLayer.hidden=true;});
</script>
</body>
</html>
