<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>House Building - Game</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d9d9d9;
      color: #222;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100dvh;
    }

    #game {
      width: 100%;
      height: 100dvh;
      display: grid;
      place-items: center;
    }

    .placeholder {
      text-align: center;
      padding: 24px;
    }

    .placeholder h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .placeholder p {
      margin: 0;
      color: #555;
    }
  </style>
</head>
<body>
  <main id="game">
    <section class="placeholder">
      <h1>家作りゲーム</h1>
      <p>ここに3Dマス座標式のゲーム画面を作成します。</p>
    </section>
  </main>
</body>
</html>
