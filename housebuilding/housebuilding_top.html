<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#d8d3c8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>House Building</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8d3c8;color:#26231f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
    button{font:inherit}

    #app{
      width:100%;
      height:100dvh;
      overflow:hidden;
      display:grid;
      grid-template-rows:auto minmax(0,1fr) 156px auto;
      background:#dce5e8;
    }

    #topSection{
      position:relative;
      z-index:20;
      padding:max(10px,env(safe-area-inset-top)) 10px 8px;
      background:#dce5e8;
    }
    .topbar{
      display:grid;
      grid-template-columns:46px 1fr auto;
      gap:8px;
      align-items:center;
    }
    .icon-btn,.status{
      min-height:44px;
      border:1px solid rgba(50,45,38,.25);
      background:rgba(255,255,255,.9);
      color:#27231d;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
      backdrop-filter:blur(8px);
    }
    .icon-btn{width:46px;border-radius:13px;font-size:20px;font-weight:800}
    .status{border-radius:13px;padding:7px 11px;min-width:0}
    .status strong{display:block;font-size:13px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .status small{display:block;margin-top:2px;color:#6e675d;font-size:10px}
    .count{border-radius:13px;padding:0 12px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;white-space:nowrap}

    #buildSection{
      position:relative;
      min-height:0;
      overflow:hidden;
      background:#dce5e8;
      border-top:1px solid rgba(50,45,38,.12);
      border-bottom:1px solid rgba(50,45,38,.18);
    }
    #scene{position:absolute;inset:0}
    #scene canvas{display:block;width:100%;height:100%;touch-action:none}
    #error{position:absolute;inset:20% 18px auto;z-index:30;display:none;padding:16px;border-radius:14px;background:#fff;color:#222;border:1px solid #aaa;line-height:1.6;font-size:14px}

    #lowerSection{
      position:relative;
      z-index:20;
      display:grid;
      grid-template-columns:124px 1fr;
      gap:8px;
      padding:8px 10px;
      background:#cfc8ba;
      min-height:0;
    }
    .camera-controls{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:6px;
      align-content:start;
    }
    .camera-controls button{
      min-height:44px;
      border:1px solid rgba(50,45,38,.22);
      border-radius:12px;
      background:rgba(255,255,255,.9);
      color:#2e2922;
      font-size:13px;
      font-weight:800;
      backdrop-filter:blur(8px);
    }
    .camera-controls button.icon-only{font-size:18px}
    .camera-controls button.view-active{background:#5f574c;color:#fff;border-color:#5f574c}
    .camera-controls button:disabled{opacity:.38}
    .toolbar-wrap{min-width:0;display:flex;flex-direction:column;gap:6px}
    .hint{width:100%;padding:5px 8px;border-radius:10px;background:rgba(32,29,25,.72);color:#fff;font-size:10px;text-align:center}
    .toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;flex:1}
    .tool{min-width:0;border:1px solid #c9c1b5;border-radius:13px;background:#fff;color:#332e27;font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
    .tool span{font-size:19px;line-height:1}
    .tool.active{border-color:#5f574c;background:#5f574c;color:#fff}

    #bottomMenu{
      position:relative;
      z-index:30;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:7px;
      padding:8px 10px calc(8px + env(safe-area-inset-bottom));
      background:rgba(248,246,241,.97);
      border-top:1px solid rgba(50,45,38,.22);
      box-shadow:0 -3px 12px rgba(0,0,0,.08);
    }
    .menu-btn{
      min-height:48px;
      border:1px solid #c9c1b5;
      border-radius:12px;
      background:#fff;
      color:#332e27;
      font-size:12px;
      font-weight:800;
    }
  </style>
</head>
<body>
  <main id="app">

    <section id="topSection">
      <header class="topbar">
        <button class="icon-btn" id="backBtn" aria-label="戻る">←</button>
        <div class="status">
          <strong id="cellStatus">マスをタップしてください</strong>
          <small>12 × 12 GRID / X・Y・Z座標で管理</small>
        </div>
        <div class="status count" id="objectCount">0 個</div>
      </header>
    </section>

    <section id="buildSection" aria-label="建築マス">
      <div id="scene" aria-label="3D家作りフィールド"></div>
      <div id="error">3D表示を読み込めませんでした。通信状態を確認して、ページを再読み込みしてください。</div>
    </section>

    <section id="lowerSection" aria-label="建築操作">
      <div class="camera-controls" aria-label="視点操作">
        <button id="viewTop" class="view-active">見下ろし</button>
        <button id="view3d">3D</button>
        <button id="rotateLeft" class="icon-only" aria-label="左へ回転" disabled>↶</button>
        <button id="rotateRight" class="icon-only" aria-label="右へ回転" disabled>↷</button>
      </div>

      <div class="toolbar-wrap">
        <div class="hint">1本指で配置 / 2本指で拡大・縮小</div>
        <nav class="toolbar" aria-label="建築ツール">
          <button class="tool active" data-tool="block"><span>■</span>ブロック</button>
          <button class="tool" data-tool="delete"><span>×</span>削除</button>
        </nav>
      </div>
    </section>

    <nav id="bottomMenu" aria-label="ゲームメニュー">
      <button class="menu-btn" type="button">ステータス</button>
      <button class="menu-btn" type="button">スキル</button>
      <button class="menu-btn" type="button">メニュー</button>
    </nav>

  </main>

  <script type="module" src="./js/housebuilding_3d.js?v=20260911-1"></script>
  <script src="./js/housebuilding_画面移動.js?v=20260911-nohistory1"></script>
</body>
</html>
