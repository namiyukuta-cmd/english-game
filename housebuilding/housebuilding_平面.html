<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>House Building - 平面</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ece8df;
      color: #222;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      min-height: 100dvh;
      overflow: hidden;
    }
    #app {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .placeholder {
      text-align: center;
    }
    .placeholder h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }
    .placeholder p {
      margin: 0;
      color: #666;
    }
    .back {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      width: 46px;
      height: 46px;
      border: 1px solid #888;
      border-radius: 12px;
      background: #fff;
      font-size: 20px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main id="app">
    <button class="back" id="back" aria-label="戻る">←</button>
    <section class="placeholder">
      <h1>平面の家作り</h1>
      <p>ここに平面版の家作り画面を作成します。</p>
    </section>
  </main>

  <script>
    document.getElementById('back').addEventListener('click', () => {
      location.href = './housebuilding_選択.html';
    });
  </script>
</body>
</html>
