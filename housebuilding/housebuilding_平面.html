<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#d7e2ea" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>House Building - 2D</title>
  <link rel="stylesheet" href="./css/housebuilding_平面.css?v=20260911-1145" />
</head>
<body>
  <main id="app">
    <header class="topbar">
      <button class="back" id="back" aria-label="戻る">←</button>
      <div class="status">
        <strong id="status">アイテムを選んでください</strong>
        <small>2D SIDE VIEW / X・Y座標で管理</small>
      </div>
      <div class="count" id="count">0 個</div>
    </header>

    <section id="fieldWrap" aria-label="2D家作りフィールド">
      <div id="field"><div class="ground"></div></div>
    </section>

    <section id="inventoryWrap" aria-label="インベントリ">
      <div class="inventoryHead">
        <strong>インベントリ</strong>
        <span id="selectedItemLabel">未選択</span>
        <button id="deleteTool" type="button">削除</button>
      </div>
      <div id="inventoryGrid"></div>
    </section>
  </main>

  <script src="./js/housebuilding_平面_アイテム.js?v=20260911-1145"></script>
  <script src="./js/housebuilding_2d.js?v=20260911-1145"></script>
</body>
</html>
