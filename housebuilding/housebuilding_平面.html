<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#d7e2ea" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>House Building - 2D</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#d7e2ea;color:#25231f;touch-action:none}
    button{font:inherit}
    #app{position:relative;width:100%;height:100dvh;overflow:hidden;background:linear-gradient(#c9d9e8 0 66%,#a8a08f 66% 100%)}
    .topbar{position:absolute;z-index:20;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:grid;grid-template-columns:46px 1fr auto;gap:8px;align-items:center;pointer-events:none}
    .topbar>*{pointer-events:auto}
    .back,.status,.count{min-height:44px;border:1px solid rgba(65,59,50,.25);background:rgba(255,255,255,.91);box-shadow:0 2px 8px rgba(0,0,0,.08);backdrop-filter:blur(8px)}
    .back{width:46px;border-radius:13px;font-size:21px;font-weight:800}
    .status{min-width:0;border-radius:13px;padding:7px 11px}
    .status strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .status small{display:block;margin-top:2px;font-size:10px;color:#6f6a62}
    .count{border-radius:13px;padding:0 12px;display:flex;align-items:center;font-size:12px;font-weight:800;white-space:nowrap}
    #fieldWrap{position:absolute;left:10px;right:10px;top:92px;bottom:50%;display:flex;align-items:center;justify-content:center;overflow:hidden}
    #field{--cols:16;--rows:11;position:relative;width:min(100%,760px);aspect-ratio:16/11;max-height:100%;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);background:rgba(238,231,210,.24);border-left:2px solid rgba(68,60,49,.45);border-right:2px solid rgba(68,60,49,.45);border-bottom:5px solid #655744;box-shadow:0 8px 18px rgba(0,0,0,.12)}
    .cell{position:relative;border-right:1px solid rgba(64,58,50,.14);border-bottom:1px solid rgba(64,58,50,.14);min-width:0;min-height:0;background:transparent;padding:0}
    .cell::after{content:"";position:absolute;inset:0;pointer-events:none}
    .cell.target::after{background:rgba(255,255,255,.35);outline:2px solid rgba(255,255,255,.75);outline-offset:-2px}
    .cell.block{background:linear-gradient(135deg,#a47c58,#8b684c);box-shadow:inset 0 0 0 1px rgba(75,51,35,.35)}
    .cell.block::before{content:"";position:absolute;inset:18% 12%;border-top:1px solid rgba(255,255,255,.17);border-bottom:1px solid rgba(60,40,28,.18);transform:skewX(-14deg);pointer-events:none}
    .ground{position:absolute;left:0;right:0;bottom:0;height:12%;background:linear-gradient(#776952,#5e5242);z-index:-1}
    .toolbarWrap{position:absolute;z-index:20;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom))}
    .hint{width:max-content;max-width:calc(100% - 20px);margin:0 auto 7px;padding:6px 10px;border-radius:999px;background:rgba(37,33,28,.74);color:#fff;font-size:11px;text-align:center}
    .toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:8px;border:1px solid rgba(65,59,50,.25);border-radius:18px;background:rgba(249,247,242,.93);box-shadow:0 4px 16px rgba(0,0,0,.10);backdrop-filter:blur(10px)}
    .tool{min-height:54px;border:1px solid #c8c0b5;border-radius:13px;background:#fff;color:#312d27;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
    .tool span{font-size:18px;line-height:1}
    .tool.active{background:#5f574c;color:#fff;border-color:#5f574c}
  </style>
</head>
<body>
  <main id="app">
    <header class="topbar">
      <button class="back" id="back" aria-label="戻る">←</button>
      <div class="status">
        <strong id="status">マスをタップしてください</strong>
        <small>2D SIDE VIEW / X・Y座標で管理</small>
      </div>
      <div class="count" id="count">0 個</div>
    </header>

    <section id="fieldWrap" aria-label="2D家作りフィールド">
      <div id="field"><div class="ground"></div></div>
    </section>

    <div class="toolbarWrap">
      <div class="hint">正面から見た家の断面に、マス単位で置きます</div>
      <nav class="toolbar" aria-label="建築ツール">
        <button class="tool active" data-tool="block"><span>■</span>ブロック</button>
        <button class="tool" data-tool="delete"><span>×</span>削除</button>
      </nav>
    </div>
  </main>

  <script src="./js/housebuilding_2d.js"></script>
</body>
</html>
