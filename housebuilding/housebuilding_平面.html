<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#d7e2ea" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>House Building - 2D</title>
  <link rel="stylesheet" href="./css/housebuilding_平面.css?v=20260911-topmenu1" />
</head>
<body>
  <main id="app">

    <section id="topSection" aria-label="上部情報">
      <header class="topbar">
        <button class="back" id="back" aria-label="戻る">←</button>
        <div class="status">
          <strong id="status">アイテムを選んでください</strong>
          <small>2D SIDE VIEW / X・Y座標で管理</small>
        </div>

        <div class="topMenuWrap">
          <div id="topQuickMenu" class="topQuickMenu" aria-label="クイックメニュー" hidden>
            <button type="button" id="quickTop">TOP</button>
            <button type="button" id="quickLog">LOG</button>
            <button type="button" id="quickRoad">ROAD</button>
            <button type="button" id="quickSave">SAVE</button>
          </div>
          <button class="topMenuToggle" id="topMenuToggle" type="button" aria-label="メニューを開く" aria-expanded="false">•••</button>
        </div>
      </header>
    </section>

    <section id="fieldWrap" aria-label="2D家作りフィールド">
      <div id="field"><div class="ground"></div></div>
    </section>

    <section id="inventoryWrap" aria-label="インベントリ">
      <div class="inventoryHead">
        <strong>インベントリ</strong>
        <span id="selectedItemLabel">未選択</span>
        <button id="deleteTool" type="button">削除</button>
      </div>
      <div id="inventoryGrid"></div>
    </section>

    <nav id="bottomMenu" aria-label="ゲームメニュー">
      <button class="menu-btn" type="button">ステータス</button>
      <button class="menu-btn" type="button">スキル</button>
      <button class="menu-btn" type="button">メニュー</button>
    </nav>

  </main>

  <script src="./js/housebuilding_平面_アイテム.js?v=20260911-topmenu1"></script>
  <script src="./js/housebuilding_2d.js?v=20260911-topmenu1"></script>
</body>
</html>
