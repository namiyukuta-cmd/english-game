<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>House Building - 方式選択</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f3f0e8;
      color: #222;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .menu {
      width: min(100%, 420px);
      display: grid;
      gap: 14px;
    }
    h1 {
      margin: 0 0 20px;
      text-align: center;
      font-size: 26px;
    }
    button {
      width: 100%;
      min-height: 72px;
      border: 1px solid #777;
      background: #fff;
      color: #222;
      border-radius: 12px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }
    .back {
      min-height: 50px;
      margin-top: 8px;
      font-size: 15px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="menu">
    <h1>家作りの方式を選ぶ</h1>
    <button id="mode3d">3D</button>
    <button id="modeFlat">平面</button>
    <button id="back" class="back">戻る</button>
  </main>

  <script>
    document.getElementById('mode3d').addEventListener('click', () => {
      location.href = './housebuilding_top.html?mode=new';
    });
    document.getElementById('modeFlat').addEventListener('click', () => {
      location.href = './housebuilding_平面.html?mode=new';
    });
    document.getElementById('back').addEventListener('click', () => {
      location.href = './housebuilding_index.html';
    });
  </script>
</body>
</html>
