<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>House Building - フィールド</title>

  <link rel="stylesheet" href="./css/フィールド_棒人間アクション.css?v=20260911-stick1" />

  <style>
    #fieldMiddle{
      grid-template-rows:minmax(0,5.5fr) minmax(0,2.5fr);
    }

    .cardRpgView{
      position:absolute;
      inset:0;
      padding:14px 0 0;
      display:flex;
      flex-direction:column;
      background:radial-gradient(circle at 50% 35%,#32332f 0%,#1c1d1b 48%,#10110f 100%);
    }

    .dungeonPathShell{
      position:relative;
      flex:0 0 auto;
      width:calc(100% - 64px);
      height:118px;
      margin:12px auto 0;
      box-sizing:border-box;
    }

    .dungeonScrollWindow{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      box-sizing:border-box;
      padding:5px;
      border:1px solid rgba(255,255,255,.28);
      border-radius:10px;
      background:rgba(255,255,255,.018);
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);
      overflow-x:hidden;
      overflow-y:hidden;
      scrollbar-width:none;
      scroll-behavior:smooth;
    }
    .dungeonScrollWindow::-webkit-scrollbar{display:none}

    .dungeonCardGrid{
      display:grid;
      grid-auto-flow:column;
      grid-auto-columns:calc((100% - 16px)/5);
      grid-template-rows:1fr;
      gap:4px;
      width:100%;
      min-width:100%;
      height:100%;
      padding:0 0 8px;
      background:transparent;
    }

    .dungeonCardGrid .cardSlot{
      position:relative;
      width:100%;
      aspect-ratio:.64/1;
      height:auto;
      min-height:0;
      overflow:hidden;
      border-radius:8px;
      perspective:700px;
    }

    .pathCardInner{
      position:absolute;
      inset:0;
      transform-style:preserve-3d;
      transition:transform .38s ease;
    }

    .cardSlot.revealed .pathCardInner{
      transform:rotateY(180deg);
    }

    .pathBack,
    .pathFront{
      position:absolute;
      inset:0;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.3);
      border-radius:8px;
      backface-visibility:hidden;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);
    }

    .pathBack{
      display:flex;
      align-items:center;
      justify-content:center;
      background:repeating-linear-gradient(135deg,#292a27 0 6px,#1b1c1a 6px 12px);
      color:#c9c5bc;
      font-size:22px;
      font-weight:900;
    }

    .pathBack::after{
      content:"?";
    }

    .pathFront{
      transform:rotateY(180deg);
      background:#fff;
    }

    .pathArt,
    .pathFrame{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
    }

    .pathArt{
      z-index:1;
      object-fit:cover;
      object-position:center center;
    }

    .pathFrame{
      z-index:3;
      object-fit:cover;
      pointer-events:none;
    }

    .pathLabel{
      position:absolute;
      z-index:2;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:5px;
      text-align:center;
      font-size:11px;
      font-weight:1000;
      letter-spacing:.04em;
      text-shadow:0 1px 2px rgba(0,0,0,.65);
    }

    .pathFront.monsterCard{
      background:#ddd;
    }

    .pathFront.trapCard{
      background:radial-gradient(circle at 50% 40%,#5a4430 0%,#2b2119 52%,#15110e 100%);
      color:#f2dfc5;
    }

    .pathFront.itemCard{
      background:radial-gradient(circle at 50% 40%,#8a7449 0%,#493d27 55%,#211c13 100%);
      color:#fff1b8;
    }

    .cardSlot.battleTarget::after{
      content:"";
      position:absolute;
      z-index:5;
      inset:-2px;
      border:2px solid rgba(255,190,120,.95);
      border-radius:9px;
      pointer-events:none;
      box-shadow:0 0 12px rgba(255,255,255,.55);
    }

    .playerMarkerSlot{
      position:absolute;
      z-index:30;
      top:5px;
      left:6px;
      width:calc((100% - 28px)/5);
      height:calc(100% - 13px);
      display:flex;
      align-items:flex-end;
      justify-content:center;
      pointer-events:none;
    }

    .playerMarker{
      margin-bottom:7px;
      width:25px;
      height:25px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:2px solid #f3efe7;
      border-radius:50%;
      background:#222;
      color:#fff;
      box-shadow:0 3px 7px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.15);
      font-size:12px;
    }

    .fieldCardDock{
      flex:1;
      min-height:0;
      display:flex;
      align-items:flex-end;
      justify-content:flex-start;
      padding:8px 10px 4px;
    }

    .fieldCardDockSlot{
      position:relative;
      height:min(98%,208px);
      aspect-ratio:.64/1;
      border:2px solid rgba(255,255,255,.38);
      border-radius:11px;
      background:rgba(255,255,255,.05);
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.22),0 5px 14px rgba(0,0,0,.24);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      color:rgba(242,235,221,.72);
      font-size:10px;
      font-weight:900;
    }

    .protagonistCardSlot{
      display:block;
      aspect-ratio:595 / 842;
      border:0;
      border-radius:0;
      background:transparent;
      box-shadow:0 5px 14px rgba(0,0,0,.24);
    }

    .protagonistArt,
    .protagonistFrame{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:contain;
    }

    .protagonistArt{z-index:1}
    .protagonistFrame{z-index:2;pointer-events:none}

    .protagonistFood{
      position:absolute;
      z-index:3;
      left:8px;
      bottom:7px;
      font-size:18px;
      line-height:1;
      filter:grayscale(15%) brightness(.95);
    }

    .protagonistHp{
      position:absolute;
      z-index:3;
      right:8px;
      bottom:6px;
      display:flex;
      align-items:flex-end;
      gap:1px;
      color:#f3efe7;
      text-shadow:0 1px 2px rgba(0,0,0,.45);
      line-height:1;
    }

    .protagonistHpCurrent{
      font-size:20px;
      font-weight:1000;
    }

    .protagonistHpSlash,
    .protagonistHpMax{
      padding-bottom:1px;
      font-size:9px;
      font-weight:800;
      opacity:.82;
    }

    .protagonistCardSlot.hit{
      animation:playerHit .35s ease;
    }

    @keyframes playerHit{
      0%{transform:translateX(0)}
      20%{transform:translateX(-7px)}
      40%{transform:translateX(7px)}
      60%{transform:translateX(-5px)}
      80%{transform:translateX(4px)}
      100%{transform:translateX(0)}
    }

    #fieldPanel{
      grid-template-rows:minmax(0,1fr);
      gap:0;
      padding:5px 8px;
    }

    .handLine{
      min-height:0;
      display:grid;
      grid-template-columns:minmax(0,1fr);
      align-items:stretch;
    }

    #inventoryGrid.handGrid{
      position:relative;
      min-width:0;
      min-height:0;
      display:flex !important;
      align-items:flex-end;
      justify-content:flex-start;
      gap:0 !important;
      padding:3px 6px;
      overflow:visible;
    }

    .handCard{
      position:relative;
      flex:0 0 74px;
      height:100%;
      min-height:0;
      max-height:118px;
      margin-left:-38px;
      border:1px solid #aaa39a;
      border-radius:8px;
      background:linear-gradient(#fff,#eeeae2);
      box-shadow:0 3px 7px rgba(0,0,0,.16);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding:7px 15px 4px 4px;
      overflow:hidden;
      transform:none;
      transition:transform .22s ease,box-shadow .22s ease,opacity .18s ease;
    }

    .handCard:first-child{margin-left:0}
    .handCard:nth-child(1){z-index:1}
    .handCard:nth-child(2){z-index:2}
    .handCard:nth-child(3){z-index:3}
    .handCard:nth-child(4){z-index:4}
    .handCard:nth-child(5){z-index:5}
    .handCard:nth-child(6){z-index:6}
    .handCard:nth-child(7){z-index:7}
    .handCard:nth-child(8){z-index:8}
    .handCard:nth-child(9){z-index:9}

    .handCard .handIcon{
      font-size:19px;
      line-height:1.05;
      margin-top:5px;
    }

    .handCard .handName{
      position:absolute;
      z-index:3;
      top:7px;
      right:3px;
      bottom:7px;
      margin:0;
      writing-mode:vertical-rl;
      text-orientation:upright;
      font-size:9px;
      font-weight:900;
      line-height:1;
      white-space:nowrap;
      overflow:hidden;
    }

    .handCard .handCount{
      position:absolute;
      z-index:4;
      left:5px;
      bottom:3px;
      font-size:10px;
      font-weight:1000;
    }

    .handCard .handRole{
      position:absolute;
      z-index:4;
      left:3px;
      top:3px;
      padding:1px 3px;
      border:1px solid #c7bda8;
      border-radius:4px;
      background:#eee7d8;
      color:#665b49;
      font-size:7px;
      font-weight:1000;
      line-height:1.2;
    }

    .handCard.equipmentCard{
      border-color:#8f877b;
      background:linear-gradient(#fffdf7,#e9e3d7);
    }

    .handCard.emptyToolCard{
      border:1px solid #b5ada1;
      background:linear-gradient(#f7f4ee,#e6e0d7);
      box-shadow:0 3px 7px rgba(0,0,0,.12);
      justify-content:center;
      padding:0 8px;
      color:#746d63;
      font-size:11px;
      font-weight:900;
    }

    .handCard.using{
      z-index:100;
      transform:translateY(-34px) scale(1.08);
      box-shadow:0 10px 20px rgba(0,0,0,.35);
    }

    .battleProjectile{
      position:fixed;
      z-index:10000;
      pointer-events:none;
      font-size:23px;
      transition:left .36s linear,top .36s linear,transform .36s linear;
    }

    .slashEffect{
      position:fixed;
      z-index:10001;
      width:46px;
      height:46px;
      pointer-events:none;
      font-size:35px;
      line-height:46px;
      text-align:center;
      animation:slashHit .32s ease-out forwards;
    }

    .slashEffect::before{content:"╱"}

    @keyframes slashHit{
      0%{transform:scale(.3) rotate(-20deg);opacity:0}
      35%{opacity:1}
      100%{transform:scale(1.5) rotate(18deg);opacity:0}
    }

    .flyingItem{
      position:fixed;
      z-index:10000;
      pointer-events:none;
      font-size:27px;
      transition:left .45s ease,top .45s ease,transform .45s ease,opacity .45s ease;
    }
  </style>
</head>
<body>
  <main id="fieldApp">
    <header id="fieldTop" aria-label="メニュー">
      <div class="topMenuRow">
        <strong class="topPlace">森・カード探索</strong>
        <button class="topMenuButton" type="button">LOG</button>
        <button class="topMenuButton" type="button">SAVE</button>
        <button class="topMenuButton" type="button">MENU</button>
      </div>
    </header>

    <section id="fieldMiddle">
      <section id="fieldView" aria-label="カード探索路">
        <div class="cardRpgView">
          <div class="dungeonPathShell">
            <div class="dungeonScrollWindow" aria-label="横スクロールする探索路">
              <div class="dungeonCardGrid" id="dungeonPath"></div>
            </div>
            <div class="playerMarkerSlot" aria-label="主人公">
              <div class="playerMarker">◆</div>
            </div>
          </div>

          <div class="fieldCardDock" aria-label="主人公カード">
            <div class="fieldCardDockSlot protagonistCardSlot" aria-label="主人公 HP 95/100 食 74">
              <img class="protagonistArt" src="../assets/housebuilding/adventurer_595x842.jpg" alt="" />
              <img class="protagonistFrame" src="../assets/housebuilding/card_frame.PNG" alt="" />
              <div class="protagonistFood" aria-label="食 74">🍖</div>
              <div class="protagonistHp" aria-label="HP 95/100">
                <span class="protagonistHpCurrent">95</span>
                <span class="protagonistHpSlash">/</span>
                <span class="protagonistHpMax">100</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="fieldPanel" aria-label="管理エリア">
        <div class="handLine">
          <div id="inventoryGrid" class="handGrid" aria-label="装備と道具の手札">
            <div class="handCard equipmentCard" id="meleeCard" data-slot="melee"><span class="handRole">近接</span><span class="handIcon">🗡️</span><span class="handName">短剣</span></div>
            <div class="handCard equipmentCard" id="rangedCard" data-slot="ranged"><span class="handRole">遠距離</span><span class="handIcon">🏹</span><span class="handName">弓</span><span class="handCount" id="arrowCount">7</span></div>
            <div class="handCard"><span class="handIcon">🌿</span><span class="handName">薬草</span><span class="handCount">2</span></div>
            <div class="handCard" id="potionCard" data-item="potion" data-heal="20"><span class="handIcon">🧴</span><span class="handName">回復薬</span><span class="handCount" id="potionCount">1</span></div>
            <div class="handCard"><span class="handIcon">🍞</span><span class="handName">パン</span><span class="handCount">2</span></div>
            <div class="handCard"><span class="handIcon">🪢</span><span class="handName">ロープ</span><span class="handCount">1</span></div>
            <div class="handCard" data-item="key"><span class="handIcon">🗝️</span><span class="handName">鍵</span><span class="handCount">1</span></div>
            <div class="handCard"><span class="handIcon">🪓</span><span class="handName">斧</span><span class="handCount">1</span></div>
            <div class="handCard emptyToolCard" aria-label="空き道具枠">空き</div>
          </div>
        </div>
      </section>
    </section>

    <footer id="fieldBottom" aria-label="探索状態">
      <span>カード探索</span><span id="lightStatus">灯り：ランプ</span><span id="exploreStatus">状態：探索中</span>
    </footer>
  </main>

  <script src="./js/housebuilding_平面_モンスター.js?v=20260912-monster1"></script>
  <script>
    (() => {
      const PATH_LENGTH = 30;
      const LAMP_RANGE = 3;
      const MOVE_WAIT = 900;
      const BATTLE_WAIT = 650;
      const SCROLL_TIME = 420;
      const HAS_LAMP_AT_START = true;

      const dungeonArt = "../assets/housebuilding/dungeon_01.PNG";
      const goblinArt = "../assets/housebuilding/goblin_595x842.jpg";
      const cardFrame = "../assets/housebuilding/card_frame.PNG";

      const TEST_DAMAGE = {
        ranged:7,
        melee:9
      };

      const goblinData = window.HOUSEBUILDING_2D_MONSTERS?.find(
        monster => monster.id === "monster_003"
      ) || {
        name:"ゴブリン",
        hp:26,
        maxHp:26,
        attack:6,
        defense:2
      };

      const pathEl = document.getElementById("dungeonPath");
      const scrollWindow = document.querySelector(".dungeonScrollWindow");
      const protagonistCard = document.querySelector(".protagonistCardSlot");
      const hpText = document.querySelector(".protagonistHpCurrent");
      const rangedCard = document.getElementById("rangedCard");
      const meleeCard = document.getElementById("meleeCard");
      const arrowCountEl = document.getElementById("arrowCount");
      let potionCard = document.getElementById("potionCard");
      let potionCountEl = document.getElementById("potionCount");
      const lightStatus = document.getElementById("lightStatus");
      const statusEl = document.getElementById("exploreStatus");

      let playerHp = 95;
      const playerMaxHp = 100;
      let hasLamp = HAS_LAMP_AT_START;
      let viewStart = 0;
      let path = [];
      let slots = [];
      let exploring = false;
      let battle = null;

      const wait = ms => new Promise(resolve => setTimeout(resolve,ms));

      function randomType(){
        const roll = Math.random() * 100;
        if (roll < 62){
          return "dungeon";
        }
        if (roll < 84){
          return "monster";
        }
        if (roll < 95){
          return "trap";
        }
        return "item";
      }

      function createPath(){
        path = Array.from({length:PATH_LENGTH},(_,index) => {
          const type = index === 0 ? "dungeon" : randomType();
          return {
            index,
            type,
            revealed:false,
            cleared:false,
            monsterHp:null,
            requiredItemId:type === "trap" ? "key" : null
          };
        });
      }

      function frontMarkup(card){
        if (card.type === "monster"){
          return `
            <div class="pathFront monsterCard">
              <img class="pathArt" src="${goblinArt}" alt="" />
              <img class="pathFrame" src="${cardFrame}" alt="" />
            </div>
          `;
        }

        if (card.type === "trap"){
          return `
            <div class="pathFront trapCard">
              <div class="pathLabel">TRAP</div>
              <img class="pathFrame" src="${cardFrame}" alt="" />
            </div>
          `;
        }

        if (card.type === "item"){
          return `
            <div class="pathFront itemCard">
              <div class="pathLabel">ITEM</div>
              <img class="pathFrame" src="${cardFrame}" alt="" />
            </div>
          `;
        }

        return `
          <div class="pathFront dungeonCard">
            <img class="pathArt" src="${dungeonArt}" alt="" />
            <img class="pathFrame" src="${cardFrame}" alt="" />
          </div>
        `;
      }

      function renderPath(){
        pathEl.innerHTML = path.map(card => `
          <div class="cardSlot" data-index="${card.index}" data-type="${card.type}">
            <div class="pathCardInner">
              <div class="pathBack" aria-label="未探索"></div>
              ${frontMarkup(card)}
            </div>
          </div>
        `).join("");

        slots = [...pathEl.querySelectorAll(".cardSlot")];
      }

      function revealCard(index){
        const card = path[index];
        const slot = slots[index];
        if (!card || !slot){
          return;
        }
        card.revealed = true;
        slot.classList.add("revealed");
      }

      function updateVision(){
        revealCard(viewStart);
        const range = hasLamp ? LAMP_RANGE : 1;

        for (let distance = 1; distance <= range; distance += 1){
          const index = viewStart + distance;
          if (index >= PATH_LENGTH){
            break;
          }

          revealCard(index);

          if (path[index].type === "trap" && !path[index].cleared){
            break;
          }
        }
      }

      function cardStep(){
        const first = slots[0];
        if (!first){
          return 0;
        }
        const style = getComputedStyle(pathEl);
        const gap = parseFloat(style.columnGap || style.gap || "4") || 4;
        return first.offsetWidth + gap;
      }

      async function shiftDungeonOne(){
        if (viewStart >= PATH_LENGTH - 1){
          return;
        }

        viewStart += 1;
        const left = viewStart * cardStep();
        scrollWindow.scrollTo({
          left,
          behavior:"smooth"
        });

        await wait(SCROLL_TIME);
        updateVision();
      }

      function trapAhead(){
        const index = viewStart + 1;
        const card = path[index];

        if (card && card.type === "trap" && !card.cleared){
          return {
            index,
            distance:1,
            requiredItemId:card.requiredItemId
          };
        }

        return null;
      }

      function visibleMonster(){
        const range = hasLamp ? LAMP_RANGE : 1;

        for (let distance = 1; distance <= range; distance += 1){
          const index = viewStart + distance;
          const card = path[index];
          if (!card){
            break;
          }

          if (card.type === "trap" && !card.cleared){
            return null;
          }

          if (card.type === "monster" && !card.cleared){
            return {
              index,
              distance
            };
          }
        }

        return null;
      }

      function monsterDistance(){
        if (!battle){
          return null;
        }
        return battle.index - viewStart;
      }

      function findRequiredItem(itemId){
        if (!itemId){
          return null;
        }

        const itemCard = document.querySelector(`.handCard[data-item="${itemId}"]`);
        if (!itemCard){
          return null;
        }

        const countEl = itemCard.querySelector(".handCount");
        if (countEl && Number(countEl.textContent) <= 0){
          return null;
        }

        return itemCard;
      }

      async function popHandCard(card){
        if (!card){
          return;
        }
        card.classList.add("using");
        await wait(240);
        card.classList.remove("using");
      }

      async function shootProjectile(){
        const monsterSlot = battle ? slots[battle.index] : null;
        if (!rangedCard || !monsterSlot){
          return;
        }

        const from = rangedCard.getBoundingClientRect();
        const to = monsterSlot.getBoundingClientRect();
        const projectile = document.createElement("div");
        projectile.className = "battleProjectile";
        projectile.textContent = "➶";
        projectile.style.left = `${from.left + from.width / 2}px`;
        projectile.style.top = `${from.top + from.height / 2}px`;
        document.body.appendChild(projectile);

        await new Promise(requestAnimationFrame);

        projectile.style.left = `${to.left + to.width / 2}px`;
        projectile.style.top = `${to.top + to.height / 2}px`;
        projectile.style.transform = "scale(1.2)";

        await wait(380);
        projectile.remove();
      }

      function slashAt(element){
        if (!element){
          return;
        }

        const rect = element.getBoundingClientRect();
        const slash = document.createElement("div");
        slash.className = "slashEffect";
        slash.style.left = `${rect.left + rect.width / 2 - 23}px`;
        slash.style.top = `${rect.top + rect.height / 2 - 23}px`;
        document.body.appendChild(slash);
        setTimeout(() => slash.remove(),350);
      }

      function updatePlayerHp(){
        hpText.textContent = String(playerHp);
      }

      async function autoPotion(){
        if (!potionCard || !potionCountEl){
          return;
        }

        const count = Number(potionCountEl.textContent) || 0;
        const heal = Number(potionCard.dataset.heal) || 0;
        const missing = playerMaxHp - playerHp;

        if (count <= 0 || heal <= 0 || missing < heal){
          return;
        }

        await popHandCard(potionCard);

        const from = potionCard.getBoundingClientRect();
        const to = protagonistCard.getBoundingClientRect();
        const flying = document.createElement("div");
        flying.className = "flyingItem";
        flying.textContent = "🧴";
        flying.style.left = `${from.left + from.width / 2}px`;
        flying.style.top = `${from.top + from.height / 2}px`;
        document.body.appendChild(flying);

        await new Promise(requestAnimationFrame);

        flying.style.left = `${to.left + to.width / 2}px`;
        flying.style.top = `${to.top + to.height / 2}px`;
        flying.style.transform = "scale(.4)";
        flying.style.opacity = "0";

        await wait(470);
        flying.remove();

        playerHp = Math.min(playerMaxHp,playerHp + heal);
        updatePlayerHp();

        const next = count - 1;
        potionCountEl.textContent = String(next);

        if (next <= 0){
          potionCard.remove();
          potionCard = null;
          potionCountEl = null;
        }
      }

      async function damagePlayer(amount){
        playerHp = Math.max(0,playerHp - amount);
        updatePlayerHp();
        protagonistCard.classList.add("hit");
        slashAt(protagonistCard);
        await wait(350);
        protagonistCard.classList.remove("hit");
        await autoPotion();
      }

      function monsterToDungeon(index){
        const card = path[index];
        const slot = slots[index];
        if (!card || !slot){
          return;
        }

        card.type = "dungeon";
        card.cleared = true;
        card.revealed = true;
        card.monsterHp = 0;
        slot.dataset.type = "dungeon";
        slot.innerHTML = `
          <div class="pathCardInner">
            <div class="pathBack"></div>
            <div class="pathFront dungeonCard">
              <img class="pathArt" src="${dungeonArt}" alt="" />
              <img class="pathFrame" src="${cardFrame}" alt="" />
            </div>
          </div>
        `;
        slot.classList.add("revealed");
        slot.classList.remove("battleTarget");
      }

      async function rangedAttack(){
        if (!rangedCard || !arrowCountEl){
          return false;
        }

        let arrows = Number(arrowCountEl.textContent) || 0;
        if (arrows <= 0){
          return false;
        }

        await popHandCard(rangedCard);
        await shootProjectile();

        arrows -= 1;
        arrowCountEl.textContent = String(arrows);
        battle.hp = Math.max(0,battle.hp - TEST_DAMAGE.ranged);
        slashAt(slots[battle.index]);
        return true;
      }

      async function meleeAttack(){
        if (!meleeCard){
          return false;
        }

        await popHandCard(meleeCard);
        battle.hp = Math.max(0,battle.hp - TEST_DAMAGE.melee);
        slashAt(slots[battle.index]);
        await wait(300);
        return true;
      }

      async function playerBattleTurn(){
        const distance = monsterDistance();

        if (distance > 1){
          const fired = await rangedAttack();
          if (!fired){
            statusEl.textContent = "遠距離攻撃できない";
            await wait(BATTLE_WAIT);
          }
          return;
        }

        const attacked = await meleeAttack();
        if (!attacked){
          statusEl.textContent = "近接攻撃できない";
          await wait(BATTLE_WAIT);
        }
      }

      async function monsterBattleTurn(){
        const distance = monsterDistance();

        if (distance > 1){
          await shiftDungeonOne();
          statusEl.textContent = `ゴブリン 距離${monsterDistance()}`;
          return;
        }

        statusEl.textContent = "ゴブリンの攻撃";
        await damagePlayer(goblinData.attack ?? 6);
      }

      async function battleLoop(){
        while (battle && playerHp > 0){
          statusEl.textContent = `ゴブリン 距離${monsterDistance()}`;

          await playerBattleTurn();

          if (battle.hp <= 0){
            const defeatedIndex = battle.index;
            monsterToDungeon(defeatedIndex);
            battle = null;
            statusEl.textContent = "ゴブリン撃破";
            await wait(700);
            updateVision();
            exploreLoop();
            return;
          }

          await wait(BATTLE_WAIT);
          await monsterBattleTurn();

          if (playerHp <= 0){
            statusEl.textContent = "探索不能";
            battle = null;
            return;
          }

          await wait(BATTLE_WAIT);
        }
      }

      function startBattle(monster){
        exploring = false;
        battle = {
          index:monster.index,
          hp:goblinData.maxHp ?? goblinData.hp ?? 26
        };
        slots[monster.index]?.classList.add("battleTarget");
        battleLoop();
      }

      function convertTrapToDungeon(index){
        const card = path[index];
        const slot = slots[index];
        if (!card || !slot || card.type !== "trap"){
          return;
        }

        card.type = "dungeon";
        card.cleared = true;
        card.revealed = true;
        slot.dataset.type = "dungeon";
        slot.innerHTML = `
          <div class="pathCardInner">
            <div class="pathBack"></div>
            <div class="pathFront dungeonCard">
              <img class="pathArt" src="${dungeonArt}" alt="" />
              <img class="pathFrame" src="${cardFrame}" alt="" />
            </div>
          </div>
        `;
        slot.classList.add("revealed");
      }

      async function attemptTrapResolution(){
        const trap = trapAhead();
        if (!trap){
          return false;
        }

        const card = path[trap.index];
        const itemCard = findRequiredItem(card.requiredItemId);

        if (!itemCard){
          statusEl.textContent = "解除できるアイテムがない";
          return false;
        }

        await popHandCard(itemCard);
        convertTrapToDungeon(trap.index);
        statusEl.textContent = "トラップ解除";
        updateVision();
        await wait(450);
        return true;
      }

      async function exploreLoop(){
        if (exploring || battle){
          return;
        }

        exploring = true;

        while (exploring && viewStart < PATH_LENGTH - 1){
          updateVision();

          const monster = visibleMonster();
          if (monster){
            startBattle(monster);
            return;
          }

          const trap = trapAhead();
          if (trap){
            const resolved = await attemptTrapResolution();
            if (resolved){
              continue;
            }

            exploring = false;
            statusEl.textContent = "解除できるアイテムがない";
            return;
          }

          statusEl.textContent = "状態：探索中";
          await wait(MOVE_WAIT);

          if (!exploring){
            return;
          }

          await shiftDungeonOne();
        }

        exploring = false;
        statusEl.textContent = "状態：最奥";
      }

      function setLamp(value){
        hasLamp = Boolean(value);
        lightStatus.textContent = hasLamp ? "灯り：ランプ" : "灯り：なし";
        updateVision();
      }

      function start(){
        createPath();
        renderPath();
        viewStart = 0;
        scrollWindow.scrollLeft = 0;
        setLamp(HAS_LAMP_AT_START);
        updateVision();
        exploreLoop();
      }

      window.HOUSEBUILDING_CARD_PATH = {
        setLamp,
        async tryResolveTrap(){
          const resolved = await attemptTrapResolution();
          if (resolved && !exploring && !battle){
            exploreLoop();
          }
          return resolved;
        },
        getState(){
          return {
            viewStart,
            hasLamp,
            playerHp,
            battle:battle ? {...battle} : null,
            path:path.map(card => ({...card}))
          };
        }
      };

      window.addEventListener("load",start);
    })();
  </script>
</body>
</html>
