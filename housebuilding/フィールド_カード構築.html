<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>House Building - フィールド</title>
  <link rel="stylesheet" href="./css/フィールド_棒人間アクション.css?v=20260911-stick1" />
  <link rel="stylesheet" href="./css/フィールド_カードRPG_v4.css?v=20260912-card4" />
  <style>
    .cardRpgView{
      padding:16px 0 0;
    }
    .cardDungeonBoard{
      flex:0 0 60%;
      grid-template-rows:repeat(3,minmax(0,1fr));
      row-gap:2px;
      align-content:start;
      padding:4px 44px 0;
    }
    .floorLane{
      grid-template-columns:repeat(7,minmax(0,1fr));
      column-gap:2px;
      justify-content:center;
      align-items:stretch;
      padding:0;
      border:0;
      border-radius:0;
      background:transparent;
    }
    .floorLane::before{display:none}
    .floorLabel{top:1px;left:-26px}
    .floorLane.reverse .floorLabel{left:auto;right:-26px}
    .cardSlot{
      height:100%;
      align-self:stretch;
      border:1px solid rgba(255,255,255,.22);
      border-radius:7px;
      background:rgba(255,255,255,.025);
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);
    }
    .verticalLadder.right{left:calc(100% - 34px);top:24.5%}
    .verticalLadder.left{left:34px;top:49.5%}

    .fieldCardDock{
      flex:1;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:8px 30px 10px;
    }
    .fieldCardDockSlot{
      height:min(94%,156px);
      aspect-ratio:.64/1;
      border:2px solid rgba(255,255,255,.34);
      border-radius:10px;
      background:rgba(255,255,255,.045);
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.22),0 4px 12px rgba(0,0,0,.22);
      display:flex;
      align-items:center;
      justify-content:center;
      color:rgba(242,235,221,.68);
      font-size:9px;
      font-weight:900;
    }
    .deckCardSlot{
      background:repeating-linear-gradient(135deg,#282926 0 7px,#1c1d1b 7px 14px);
      color:rgba(242,235,221,.72);
    }

    /* 3/8側：所持品を横一列で重ねる手札にする。扇状にはしない。 */
    .handLine{
      min-height:0;
      display:grid;
      grid-template-columns:48px minmax(0,1fr);
      gap:5px;
      align-items:stretch;
    }
    #inventoryGrid.handGrid{
      position:relative;
      min-width:0;
      min-height:0;
      display:flex !important;
      align-items:flex-end;
      justify-content:flex-start;
      gap:0 !important;
      padding:3px 6px 2px 8px;
      overflow:visible;
    }
    .handCard{
      position:relative;
      flex:0 0 68px;
      height:100%;
      min-height:0;
      max-height:122px;
      margin-left:-29px;
      border:1px solid #aaa39a;
      border-radius:8px;
      background:linear-gradient(#fff,#eeeae2);
      box-shadow:0 3px 7px rgba(0,0,0,.16);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding:8px 4px 5px;
      overflow:hidden;
      transform:none;
      transition:transform .22s ease,box-shadow .22s ease,opacity .18s ease;
    }
    .handCard:first-child{margin-left:0}
    .handCard:nth-child(1){z-index:1}
    .handCard:nth-child(2){z-index:2}
    .handCard:nth-child(3){z-index:3}
    .handCard:nth-child(4){z-index:4}
    .handCard:nth-child(5){z-index:5}
    .handCard:nth-child(6){z-index:6}
    .handCard:nth-child(7){z-index:7}
    .handCard .handIcon{font-size:20px;line-height:1.05}
    .handCard .handName{
      width:100%;
      margin-top:4px;
      text-align:center;
      font-size:7px;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .handCard .handCount{
      position:absolute;
      right:5px;
      bottom:3px;
      font-size:8px;
      font-weight:1000;
    }
    .handCard.using{
      z-index:50;
      transform:translateY(-34px) scale(1.08);
      box-shadow:0 10px 20px rgba(0,0,0,.3);
    }
  </style>
</head>
<body>
  <main id="fieldApp">
    <header id="fieldTop" aria-label="メニュー">
      <div class="topMenuRow">
        <strong class="topPlace">森・カード探索</strong>
        <button class="topMenuButton" type="button">LOG</button>
        <button class="topMenuButton" type="button">SAVE</button>
        <button class="topMenuButton" type="button">MENU</button>
      </div>
    </header>

    <section id="fieldMiddle">
      <section id="fieldView" aria-label="カード収納マップ">
        <a class="fieldEdge" href="./フィールド_店エリア_v3.html" aria-label="店エリアへ戻る">◀</a>
        <div class="cardRpgView">
          <div class="cardDungeonBoard">
            <div class="floorLane">
              <span class="floorLabel">上層 →</span>
              <div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div>
            </div>
            <div class="floorLane reverse">
              <span class="floorLabel">地下1階 ←</span>
              <div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div>
            </div>
            <div class="floorLane">
              <span class="floorLabel">地下2階 →</span>
              <div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div>
            </div>
            <div class="verticalLadder right" aria-hidden="true"></div>
            <div class="verticalLadder left" aria-hidden="true"></div>
          </div>

          <div class="fieldCardDock" aria-label="主人公カードと山札">
            <div class="fieldCardDockSlot protagonistCardSlot">主人公</div>
            <div class="fieldCardDockSlot deckCardSlot">山札</div>
          </div>
        </div>
      </section>

      <section id="fieldPanel" aria-label="管理エリア">
        <div class="panelStatus">
          <div class="hpWrap"><span class="hpText">HP 95/100</span><div class="hpBar"><div class="hpFill" style="width:95%"></div></div></div>
          <span class="foodValue">🍖 74</span>
        </div>

        <div class="handLine">
          <div class="slotLabel">持ち物</div>
          <div id="inventoryGrid" class="handGrid" aria-label="所持品の手札">
            <div class="handCard"><span class="handIcon">🌿</span><span class="handName">薬草</span><span class="handCount">2</span></div>
            <div class="handCard"><span class="handIcon">🧴</span><span class="handName">回復薬</span><span class="handCount">1</span></div>
            <div class="handCard"><span class="handIcon">🍞</span><span class="handName">パン</span><span class="handCount">2</span></div>
            <div class="handCard"><span class="handIcon">🏹</span><span class="handName">矢</span><span class="handCount">7</span></div>
            <div class="handCard"><span class="handIcon">🪢</span><span class="handName">ロープ</span><span class="handCount">1</span></div>
            <div class="handCard"><span class="handIcon">🗝️</span><span class="handName">鍵</span><span class="handCount">1</span></div>
            <div class="handCard"><span class="handIcon">🪓</span><span class="handName">斧</span><span class="handCount">1</span></div>
          </div>
        </div>

        <div class="slotLine">
          <div class="slotLabel">装備<br>スキル</div>
          <div id="abilityGrid" class="slotGrid">
            <div class="squareSlot skillSlot"><span class="slotIcon">🗡️</span><span class="slotName">短剣</span></div>
            <div class="squareSlot skillSlot"><span class="slotIcon">🏹</span><span class="slotName">弓</span></div>
            <div class="squareSlot skillSlot"><span class="slotIcon">🛡️</span><span class="slotName">革鎧</span></div>
            <div class="squareSlot skillSlot"><span class="slotIcon">＋</span><span class="slotName">応急処置</span></div>
            <div class="squareSlot skillSlot"><span class="slotIcon">🌱</span><span class="slotName">採取</span></div>
            <div class="squareSlot skillSlot"><span class="slotIcon">!</span><span class="slotName">危険察知</span></div>
            <div class="squareSlot skillSlot empty"></div>
          </div>
        </div>
      </section>
    </section>

    <footer id="fieldBottom" aria-label="探索状態">
      <span>カード構築</span><span>矢 7</span><span>状態：正常</span>
    </footer>
  </main>
</body>
</html>
