<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>House Building - フィールド</title>

  <link rel="stylesheet" href="./css/フィールド_棒人間アクション.css?v=20260911-stick1" />

  <style>
    #fieldMiddle{
      grid-template-rows:minmax(0,5.5fr) minmax(0,2.5fr);
    }

    .cardRpgView{
      position:absolute;
      inset:0;
      padding:14px 0 0;
      display:flex;
      flex-direction:column;
      background:radial-gradient(circle at 50% 35%,#32332f 0%,#1c1d1b 48%,#10110f 100%);
    }

    .dungeonScrollWindow{
      flex:0 0 auto;
      width:calc(100% - 36px);
      height:132px;
      margin:2px auto 0;
      overflow-x:hidden;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .dungeonScrollWindow::-webkit-scrollbar{display:none}

    .dungeonCardGrid{
      display:grid;
      grid-template-columns:repeat(6,minmax(0,1fr));
      gap:4px;
      padding:0 2px 8px;
      background:transparent;
    }

    .dungeonCardGrid .cardSlot{
      position:relative;
      width:100%;
      aspect-ratio:.64/1;
      height:auto;
      min-height:0;
      border:1px solid rgba(255,255,255,.25);
      border-radius:8px;
      background:rgba(255,255,255,.025);
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);
    }

    .fieldCardDock{
      flex:1;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 30px 12px;
    }

    .fieldCardDockSlot{
      height:min(92%,180px);
      aspect-ratio:.64/1;
      border:2px solid rgba(255,255,255,.38);
      border-radius:11px;
      background:rgba(255,255,255,.05);
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.22),0 5px 14px rgba(0,0,0,.24);
      display:flex;
      align-items:center;
      justify-content:center;
      color:rgba(242,235,221,.72);
      font-size:10px;
      font-weight:900;
    }

    .deckCardSlot{
      background:repeating-linear-gradient(135deg,#282926 0 7px,#1c1d1b 7px 14px);
      color:rgba(242,235,221,.76);
    }

    #fieldPanel{
      grid-template-rows:auto minmax(0,1fr);
      gap:3px;
      padding:5px 8px;
    }

    .panelStatus{min-height:25px}

    .handLine{
      min-height:0;
      display:grid;
      grid-template-columns:42px minmax(0,1fr);
      gap:4px;
      align-items:stretch;
    }

    #inventoryGrid.handGrid{
      position:relative;
      min-width:0;
      min-height:0;
      display:flex !important;
      align-items:flex-end;
      justify-content:flex-start;
      gap:0 !important;
      padding:3px 6px;
      overflow:visible;
    }

    .handCard{
      position:relative;
      flex:0 0 74px;
      height:100%;
      min-height:0;
      max-height:118px;
      margin-left:-43px;
      border:1px solid #aaa39a;
      border-radius:8px;
      background:linear-gradient(#fff,#eeeae2);
      box-shadow:0 3px 7px rgba(0,0,0,.16);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding:7px 15px 4px 4px;
      overflow:hidden;
      transform:none;
      transition:transform .22s ease,box-shadow .22s ease,opacity .18s ease;
    }

    .handCard:first-child{margin-left:0}
    .handCard:nth-child(1){z-index:1}
    .handCard:nth-child(2){z-index:2}
    .handCard:nth-child(3){z-index:3}
    .handCard:nth-child(4){z-index:4}
    .handCard:nth-child(5){z-index:5}
    .handCard:nth-child(6){z-index:6}
    .handCard:nth-child(7){z-index:7}
    .handCard:nth-child(8){z-index:8}
    .handCard:nth-child(9){z-index:9}

    .handCard .handIcon{
      font-size:19px;
      line-height:1.05;
      margin-top:5px;
    }

    .handCard .handName{
      position:absolute;
      z-index:3;
      top:7px;
      right:3px;
      bottom:7px;
      margin:0;
      writing-mode:vertical-rl;
      text-orientation:upright;
      font-size:7px;
      font-weight:900;
      line-height:1;
      white-space:nowrap;
      overflow:hidden;
    }

    .handCard .handCount{
      position:absolute;
      z-index:4;
      left:5px;
      bottom:3px;
      font-size:8px;
      font-weight:1000;
    }

    .handCard .handRole{
      position:absolute;
      z-index:4;
      left:3px;
      top:3px;
      padding:1px 3px;
      border:1px solid #c7bda8;
      border-radius:4px;
      background:#eee7d8;
      color:#665b49;
      font-size:5px;
      font-weight:1000;
      line-height:1.2;
    }

    .handCard.equipmentCard{
      border-color:#8f877b;
      background:linear-gradient(#fffdf7,#e9e3d7);
    }

    .handCard.using{
      z-index:50;
      transform:translateY(-34px) scale(1.08);
      box-shadow:0 10px 20px rgba(0,0,0,.3);
    }
  </style>
</head>
<body>
  <main id="fieldApp">
    <header id="fieldTop" aria-label="メニュー">
      <div class="topMenuRow">
        <strong class="topPlace">森・カード探索</strong>
        <button class="topMenuButton" type="button">LOG</button>
        <button class="topMenuButton" type="button">SAVE</button>
        <button class="topMenuButton" type="button">MENU</button>
      </div>
    </header>

    <section id="fieldMiddle">
      <section id="fieldView" aria-label="カード構築">
        <div class="cardRpgView">
          <div class="dungeonScrollWindow" aria-label="ダンジョンカード一覧">
            <div class="dungeonCardGrid">
              <div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div>
              <div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div>
              <div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div><div class="cardSlot"></div>
            </div>
          </div>

          <div class="fieldCardDock" aria-label="主人公カードと山札">
            <div class="fieldCardDockSlot protagonistCardSlot">主人公</div>
            <div class="fieldCardDockSlot deckCardSlot">山札</div>
          </div>
        </div>
      </section>

      <section id="fieldPanel" aria-label="管理エリア">
        <div class="panelStatus">
          <div class="hpWrap">
            <span class="hpText">HP 95/100</span>
            <div class="hpBar"><div class="hpFill" style="width:95%"></div></div>
          </div>
          <span class="foodValue">🍖 74</span>
        </div>

        <div class="handLine">
          <div class="slotLabel">手札</div>
          <div id="inventoryGrid" class="handGrid" aria-label="装備と道具の手札">
            <div class="handCard equipmentCard" data-slot="melee"><span class="handRole">近接</span><span class="handIcon">🗡️</span><span class="handName">短剣</span></div>
            <div class="handCard equipmentCard" data-slot="ranged"><span class="handRole">遠距離</span><span class="handIcon">🏹</span><span class="handName">弓</span><span class="handCount">7</span></div>
            <div class="handCard"><span class="handIcon">🌿</span><span class="handName">薬草</span><span class="handCount">2</span></div>
            <div class="handCard"><span class="handIcon">🧴</span><span class="handName">回復薬</span><span class="handCount">1</span></div>
            <div class="handCard"><span class="handIcon">🍞</span><span class="handName">パン</span><span class="handCount">2</span></div>
            <div class="handCard"><span class="handIcon">🪢</span><span class="handName">ロープ</span><span class="handCount">1</span></div>
            <div class="handCard"><span class="handIcon">🗝️</span><span class="handName">鍵</span><span class="handCount">1</span></div>
            <div class="handCard"><span class="handIcon">🪓</span><span class="handName">斧</span><span class="handCount">1</span></div>
          </div>
        </div>
      </section>
    </section>

    <footer id="fieldBottom" aria-label="探索状態">
      <span>カード構築</span><span>矢 7</span><span>状態：正常</span>
    </footer>
  </main>
</body>
</html>
