<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>House Building - フィールド</title>
  <link rel="stylesheet" href="./css/フィールド_棒人間アクション.css?v=20260911-stick1" />
  <link rel="stylesheet" href="./css/フィールド_カードRPG_v4.css?v=20260912-card4" />
  <style>
    .cardDungeonBoard{
      grid-template-rows:repeat(3,27%);
      row-gap:2px;
      align-content:center;
      padding:10px 16px;
    }
    .floorLane{
      grid-template-columns:repeat(7,minmax(0,11.5%));
      column-gap:1px;
      justify-content:center;
      align-items:stretch;
      padding:2px 4px;
    }
    .cardSlot{
      height:100%;
      align-self:stretch;
    }
    .mapCard{inset:0;border-radius:7px}
    .cardFace{border-radius:7px}
    .sceneName{font-size:5.2px;bottom:3px}
    .eventBadge{font-size:5.2px;padding:2px 4px}
    .eventNeed{font-size:5px;left:3px;right:3px;padding:2px 1px}
    .threatBadge{font-size:5px;padding:2px 4px}
  </style>
</head>
<body>
  <main id="fieldApp">
    <header id="fieldTop" aria-label="メニュー"></header>

    <section id="fieldMiddle">
      <section id="fieldView" aria-label="探索マップ"></section>
      <section id="fieldPanel" aria-label="管理エリア"></section>
    </section>

    <footer id="fieldBottom" aria-label="探索状態"></footer>
  </main>

  <script src="./js/フィールド_カードRPG_v4.js?v=20260912-card4"></script>
  <script src="./js/フィールド_自動回復_v1.js?v=20260912-heal1"></script>
</body>
</html>
