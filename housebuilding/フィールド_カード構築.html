<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>House Building - フィールド</title>

  <link rel="stylesheet" href="./css/フィールド_棒人間アクション.css?v=20260911-stick1" />

  <style>
    #fieldMiddle{
      grid-template-rows:minmax(0,5.5fr) minmax(0,2.5fr);
    }

    .cardRpgView{
      position:absolute;
      inset:0;
      padding:14px 0 0;
      display:flex;
      flex-direction:column;
      background:radial-gradient(circle at 50% 35%,#32332f 0%,#1c1d1b 48%,#10110f 100%);
    }

    .dungeonScrollWindow{
      flex:0 0 auto;
      width:calc(100% - 64px);
      height:118px;
      margin:12px auto 0;
      padding:5px;
      border:1px solid rgba(255,255,255,.28);
      border-radius:10px;
      background:rgba(255,255,255,.018);
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);
      overflow-x:auto;
      overflow-y:hidden;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      scroll-behavior:smooth;
    }
    .dungeonScrollWindow::-webkit-scrollbar{display:none}

    .dungeonCardGrid{
      display:grid;
      grid-auto-flow:column;
      grid-auto-columns:calc((100% - 16px)/5);
      grid-template-rows:1fr;
      gap:4px;
      width:100%;
      min-width:100%;
      padding:0 0 8px;
      background:transparent;
    }

    .dungeonCardGrid .cardSlot{
      position:relative;
      width:100%;
      aspect-ratio:.64/1;
      height:auto;
      min-height:0;
      perspective:600px;
    }

    .pathCardInner{
      position:absolute;
      inset:0;
      transform-style:preserve-3d;
      transition:transform .38s ease;
    }

    .cardSlot.revealed .pathCardInner{
      transform:rotateY(180deg);
    }

    .pathBack,
    .pathFront{
      position:absolute;
      inset:0;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.3);
      border-radius:8px;
      backface-visibility:hidden;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);
    }

    .pathBack{
      display:flex;
      align-items:center;
      justify-content:center;
      background:repeating-linear-gradient(135deg,#282926 0 7px,#1c1d1b 7px 14px);
      color:rgba(242,235,221,.45);
      font-size:8px;
      font-weight:900;
    }

    .pathFront{
      transform:rotateY(180deg);
      background:#111;
    }

    .pathArt,
    .pathFrame{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
    }

    .pathArt{
      z-index:1;
      object-fit:cover;
      object-position:center center;
    }

    .pathFrame{
      z-index:3;
      object-fit:contain;
      pointer-events:none;
    }

    .pathLabel{
      position:absolute;
      z-index:2;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:5px;
      text-align:center;
      font-size:9px;
      font-weight:1000;
      letter-spacing:.04em;
      text-shadow:0 1px 2px rgba(0,0,0,.65);
    }

    .pathFront.trapCard{
      background:radial-gradient(circle at 50% 40%,#5a4430 0%,#2b2119 52%,#15110e 100%);
      color:#f2dfc5;
    }

    .pathFront.itemCard{
      background:radial-gradient(circle at 50% 40%,#8a7449 0%,#493d27 55%,#211c13 100%);
      color:#fff1b8;
    }

    .cardSlot.current::after{
      content:"";
      position:absolute;
      z-index:5;
      inset:-2px;
      border:2px solid rgba(255,255,255,.9);
      border-radius:9px;
      pointer-events:none;
    }

    .cardSlot.targetMonster::after{
      content:"";
      position:absolute;
      z-index:5;
      inset:-2px;
      border:2px solid rgba(255,190,120,.95);
      border-radius:9px;
      pointer-events:none;
    }

    .cardSlot.targetTrap::after{
      content:"";
      position:absolute;
      z-index:5;
      inset:-2px;
      border:2px solid rgba(255,220,145,.95);
      border-radius:9px;
      pointer-events:none;
    }

    .fieldCardDock{
      flex:1;
      min-height:0;
      display:flex;
      align-items:flex-end;
      justify-content:flex-start;
      padding:8px 10px 4px;
    }

    .fieldCardDockSlot{
      position:relative;
      height:min(98%,208px);
      aspect-ratio:.64/1;
      border:2px solid rgba(255,255,255,.38);
      border-radius:11px;
      background:rgba(255,255,255,.05);
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.22),0 5px 14px rgba(0,0,0,.24);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      color:rgba(242,235,221,.72);
      font-size:10px;
      font-weight:900;
    }

    .protagonistCardSlot{
      display:block;
      aspect-ratio:595 / 842;
      border:0;
      border-radius:0;
      background:transparent;
      box-shadow:0 5px 14px rgba(0,0,0,.24);
    }

    .protagonistArt,
    .protagonistFrame{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:contain;
    }

    .protagonistArt{z-index:1}
    .protagonistFrame{z-index:2;pointer-events:none}

    .protagonistFood{
      position:absolute;
      z-index:3;
      left:8px;
      bottom:7px;
      font-size:18px;
      line-height:1;
      filter:grayscale(15%) brightness(.95);
    }

    .protagonistHp{
      position:absolute;
      z-index:3;
      right:8px;
      bottom:6px;
      display:flex;
      align-items:flex-end;
      gap:1px;
      color:#f3efe7;
      text-shadow:0 1px 2px rgba(0,0,0,.45);
      line-height:1;
    }

    .protagonistHpCurrent{
      font-size:20px;
      font-weight:1000;
    }

    .protagonistHpSlash,
    .protagonistHpMax{
      padding-bottom:1px;
      font-size:9px;
      font-weight:800;
      opacity:.82;
    }

    #fieldPanel{
      grid-template-rows:minmax(0,1fr);
      gap:0;
      padding:5px 8px;
    }

    .handLine{
      min-height:0;
      display:grid;
      grid-template-columns:minmax(0,1fr);
      align-items:stretch;
    }

    #inventoryGrid.handGrid{
      position:relative;
      min-width:0;
      min-height:0;
      display:flex !important;
      align-items:flex-end;
      justify-content:flex-start;
      gap:0 !important;
      padding:3px 6px;
      overflow:visible;
    }

    .handCard{
      position:relative;
      flex:0 0 74px;
      height:100%;
      min-height:0;
      max-height:118px;
      margin-left:-38px;
      border:1px solid #aaa39a;
      border-radius:8px;
      background:linear-gradient(#fff,#eeeae2);
      box-shadow:0 3px 7px rgba(0,0,0,.16);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding:7px 15px 4px 4px;
      overflow:hidden;
      transform:none;
      transition:transform .22s ease,box-shadow .22s ease,opacity .18s ease;
    }

    .handCard:first-child{margin-left:0}
    .handCard:nth-child(1){z-index:1}
    .handCard:nth-child(2){z-index:2}
    .handCard:nth-child(3){z-index:3}
    .handCard:nth-child(4){z-index:4}
    .handCard:nth-child(5){z-index:5}
    .handCard:nth-child(6){z-index:6}
    .handCard:nth-child(7){z-index:7}
    .handCard:nth-child(8){z-index:8}
    .handCard:nth-child(9){z-index:9}

    .handCard .handIcon{
      font-size:19px;
      line-height:1.05;
      margin-top:5px;
    }

    .handCard .handName{
      position:absolute;
      z-index:3;
      top:7px;
      right:3px;
      bottom:7px;
      margin:0;
      writing-mode:vertical-rl;
      text-orientation:upright;
      font-size:9px;
      font-weight:900;
      line-height:1;
      white-space:nowrap;
      overflow:hidden;
    }

    .handCard .handCount{
      position:absolute;
      z-index:4;
      left:5px;
      bottom:3px;
      font-size:10px;
      font-weight:1000;
    }

    .handCard .handRole{
      position:absolute;
      z-index:4;
      left:3px;
      top:3px;
      padding:1px 3px;
      border:1px solid #c7bda8;
      border-radius:4px;
      background:#eee7d8;
      color:#665b49;
      font-size:7px;
      font-weight:1000;
      line-height:1.2;
    }

    .handCard.equipmentCard{
      border-color:#8f877b;
      background:linear-gradient(#fffdf7,#e9e3d7);
    }

    .handCard.emptyToolCard{
      border:1px solid #b5ada1;
      background:linear-gradient(#f7f4ee,#e6e0d7);
      box-shadow:0 3px 7px rgba(0,0,0,.12);
      justify-content:center;
      padding:0 8px;
      color:#746d63;
      font-size:11px;
      font-weight:900;
    }

    .handCard.using{
      z-index:50;
      transform:translateY(-34px) scale(1.08);
      box-shadow:0 10px 20px rgba(0,0,0,.3);
    }
  </style>
</head>
<body>
  <main id="fieldApp">
    <header id="fieldTop" aria-label="メニュー">
      <div class="topMenuRow">
        <strong class="topPlace">森・カード探索</strong>
        <button class="topMenuButton" type="button">LOG</button>
        <button class="topMenuButton" type="button">SAVE</button>
        <button class="topMenuButton" type="button">MENU</button>
      </div>
    </header>

    <section id="fieldMiddle">
      <section id="fieldView" aria-label="カード探索路">
        <div class="cardRpgView">
          <div class="dungeonScrollWindow" aria-label="横スクロールする探索路">
            <div class="dungeonCardGrid" id="dungeonPath"></div>
          </div>

          <div class="fieldCardDock" aria-label="主人公カード">
            <div class="fieldCardDockSlot protagonistCardSlot" aria-label="主人公 HP 95/100 食 74">
              <img class="protagonistArt" src="../assets/housebuilding/adventurer_595x842.jpg" alt="" />
              <img class="protagonistFrame" src="../assets/housebuilding/card_frame.PNG" alt="" />
              <div class="protagonistFood" aria-label="食 74">🍖</div>
              <div class="protagonistHp" aria-label="HP 95/100">
                <span class="protagonistHpCurrent">95</span>
                <span class="protagonistHpSlash">/</span>
                <span class="protagonistHpMax">100</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="fieldPanel" aria-label="管理エリア">
        <div class="handLine">
          <div id="inventoryGrid" class="handGrid" aria-label="装備と道具の手札">
            <div class="handCard equipmentCard" data-slot="melee"><span class="handRole">近接</span><span class="handIcon">🗡️</span><span class="handName">短剣</span></div>
            <div class="handCard equipmentCard" data-slot="ranged"><span class="handRole">遠距離</span><span class="handIcon">🏹</span><span class="handName">弓</span><span class="handCount">7</span></div>
            <div class="handCard"><span class="handIcon">🌿</span><span class="handName">薬草</span><span class="handCount">2</span></div>
            <div class="handCard"><span class="handIcon">🧴</span><span class="handName">回復薬</span><span class="handCount">1</span></div>
            <div class="handCard"><span class="handIcon">🍞</span><span class="handName">パン</span><span class="handCount">2</span></div>
            <div class="handCard"><span class="handIcon">🪢</span><span class="handName">ロープ</span><span class="handCount">1</span></div>
            <div class="handCard"><span class="handIcon">🗝️</span><span class="handName">鍵</span><span class="handCount">1</span></div>
            <div class="handCard"><span class="handIcon">🪓</span><span class="handName">斧</span><span class="handCount">1</span></div>
            <div class="handCard emptyToolCard" aria-label="空き道具枠">空き</div>
          </div>
        </div>
      </section>
    </section>

    <footer id="fieldBottom" aria-label="探索状態">
      <span>カード探索</span><span id="lightStatus">灯り：ランプ</span><span id="exploreStatus">状態：探索中</span>
    </footer>
  </main>

  <script>
    (() => {
      const PATH_LENGTH = 18;
      const STEP_WAIT = 1100;
      const SCROLL_WAIT = 420;
      const HAS_LAMP_AT_START = true;

      const dungeonArt = "../assets/housebuilding/dungeon_01.PNG";
      const goblinArt = "../assets/housebuilding/goblin_595x842.jpg";
      const cardFrame = "../assets/housebuilding/card_frame.PNG";

      const WEIGHTS = [
        { type:"dungeon", weight:60 },
        { type:"monster", weight:25 },
        { type:"trap", weight:10 },
        { type:"item", weight:5 }
      ];

      const pathEl = document.getElementById("dungeonPath");
      const scrollWindow = document.querySelector(".dungeonScrollWindow");
      const lightStatus = document.getElementById("lightStatus");
      const exploreStatus = document.getElementById("exploreStatus");

      let hasLamp = HAS_LAMP_AT_START;
      let currentPosition = -1;
      let running = false;
      let pendingObstacle = null;
      let path = [];
      let slots = [];

      const wait = ms => new Promise(resolve => setTimeout(resolve,ms));

      function visionRange(){
        return hasLamp ? 3 : 1;
      }

      function chooseType(){
        const total = WEIGHTS.reduce((sum,item) => sum + item.weight,0);
        let roll = Math.random() * total;

        for (const item of WEIGHTS){
          roll -= item.weight;
          if (roll < 0){
            return item.type;
          }
        }

        return "dungeon";
      }

      function makePath(){
        return Array.from({length:PATH_LENGTH},(_,index) => ({
          index,
          type:chooseType(),
          revealed:false,
          cleared:false
        }));
      }

      function frontMarkup(card){
        if (card.type === "monster"){
          return `
            <div class="pathFront monsterCard">
              <img class="pathArt" src="${goblinArt}" alt="" />
              <img class="pathFrame" src="${cardFrame}" alt="" />
            </div>
          `;
        }

        if (card.type === "trap"){
          return `
            <div class="pathFront trapCard">
              <div class="pathLabel">TRAP</div>
              <img class="pathFrame" src="${cardFrame}" alt="" />
            </div>
          `;
        }

        if (card.type === "item"){
          return `
            <div class="pathFront itemCard">
              <div class="pathLabel">ITEM</div>
              <img class="pathFrame" src="${cardFrame}" alt="" />
            </div>
          `;
        }

        return `
          <div class="pathFront dungeonCard">
            <img class="pathArt" src="${dungeonArt}" alt="" />
            <img class="pathFrame" src="${cardFrame}" alt="" />
          </div>
        `;
      }

      function renderPath(){
        pathEl.innerHTML = path.map(card => `
          <div class="cardSlot" data-index="${card.index}" data-type="${card.type}">
            <div class="pathCardInner">
              <div class="pathBack" aria-label="未探索"></div>
              ${frontMarkup(card)}
            </div>
          </div>
        `).join("");

        slots = [...pathEl.querySelectorAll(".cardSlot")];
      }

      function revealCard(index){
        const card = path[index];
        const slot = slots[index];
        if (!card || !slot || card.revealed){
          return;
        }

        card.revealed = true;
        slot.classList.add("revealed");
      }

      function revealVision(){
        const lastVisible = Math.min(PATH_LENGTH - 1,currentPosition + visionRange());
        for (let i = currentPosition + 1; i <= lastVisible; i += 1){
          revealCard(i);
        }
      }

      function clearTargetMarks(){
        slots.forEach(slot => {
          slot.classList.remove("targetMonster","targetTrap");
        });
      }

      function findVisibleMonster(){
        const max = Math.min(PATH_LENGTH - 1,currentPosition + visionRange());
        for (let i = currentPosition + 1; i <= max; i += 1){
          if (path[i]?.type === "monster" && !path[i].cleared){
            return {
              type:"monster",
              index:i,
              distance:i - currentPosition
            };
          }
        }
        return null;
      }

      function trapImmediatelyAhead(){
        const index = currentPosition + 1;
        if (path[index]?.type === "trap" && !path[index].cleared){
          return { type:"trap", index, distance:1 };
        }
        return null;
      }

      function markCurrent(){
        slots.forEach(slot => slot.classList.remove("current"));
        if (currentPosition >= 0 && slots[currentPosition]){
          slots[currentPosition].classList.add("current");
        }
      }

      function oneCardStep(){
        if (!slots[0]){
          return 0;
        }
        const style = getComputedStyle(pathEl);
        const gap = parseFloat(style.columnGap || style.gap || "4") || 4;
        return slots[0].offsetWidth + gap;
      }

      async function scrollForwardOneCard(){
        const step = oneCardStep();
        scrollWindow.scrollTo({
          left:Math.max(0,(currentPosition + 1) * step),
          behavior:"smooth"
        });
        await wait(SCROLL_WAIT);
      }

      function stopForObstacle(obstacle){
        running = false;
        pendingObstacle = obstacle;
        clearTargetMarks();

        if (obstacle.type === "monster"){
          slots[obstacle.index]?.classList.add("targetMonster");
          exploreStatus.textContent = `ゴブリン 距離${obstacle.distance}`;
        } else {
          slots[obstacle.index]?.classList.add("targetTrap");
          exploreStatus.textContent = "トラップの前で停止";
        }
      }

      function convertToDungeon(index){
        const card = path[index];
        const slot = slots[index];
        if (!card || !slot){
          return;
        }

        card.type = "dungeon";
        card.cleared = true;
        card.revealed = true;
        slot.dataset.type = "dungeon";
        slot.innerHTML = `
          <div class="pathCardInner" style="transform:rotateY(180deg)">
            <div class="pathBack"></div>
            <div class="pathFront dungeonCard">
              <img class="pathArt" src="${dungeonArt}" alt="" />
              <img class="pathFrame" src="${cardFrame}" alt="" />
            </div>
          </div>
        `;
        slot.classList.add("revealed");
        slot.classList.remove("targetMonster","targetTrap");
      }

      async function exploreLoop(){
        if (running){
          return;
        }

        running = true;
        pendingObstacle = null;
        exploreStatus.textContent = "状態：探索中";

        revealVision();

        while (running && currentPosition < PATH_LENGTH - 1){
          const monster = findVisibleMonster();
          if (monster){
            stopForObstacle(monster);
            return;
          }

          const trap = trapImmediatelyAhead();
          if (trap){
            stopForObstacle(trap);
            return;
          }

          await wait(STEP_WAIT);
          if (!running){
            return;
          }

          currentPosition += 1;
          markCurrent();
          await scrollForwardOneCard();
          revealVision();
        }

        running = false;
        exploreStatus.textContent = "状態：最奥";
      }

      async function resolveObstacle(){
        if (!pendingObstacle){
          return;
        }

        const index = pendingObstacle.index;
        convertToDungeon(index);
        pendingObstacle = null;
        clearTargetMarks();
        revealVision();
        await exploreLoop();
      }

      function setLamp(value){
        hasLamp = Boolean(value);
        lightStatus.textContent = hasLamp ? "灯り：ランプ" : "灯り：なし";
        revealVision();
      }

      function start(){
        path = makePath();
        currentPosition = -1;
        pendingObstacle = null;
        scrollWindow.scrollLeft = 0;
        renderPath();
        setLamp(HAS_LAMP_AT_START);
        revealVision();
        exploreLoop();
      }

      window.HOUSEBUILDING_CARD_PATH = {
        resume:exploreLoop,
        resolveObstacle,
        setLamp,
        getState:() => ({
          hasLamp,
          currentPosition,
          vision:visionRange(),
          pendingObstacle,
          path:path.map(card => ({...card}))
        })
      };

      window.addEventListener("load",start);
    })();
  </script>
</body>
</html>
