<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>文字タップ</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f0e8;color:#222}
    button{font:inherit}
    .app{width:min(640px,100%);height:100svh;margin:auto;padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto auto 1fr auto;gap:10px}
    .top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
    .back{width:42px;height:42px;border:1px solid #b9b2a7;border-radius:12px;background:#fff;color:#222;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
    h1{margin:0;text-align:center;font-size:20px}
    .question{background:#fff;border:1px solid #ccc3b7;border-radius:18px;padding:18px 14px;text-align:center}
    .question small{display:block;color:#777;font-size:13px;margin-bottom:4px}
    .question strong{display:block;font-size:34px;line-height:1.3}
    .answer{min-height:64px;background:#fff;border:2px solid #aaa196;border-radius:16px;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}
    .answer .letter{min-width:32px;height:42px;padding:0 5px;border-bottom:3px solid #444;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;text-transform:lowercase}
    .placeholder{color:#aaa;font-size:17px}
    .message{min-height:24px;text-align:center;font-size:15px;font-weight:800}
    .message.good{color:#147a3d}.message.bad{color:#c43d3d}
    .keys{min-height:0;display:grid;grid-template-columns:repeat(7,1fr);gap:7px;align-content:center}
    .key{aspect-ratio:1.05;border:1px solid #999084;border-radius:12px;background:#fff;color:#222;font-size:clamp(18px,5vw,25px);font-weight:900;box-shadow:0 2px 0 #bbb2a5;touch-action:manipulation}
    .key:active{transform:translateY(2px);box-shadow:none;background:#eee8dd}
    .controls{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
    .control{min-height:52px;border-radius:13px;border:1px solid #aaa196;background:#fff;font-weight:900;font-size:16px}
    .submit{background:#222;color:#fff;border-color:#222}
    @media(max-width:430px){.app{padding-left:8px;padding-right:8px;gap:8px}.keys{gap:5px}.key{border-radius:10px}.question{padding:14px 10px}.question strong{font-size:30px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <a class="back" href="シューティングtop.html" aria-label="戻る">←</a>
      <h1>英単語を作る</h1>
      <span></span>
    </header>

    <section class="question">
      <small>日本語に合う英単語をタップしてください</small>
      <strong id="jp">りんご</strong>
    </section>

    <section class="answer" id="answer" aria-live="polite">
      <span class="placeholder">下の文字をタップ</span>
    </section>

    <section class="keys" id="keys" aria-label="アルファベット"></section>

    <section>
      <div class="message" id="message"></div>
      <div class="controls">
        <button class="control" id="deleteBtn" type="button">1文字消す</button>
        <button class="control" id="clearBtn" type="button">全部消す</button>
        <button class="control submit" id="submitBtn" type="button">決定</button>
      </div>
    </section>
  </main>

  <script>
    const WORDS = [
      ["apple","りんご"],["dog","犬"],["cat","猫"],["book","本"],["school","学校"],
      ["teacher","先生"],["friend","友達"],["water","水"],["train","電車"],["green","緑"]
    ];

    const jp = document.getElementById('jp');
    const answerEl = document.getElementById('answer');
    const keysEl = document.getElementById('keys');
    const message = document.getElementById('message');
    const deleteBtn = document.getElementById('deleteBtn');
    const clearBtn = document.getElementById('clearBtn');
    const submitBtn = document.getElementById('submitBtn');

    let index = 0;
    let typed = '';

    const letters = 'abcdefghijklmnopqrstuvwxyz'.split('');

    function makeKeys(){
      keysEl.innerHTML = '';
      letters.forEach(letter => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'key';
        btn.textContent = letter;
        btn.setAttribute('aria-label', letter);
        btn.addEventListener('click', () => addLetter(letter));
        keysEl.appendChild(btn);
      });
    }

    function addLetter(letter){
      if(typed.length >= 18) return;
      typed += letter;
      message.textContent = '';
      message.className = 'message';
      renderAnswer();
    }

    function renderAnswer(){
      answerEl.innerHTML = '';
      if(!typed){
        const p = document.createElement('span');
        p.className = 'placeholder';
        p.textContent = '下の文字をタップ';
        answerEl.appendChild(p);
        return;
      }
      [...typed].forEach(letter => {
        const span = document.createElement('span');
        span.className = 'letter';
        span.textContent = letter;
        answerEl.appendChild(span);
      });
    }

    function nextQuestion(){
      index = (index + 1) % WORDS.length;
      typed = '';
      jp.textContent = WORDS[index][1];
      message.textContent = '';
      message.className = 'message';
      renderAnswer();
    }

    deleteBtn.addEventListener('click', () => {
      typed = typed.slice(0,-1);
      renderAnswer();
    });

    clearBtn.addEventListener('click', () => {
      typed = '';
      renderAnswer();
    });

    submitBtn.addEventListener('click', () => {
      if(!typed) return;
      const correct = WORDS[index][0];
      if(typed === correct){
        message.textContent = '正解！ ' + correct + ' ＝ ' + WORDS[index][1];
        message.className = 'message good';
        setTimeout(nextQuestion,700);
      }else{
        message.textContent = 'ちがいます。もう一度。';
        message.className = 'message bad';
      }
    });

    makeKeys();
    jp.textContent = WORDS[index][1];
    renderAnswer();
  </script>
</body>
</html>
