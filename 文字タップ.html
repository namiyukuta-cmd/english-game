<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>英単語シューティング - 回答</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#fff;touch-action:manipulation}
    button,input{font:inherit}
    button{touch-action:manipulation}

    .app{width:min(620px,100%);height:100svh;margin:auto;padding:10px 12px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 150px auto 1fr;gap:8px;overflow:hidden}
    .top{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px}
    .back{width:42px;height:42px;border:1px solid #3a4d67;border-radius:12px;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
    .title{text-align:center;font-weight:900;font-size:16px}.count{font-size:14px;color:#c9d5e5;white-space:nowrap}

    .field{position:relative;min-height:0;overflow:hidden;border:1px solid #2c405a;border-radius:20px;background:linear-gradient(#13243a,#09121f)}
    .field:before{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:42px 42px;pointer-events:none}
    .jp-hit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:150px;max-width:82%;padding:9px 22px;border:2px solid #ff9aac;border-radius:18px;background:#4c2430;color:#fff;text-align:center;font-size:clamp(28px,9vw,44px);font-weight:950;line-height:1.15;text-shadow:0 3px 10px #000;white-space:nowrap}
    .impact{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);width:66%;height:7px;border-radius:999px;background:#1b2c42;box-shadow:0 0 28px #7ee7ff44}
    .impact:before{content:"YOU";position:absolute;left:50%;top:-28px;transform:translateX(-50%);font-size:11px;color:#8094ac;font-weight:900}

    .quiz{padding:9px 11px;border:1px solid #334964;border-radius:18px;background:#111e30}
    .label{font-size:12px;color:#9db0c7;font-weight:800;margin-bottom:3px}
    .jp{font-size:24px;font-weight:950;margin:0 0 6px;color:#ffd75a;line-height:1.2}
    .answer-row{display:grid;grid-template-columns:1fr auto;gap:7px}
    .answer-box{min-width:0;height:48px;border:2px solid #77dcff;border-radius:13px;background:#08111e;color:#fff;padding:0 13px;font-size:21px;font-weight:800;outline:none;caret-color:transparent;user-select:none;pointer-events:none}
    .submit{height:48px;border:0;border-radius:13px;background:#ffd54f;color:#172033;font-weight:900;padding:0 18px;font-size:18px}
    .msg{min-height:18px;margin-top:4px;font-size:13px;font-weight:800}.msg.good{color:#78eca5}.msg.bad{color:#ff8c8c}

    /* キーボード本体は余白を引き伸ばさず、スマホ標準に近い高さで画面下へ固定 */
    .keyboard-wrap{min-height:0;display:flex;align-items:flex-end;justify-content:center}
    .keyboard{width:100%;border:1px solid #334964;border-radius:18px;background:#101c2d;padding:7px 5px 8px;display:grid;gap:4px;align-self:end}
    .key-row{display:flex;justify-content:center;align-items:center;height:52px}

    /* hit は隙間を含む実際のタップ領域、keycap は見た目だけ */
    .key-hit{height:100%;min-width:0;display:flex;align-items:stretch;justify-content:stretch;padding:2px;cursor:pointer;user-select:none}
    .key-hit.letter{flex:1}
    .keycap{width:100%;height:100%;border:0;border-radius:7px;background:#e8edf3;color:#101722;font-size:23px;font-weight:650;box-shadow:0 1px 0 #65748a,0 2px 3px #0006;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .key-hit.pressed .keycap{transform:translateY(1px);background:#cbd5e1;box-shadow:0 1px 1px #0004}

    .row2{padding-left:4.5%;padding-right:4.5%}
    .row3{gap:0}
    .side-hit{height:100%;display:flex;align-items:stretch;padding:2px;flex:1.28}
    .side-hit .keycap{background:#aeb9c8;font-size:18px;font-weight:900}
    .row3 .key-hit.letter{flex:1}

    .utility-row{display:grid;grid-template-columns:1.15fr 3.6fr 1.15fr;height:52px}
    .utility-hit{height:100%;display:flex;padding:2px;user-select:none;cursor:pointer}
    .utility-hit .keycap{background:#aeb9c8;font-size:14px;font-weight:900;color:#101722}
    .utility-hit.space .keycap{background:#eef2f6;font-size:13px;letter-spacing:.08em}

    .error{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:30px;color:#c9d5e5;line-height:1.7}.error.show{display:flex}

    @media(max-height:700px){
      .app{grid-template-rows:auto 120px auto 1fr;gap:6px}
      .quiz{padding:7px 9px}.jp{font-size:21px;margin-bottom:4px}.answer-box,.submit{height:44px}
      .key-row,.utility-row{height:46px}.keyboard{padding:5px 4px 6px;gap:3px}.key-hit,.side-hit,.utility-hit{padding:1.5px}.keycap{font-size:20px}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <a class="back" href="シューティングtop.html" aria-label="戻る">←</a>
      <div class="title">英単語シューティング</div>
      <div class="count"><span id="now">1</span> / 10</div>
    </header>

    <section class="field">
      <div class="jp-hit" id="jpHit"></div>
      <div class="impact"></div>
      <div class="error" id="error">問題データがありません。<br>「初めから」で開始してください。</div>
    </section>

    <section class="quiz" id="quiz">
      <div class="label">さっき飛んできた英単語を入力してください</div>
      <p class="jp" id="jp"></p>
      <div class="answer-row">
        <input class="answer-box" id="answer" type="text" readonly inputmode="none" tabindex="-1" autocomplete="off" aria-label="英単語の入力内容">
        <button class="submit" id="submitBtn" type="button">決定</button>
      </div>
      <div class="msg" id="msg"></div>
    </section>

    <div class="keyboard-wrap">
      <section class="keyboard" id="keyboard" aria-label="英語キーボード">
        <div class="key-row row1" id="row1"></div>
        <div class="key-row row2" id="row2"></div>
        <div class="key-row row3" id="row3"></div>
        <div class="utility-row">
          <div class="utility-hit" id="clearHit" role="button" aria-label="全部消す"><div class="keycap">全消し</div></div>
          <div class="utility-hit space" id="spaceHit" role="button" aria-label="スペース"><div class="keycap">SPACE</div></div>
          <div class="utility-hit" id="deleteHit" role="button" aria-label="1文字消す"><div class="keycap">⌫</div></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const SAVE_KEY='eiken5TypingSave';
    const now=document.getElementById('now');
    const jpHit=document.getElementById('jpHit');
    const jp=document.getElementById('jp');
    const quiz=document.getElementById('quiz');
    const keyboard=document.getElementById('keyboard');
    const error=document.getElementById('error');
    const answer=document.getElementById('answer');
    const msg=document.getElementById('msg');
    const submitBtn=document.getElementById('submitBtn');

    let save=null;
    let current=null;
    let locked=false;

    function pressEffect(el){
      el.classList.add('pressed');
      setTimeout(()=>el.classList.remove('pressed'),85);
    }

    function makeLetter(row,letter){
      const hit=document.createElement('div');
      hit.className='key-hit letter';
      hit.setAttribute('role','button');
      hit.setAttribute('aria-label',letter);
      const cap=document.createElement('div');
      cap.className='keycap';
      cap.textContent=letter;
      hit.appendChild(cap);
      hit.addEventListener('pointerdown',e=>{
        e.preventDefault();
        pressEffect(hit);
        addCharacter(letter);
      });
      row.appendChild(hit);
    }

    function makeKeyboard(){
      const row1=document.getElementById('row1');
      const row2=document.getElementById('row2');
      const row3=document.getElementById('row3');
      'qwertyuiop'.split('').forEach(l=>makeLetter(row1,l));
      'asdfghjkl'.split('').forEach(l=>makeLetter(row2,l));

      const left=document.createElement('div');
      left.className='side-hit';
      left.setAttribute('aria-hidden','true');
      left.innerHTML='<div class="keycap">⇧</div>';
      row3.appendChild(left);
      'zxcvbnm'.split('').forEach(l=>makeLetter(row3,l));
      const right=document.createElement('div');
      right.className='side-hit';
      right.setAttribute('role','button');
      right.setAttribute('aria-label','1文字消す');
      right.innerHTML='<div class="keycap">⌫</div>';
      right.addEventListener('pointerdown',e=>{
        e.preventDefault();
        pressEffect(right);
        deleteCharacter();
      });
      row3.appendChild(right);
    }

    function addCharacter(char){
      if(locked || !current)return;
      if(answer.value.length>=24)return;
      answer.value+=char;
      clearMessage();
    }

    function deleteCharacter(){
      if(locked)return;
      answer.value=answer.value.slice(0,-1);
      clearMessage();
    }

    function clearMessage(){
      msg.textContent='';
      msg.className='msg';
    }

    function loadQuestion(){
      try{save=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){save=null}
      if(!save || !Array.isArray(save.questions) || save.index<0 || save.index>=save.questions.length){
        quiz.style.display='none';
        keyboard.style.display='none';
        jpHit.style.display='none';
        error.classList.add('show');
        return;
      }
      current=save.questions[save.index];
      now.textContent=save.index+1;
      jpHit.textContent=current[1];
      jp.textContent=current[1];
      answer.value='';
    }

    function submitAnswer(){
      if(locked || !current)return;
      const typed=answer.value.trim().toLowerCase().replace(/\s+/g,' ');
      const correct=current[0].toLowerCase().replace(/\s+/g,' ');
      if(!typed)return;
      if(typed===correct){
        locked=true;
        msg.textContent='正解：'+current[0]+' ＝ '+current[1];
        msg.className='msg good';
        save.index++;
        if(save.index>=save.questions.length){
          localStorage.removeItem(SAVE_KEY);
          setTimeout(()=>{location.href='シューティングtop.html'},650);
        }else{
          localStorage.setItem(SAVE_KEY,JSON.stringify(save));
          setTimeout(()=>{location.href='シューティング.html?continue=1'},450);
        }
      }else{
        msg.textContent='ちがいます。もう一度入力してください。';
        msg.className='msg bad';
      }
    }

    submitBtn.addEventListener('click',submitAnswer);

    const clearHit=document.getElementById('clearHit');
    clearHit.addEventListener('pointerdown',e=>{
      e.preventDefault();
      pressEffect(clearHit);
      if(locked)return;
      answer.value='';
      clearMessage();
    });

    const spaceHit=document.getElementById('spaceHit');
    spaceHit.addEventListener('pointerdown',e=>{
      e.preventDefault();
      pressEffect(spaceHit);
      if(locked || !answer.value || answer.value.endsWith(' '))return;
      addCharacter(' ');
    });

    const deleteHit=document.getElementById('deleteHit');
    deleteHit.addEventListener('pointerdown',e=>{
      e.preventDefault();
      pressEffect(deleteHit);
      deleteCharacter();
    });

    makeKeyboard();
    loadQuestion();
  </script>
</body>
</html>
