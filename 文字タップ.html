<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>英単語シューティング - 回答</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#fff;touch-action:manipulation}
    button,input{font:inherit}
    .app{width:min(620px,100%);height:100svh;margin:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto minmax(145px,23vh) auto 1fr;gap:8px;overflow:hidden}
    .top{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px}
    .back{width:42px;height:42px;border:1px solid #3a4d67;border-radius:12px;color:#fff;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
    .title{text-align:center;font-weight:900;font-size:16px}.count{font-size:14px;color:#c9d5e5;white-space:nowrap}

    .field{position:relative;min-height:0;overflow:hidden;border:1px solid #2c405a;border-radius:20px;background:linear-gradient(#13243a,#09121f)}
    .field:before{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:42px 42px;pointer-events:none}
    .jp-hit{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);min-width:150px;max-width:82%;padding:11px 22px;border:2px solid #ff9aac;border-radius:18px;background:#4c2430;color:#fff;text-align:center;font-size:clamp(28px,9vw,46px);font-weight:950;line-height:1.15;text-shadow:0 3px 10px #000;white-space:nowrap}
    .impact{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);width:66%;height:7px;border-radius:999px;background:#1b2c42;box-shadow:0 0 28px #7ee7ff44}
    .impact:before{content:"YOU";position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:11px;color:#8094ac;font-weight:900}

    .quiz{padding:10px 12px;border:1px solid #334964;border-radius:18px;background:#111e30}
    .label{font-size:12px;color:#9db0c7;font-weight:800;margin-bottom:3px}
    .jp{font-size:25px;font-weight:950;margin:0 0 7px;color:#ffd75a;line-height:1.2}
    .answer-row{display:grid;grid-template-columns:1fr auto;gap:8px}
    .answer-box{min-width:0;height:50px;border:2px solid #77dcff;border-radius:13px;background:#08111e;color:#fff;padding:0 13px;font-size:21px;font-weight:800;outline:none;caret-color:transparent;user-select:none}
    .submit{height:50px;border:0;border-radius:13px;background:#ffd54f;color:#172033;font-weight:900;padding:0 18px;font-size:18px}
    .msg{min-height:20px;margin-top:5px;font-size:13px;font-weight:800}.msg.good{color:#78eca5}.msg.bad{color:#ff8c8c}

    .keyboard{min-height:0;border:1px solid #334964;border-radius:20px;background:#101c2d;padding:10px 7px;display:grid;grid-template-rows:repeat(4,1fr);gap:7px;align-content:stretch}
    .key-row{display:flex;justify-content:center;gap:5px;min-height:0}
    .key{flex:1;min-width:0;max-width:54px;border:1px solid #526987;border-radius:10px;background:#1b2c43;color:#fff;font-size:clamp(18px,5.1vw,24px);font-weight:900;box-shadow:0 2px 0 #08111e;touch-action:manipulation}
    .key:active{transform:translateY(2px);box-shadow:none;background:#29415f}
    .utility-row{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:6px;min-height:0}
    .utility{border:1px solid #526987;border-radius:10px;background:#1b2c43;color:#dfeaff;font-size:15px;font-weight:900}
    .utility:active{background:#29415f}
    .space{font-size:14px;letter-spacing:.08em}

    .error{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:30px;color:#c9d5e5;line-height:1.7}.error.show{display:flex}
    @media(max-height:700px){.app{grid-template-rows:auto minmax(120px,20vh) auto 1fr;gap:6px}.quiz{padding:8px 10px}.jp{font-size:22px;margin-bottom:5px}.answer-box,.submit{height:46px}.keyboard{padding:7px 5px;gap:5px}.key-row{gap:4px}.key{border-radius:8px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <a class="back" href="シューティングtop.html" aria-label="戻る">←</a>
      <div class="title">英単語シューティング</div>
      <div class="count"><span id="now">1</span> / 10</div>
    </header>

    <section class="field">
      <div class="jp-hit" id="jpHit"></div>
      <div class="impact"></div>
      <div class="error" id="error">問題データがありません。<br>「初めから」で開始してください。</div>
    </section>

    <section class="quiz" id="quiz">
      <div class="label">さっき飛んできた英単語を入力してください</div>
      <p class="jp" id="jp"></p>
      <div class="answer-row">
        <input class="answer-box" id="answer" type="text" readonly inputmode="none" tabindex="-1" autocomplete="off" aria-label="英単語の入力内容">
        <button class="submit" id="submitBtn" type="button">決定</button>
      </div>
      <div class="msg" id="msg"></div>
    </section>

    <section class="keyboard" id="keyboard" aria-label="英語キーボード">
      <div class="key-row" data-row="qwertyuiop"></div>
      <div class="key-row" data-row="asdfghjkl"></div>
      <div class="key-row" data-row="zxcvbnm"></div>
      <div class="utility-row">
        <button class="utility" id="clearBtn" type="button">全消し</button>
        <button class="utility space" id="spaceBtn" type="button">SPACE</button>
        <button class="utility" id="deleteBtn" type="button">⌫</button>
      </div>
    </section>
  </main>

  <script>
    const SAVE_KEY='eiken5TypingSave';
    const now=document.getElementById('now');
    const jpHit=document.getElementById('jpHit');
    const jp=document.getElementById('jp');
    const quiz=document.getElementById('quiz');
    const keyboard=document.getElementById('keyboard');
    const error=document.getElementById('error');
    const answer=document.getElementById('answer');
    const msg=document.getElementById('msg');
    const submitBtn=document.getElementById('submitBtn');
    const clearBtn=document.getElementById('clearBtn');
    const spaceBtn=document.getElementById('spaceBtn');
    const deleteBtn=document.getElementById('deleteBtn');

    let save=null;
    let current=null;
    let locked=false;

    function makeKeyboard(){
      document.querySelectorAll('.key-row[data-row]').forEach(row=>{
        const letters=row.dataset.row.split('');
        letters.forEach(letter=>{
          const button=document.createElement('button');
          button.type='button';
          button.className='key';
          button.textContent=letter;
          button.setAttribute('aria-label',letter);
          button.addEventListener('click',()=>addCharacter(letter));
          row.appendChild(button);
        });
      });
    }

    function addCharacter(char){
      if(locked || !current)return;
      if(answer.value.length>=24)return;
      answer.value+=char;
      clearMessage();
    }

    function clearMessage(){
      msg.textContent='';
      msg.className='msg';
    }

    function loadQuestion(){
      try{save=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){save=null}
      if(!save || !Array.isArray(save.questions) || save.index<0 || save.index>=save.questions.length){
        quiz.style.display='none';
        keyboard.style.display='none';
        jpHit.style.display='none';
        error.classList.add('show');
        return;
      }
      current=save.questions[save.index];
      now.textContent=save.index+1;
      jpHit.textContent=current[1];
      jp.textContent=current[1];
      answer.value='';
    }

    function submitAnswer(){
      if(locked || !current)return;
      const typed=answer.value.trim().toLowerCase().replace(/\s+/g,' ');
      const correct=current[0].toLowerCase().replace(/\s+/g,' ');
      if(!typed)return;
      if(typed===correct){
        locked=true;
        msg.textContent='正解：'+current[0]+' ＝ '+current[1];
        msg.className='msg good';
        save.index++;
        if(save.index>=save.questions.length){
          localStorage.removeItem(SAVE_KEY);
          setTimeout(()=>{location.href='シューティングtop.html'},650);
        }else{
          localStorage.setItem(SAVE_KEY,JSON.stringify(save));
          setTimeout(()=>{location.href='シューティング.html?continue=1'},450);
        }
      }else{
        msg.textContent='ちがいます。もう一度入力してください。';
        msg.className='msg bad';
      }
    }

    submitBtn.addEventListener('click',submitAnswer);
    deleteBtn.addEventListener('click',()=>{
      if(locked)return;
      answer.value=answer.value.slice(0,-1);
      clearMessage();
    });
    clearBtn.addEventListener('click',()=>{
      if(locked)return;
      answer.value='';
      clearMessage();
    });
    spaceBtn.addEventListener('click',()=>{
      if(locked || !answer.value || answer.value.endsWith(' '))return;
      addCharacter(' ');
    });

    makeKeyboard();
    loadQuestion();
  </script>
</body>
</html>
