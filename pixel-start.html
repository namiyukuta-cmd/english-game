<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7fb">
  <title>ドット絵</title>
  <link rel="stylesheet" href="css/style.css?v=20260823-1401">
  <style>
    .menu-head{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;margin-bottom:18px}
    .menu-head h1{margin:0;text-align:center;font-size:22px}
    .back{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--brown);font-size:21px;font-weight:900;text-decoration:none}
    .note{margin:4px 4px 18px;text-align:center;font-size:13px;line-height:1.7;color:#977582}
    .choice{display:grid;gap:12px}
    .choice a{text-decoration:none;color:inherit}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="menu-head">
      <a class="back" href="story-menu.html" aria-label="選択画面へ戻る">←</a>
      <h1>ドット絵</h1>
      <span aria-hidden="true"></span>
    </header>

    <p class="note">24×24のドット絵を描きます。</p>

    <div class="mode-grid choice">
      <a class="mode-card" href="pixel-editor.html?mode=new">
        <span class="mode-icon">＋</span>
        <span class="mode-copy"><strong>初めから</strong><small>新しいドット絵を描く</small></span>
        <span class="arrow">›</span>
      </a>

      <a class="mode-card" href="pixel-saves.html">
        <span class="mode-icon">💾</span>
        <span class="mode-copy"><strong>続きから</strong><small>保存したドット絵を開く</small></span>
        <span class="arrow">›</span>
      </a>
    </div>
  </main>
</body>
</html>
