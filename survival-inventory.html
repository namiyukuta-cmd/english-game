<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サバイバル - インベントリ</title>

  <link rel="stylesheet" href="css/survival/inventory.css?v=20261004-css-split-1">
</head>

<body>

<div class="game">

  <header class="topbar">

    <button
      class="back-button"
      type="button"
      id="backButton"
    >
      戻る
    </button>

    <div class="screen-title">
      インベントリ
    </div>

    <div class="top-spacer"></div>

  </header>


  <main class="inventory-screen">

    <div class="inventory-columns">


      <!-- =========================
           左側：収納
           タンス・冷蔵庫・棚など共通
      ========================== -->

      <section class="panel">

        <div class="panel-header">

          <div
            class="panel-title"
            id="storageTitle"
          >
            収納
          </div>

          <div
            class="panel-sub"
            id="storageSub"
          >
            -
          </div>

        </div>

        <div
          class="panel-list"
          id="storageList"
        ></div>

      </section>


      <!-- =========================
           右側：主人公

           通常収納
           → アイテム一覧

           洋服箪笥
           → 装備一覧

           切り替えはJS側
      ========================== -->

      <section class="panel">

        <div class="panel-header">

          <div
            class="panel-title"
            id="playerTitle"
          >
            アイテム
          </div>

          <div
            class="panel-sub"
            id="playerSub"
          >
            -
          </div>

        </div>

        <div
          class="panel-list"
          id="playerList"
        ></div>

      </section>


    </div>


    <!-- =========================
         操作
    ========================== -->

    <div class="action-area">

      <button
        class="action-button"
        type="button"
        id="takeButton"
        disabled
      >
        受け取る
      </button>

      <button
        class="action-button"
        type="button"
        id="returnButton"
        disabled
      >
        収納へ戻す
      </button>

    </div>


    <!-- =========================
         メッセージ
    ========================== -->

    <div
      class="message"
      id="message"
      aria-live="polite"
    >
      移動するものを選んでください。
    </div>

  </main>

</div>


<!--
  データ
-->
<script src="data/survival-items.js"></script>

<!--
  インベントリ本体
  所持品・重量・装備・収納・移動処理
-->
<script src="data/survival-inventory.js"></script>

<!--
  このHTMLへの表示・操作
-->
<script src="data/survival-inventory-ui.js"></script>

</body>
</html>
