<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サバイバル - インベントリ</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:#eef1f2;
  color:#202326;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  font-size:17px;
}

body{
  min-height:100dvh;
  display:flex;
  justify-content:center;
}

button{
  font:inherit;
  color:inherit;
  -webkit-tap-highlight-color:transparent;
}

.game{
  width:100%;
  max-width:720px;
  height:100dvh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#f8f9f9;
}


/* =========================
   上部
========================= */

.topbar{
  flex:0 0 auto;
  min-height:58px;
  padding:
    max(8px, env(safe-area-inset-top))
    10px
    8px;
  display:grid;
  grid-template-columns:72px 1fr 72px;
  align-items:center;
  gap:8px;
  border-bottom:1px solid #aeb4b8;
  background:#ffffff;
}

.back-button{
  min-height:44px;
  border:1px solid #8f969a;
  border-radius:9px;
  background:#f4f5f5;
  font-weight:700;
}

.screen-title{
  text-align:center;
  font-size:20px;
  font-weight:800;
}

.top-spacer{
  width:72px;
}


/* =========================
   メイン
========================= */

.inventory-screen{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:8px 8px max(8px, env(safe-area-inset-bottom));
}

.inventory-columns{
  flex:1 1 auto;
  min-height:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}


/* =========================
   左右共通パネル
========================= */

.panel{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid #969da1;
  border-radius:11px;
  background:#ffffff;
}

.panel-header{
  flex:0 0 auto;
  min-height:58px;
  padding:8px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:3px;
  border-bottom:1px solid #b8bdc0;
  background:#eceeef;
}

.panel-title{
  min-width:0;
  font-size:18px;
  font-weight:800;
  line-height:1.25;
  overflow-wrap:anywhere;
}

.panel-sub{
  min-width:0;
  font-size:17px;
  line-height:1.25;
  color:#555d61;
  overflow-wrap:anywhere;
}

.panel-list{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:6px;
}


/* =========================
   通常アイテム行
========================= */

.item-row{
  width:100%;
  min-height:62px;
  margin:0 0 6px;
  padding:8px;
  border:1px solid #c2c6c9;
  border-radius:9px;
  background:#ffffff;
  text-align:left;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
}

.item-row:last-child{
  margin-bottom:0;
}

.item-row.selected{
  border:2px solid #343b3f;
  background:#e8ecee;
}

.item-name{
  flex:1 1 auto;
  min-width:0;
  font-weight:700;
  line-height:1.35;
  overflow-wrap:anywhere;
}

.item-info{
  flex:0 0 auto;
  min-width:54px;
  text-align:right;
  white-space:nowrap;
  font-size:17px;
  line-height:1.3;
}

.item-qty{
  display:block;
}

.item-weight{
  display:block;
  color:#5a6266;
}


/* =========================
   装備欄
========================= */

.equipment-row{
  width:100%;
  min-height:66px;
  margin:0 0 6px;
  padding:8px;
  border:1px solid #c2c6c9;
  border-radius:9px;
  background:#ffffff;
  text-align:left;
  display:block;
}

.equipment-row:last-child{
  margin-bottom:0;
}

.equipment-row.selected{
  border:2px solid #343b3f;
  background:#e8ecee;
}

.equipment-slot-name{
  display:block;
  margin-bottom:4px;
  font-size:17px;
  font-weight:800;
  color:#4c5357;
}

.equipment-item-name{
  display:block;
  font-size:17px;
  font-weight:700;
  line-height:1.35;
  overflow-wrap:anywhere;
}

.equipment-empty{
  color:#777f83;
  font-weight:400;
}


/* =========================
   空表示
========================= */

.empty-message{
  padding:18px 8px;
  text-align:center;
  color:#697176;
  font-size:17px;
  line-height:1.5;
}


/* =========================
   操作ボタン
========================= */

.action-area{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.action-button{
  min-height:52px;
  padding:8px 10px;
  border:1px solid #7f878b;
  border-radius:10px;
  background:#f2f3f3;
  font-weight:800;
}

.action-button:disabled{
  opacity:.4;
}


/* =========================
   メッセージ欄
========================= */

.message{
  flex:0 0 auto;
  min-height:50px;
  max-height:76px;
  overflow-y:auto;
  padding:9px 11px;
  border:1px solid #b8bdc0;
  border-radius:9px;
  background:#ffffff;
  display:flex;
  align-items:center;
  font-size:17px;
  line-height:1.4;
}

.message.error{
  font-weight:800;
}


/* =========================
   狭いスマホ
========================= */

@media (max-width:390px){

  .inventory-screen{
    padding:6px 6px max(6px, env(safe-area-inset-bottom));
    gap:6px;
  }

  .inventory-columns{
    gap:5px;
  }

  .panel-header{
    padding:7px 6px;
  }

  .panel-list{
    padding:5px;
  }

  .item-row,
  .equipment-row{
    padding:7px 6px;
  }

  .action-area{
    gap:5px;
  }
}

</style>
</head>

<body>

<div class="game">

  <header class="topbar">

    <button
      class="back-button"
      type="button"
      id="backButton"
    >
      戻る
    </button>

    <div class="screen-title">
      インベントリ
    </div>

    <div class="top-spacer"></div>

  </header>


  <main class="inventory-screen">

    <div class="inventory-columns">


      <!-- =========================
           左側：収納
           タンス・冷蔵庫・棚など共通
      ========================== -->

      <section class="panel">

        <div class="panel-header">

          <div
            class="panel-title"
            id="storageTitle"
          >
            収納
          </div>

          <div
            class="panel-sub"
            id="storageSub"
          >
            -
          </div>

        </div>

        <div
          class="panel-list"
          id="storageList"
        ></div>

      </section>


      <!-- =========================
           右側：主人公

           通常収納
           → アイテム一覧

           洋服箪笥
           → 装備一覧

           切り替えはJS側
      ========================== -->

      <section class="panel">

        <div class="panel-header">

          <div
            class="panel-title"
            id="playerTitle"
          >
            アイテム
          </div>

          <div
            class="panel-sub"
            id="playerSub"
          >
            -
          </div>

        </div>

        <div
          class="panel-list"
          id="playerList"
        ></div>

      </section>


    </div>


    <!-- =========================
         操作
    ========================== -->

    <div class="action-area">

      <button
        class="action-button"
        type="button"
        id="takeButton"
        disabled
      >
        受け取る
      </button>

      <button
        class="action-button"
        type="button"
        id="returnButton"
        disabled
      >
        収納へ戻す
      </button>

    </div>


    <!-- =========================
         メッセージ
    ========================== -->

    <div
      class="message"
      id="message"
      aria-live="polite"
    >
      移動するものを選んでください。
    </div>

  </main>

</div>


<!--
  データ
-->
<script src="data/survival-items.js"></script>

<!--
  インベントリ本体
  所持品・重量・装備・収納・移動処理
-->
<script src="data/survival-inventory.js"></script>

<!--
  このHTMLへの表示・操作
-->
<script src="data/survival-inventory-ui.js"></script>

</body>
</html>
