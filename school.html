<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#eef6ff">
  <title>学校</title>
  <link rel="stylesheet" href="css/school.css?v=20260822-2212">
</head>
<body>
  <main class="school-stage">
    <header class="school-header">
      <a class="back-button" href="index.html" aria-label="ホームへ戻る">←</a>
      <div>
        <p class="school-kicker">AMERICAN SCHOOL</p>
        <h1>学校</h1>
      </div>
      <div id="schoolProgress" class="school-progress">1 / 3</div>
    </header>

    <section class="scene-panel">
      <p id="sceneTitle" class="scene-title">留学初日</p>
      <p id="scenePlace" class="scene-place">教室</p>
    </section>

    <section class="conversation-panel" aria-label="会話">
      <div id="conversationHistory" class="conversation-history"></div>
      <div id="npcSpeech" class="speech-card">
        <p id="npcName" class="speaker-name"></p>
        <p id="npcEnglish" class="npc-english"></p>
        <p id="npcJapanese" class="npc-japanese"></p>
      </div>
    </section>

    <section class="response-panel" aria-label="主人公の返事">
      <p class="response-label">返事をする</p>
      <p id="responsePrompt" class="response-prompt"></p>
      <div id="selectedWords" class="selected-words" aria-live="polite"></div>
      <div id="wordBank" class="word-bank" aria-label="英単語"></div>
      <p id="schoolFeedback" class="school-feedback" aria-live="polite"></p>
      <div class="school-actions">
        <button id="resetWords" class="school-button secondary" type="button">選びなおす</button>
        <button id="sayResponse" class="school-button" type="button">話す</button>
      </div>
      <a id="schoolFinish" class="school-finish hidden" href="index.html">学校を出る</a>
    </section>
  </main>

  <script src="data/words/grade1/term1.js"></script>
  <script src="data/words.js"></script>
  <script src="js/storage.js"></script>
  <script src="data/scenes/school.js"></script>
  <script src="js/school.js?v=20260822-2212"></script>
</body>
</html>
