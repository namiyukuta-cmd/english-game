  <title>ダンジョンの酒場</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;background:#efe4d6;color:#3c312b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}

    .app{width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
    .head{display:grid;grid-template-columns:48px 1fr 48px;align-items:center}.head h1{margin:0;text-align:center;font-size:24px}.back{width:46px;height:46px;border:1px solid #cbb9a7;border-radius:14px;background:#fff;color:#493d36;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
    .scene{min-height:230px;border:1px solid #cbb9a7;border-radius:22px;background:linear-gradient(#f7ead7,#d8b98f);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;box-shadow:0 7px 20px rgba(76,55,41,.08)}
    .icon{font-size:68px;line-height:1;margin-bottom:14px}.scene h2{margin:0 0 8px;font-size:25px}.scene p{margin:0;font-size:18px;line-height:1.65;color:#6e5547}
    .menu{display:grid;gap:11px}.btn{min-height:62px;border:1px solid #b49a84;border-radius:16px;background:#fff;color:#42362f;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900}.btn.primary{background:#6a4936;color:#fff;border-color:#6a4936}.btn.disabled{opacity:.48;pointer-events:none}.btn:active{transform:translateY(1px)}
    .board{border:1px solid #cab49f;border-radius:16px;background:#fffaf4;padding:16px}.board strong{display:block;font-size:19px;margin-bottom:7px}.board p{margin:0;font-size:17px;line-height:1.6;color:#765f52}
  </style>
</head>
<body>
  <main class="app">
    <header class="head">
      <a class="back" href="dungeon_inn.html?v=20260823-2324" aria-label="宿へ戻る">←</a>
      <h1>酒場</h1>
      <span></span>

    <section class="scene">
      <div class="icon">🍺</div>
