<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>RPG 酒場</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#17100c;font-family:system-ui,"Yu Gothic",sans-serif;overflow:hidden}
    body{display:flex;align-items:center;justify-content:center;color:#f7ead6}
    .tavarn-shell{position:relative;width:min(100vw,540px);height:100dvh;max-width:540px;display:grid;grid-template-rows:auto 1fr auto;background:#2a1910;overflow:hidden}
    .head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 12px 12px;background:#21130d;border-bottom:2px solid #775039}
    .head h1{margin:0;text-align:center;font-size:21px}
    .exit{border:2px solid #8a6044;border-radius:12px;padding:8px 11px;background:#f0d7ac;color:#42291a;font-weight:900;text-decoration:none}
    .coin{font-weight:900}
    .room{position:relative;min-height:0;background:
      linear-gradient(90deg,transparent 0 49%,#5a341f 49% 51%,transparent 51%) 0 0/74px 74px,
      linear-gradient(#75472a 0 49%,#5a341f 49% 51%,#75472a 51%) 0 0/74px 74px}
    .counter{position:absolute;left:7%;right:7%;top:15%;height:18%;border:4px solid #3c2418;border-radius:12px;background:#9a643a;box-shadow:0 10px 0 #4b2b1a}
    .keeper{position:absolute;left:50%;top:9%;transform:translateX(-50%);width:50px;height:58px;border:3px solid #3e2a25;border-radius:24px 24px 12px 12px;background:#d8a071}
    .board{position:absolute;left:10%;top:39%;width:35%;height:25%;border:7px solid #4a2c1c;border-radius:7px;background:#d6b77e;color:#3d2618;padding:10px;font-weight:900;text-align:center}
    .tables{position:absolute;right:10%;top:43%;width:34%;height:20%;border:5px solid #4a2c1c;border-radius:50%;background:#8d5934}
    .door{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:84px;height:54px;border:4px solid #4a2c1c;border-bottom:0;background:#bd8a51}
    .panel{padding:12px;background:#160d09;border-top:2px solid #775039}
    .text{min-height:54px;margin:0 0 10px;padding:10px 12px;border:2px solid #775039;border-radius:10px;background:#2b1b13;line-height:1.6}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:max(0px,env(safe-area-inset-bottom))}
    button{min-height:48px;border:2px solid #8a6044;border-radius:12px;background:#f0d7ac;color:#42291a;font-size:16px;font-weight:900}
  </style>
</head>
<body>
  <main class="tavarn-shell">
    <header class="head">
      <a class="exit" href="rpg.html?v=20260823-8">← 外へ</a>
      <h1>酒場</h1>
      <span class="coin">🪙 <span id="coinCount">0</span></span>
    </header>

    <section class="room" aria-label="RPGの酒場店内">
      <div class="keeper" aria-label="酒場の主人"></div>
      <div class="counter"></div>
      <div class="board">依頼掲示板</div>
      <div class="tables"></div>
      <div class="door"></div>
    </section>

    <section class="panel">
      <p class="text" id="tavarnText">酒場には冒険者向けの依頼が集まっている。</p>
      <div class="actions">
        <button id="requestButton" type="button">依頼を見る</button>
        <button id="talkButton" type="button">主人と話す</button>
      </div>
    </section>
  </main>

  <script src="data/words/grade1/term1.js?v=20260823-8"></script>
  <script src="data/words.js?v=20260823-8"></script>
  <script src="js/storage.js?v=20260823-8"></script>
  <script src="data/rpg-quests.js?v=20260823-8"></script>
  <script src="js/rpg_tavarn.js?v=20260823-8"></script>
</body>
</html>
