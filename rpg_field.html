<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>RPG 北の草原</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#171217;font-family:system-ui,"Yu Gothic",sans-serif;overflow:hidden}
    body{display:flex;align-items:center;justify-content:center}
    .rpg-shell{position:relative;width:min(100vw,540px);height:100dvh;max-width:540px;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    .game{width:100%;height:100%}
    .back{position:absolute;z-index:20;left:10px;top:max(10px,env(safe-area-inset-top));border:0;border-radius:999px;padding:8px 12px;background:#fffdf0dd;color:#4b3440;font-weight:800;text-decoration:none}
    .dpad{position:absolute;z-index:20;right:14px;bottom:max(18px,env(safe-area-inset-bottom));display:grid;grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px 50px;gap:5px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    .dpad button{border:2px solid #fff8;background:#2d2330bb;color:#fff;border-radius:14px;font-size:23px;font-weight:900;touch-action:none;user-select:none!important;-webkit-user-select:none!important;-webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent}
    .dpad button::before{content:attr(data-symbol);pointer-events:none;user-select:none;-webkit-user-select:none}
    .up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
    .help{position:absolute;z-index:20;left:10px;bottom:max(18px,env(safe-area-inset-bottom));padding:8px 10px;border-radius:12px;background:#2d2330b8;color:#fff;font-size:11px;text-align:left}
    @media(min-width:700px){.dpad{opacity:.8}.help{font-size:13px}}
  </style>
</head>
<body>
  <main class="rpg-shell">
    <a class="back" href="rpg.html?v=20260824-2">← 村へ</a>
    <div id="game" class="game"></div>
    <div class="dpad" aria-label="移動ボタン">
      <button class="up" data-dir="up" data-symbol="▲" aria-label="上"></button>
      <button class="left" data-dir="left" data-symbol="◀" aria-label="左"></button>
      <button class="down" data-dir="down" data-symbol="▼" aria-label="下"></button>
      <button class="right" data-dir="right" data-symbol="▶" aria-label="右"></button>
    </div>
    <div class="help">スマホ：十字キー<br>PC：矢印 / WASD</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <script src="data/rpg-field-map.js?v=20260824-2"></script>
  <script src="js/rpg.js?v=20260824-2"></script>
</body>
</html>
