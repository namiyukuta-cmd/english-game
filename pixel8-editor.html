<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7fb">
  <title>8×8 ドット絵メーカー</title>
  <style>
    *{box-sizing:border-box}
    :root{--bg:#fff7fb;--card:#fff;--ink:#3e3037;--line:#dccfd6;--muted:#7d6e75}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
    .wrap{max-width:720px;margin:0 auto;padding:12px 12px 28px}
    .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .back{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:22px;color:var(--ink);flex:0 0 auto}
    h1{margin:0;font-size:20px}
    .sub{margin:2px 0 0;color:var(--muted);font-size:12px}
    .save-name{margin:3px 0 0;font-size:12px;font-weight:800;color:#a06479}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
    .toolrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
    .current{width:34px;height:34px;border:2px solid #4b3e44;border-radius:8px;background:#2b2118;flex:0 0 auto}
    .status{font-size:13px;min-width:0;flex:1}
    .status strong{display:block;font-size:14px}
    button{font:inherit}
    .toolbtn,.action{min-height:42px;border:1px solid #cdbfc6;border-radius:10px;background:#fff;color:var(--ink);font-weight:700;padding:8px 12px}
    .toolbtn.active{background:#3e3037;color:#fff;border-color:#3e3037}
    .zoomrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
    .zoomrow .toolbtn{min-width:48px}
    #zoomLabel{min-width:64px;text-align:center;font-weight:800}
    .canvas-shell{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:10px;overflow:auto;max-height:min(78vw,620px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
    #grid{width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,1fr);user-select:none;-webkit-user-select:none;border-top:1px solid rgba(65,52,58,.3);border-left:1px solid rgba(65,52,58,.3);background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0;transform-origin:top left}
    #grid.tap-mode{touch-action:pan-x pan-y}
    #grid.draw-mode{touch-action:none}
    .cell{padding:0;margin:0;border:0;border-right:1px solid rgba(65,52,58,.26);border-bottom:1px solid rgba(65,52,58,.26);background:transparent;min-width:0;min-height:0}
    .palette{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
    .swatch{aspect-ratio:1/1;border:2px solid #d3c6cc;border-radius:8px;padding:0;min-width:0}
    .swatch.active{outline:3px solid #3e3037;outline-offset:1px}
    .transparent{background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0;background-color:#fff}
    .custom{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
    #customColor{width:48px;height:42px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:2px}
    .actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .action.primary{background:#3e3037;color:#fff;border-color:#3e3037}
    .action.save{background:#d97898;color:#fff;border-color:#d97898}
    .message{min-height:18px;text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
    @media(min-width:560px){.palette{grid-template-columns:repeat(12,1fr)}.actions{grid-template-columns:repeat(3,1fr)}.canvas-shell{max-height:620px}}
  </style>
  <link rel="stylesheet" href="pixel-editor.css?v=20261007-4">
</head>
<body data-size="8">
  <main class="wrap">
    <div class="top">
      <button class="back" type="button" id="backBtn" aria-label="戻る">←</button>
      <div>
        <h1>8×8 ドット絵メーカー</h1>
        <p class="sub">色を選んでタップ。拡大・移動して細かく描けます</p>
        <p id="projectLabel" class="save-name">新しいドット絵</p>
      </div>
    </div>

<section class="panel image-import">
      <h2>画像からドット絵</h2>
      <label class="file-label">画像を選ぶ<input id="imageFile" type="file" accept="image/*"></label>
      <div class="import-controls">
        <label>収め方<select id="imageFit"><option value="contain">全体を収める</option><option value="cover">中央を切り抜く</option><option value="stretch">キャンバスいっぱい</option></select></label>
        <label>色数<select id="imageColors"><option value="0" selected>元の色（減らさない）</option><option value="16">4096色</option><option value="8">512色</option><option value="4">64色</option><option value="palette">パレットの色</option></select></label>
      </div>
      <div id="imageResult" hidden><div class="import-preview"><figure><img id="imageOriginal" alt="取り込む画像"><figcaption>元の画像</figcaption></figure><figure><canvas id="imageConverted"></canvas><figcaption>変換結果</figcaption></figure></div>
      <button id="applyImage" class="action primary" type="button">このドット絵をキャンバスに入れる</button><p class="sub">今の絵を置き換えます。「1つ戻る」で取り消せます。</p></div>
      <p id="importMessage" class="sub" aria-live="polite">画像を選ぶと変換結果を確認できます。透明部分は残ります。</p>
    </section>
    <section class="panel size-controls"><label for="canvasSize">キャンバスの大きさ</label><select id="canvasSize"><option value="8">8×8</option><option value="16">16×16</option><option value="24">24×24</option><option value="32">32×32</option><option value="48">48×48</option><option value="64">64×64</option><option value="96">96×96</option><option value="128">128×128</option></select><button id="newSizeBtn" class="toolbtn" type="button">このサイズで新規作成</button></section>
    <section class="panel toolrow">
      <div id="currentColor" class="current" aria-hidden="true"></div>
      <div class="status"><strong id="currentLabel">#2B2118</strong><span>選択中の色</span></div>
      <button id="eraserBtn" class="toolbtn" type="button">消しゴム</button>
      <button id="drawModeBtn" class="toolbtn" type="button">なぞり塗り：OFF</button>
          <button id="moveBtn" class="toolbtn" type="button">移動</button>
      <button id="pickBtn" class="toolbtn" type="button">色を拾う</button>
      <button id="fillBtn" class="toolbtn" type="button">塗りつぶし</button>
    </section>
    <p id="modeHelp" class="mode-help"></p>

    <div class="zoomrow" aria-label="拡大縮小">
      <button id="zoomOutBtn" class="toolbtn" type="button" aria-label="縮小">−</button>
      <output id="zoomLabel">100%</output>
      <button id="zoomInBtn" class="toolbtn" type="button" aria-label="拡大">＋</button>
      <button id="zoomResetBtn" class="toolbtn" type="button">100%</button>
      <input id="zoomRange" type="range" min="0" max="9" value="2" step="1" aria-label="表示倍率">
      <button id="gridBtn" class="toolbtn" type="button">格子：ON</button>
    </div>
    <div class="preview-row"><span>仕上がり</span><canvas id="preview" aria-label="格子なしのプレビュー"></canvas><span>50〜800％で表示</span></div>

    <section class="canvas-shell" id="canvasShell"><div id="grid" class="tap-mode" aria-label="8×8キャンバス"></div></section>

    <section class="panel">
      <div id="paletteGroups" class="palette-groups" aria-label="色の種類">
        <button type="button" data-group="all" aria-pressed="true">全色</button><button type="button" data-group="skin" aria-pressed="false">肌・茶</button><button type="button" data-group="warm" aria-pressed="false">暖色</button><button type="button" data-group="cool" aria-pressed="false">寒色</button><button type="button" data-group="red" aria-pressed="false">赤</button><button type="button" data-group="orange" aria-pressed="false">橙</button><button type="button" data-group="yellow" aria-pressed="false">黄</button><button type="button" data-group="green" aria-pressed="false">緑</button><button type="button" data-group="cyan" aria-pressed="false">水色</button><button type="button" data-group="blue" aria-pressed="false">青</button><button type="button" data-group="purple" aria-pressed="false">紫</button><button type="button" data-group="pink" aria-pressed="false">桃</button><button type="button" data-group="gray" aria-pressed="false">白黒</button><button type="button" data-group="custom" aria-pressed="false">好きな色</button>
      </div><p id="paletteCount" class="sub"></p><div id="palette" class="palette"></div>
      <div class="custom">
        <label for="customColor">好きな色</label>
        <input id="customColor" type="color" value="#8B5A3C">
        <input id="hexColor" type="text" value="#8B5A3C" maxlength="7" spellcheck="false" aria-label="色コード" placeholder="#RRGGBB"><button id="useCustom" class="toolbtn" type="button">この色を追加</button>
      </div>
    </section>

    <section class="panel export-options"><label for="exportScale">PNGの大きさ</label><select id="exportScale"><option value="1">元のドット数</option><option value="10">10倍</option><option value="20" selected>20倍</option></select></section>
    <section class="panel actions">
      <button id="gameSaveBtn" class="action save" type="button">GitHubへセーブ</button>
      <button id="saveNewBtn" class="action" type="button">別のセーブに保存</button>
      <button id="undoBtn" class="action" type="button">1つ戻る</button>
      <button id="redoBtn" class="action" type="button">やり直す</button>
      <button id="clearBtn" class="action" type="button">全消去</button>
      <button id="savePngBtn" class="action primary" type="button">PNG保存</button>
      <button id="saveJsonBtn" class="action" type="button">座標保存</button>
      <button id="saveListBtn" class="action" type="button">セーブ一覧</button>
    </section>
    <div id="cloudStatus" class="cloud-status" role="status"></div>
    <div id="cloudSettingsMount"></div>
    <div id="message" class="message" aria-live="polite"></div>
  </main>

<script src="js/pixel-cloud.js?v=20261007-4"></script>
<script src="pixel-editor.js?v=20261007-4"></script>
</body>
</html>
