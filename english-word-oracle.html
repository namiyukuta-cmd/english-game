<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英単語オラクル</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f7f7f2;
    color: #222;
    font-size: 18px;
    line-height: 1.6;
  }
  main {
    width: min(900px, 100%);
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  h1 { font-size: 30px; margin: 0 0 18px; }
  h2 { font-size: 23px; margin: 34px 0 12px; }
  .panel {
    background: #fff;
    border: 1px solid #d8d8d0;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 18px;
  }
  label { display: block; font-weight: 700; margin-bottom: 8px; }
  select, button {
    width: 100%;
    min-height: 50px;
    font-size: 18px;
    border-radius: 10px;
  }
  select {
    padding: 8px 12px;
    background: #fff;
    border: 1px solid #aaa;
    margin-bottom: 12px;
  }
  button {
    border: 1px solid #333;
    background: #fff;
    color: #111;
    font-weight: 700;
    padding: 10px 14px;
  }
  button:active { transform: translateY(1px); }
  #result {
    min-height: 88px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin-top: 14px;
    padding: 14px;
    border-radius: 10px;
    background: #f1f1ec;
  }
  #result .en { font-size: 28px; font-weight: 800; }
  #result .ja { font-size: 20px; }
  details {
    background: #fff;
    border: 1px solid #d8d8d0;
    border-radius: 12px;
    margin: 10px 0;
    overflow: hidden;
  }
  summary {
    cursor: pointer;
    font-weight: 700;
    padding: 14px 16px;
  }
  .word-list {
    margin: 0;
    padding: 0 16px 16px 42px;
  }
  .word-list li { padding: 3px 0; }
  .count { font-weight: 400; color: #666; }
</style>
</head>
<body>
<main>
  <h1>英単語オラクル</h1>

  <section class="panel">
    <label for="category">カテゴリ</label>
    <select id="category"></select>
    <button id="rollButton" type="button">オラクルを振る</button>
    <div id="result" aria-live="polite">カテゴリを選んで「オラクルを振る」を押してください。</div>
  </section>

  <h2>カテゴリごとの一覧</h2>
  <div id="lists"></div>
</main>

<script>

    ["eraser","消しゴム"],["ruler","定規"],["pencil case","筆箱"],["bag","かばん"],["paper","紙"],

    ["what","何"],["who","誰"],["whose","誰の"],["which","どちら"],["where","どこ"],["when","いつ"],
    ["why","なぜ"],["how","どのように"],["this","これ"],["that","あれ"],["these","これら"],["those","あれら"],
    ["in","〜の中に"],["on","〜の上に"],["at","〜で"],["under","〜の下に"],["by","〜のそばに"],
    ["with","〜と一緒に"],["to","〜へ"],["for","〜のために"],["from","〜から"],["of","〜の"],
    ["about","〜について"],["before","〜の前"],["after","〜の後"],["and","〜と"],["but","しかし"],
    ["or","または"],["because","〜だから"],["so","だから"]

  "数詞・序数": [
    ["one","1"],["two","2"],["three","3"],["four","4"],["five","5"],["six","6"],["seven","7"],

const categorySelect = document.getElementById('category');
const result = document.getElementById('result');
const lists = document.getElementById('lists');

Object.entries(oracleData).forEach(([category, words]) => {
  const option = document.createElement('option');
  option.value = category;
  option.textContent = `${category}（${words.length}語）`;
  categorySelect.appendChild(option);

  const details = document.createElement('details');
  const summary = document.createElement('summary');
  summary.textContent = `${category} `;
  const count = document.createElement('span');
  count.className = 'count';
  count.textContent = `（${words.length}語）`;
  summary.appendChild(count);
  details.appendChild(summary);

  const ol = document.createElement('ol');
  ol.className = 'word-list';
  words.forEach(([en, ja]) => {
    const li = document.createElement('li');
    li.textContent = `${en}（${ja}）`;
    ol.appendChild(li);
  });
  details.appendChild(ol);
  lists.appendChild(details);
});

document.getElementById('rollButton').addEventListener('click', () => {
  const category = categorySelect.value;
  const words = oracleData[category];
  const index = Math.floor(Math.random() * words.length);
  const [en, ja] = words[index];
  result.innerHTML = `<div>${category} ／ ${index + 1}</div><div class="en">${en}</div><div class="ja">${ja}</div>`;
});
</script>
</body>
</html>
