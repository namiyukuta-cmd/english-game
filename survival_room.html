<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雪山サバイバル｜山小屋</title>

  <link rel="stylesheet" href="css/survival/base.css?v=20261004-css-split-1">
  <link rel="stylesheet" href="css/survival/status.css?v=20261004-css-split-1">
  <link rel="stylesheet" href="css/survival/message.css?v=20261004-css-split-1">
  <link rel="stylesheet" href="css/survival/character.css?v=20261004-css-split-1">
  <link rel="stylesheet" href="css/survival/room.css?v=20261004-room2">
  <link rel="stylesheet" href="css/survival/room-hotspots.css?v=20261004-room2">
  <link rel="stylesheet" href="css/survival/room-markers.css?v=20261004-room2">
  <link rel="stylesheet" href="css/survival/quest.css?v=20261004-room2">
</head>


<body>

<main class="game">


  <!-- =========================
       上部
  ========================== -->

  <header class="topbar">

    <button
      id="backButton"
      class="back-button"
      type="button"
      aria-label="戻る"
    >
      ←
    </button>

    <div
      id="day"
      class="top-small"
    ></div>

    <div
      id="clock"
      class="top-small"
    ></div>

    <div
      id="placeName"
      class="top-small place"
    ></div>

  </header>


  <!-- =========================
       環境
  ========================== -->

  <section class="environment-bar">

    <div class="environment-card">
      <span class="environment-label">
        室温
      </span>

      <span
        id="roomTemperature"
        class="environment-value"
      ></span>
    </div>

    <div class="environment-card">
      <span class="environment-label">
        天気
      </span>

      <span
        id="weather"
        class="environment-value"
      ></span>
    </div>

  </section>


  <!-- =========================
       主人公ステータス
  ========================== -->

  <section class="meters">


    <!-- 体温 -->

    <div class="meter">

      <svg
        class="meter-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <defs>
          <clipPath id="tempClip">
            <rect
              id="tempClipRect"
              x="0"
              y="0"
              width="24"
              height="24"
            ></rect>
          </clipPath>
        </defs>

        <path
          id="tempFill"
          clip-path="url(#tempClip)"
          d="M12 2C9.8 2 8 3.8 8 6v8.1C6.7 15.3 6 17 6 18.7 6 22 8.7 24 12 24s6-2 6-5.3c0-1.7-.7-3.4-2-4.6V6c0-2.2-1.8-4-4-4Z"
        ></path>

        <path
          class="meter-outline"
          d="M12 2C9.8 2 8 3.8 8 6v8.1C6.7 15.3 6 17 6 18.7 6 22 8.7 24 12 24s6-2 6-5.3c0-1.7-.7-3.4-2-4.6V6c0-2.2-1.8-4-4-4Z"
        ></path>

      </svg>

      <div
        id="tempValue"
        class="meter-value"
      ></div>

    </div>


    <!-- 空腹 -->

    <div class="meter">

      <svg
        class="meter-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <defs>
          <clipPath id="hungerClip">
            <rect
              id="hungerClipRect"
              x="0"
              y="0"
              width="24"
              height="24"
            ></rect>
          </clipPath>
        </defs>

        <path
          id="hungerFill"
          clip-path="url(#hungerClip)"
          d="M12 7C9.5 4.5 5.2 5.4 3.8 8.6 1.7 13.4 5.2 20.5 9.3 22c1.2.4 2-.3 2.7-.7.7.4 1.5 1.1 2.7.7 4.1-1.5 7.6-8.6 5.5-13.4C18.8 5.4 14.5 4.5 12 7Z"
        ></path>

        <path
          class="meter-outline"
          d="M12 7C9.5 4.5 5.2 5.4 3.8 8.6 1.7 13.4 5.2 20.5 9.3 22c1.2.4 2-.3 2.7-.7.7.4 1.5 1.1 2.7.7 4.1-1.5 7.6-8.6 5.5-13.4C18.8 5.4 14.5 4.5 12 7Z"
        ></path>

      </svg>

      <div
        id="hungerValue"
        class="meter-value"
      ></div>

    </div>


    <!-- 体力 -->

    <div class="meter">

      <svg
        class="meter-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <defs>
          <clipPath id="staminaClip">
            <rect
              id="staminaClipRect"
              x="0"
              y="0"
              width="24"
              height="24"
            ></rect>
          </clipPath>
        </defs>

        <path
          id="staminaFill"
          clip-path="url(#staminaClip)"
          d="M12 21C10.7 19.8 4.3 15.5 2.6 11.6.6 7.2 3.5 3.5 7.4 3.5c2.1 0 3.6 1.2 4.6 2.6 1-1.4 2.5-2.6 4.6-2.6 3.9 0 6.8 3.7 4.8 8.1C19.7 15.5 13.3 19.8 12 21Z"
        ></path>

        <path
          class="meter-outline"
          d="M12 21C10.7 19.8 4.3 15.5 2.6 11.6.6 7.2 3.5 3.5 7.4 3.5c2.1 0 3.6 1.2 4.6 2.6 1-1.4 2.5-2.6 4.6-2.6 3.9 0 6.8 3.7 4.8 8.1C19.7 15.5 13.3 19.8 12 21Z"
        ></path>

      </svg>

      <div
        id="staminaValue"
        class="meter-value"
      ></div>

    </div>

  </section>


  <!-- =========================
       山小屋画面
  ========================== -->

  <section
    id="roomStage"
    class="room-stage"
  >


    <!-- 会話時背景 -->

    <div
      id="roomBackground"
      class="room-background"
    ></div>


    <!-- キャラクター -->

    <div class="character-layer">

      <div
        id="grantCharacter"
        class="character-sprite"
      >

        <img
          id="grantCharacterImage"
          alt=""
        >

      </div>

    </div>


    <!-- =========================
         間取り図
    ========================== -->

    <div
      id="floorplanLayer"
      class="floorplan-layer"
    >

      <img
        id="floorplanImage"
        class="floorplan-image"
        alt=""
      >

      <div
        id="roomActors"
        class="room-actors"
        aria-label="人物"
      ></div>


      <!-- タップ領域 -->

      <div
        id="roomHotspots"
        class="room-hotspots"
      >

        <button
          class="room-hotspot hotspot-bed"
          type="button"
          data-room-action="bed"
          aria-label="ベッド"
        ></button>

        <button
          class="room-hotspot hotspot-wardrobe"
          type="button"
          data-room-action="wardrobe"
          aria-label="洋服箪笥"
        ></button>

        <button
          class="room-hotspot hotspot-kitchen"
          type="button"
          data-room-action="kitchen"
          aria-label="台所"
        ></button>

        <button
          class="room-hotspot hotspot-fridge"
          type="button"
          data-room-action="fridge"
          aria-label="冷蔵庫"
        ></button>

        <button
          class="room-hotspot hotspot-stove"
          type="button"
          data-room-action="stove"
          aria-label="薪ストーブ"
        ></button>

        <button
          class="room-hotspot hotspot-attic"
          type="button"
          data-room-action="attic"
          aria-label="屋根裏"
        ></button>

        <button
          class="room-hotspot hotspot-basement"
          type="button"
          data-room-action="basement"
          aria-label="地下"
        ></button>

        <button
          class="room-hotspot hotspot-entry"
          type="button"
          data-room-action="entry"
          aria-label="玄関"
        ></button>

      </div>

    </div>


    <button
      id="questBadge"
      class="quest-badge hidden"
      type="button"
      aria-label="現在のクエスト"
    >
      <span class="quest-badge-label">QUEST</span>
      <span id="questBadgeText" class="quest-badge-text"></span>
    </button>


    <!-- =========================
         会話・メッセージ
    ========================== -->

    <div
      id="messagePanel"
      class="message-panel closed hidden"
    >

      <div
        id="messageText"
        class="message-text"
      ></div>

      <div
        id="messageProgress"
        class="message-progress"
      ></div>

      <div
        id="messageChoices"
        class="message-choices hidden"
      ></div>

      <button
        id="messageToggle"
        class="message-toggle"
        type="button"
      >
        ▶
      </button>

    </div>


  </section>

</main>


<!-- =========================
     アイテムデータ
========================= -->

<script src="data/survival-items.js?v=20261004-room2"></script>


<!-- =========================
     インベントリ本体
========================= -->

<script src="data/survival-inventory.js?v=20261004-room2"></script>


<!-- =========================
     イベントデータ
========================= -->

<script src="data/survival-events.js?v=20261004-room2"></script>

<script src="data/survival-quests.js?v=20261004-room2"></script>


<!-- =========================
     山小屋画面の処理
========================= -->

<script src="data/survival-room-ui.js?v=20261004-room2"></script>


</body>
</html>
