<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雪山サバイバル｜山小屋</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#e5e7e9;color:#202427}
body{min-height:100dvh}button,a{font:inherit}button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.game{position:relative;width:min(100%,540px);height:100dvh;margin:0 auto;padding:calc(5px + env(safe-area-inset-top)) 6px calc(6px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px;overflow:hidden}
.topbar{flex:0 0 auto;display:grid;grid-template-columns:36px 52px 80px minmax(0,1fr);gap:4px;align-items:center}
.back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid #999;border-radius:9px;background:#fff;color:#222;text-decoration:none;font-size:22px;font-weight:900;line-height:1}
.top-small{height:36px;padding:0 5px;display:flex;align-items:center;justify-content:center;border:1px solid #aaa;border-radius:9px;background:#fff;font-size:13px;font-weight:800;line-height:1;white-space:nowrap}.place{min-width:0;overflow:hidden;text-overflow:ellipsis}
.environment-bar{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:4px}.environment-card{height:32px;padding:0 9px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid #aaa;border-radius:9px;background:#f8f8f8;white-space:nowrap}.environment-label{font-size:13px;color:#555;font-weight:800}.environment-value{font-size:15px;color:#222;font-weight:900}
.meters{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.meter{height:32px;min-width:0;padding:2px 5px;display:flex;align-items:center;justify-content:center;gap:4px;border:1px solid #aaa;border-radius:9px;background:#fff}.meter-icon{width:18px;height:18px;flex:0 0 18px}.meter-outline{fill:none;stroke:#262626;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}.meter-value{min-width:0;font-size:13px;font-weight:900;line-height:1;white-space:nowrap}
.room-stage{position:relative;flex:1 1 auto;min-height:0;width:100%;overflow:hidden;border:1px solid #8c9296;border-radius:13px;background:#ddd}
.room-background{position:absolute;inset:-8px;z-index:1;background-position:center;background-size:cover;background-repeat:no-repeat;filter:blur(5px) brightness(.90);transform:scale(1.035);transition:filter .25s ease,opacity .25s ease}
.character-layer{position:absolute;inset:0;z-index:5;pointer-events:none}.character-sprite{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(66%,340px);height:min(82%,470px);padding:0;display:none;pointer-events:none;border:3px solid #87652c;border-radius:3px;outline:1px solid #c7a253;outline-offset:-8px;background:#f5f0e2;box-shadow:0 7px 18px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.85);overflow:hidden}.character-sprite.visible{display:block}.character-sprite::before{content:"";position:absolute;inset:5px;z-index:3;border:1px solid rgba(111,77,24,.62);pointer-events:none}.character-sprite img{position:absolute;left:50%;top:53%;width:142%;height:142%;transform:translate(-50%,-50%);object-fit:contain;object-position:center;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.16))}
.floorplan-layer{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;background:#f6f6f6;overflow:hidden}.floorplan-layer.visible{display:flex}.floorplan-image{display:none;width:100%;height:100%;object-fit:contain;object-position:center top;background:#fff;transform:scaleY(1.05);transform-origin:top center}.floorplan-image.visible{display:block}.floorplan-placeholder{padding:24px;text-align:center;font-size:18px;line-height:1.6;font-weight:800;color:#555}.floorplan-placeholder.hidden{display:none}
.message-panel{position:absolute;left:9px;top:calc(100% - 258px);z-index:30;width:calc(100% - 18px);height:120px;padding:13px 14px 42px 14px;overflow:hidden;border:1px solid #979797;border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 4px 12px rgba(0,0,0,.10);transition:width .20s ease,height .20s ease,top .20s ease;cursor:pointer}.message-panel.closed{width:60px;height:54px;top:calc(100% - 180px);padding:0}.message-panel.closed .message-text,.message-panel.closed .message-progress,.message-panel.closed .message-choices{display:none}.message-panel.hidden{display:none}.message-text{height:64px;overflow:hidden;font-size:17px;line-height:1.42;font-weight:650;white-space:pre-wrap;word-break:break-word;pointer-events:none}.message-progress{position:absolute;left:62px;bottom:13px;font-size:12px;line-height:1;color:#666;font-weight:700;pointer-events:none}.message-choices{position:absolute;right:12px;bottom:8px;left:62px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.message-choices.hidden{display:none}.message-choice{min-width:132px;min-height:38px;padding:7px 14px;border:2px solid #93651f;border-radius:10px;background:linear-gradient(180deg,#fff6df 0%,#e8c16e 100%);box-shadow:0 2px 8px rgba(106,70,17,.25);color:#3b2506;font-size:16px;font-weight:900}.message-toggle{position:absolute;left:10px;bottom:8px;z-index:3;width:40px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid #888;border-radius:8px;background:#d7d8d9;color:#222;font-size:18px;line-height:1;font-weight:900}
@media(max-width:390px){.topbar{grid-template-columns:34px 48px 76px minmax(0,1fr)}.back{width:34px;height:34px}.top-small{height:34px;font-size:12px}.environment-card{height:30px}.environment-label{font-size:12px}.environment-value{font-size:14px}.meter{height:30px}.meter-value{font-size:12px}.character-sprite{width:68%;height:80%}.message-choice{min-width:118px;font-size:15px}}
</style>
</head>
<body>
<main class="game">
<header class="topbar"><a class="back" href="survival%20game_TOP.html" aria-label="戻る">←</a><div id="day" class="top-small">Day.1</div><div id="clock" class="top-small">08:00:00</div><div class="top-small place">山小屋・1階</div></header>
<section class="environment-bar"><div class="environment-card"><span class="environment-label">室温</span><span class="environment-value">18℃</span></div><div class="environment-card"><span class="environment-label">天気</span><span class="environment-value">雪</span></div></section>
<section class="meters">
<div class="meter"><svg class="meter-icon" viewBox="0 0 24 24"><defs><clipPath id="tempClip"><rect id="tempClipRect" x="0" y="0" width="24" height="24"></rect></clipPath></defs><path id="tempFill" clip-path="url(#tempClip)" d="M12 2C9.8 2 8 3.8 8 6v8.1C6.7 15.3 6 17 6 18.7 6 22 8.7 24 12 24s6-2 6-5.3c0-1.7-.7-3.4-2-4.6V6c0-2.2-1.8-4-4-4Z"></path><path class="meter-outline" d="M12 2C9.8 2 8 3.8 8 6v8.1C6.7 15.3 6 17 6 18.7 6 22 8.7 24 12 24s6-2 6-5.3c0-1.7-.7-3.4-2-4.6V6c0-2.2-1.8-4-4-4Z"></path></svg><div id="tempValue" class="meter-value">体温 36.7℃</div></div>
<div class="meter"><svg class="meter-icon" viewBox="0 0 24 24"><defs><clipPath id="hungerClip"><rect id="hungerClipRect" x="0" y="0" width="24" height="24"></rect></clipPath></defs><path id="hungerFill" clip-path="url(#hungerClip)" d="M12 7C9.5 4.5 5.2 5.4 3.8 8.6 1.7 13.4 5.2 20.5 9.3 22c1.2.4 2-.3 2.7-.7.7.4 1.5 1.1 2.7.7 4.1-1.5 7.6-8.6 5.5-13.4C18.8 5.4 14.5 4.5 12 7Z"></path><path class="meter-outline" d="M12 7C9.5 4.5 5.2 5.4 3.8 8.6 1.7 13.4 5.2 20.5 9.3 22c1.2.4 2-.3 2.7-.7.7.4 1.5 1.1 2.7.7 4.1-1.5 7.6-8.6 5.5-13.4C18.8 5.4 14.5 3.5 12 7Z"></path></svg><div id="hungerValue" class="meter-value">100</div></div>
<div class="meter"><svg class="meter-icon" viewBox="0 0 24 24"><defs><clipPath id="staminaClip"><rect id="staminaClipRect" x="0" y="0" width="24" height="24"></rect></clipPath></defs><path id="staminaFill" clip-path="url(#staminaClip)" d="M12 21C10.7 19.8 4.3 15.5 2.6 11.6.6 7.2 3.5 3.5 7.4 3.5c2.1 0 3.6 1.2 4.6 2.6 1-1.4 2.5-2.6 4.6-2.6 3.9 0 6.8 3.7 4.8 8.1C19.7 15.5 13.3 19.8 12 21Z"></path><path class="meter-outline" d="M12 21C10.7 19.8 4.3 15.5 2.6 11.6.6 7.2 3.5 3.5 7.4 3.5c2.1 0 3.6 1.2 4.6 2.6 1-1.4 2.5-2.6 4.6-2.6 3.9 0 6.8 3.7 4.8 8.1C19.7 15.5 13.3 19.8 12 21Z"></path></svg><div id="staminaValue" class="meter-value">100</div></div>
</section>
<section id="roomStage" class="room-stage"><div id="roomBackground" class="room-background"></div><div class="character-layer"><div id="grantCharacter" class="character-sprite"><img id="grantCharacterImage" alt="グラント"></div></div><div id="floorplanLayer" class="floorplan-layer"><img id="floorplanImage" class="floorplan-image" alt="1階 間取り図"><div id="floorplanPlaceholder" class="floorplan-placeholder">1階の間取り図画像はまだ未設定です。<br>画像を追加したら、この全面DIVに表示します。</div></div><div id="messagePanel" class="message-panel closed"><div id="messageText" class="message-text"></div><div id="messageProgress" class="message-progress"></div><div id="messageChoices" class="message-choices hidden"></div><button id="messageToggle" class="message-toggle" type="button">▶</button></div></section>
</main>
<script src="data/survival-items.js"></script>
<script src="data/survival-inventory.js"></script>
<script src="data/survival-events.js"></script>
<script>
'use strict';
const EVENT_ID='cabin_grant_first_meeting';
const EVENT_STATE_KEY='survival_event_state_v1';
const ROOM_FLAGS_KEY='survival_room_flags_v1';
const FLOORPLAN_IMAGE='assets/survival/survival_room01.png';
const $=id=>document.getElementById(id);
const roomStage=$('roomStage'),roomBackground=$('roomBackground'),grantCharacter=$('grantCharacter'),grantCharacterImage=$('grantCharacterImage'),floorplanLayer=$('floorplanLayer'),floorplanImage=$('floorplanImage'),floorplanPlaceholder=$('floorplanPlaceholder'),messagePanel=$('messagePanel'),messageText=$('messageText'),messageProgress=$('messageProgress'),messageChoices=$('messageChoices'),messageToggle=$('messageToggle');
let messageOpen=false,messagePages=[],messageIndex=0,finalMessageAction=null;
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function setFillLevel(id,percent){const v=clamp(percent,0,100),h=24*v/100,r=$(id);r.setAttribute('y',24-h);r.setAttribute('height',h)}
function normalColor(v){if(v<=20)return'#c62828';if(v<=40)return'#d6a000';return'#151515'}
function temperatureColor(v){if(v<33)return'#c62828';if(v<35)return'#d6a000';return'#151515'}
function readSavedState(){try{return JSON.parse(sessionStorage.getItem(EVENT_STATE_KEY)||'null')}catch(error){return null}}
function renderStatus(){const s=readSavedState()||{};const total=Math.floor(Number(s.gameSeconds)||8*60*60),day=Math.floor(total/86400)+1,t=total%86400,h=Math.floor(t/3600),m=Math.floor((t%3600)/60),sec=t%60;const temp=Number.isFinite(Number(s.bodyTemperature))?Number(s.bodyTemperature):36.7,hunger=Number.isFinite(Number(s.hunger))?Number(s.hunger):100,stamina=Number.isFinite(Number(s.stamina))?Number(s.stamina):100;$('day').textContent='Day.'+day;$('clock').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');$('tempValue').textContent='体温 '+temp.toFixed(1)+'℃';$('hungerValue').textContent=Math.round(hunger);$('staminaValue').textContent=Math.round(stamina);const p=clamp(((temp-28)/(36.8-28))*100,0,100);setFillLevel('tempClipRect',p);$('tempFill').style.fill=temperatureColor(temp);setFillLevel('hungerClipRect',hunger);$('hungerFill').style.fill=normalColor(hunger);setFillLevel('staminaClipRect',stamina);$('staminaFill').style.fill=normalColor(stamina)}
function getPageChoices(page){if(!page||typeof page!=='object')return[];if(Array.isArray(page.choices))return page.choices;return[]}
function renderMessage(){messageChoices.innerHTML='';if(!messagePages.length){messageText.textContent='';messageProgress.textContent='';messageChoices.classList.add('hidden');return}const page=messagePages[messageIndex];messageText.textContent=typeof page==='string'?page:(page.text||'');messageProgress.textContent=(messageIndex+1)+' / '+messagePages.length;const choices=getPageChoices(page);if(!choices.length){messageChoices.classList.add('hidden');return}for(const choice of choices){const b=document.createElement('button');b.type='button';b.className='message-choice';b.textContent=choice.label;b.addEventListener('click',e=>{e.stopPropagation();if(!messageOpen)return;hideMessage();choice.action()});messageChoices.appendChild(b)}messageChoices.classList.remove('hidden')}
function setMessageOpen(open){messageOpen=open;messagePanel.classList.toggle('closed',!open);messageToggle.textContent=open?'◀':'▶'}
function showMessages(pages,options={}){messagePanel.classList.remove('hidden');messagePages=Array.isArray(pages)?pages.slice():[String(pages)];messageIndex=0;finalMessageAction=options.finalAction||null;renderMessage();setMessageOpen(true)}
function hideMessage(){setMessageOpen(false)}
function advanceMessage(){if(!messagePages.length){hideMessage();return}const page=messagePages[messageIndex],last=messageIndex>=messagePages.length-1;if(getPageChoices(page).length)return;if(!last){messageIndex++;renderMessage();return}if(finalMessageAction){const action=finalMessageAction;finalMessageAction=null;hideMessage();action();return}hideMessage()}
messagePanel.addEventListener('click',e=>{if(!messageOpen||e.target.closest('button'))return;advanceMessage()});
messageToggle.addEventListener('click',e=>{e.stopPropagation();if(messageOpen)hideMessage();else if(messagePages.length)setMessageOpen(true)});
function saveFlag(flag,value){let data={};try{data=JSON.parse(sessionStorage.getItem(ROOM_FLAGS_KEY)||'{}')||{}}catch(error){}data[flag]=value;sessionStorage.setItem(ROOM_FLAGS_KEY,JSON.stringify(data))}
function showEventMode(){floorplanLayer.classList.remove('visible');messagePanel.classList.remove('hidden');roomBackground.style.backgroundImage=`url("${SURVIVAL_EVENTS.assets.cabinInterior}")`;roomBackground.style.opacity='1';grantCharacterImage.src=SURVIVAL_EVENTS.assets.grantNormal;grantCharacter.classList.add('visible')}
function showFloorplan(){hideMessage();messagePanel.classList.add('hidden');grantCharacter.classList.remove('visible');roomBackground.style.opacity='0';floorplanLayer.classList.add('visible');if(FLOORPLAN_IMAGE){floorplanImage.src=FLOORPLAN_IMAGE;floorplanImage.classList.add('visible');floorplanPlaceholder.classList.add('hidden')}else{floorplanImage.classList.remove('visible');floorplanPlaceholder.classList.remove('hidden')}}
function runDialogueNode(nodeId){const node=SURVIVAL_EVENTS.getDialogueNode(EVENT_ID,nodeId);if(!node){showFloorplan();return}switch(node.type){case'choice':showMessages([{text:'',choices:(node.choices||[]).map(choice=>({label:choice.label,action:()=>runDialogueNode(choice.next)}))}]);break;case'dialogue':showMessages([node.speaker?node.speaker+'\n「'+node.text+'」':node.text],{finalAction:()=>runDialogueNode(node.next)});break;case'narration':showMessages([node.text],{finalAction:()=>runDialogueNode(node.next)});break;case'setFlag':saveFlag(node.flag,node.value);node.next?runDialogueNode(node.next):showFloorplan();break;case'completeEvent':SURVIVAL_EVENTS.markCompleted(EVENT_ID);showFloorplan();break;default:node.next?runDialogueNode(node.next):showFloorplan()}}
renderStatus();
if(window.SURVIVAL_EVENTS&&SURVIVAL_EVENTS.isCompleted(EVENT_ID)){showFloorplan()}else{showEventMode();const event=SURVIVAL_EVENTS.getEvent(EVENT_ID);setTimeout(()=>runDialogueNode(event&&event.dialogue?event.dialogue.startNode:null),250)}
</script>
</body>
</html>
