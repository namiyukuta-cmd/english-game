<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雪山サバイバル｜山小屋</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#e5e7e9;
  color:#202427;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:17px;
}

body{
  min-height:100dvh;
}

button{
  font:inherit;
  color:inherit;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}


/* =========================
   全体
========================= */

.game{
  position:relative;
  width:min(100%,540px);
  height:100dvh;
  margin:0 auto;
  padding:
    calc(5px + env(safe-area-inset-top))
    6px
    calc(6px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:4px;
  overflow:hidden;
}


/* =========================
   上部
========================= */

.topbar{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:36px 52px 80px minmax(0,1fr);
  gap:4px;
  align-items:center;
}

.back-button{
  width:36px;
  height:36px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #999;
  border-radius:9px;
  background:#fff;
  font-size:22px;
  font-weight:900;
  line-height:1;
}

.top-small{
  height:36px;
  padding:0 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #aaa;
  border-radius:9px;
  background:#fff;
  font-size:13px;
  font-weight:800;
  line-height:1;
  white-space:nowrap;
}

.place{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* =========================
   室温・天気
========================= */

.environment-bar{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
}

.environment-card{
  height:32px;
  padding:0 9px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:1px solid #aaa;
  border-radius:9px;
  background:#f8f8f8;
  white-space:nowrap;
}

.environment-label{
  font-size:13px;
  color:#555;
  font-weight:800;
}

.environment-value{
  font-size:15px;
  font-weight:900;
}


/* =========================
   ステータス
========================= */

.meters{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}

.meter{
  height:32px;
  min-width:0;
  padding:2px 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  border:1px solid #aaa;
  border-radius:9px;
  background:#fff;
}

.meter-icon{
  width:18px;
  height:18px;
  flex:0 0 18px;
}

.meter-outline{
  fill:none;
  stroke:#262626;
  stroke-width:1.5;
  stroke-linejoin:round;
  stroke-linecap:round;
}

.meter-value{
  min-width:0;
  font-size:13px;
  font-weight:900;
  line-height:1;
  white-space:nowrap;
}


/* =========================
   山小屋メイン画面
========================= */

.room-stage{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  width:100%;
  overflow:hidden;
  border:1px solid #8c9296;
  border-radius:13px;
  background:#ddd;
}


/* =========================
   会話時背景
========================= */

.room-background{
  position:absolute;
  inset:-8px;
  z-index:1;
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
  filter:blur(5px) brightness(.90);
  transform:scale(1.035);
}


/* =========================
   キャラクター
========================= */

.character-layer{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
}

.character-sprite{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(66%,340px);
  height:min(82%,470px);
  display:none;
  pointer-events:none;
  border:3px solid #87652c;
  border-radius:3px;
  outline:1px solid #c7a253;
  outline-offset:-8px;
  background:#f5f0e2;
  box-shadow:
    0 7px 18px rgba(0,0,0,.22),
    inset 0 0 0 1px rgba(255,255,255,.85);
  overflow:hidden;
}

.character-sprite.visible{
  display:block;
}

.character-sprite::before{
  content:"";
  position:absolute;
  inset:5px;
  z-index:3;
  border:1px solid rgba(111,77,24,.62);
  pointer-events:none;
}

.character-sprite img{
  position:absolute;
  left:50%;
  top:53%;
  width:142%;
  height:142%;
  transform:translate(-50%,-50%);
  object-fit:contain;
  object-position:center;
  pointer-events:none;
}


/* =========================
   間取り図
========================= */

.floorplan-layer{
  position:absolute;
  inset:0;
  z-index:4;
  display:none;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#fff;
}

.floorplan-layer.visible{
  display:flex;
}

.floorplan-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center top;
  background:#fff;
  transform:scaleY(1.05);
  transform-origin:top center;
}


/* =========================
   間取り図タップ領域
========================= */

.room-hotspots{
  position:absolute;
  inset:0;
  z-index:6;
  pointer-events:none;
}

.room-hotspot{
  position:absolute;
  margin:0;
  padding:0;
  border:0;
  border-radius:10px;
  background:rgba(255,255,255,.001);
  pointer-events:auto;
}

.room-hotspot:active{
  background:rgba(111,170,200,.18);
  outline:2px solid rgba(62,121,151,.55);
}


/* 1階間取り図の位置 */

.hotspot-bed{
  left:11%;
  top:11%;
  width:34%;
  height:19%;
}

.hotspot-wardrobe{
  left:54%;
  top:12%;
  width:29%;
  height:13%;
}

.hotspot-kitchen{
  left:66%;
  top:29%;
  width:20%;
  height:20%;
}

.hotspot-fridge{
  left:67%;
  top:49%;
  width:19%;
  height:14%;
}

.hotspot-stove{
  left:62%;
  top:64%;
  width:27%;
  height:17%;
}

.hotspot-attic{
  left:16%;
  top:39%;
  width:22%;
  height:18%;
}

.hotspot-basement{
  left:10%;
  top:61%;
  width:22%;
  height:20%;
}

.hotspot-entry{
  left:27%;
  top:81%;
  width:42%;
  height:18%;
}


/* =========================
   メッセージ
========================= */

.message-panel{
  position:absolute;
  left:9px;
  top:calc(100% - 258px);
  z-index:30;
  width:calc(100% - 18px);
  height:120px;
  padding:13px 14px 42px;
  overflow:hidden;
  border:1px solid #979797;
  border-radius:14px;
  background:rgba(255,255,255,.96);
  box-shadow:0 4px 12px rgba(0,0,0,.10);
  transition:
    width .20s ease,
    height .20s ease,
    top .20s ease;
}

.message-panel.closed{
  width:60px;
  height:54px;
  top:calc(100% - 180px);
  padding:0;
}

.message-panel.hidden{
  display:none;
}

.message-panel.closed .message-text,
.message-panel.closed .message-progress,
.message-panel.closed .message-choices{
  display:none;
}

.message-text{
  height:64px;
  overflow:hidden;
  font-size:17px;
  line-height:1.42;
  font-weight:650;
  white-space:pre-wrap;
  word-break:break-word;
}

.message-progress{
  position:absolute;
  left:62px;
  bottom:13px;
  font-size:12px;
  color:#666;
  font-weight:700;
}

.message-choices{
  position:absolute;
  right:12px;
  bottom:8px;
  left:62px;
  display:flex;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap;
}

.message-choices.hidden{
  display:none;
}

.message-choice{
  min-width:132px;
  min-height:42px;
  padding:7px 14px;
  border:2px solid #93651f;
  border-radius:10px;
  background:#fff3d2;
  color:#3b2506;
  font-size:17px;
  font-weight:900;
}

.message-toggle{
  position:absolute;
  left:10px;
  bottom:8px;
  z-index:3;
  width:40px;
  height:36px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #888;
  border-radius:8px;
  background:#d7d8d9;
  font-size:18px;
  font-weight:900;
}


/* =========================
   スマホ
========================= */

@media(max-width:390px){

  .topbar{
    grid-template-columns:
      34px
      48px
      76px
      minmax(0,1fr);
  }

  .back-button{
    width:34px;
    height:34px;
  }

  .top-small{
    height:34px;
    font-size:12px;
  }

  .environment-card{
    height:30px;
  }

  .environment-label{
    font-size:12px;
  }

  .environment-value{
    font-size:14px;
  }

  .meter{
    height:30px;
  }

  .meter-value{
    font-size:12px;
  }

  .character-sprite{
    width:68%;
    height:80%;
  }

  .message-choice{
    min-width:118px;
    font-size:17px;
  }
}
</style>
</head>


<body>

<main class="game">


  <!-- =========================
       上部
  ========================== -->

  <header class="topbar">

    <button
      id="backButton"
      class="back-button"
      type="button"
      aria-label="戻る"
    >
      ←
    </button>

    <div
      id="day"
      class="top-small"
    ></div>

    <div
      id="clock"
      class="top-small"
    ></div>

    <div
      id="placeName"
      class="top-small place"
    ></div>

  </header>


  <!-- =========================
       環境
  ========================== -->

  <section class="environment-bar">

    <div class="environment-card">
      <span class="environment-label">
        室温
      </span>

      <span
        id="roomTemperature"
        class="environment-value"
      ></span>
    </div>

    <div class="environment-card">
      <span class="environment-label">
        天気
      </span>

      <span
        id="weather"
        class="environment-value"
      ></span>
    </div>

  </section>


  <!-- =========================
       主人公ステータス
  ========================== -->

  <section class="meters">


    <!-- 体温 -->

    <div class="meter">

      <svg
        class="meter-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <defs>
          <clipPath id="tempClip">
            <rect
              id="tempClipRect"
              x="0"
              y="0"
              width="24"
              height="24"
            ></rect>
          </clipPath>
        </defs>

        <path
          id="tempFill"
          clip-path="url(#tempClip)"
          d="M12 2C9.8 2 8 3.8 8 6v8.1C6.7 15.3 6 17 6 18.7 6 22 8.7 24 12 24s6-2 6-5.3c0-1.7-.7-3.4-2-4.6V6c0-2.2-1.8-4-4-4Z"
        ></path>

        <path
          class="meter-outline"
          d="M12 2C9.8 2 8 3.8 8 6v8.1C6.7 15.3 6 17 6 18.7 6 22 8.7 24 12 24s6-2 6-5.3c0-1.7-.7-3.4-2-4.6V6c0-2.2-1.8-4-4-4Z"
        ></path>

      </svg>

      <div
        id="tempValue"
        class="meter-value"
      ></div>

    </div>


    <!-- 空腹 -->

    <div class="meter">

      <svg
        class="meter-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <defs>
          <clipPath id="hungerClip">
            <rect
              id="hungerClipRect"
              x="0"
              y="0"
              width="24"
              height="24"
            ></rect>
          </clipPath>
        </defs>

        <path
          id="hungerFill"
          clip-path="url(#hungerClip)"
          d="M12 7C9.5 4.5 5.2 5.4 3.8 8.6 1.7 13.4 5.2 20.5 9.3 22c1.2.4 2-.3 2.7-.7.7.4 1.5 1.1 2.7.7 4.1-1.5 7.6-8.6 5.5-13.4C18.8 5.4 14.5 4.5 12 7Z"
        ></path>

        <path
          class="meter-outline"
          d="M12 7C9.5 4.5 5.2 5.4 3.8 8.6 1.7 13.4 5.2 20.5 9.3 22c1.2.4 2-.3 2.7-.7.7.4 1.5 1.1 2.7.7 4.1-1.5 7.6-8.6 5.5-13.4C18.8 5.4 14.5 4.5 12 7Z"
        ></path>

      </svg>

      <div
        id="hungerValue"
        class="meter-value"
      ></div>

    </div>


    <!-- 体力 -->

    <div class="meter">

      <svg
        class="meter-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <defs>
          <clipPath id="staminaClip">
            <rect
              id="staminaClipRect"
              x="0"
              y="0"
              width="24"
              height="24"
            ></rect>
          </clipPath>
        </defs>

        <path
          id="staminaFill"
          clip-path="url(#staminaClip)"
          d="M12 21C10.7 19.8 4.3 15.5 2.6 11.6.6 7.2 3.5 3.5 7.4 3.5c2.1 0 3.6 1.2 4.6 2.6 1-1.4 2.5-2.6 4.6-2.6 3.9 0 6.8 3.7 4.8 8.1C19.7 15.5 13.3 19.8 12 21Z"
        ></path>

        <path
          class="meter-outline"
          d="M12 21C10.7 19.8 4.3 15.5 2.6 11.6.6 7.2 3.5 3.5 7.4 3.5c2.1 0 3.6 1.2 4.6 2.6 1-1.4 2.5-2.6 4.6-2.6 3.9 0 6.8 3.7 4.8 8.1C19.7 15.5 13.3 19.8 12 21Z"
        ></path>

      </svg>

      <div
        id="staminaValue"
        class="meter-value"
      ></div>

    </div>

  </section>


  <!-- =========================
       山小屋画面
  ========================== -->

  <section
    id="roomStage"
    class="room-stage"
  >


    <!-- 会話時背景 -->

    <div
      id="roomBackground"
      class="room-background"
    ></div>


    <!-- キャラクター -->

    <div class="character-layer">

      <div
        id="grantCharacter"
        class="character-sprite"
      >

        <img
          id="grantCharacterImage"
          alt=""
        >

      </div>

    </div>


    <!-- =========================
         間取り図
    ========================== -->

    <div
      id="floorplanLayer"
      class="floorplan-layer"
    >

      <img
        id="floorplanImage"
        class="floorplan-image"
        alt=""
      >


      <!-- タップ領域 -->

      <div
        id="roomHotspots"
        class="room-hotspots"
      >

        <button
          class="room-hotspot hotspot-bed"
          type="button"
          data-room-action="bed"
          aria-label="ベッド"
        ></button>

        <button
          class="room-hotspot hotspot-wardrobe"
          type="button"
          data-room-action="wardrobe"
          aria-label="洋服箪笥"
        ></button>

        <button
          class="room-hotspot hotspot-kitchen"
          type="button"
          data-room-action="kitchen"
          aria-label="台所"
        ></button>

        <button
          class="room-hotspot hotspot-fridge"
          type="button"
          data-room-action="fridge"
          aria-label="冷蔵庫"
        ></button>

        <button
          class="room-hotspot hotspot-stove"
          type="button"
          data-room-action="stove"
          aria-label="薪ストーブ"
        ></button>

        <button
          class="room-hotspot hotspot-attic"
          type="button"
          data-room-action="attic"
          aria-label="屋根裏"
        ></button>

        <button
          class="room-hotspot hotspot-basement"
          type="button"
          data-room-action="basement"
          aria-label="地下"
        ></button>

        <button
          class="room-hotspot hotspot-entry"
          type="button"
          data-room-action="entry"
          aria-label="玄関"
        ></button>

      </div>

    </div>


    <!-- =========================
         会話・メッセージ
    ========================== -->

    <div
      id="messagePanel"
      class="message-panel closed hidden"
    >

      <div
        id="messageText"
        class="message-text"
      ></div>

      <div
        id="messageProgress"
        class="message-progress"
      ></div>

      <div
        id="messageChoices"
        class="message-choices hidden"
      ></div>

      <button
        id="messageToggle"
        class="message-toggle"
        type="button"
      >
        ▶
      </button>

    </div>


  </section>

</main>


<!-- =========================
     アイテムデータ
========================= -->

<script src="data/survival-items.js"></script>


<!-- =========================
     インベントリ本体
========================= -->

<script src="data/survival-inventory.js"></script>


<!-- =========================
     イベントデータ
========================= -->

<script src="data/survival-events.js"></script>


<!-- =========================
     山小屋画面の処理
========================= -->

<script src="data/survival-room-ui.js"></script>


</body>
</html>
