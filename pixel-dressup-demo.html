baseBtn.onclick=()=>{worn=false;render()};topBtn.onclick=()=>{worn=true;render()};guideBtn.onclick=()=>{guide=!guide;render()};minus.onclick=()=>{zoom=Math.max(.5,zoom-.5);render()};plus.onclick=()=>{zoom=Math.min(4,zoom+.5);render()};addEventListener('resize',render);saveBtn.onclick=()=>saveDialog.showModal();closeSave.onclick=()=>saveDialog.close();saveDialog.onclick=e=>{if(e.target===saveDialog)saveDialog.close()};
function data(p){return {width:128,height:128,pixels:p,coordinates:p.flatMap((r,y)=>r.flatMap((color,x)=>color?[{x,y,color}]:[]))}}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>{const [which,ext]=b.dataset.export.split('-'),p=which==='top'?TOP:current(),name=which==='top'?'top-green':'avatar-with-top';if(ext==='json')download(new Blob([JSON.stringify({...data(p),...(which==='top'?{layer:'clothing',anchors:ANCHORS}:{})})],{type:'application/json'}),name+'.json');else{const c=document.createElement('canvas');c.width=c.height=128;drawPixels(c,p);c.toBlob(blob=>download(blob,name+'.png'),'image/png')}});render();
</script></html>
