<style>

.box{background:#f5f0e6;border-radius:12px;padding:10px;margin-top:6px;font-size:13px;line-height:1.5}.box strong{font-size:15px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}.mini{background:#fff;border:1px solid #ddd3c4;border-radius:9px;padding:7px}.mini small{font-size:9px;color:#777;display:block}.mini b{font-size:13px}.quest{border-left:4px solid #735b37;padding-left:9px}
.enemy{display:flex;justify-content:space-between;align-items:center;gap:8px}.enemy-name{font-size:19px;font-weight:950}.hpbar{height:9px;background:#ded8ce;border-radius:99px;overflow:hidden;margin-top:4px}.hpfill{height:100%;background:#433b34}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.choice{min-height:42px;border:1px solid #847b70;border-radius:9px;background:#fff;font-size:14px;font-weight:800;padding:6px}
.answerline{min-height:44px;border:1px dashed #a89c8b;border-radius:9px;padding:6px;margin-top:7px;display:flex;gap:4px;flex-wrap:wrap;align-content:flex-start}.tokens{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.token{border:1px solid #837a6e;border-radius:8px;background:#fff;padding:7px 9px;font-size:14px;font-weight:850}.feedback{font-size:13px;font-weight:850;margin-top:6px;min-height:19px}.good{color:#285a34}.bad{color:#8a352a}
.battle-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:8px}.battle-controls .btn{min-height:42px;font-size:13px;padding:5px}.battle-controls .tiny{font-size:9px}
.loot{font-size:12px;color:#625a50;margin-top:6px}.map{display:grid;grid-template-columns:repeat(5,24px);gap:3px;justify-content:center;margin:8px auto}.tile{width:24px;height:24px;border-radius:5px;background:#e8e0d4;display:grid;place-items:center;font-size:11px}.tile.now{background:#3d3831;color:#fff}.tile.done{background:#cfc3b0}.dept{display:grid;grid-template-columns:1fr 1fr;gap:5px}.dept div{background:#fff;border:1px solid #ddd3c4;border-radius:9px;padding:6px;font-size:11px}.dept b{display:block;font-size:13px}.note{font-size:11px;color:#746c61;margin-top:6px}
.app.battle-mode{grid-template-rows:auto auto minmax(0,1fr)}.app.battle-mode>.actions{display:none}.app.battle-mode .scene{padding:10px}.app.battle-mode .box{padding:8px;margin-top:5px}.app.battle-mode .scene h1{font-size:22px}.app.battle-mode .jp{margin-bottom:4px}.app.battle-mode .stats{margin-top:5px}
@media(max-height:760px){.top{min-height:36px}.back{width:36px;height:36px}.card{padding:5px 7px}.scene{padding:10px}.scene h1{font-size:21px}.box{padding:8px}.btn{min-height:42px}.hud{gap:4px}.battle-controls .btn{min-height:38px}.token{padding:6px 8px}}

<body>
<div class="app" id="app">
  <div class="top">
    <a class="back" href="story-menu.html?v=20260903-4" aria-label="戻る">←</a>
    <div class="title"><strong>Magic School</strong><small>遺跡都市・公営遺跡調査隊</small></div>
  </div>
  <div class="hud">
    <div class="card"><div class="card-label">DATE / 日付</div><div class="date-main" id="dateMain"></div><div class="date-sub" id="dateSub"></div></div>
    <div class="card"><div class="card-label">TIME / 時間</div><div class="clock-main" id="clockMain"></div><div class="clock-parts"><div><small>time / 時間</small><b id="timeVal"></b></div><div><small>hour / 時</small><b id="hourVal"></b></div><div><small>minute / 分</small><b id="minuteVal"></b></div></div></div>
  </div>

</div>
<script>
const SAVE_KEY='magicSchoolRuinsSave_v3';
const months=[['January','1月'],['February','2月'],['March','3月'],['April','4月'],['May','5月'],['June','6月'],['July','7月'],['August','8月'],['September','9月'],['October','10月'],['November','11月'],['December','12月']];
const weekdays=[['Sunday','日曜日'],['Monday','月曜日'],['Tuesday','火曜日'],['Wednesday','水曜日'],['Thursday','木曜日'],['Friday','金曜日'],['Saturday','土曜日']];
const weeks=[['First week','第1週'],['Second week','第2週'],['Third week','第3週'],['Fourth week','第4週'],['Fifth week','第5週']];
const fruits=[['apple','リンゴ'],['banana','バナナ'],['orange','オレンジ'],['strawberry','イチゴ'],['lemon','レモン']];
const weatherList=[['sun','晴れ'],['rain','雨'],['snow','雪'],['wind','風'],['blue sky','青空'],['hot','暑い'],['cold','寒い'],['warm','暖かい'],['cool','涼しい']];
const lunchFoods=[['salad','サラダ'],['soup','スープ'],['bread','パン'],['rice','ご飯'],['fish','魚'],['cake','ケーキ']];
const dinnerFoods=[['meat','肉'],['beef','牛肉'],['pork','豚肉'],['chicken','鶏肉'],['fish','魚'],['salad','サラダ'],['soup','スープ'],['bread','パン'],['rice','ご飯']];
const drinks=[['water','水'],['milk','牛乳'],['tea','お茶'],['coffee','コーヒー'],['juice','ジュース']];
const monsters=[['slime','スライム',2],['goblin','ゴブリン',3],['orc','オーク',4],['dragon','ドラゴン',6]];
const colors=[['red','赤'],['blue','青'],['green','緑'],['yellow','黄'],['white','白'],['black','黒'],['brown','茶'],['purple','紫']];
const questTypes=[
 {en:'Defeat monsters',ja:'モンスター退治',dept:'PE',target:'monster'},
 {en:'Investigate the ruins',ja:'遺跡調査',dept:'history',target:'ruin'},
 {en:'Open a sealed door',ja:'封印扉の解錠',dept:'science',target:'door'},
 {en:'Recover an old item',ja:'古代アイテム回収',dept:'history',target:'item'},
 {en:'Read an old inscription',ja:'碑文の解読',dept:'English',target:'text'}
];
const departments=[['PE','戦闘','weapon / 武器・戦闘訓練'],['science','理科','key / 鍵・罠・仕掛け'],['history','歴史','old book / 遺跡・古代資料'],['math','数学','ruler / 距離・地図'],['art','美術','paper & pen / 魔法陣・術札'],['music','音楽','sound / 音を使う魔法'],['English','英語','dictionary / 文書・碑文の解読']];
const tools={PE:['pen','ペン型の魔法ナイフ'],science:['ruler','罠や扉を測る定規'],history:['book','遺跡資料の本'],math:['pencil','地図を書く鉛筆'],art:['paper','術札用の紙'],music:['notebook','音術を記録するノート'],English:['dictionary','碑文を読む辞書']};
const treasures=[['money','お金'],['old book','古い本'],['magic stone','魔石'],['monster material','モンスター素材'],['old coin','古代貨幣'],['jewel','宝石']];
const wordQuestions=[['walk','歩く'],['road','道'],['egg','卵'],['coffee','コーヒー'],['music','音楽'],['door','ドア'],['money','お金'],['good','良い'],['well','上手に'],['happy','幸せな'],['slow','遅い'],['flower','花'],['young','若い'],['safe','安全な'],['busy','忙しい'],['hot','暑い'],['why','なぜ'],['this','これ'],['under','〜の下に'],['but','しかし'],['weather','天気'],['wind','風'],['sky','空'],['history','歴史'],['science','理科'],['water','水'],['milk','牛乳'],['tea','お茶'],['fish','魚'],['meat','肉']];
const sentences=[
 {jp:'私は道を歩きます。',tokens:['I','walk','on','the','road.']},
 {jp:'私は卵を買います。',tokens:['I','buy','eggs.']},
 {jp:'私はコーヒーを飲みます。',tokens:['I','drink','coffee.']},
 {jp:'私は音楽が聞こえます。',tokens:['I','hear','music.']},
 {jp:'私はドアを引きます。',tokens:['I','pull','the','door.']},
 {jp:'私はお金が欲しいです。',tokens:['I','want','money.']},
 {jp:'私はたいてい幸せです。',tokens:['I','am','usually','happy.']},
 {jp:'私は時々幸せです。',tokens:['I','am','sometimes','happy.']},
 {jp:'私はいつも悲しいです。',tokens:['I','am','always','sad.']},
 {jp:'私はよく忙しいです。',tokens:['I','am','often','busy.']},
 {jp:'なぜこのバッグはテーブルの下にあるのですか？',tokens:['Why','is','this','bag','under','the','table?']},
 {jp:'あなたはサッカーが上手です。',tokens:['You','play','soccer','well.']}
];
const defaultState={year:1,month:8,day:1,weekday:1,hour:7,minute:0,stage:'date',hp:6,maxHp:6,mp:3,maxMp:3,coins:0,egg:false,eggBuff:0,fruit:null,weather:null,lunch:null,lunchDrink:null,dinner:null,dinnerDrink:null,quest:null,tool:null,questProgress:0,questGoal:3,dungeonStep:0,enemy:null,battleType:null,question:null,loot:[],message:'',reported:false};
let state=loadState();
const app=document.getElementById('app'),scene=document.getElementById('scene'),actions=document.getElementById('actions');
function loadState(){try{return {...defaultState,...JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')}}catch(e){return {...defaultState}}}
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function ordinal(n){const v=n%100;if(v>=11&&v<=13)return n+'th';return n+(n%10===1?'st':n%10===2?'nd':n%10===3?'rd':'th')}
function season(m){if([2,3,4].includes(m))return ['spring','春'];if([5,6,7].includes(m))return ['summer','夏'];if([8,9,10].includes(m))return ['fall / autumn','秋'];return ['winter','冬']}
function daysInMonth(m){return [31,28,31,30,31,30,31,31,30,31,30,31][m]}
function weekIndex(){return Math.min(4,Math.floor((state.day-1)/7))}
function clock(){const h=state.hour,hr=h===0?12:h>12?h-12:h;return `${hr}:${String(state.minute).padStart(2,'0')} ${h>=12?'p.m.':'a.m.'}`}
function setTime(h,m=0){state.hour=h;state.minute=m;updateHud()}
function updateHud(){document.getElementById('dateMain').textContent=`${months[state.month][0]} ${ordinal(state.day)}, ${weekdays[state.weekday][0]}`;document.getElementById('dateSub').textContent=`Year ${state.year} · ${weeks[weekIndex()][0]} · ${season(state.month)[0]}`;document.getElementById('clockMain').textContent=clock();document.getElementById('timeVal').textContent=clock();document.getElementById('hourVal').textContent=state.hour;document.getElementById('minuteVal').textContent=String(state.minute).padStart(2,'0')}
function word(en,ja){return `<span class="word"><b>${en}</b><small>${ja}</small></span>`}
function stats(){return `<div class="stats"><span class="stat danger">HP ${state.hp}/${state.maxHp}</span><span class="stat magic">MP ${state.mp}/${state.maxMp}</span><span class="stat money">Money ${state.coins}</span>${state.eggBuff?'<span class="stat">Egg Buff +1</span>':''}</div><div class="loot">Bag / かばん：${state.loot.length?state.loot.join(' / '):'empty / 空'}</div>`}
function base(phase,en,jp,body=''){scene.innerHTML=`<div class="phase">${phase}</div><h1>${en}</h1><p class="jp">${jp}</p>${body}`;actions.innerHTML='';actions.className='actions';updateHud();scene.scrollTop=0}
function btn(label,jp,fn,primary=false){const b=document.createElement('button');b.className='btn'+(primary?' primary':'');b.innerHTML=`${label}<span class="tiny">${jp}</span>`;b.onclick=fn;actions.appendChild(b);return b}
function one(){actions.className='actions one'}
function nextStage(stage){state.stage=stage;state.message='';save();render()}
function randomQuest(){state.quest=rnd(questTypes);state.questProgress=0;state.questGoal=3;state.tool=tools[state.quest.dept]||tools.history;state.reported=false;save()}
function render(){app.classList.toggle('battle-mode',state.stage==='battle');if(state.stage==='date')return renderDate();if(state.stage==='egg')return renderEgg();if(state.stage==='breakfast')return renderBreakfast();if(state.stage==='weather')return renderWeather();if(state.stage==='guild')return renderGuild();if(state.stage==='classroom')return renderClassroom();if(state.stage==='prepare')return renderPrepare();if(state.stage==='lunch')return renderLunch();if(state.stage==='ruins')return renderRuins();if(state.stage==='battle')return renderBattle();if(state.stage==='questDone')return renderQuestDone();if(state.stage==='report')return renderReport();if(state.stage==='evening')return renderEvening();if(state.stage==='dinner')return renderDinner();if(state.stage==='night')return renderNight();state.stage='date';render()}
function renderDate(){setTime(7);const s=season(state.month);base('DATE / 日付','Today','今日',`<div class="grid2"><div class="mini"><small>year / 年</small><b>Year ${state.year}</b></div><div class="mini"><small>month / 月</small><b>${months[state.month][0]}</b></div><div class="mini"><small>week / 週</small><b>${weeks[weekIndex()][0]}</b></div><div class="mini"><small>day / 日</small><b>${ordinal(state.day)}</b></div><div class="mini"><small>weekday / 曜日</small><b>${weekdays[state.weekday][0]}</b></div><div class="mini"><small>season / 季節</small><b>${s[0]}</b></div></div>`);one();btn('Morning','朝を始める',()=>nextStage('egg'),true)}
function renderEgg(){setTime(7);base('MORNING / 朝','Get an egg.','鶏から卵を取ります。',`${word('egg','卵')}<div class="box" id="eggResult">Roll / 判定で卵を取ります。成功すると今日の最初の攻撃に Egg Buff がつきます。</div>${stats()}`);one();btn('Roll','判定',()=>{const d=1+Math.floor(Math.random()*6),ok=d>=3;if(ok){state.egg=true;state.eggBuff=1}document.getElementById('eggResult').innerHTML=`🎲 ${d} — <strong>${ok?'Success':'Fail'}</strong><br>${ok?'I get an egg. — 卵を手に入れました。':'I do not get an egg. — 卵を取れませんでした。'}`;actions.innerHTML='';btn('Breakfast','朝食へ',()=>nextStage('breakfast'),true);save()})}
function renderBreakfast(){setTime(7,30);if(!state.fruit)state.fruit=rnd(fruits);const f=state.fruit;state.mp=state.maxMp;base('BREAKFAST / 朝食','I make fruit juice.','フルーツジュースを作ります。',`<div class="box"><span class="badge">FRUIT ORACLE</span><br>${word(f[0],f[1])}<br><strong>${f[0]} juice</strong><br>Juice：MP ${state.maxMp}/${state.maxMp} に回復${state.egg?'<br>I eat an egg. — 卵も食べます。':''}</div>${stats()}`);btn('Fruit oracle','果物を引き直す',()=>{state.fruit=rnd(fruits);render()});btn('Weather','天気を見る',()=>nextStage('weather'),true)}
function renderWeather(){setTime(8);if(!state.weather)state.weather=rnd(weatherList);const w=state.weather;base('WEATHER / 天気','How is the weather?','天気はどうですか？',`<div class="box"><span class="badge">WEATHER ORACLE</span><br>${word('weather','天気')} ${word(w[0],w[1])}<br><strong>Weather: ${w[0]}</strong></div>`);btn('Weather oracle','引き直す',()=>{state.weather=rnd(weatherList);render()});btn('Go to Magic School','Magic Schoolへ',()=>nextStage('guild'),true)}
function renderGuild(){setTime(9);base('MAGIC SCHOOL','Magic School','遺跡都市の公営遺跡調査隊です。',`<div class="box"><strong>Magic School is not a normal school.</strong><br>学校という名前ですが、遺跡調査・モンスター退治を行う公的組織です。</div><div class="dept">${departments.map(d=>`<div><b>${d[0]}</b>${d[1]}<br>${d[2]}</div>`).join('')}</div>`);one();btn('Magic Classroom','依頼斡旋所へ',()=>nextStage('classroom'),true)}
function renderClassroom(){setTime(9,15);if(!state.quest)randomQuest();const q=state.quest;base('MAGIC CLASSROOM','Choose a mission.','今日の依頼を受けます。',`<div class="box quest"><span class="badge">MISSION</span><br><strong>${q.en}</strong><br>${q.ja}<br><br>Department / 担当：<strong>${q.dept}</strong><br>Goal / 目標：${state.questGoal}</div>`);btn('Mission oracle','依頼を引き直す',()=>{randomQuest();render()});btn('Accept','依頼を受ける',()=>nextStage('prepare'),true)}
function renderPrepare(){setTime(10);const t=state.tool;base('PREPARE / 準備','Prepare for the ruins.','遺跡へ潜る準備をします。',`<div class="box"><strong>Mission tool / 任務道具</strong><br>${word(t[0],t[1])}<br><br>${word('pen','魔法ナイフ')} ${word('pencil','地図・魔法を書く')} ${word('notebook','術札・記録')} ${word('eraser','魔法を消す')} ${word('paper','術札')}</div>${stats()}`);one();btn('Lunch','昼食へ',()=>nextStage('lunch'),true)}
function renderLunch(){setTime(12);if(!state.lunch)state.lunch=rnd(lunchFoods);if(!state.lunchDrink)state.lunchDrink=rnd(drinks);base('AFTERNOON / 昼','Lunch','遺跡へ行く前に昼食です。',`<div class="box"><strong>Food</strong> ${word(state.lunch[0],state.lunch[1])}<br><strong>Drink</strong> ${word(state.lunchDrink[0],state.lunchDrink[1])}</div>`);btn('Lunch oracle','引き直す',()=>{state.lunch=rnd(lunchFoods);state.lunchDrink=rnd(drinks);render()});btn('Go to the ruins','遺跡へ',()=>{state.dungeonStep=0;nextStage('ruins')},true)}
function mapHtml(){let s='<div class="map">';for(let i=0;i<10;i++){s+=`<div class="tile ${i<state.dungeonStep?'done':''} ${i===state.dungeonStep?'now':''}">${i===state.dungeonStep?'●':''}</div>`}return s+'</div>'}
function renderRuins(){if(state.hour<13)setTime(13);base('RUINS / 遺跡','Explore the ruins.','街の地下に広がる遺跡を探索します。',`${mapHtml()}<div class="box"><strong>${state.quest.en}</strong> — ${state.quest.ja}<br>Progress / 進行：${state.questProgress}/${state.questGoal}<br>${state.message||'Choose a way. — 進む方向を選びます。'}</div>${stats()}`);btn('Go forward','前へ進む',()=>explore('forward'));btn('Turn left','左へ曲がる',()=>explore('left'));btn('Turn right','右へ曲がる',()=>explore('right'));btn('Return','街へ戻る',()=>nextStage('evening'))}
function addMinutes(n){let total=state.hour*60+state.minute+n;state.hour=Math.floor(total/60)%24;state.minute=total%60;updateHud()}
function explore(dir){addMinutes(20);state.dungeonStep++;const roll=Math.random();if(roll<.42){startEnemy();return}if(roll<.60){const tr=rnd(treasures);state.loot.push(tr[1]);if(tr[0]==='money')state.coins+=2;state.message=`Treasure! — ${tr[1]}を見つけました。`;progressFor('item')}else if(roll<.74){state.message='An old room. — 古い部屋を調査します。';progressFor('ruin')}else if(roll<.86){state.message='A sealed door. — 封印された扉があります。';progressFor('door')}else if(roll<.95){state.message='Old words are on the wall. — 壁に古い文字があります。';progressFor('text')}else{state.hp=Math.max(1,state.hp-1);state.message='A trap! — 罠です。HP -1'}save();if(state.questProgress>=state.questGoal){state.stage='questDone';render();return}renderRuins()}
function progressFor(type){if(state.quest&&state.quest.target===type)state.questProgress++}
function startEnemy(){const m=rnd(monsters),c=rnd(colors);state.enemy={en:m[0],ja:m[1],hp:m[2],maxHp:m[2],color:c[0],colorJa:c[1]};state.battleType=Math.random()<.5?'word':'sentence';state.question=null;state.stage='battle';save();render()}
function makeWordQuestion(){const q=rnd(wordQuestions),wrong=shuffle(wordQuestions.filter(x=>x[0]!==q[0])).slice(0,3);return {kind:'word',en:q[0],ja:q[1],choices:shuffle([q,...wrong])}}
function makeSentenceQuestion(){const q=rnd(sentences);return {kind:'sentence',jp:q.jp,correct:[...q.tokens],pool:shuffle(q.tokens.map((t,i)=>({t,id:i}))),pick:[]}}
function ensureQuestion(){if(!state.question)state.question=state.battleType==='word'?makeWordQuestion():makeSentenceQuestion()}
function enemyBox(){const e=state.enemy,p=Math.max(0,Math.round(e.hp/e.maxHp*100));return `<div class="box"><div class="enemy"><div><span class="badge">MONSTER</span><div class="enemy-name">${e.color} ${e.en}</div><div>${e.colorJa}：${e.ja}</div></div><b>HP ${e.hp}/${e.maxHp}</b></div><div class="hpbar"><div class="hpfill" style="width:${p}%"></div></div></div>`}
function renderBattle(){ensureQuestion();const q=state.question;let body=enemyBox()+stats();if(q.kind==='word'){body+=`<div class="box"><span class="badge">WORD BATTLE / 英単語</span><br><strong>${q.en}</strong> の意味は？<div class="choices" id="choices"></div><div id="battleFeedback" class="feedback"></div><div class="battle-controls"><button class="btn" id="magicBtn">Use Magic<span class="tiny">MP -1 / ヒント</span></button></div></div>`}else{body+=`<div class="box"><span class="badge">SENTENCE BATTLE / 英文</span><br><strong>${q.jp}</strong><div class="answerline" id="answerLine"></div><div class="tokens" id="tokenPool"></div><div id="battleFeedback" class="feedback"></div><div class="battle-controls"><button class="btn primary" id="checkBtn">Check<span class="tiny">答え合わせ</span></button><button class="btn" id="resetBtn">Reset<span class="tiny">並べ直す</span></button><button class="btn" id="magicBtn">Magic<span class="tiny">MP -1 / ヒント</span></button></div></div>`}base('BATTLE / 戦闘','Fight!','英語で戦います。',body);if(q.kind==='word'){const area=document.getElementById('choices');q.choices.forEach(ch=>{const b=document.createElement('button');b.className='choice';b.textContent=ch[1];b.onclick=()=>answerWord(ch[1]===q.ja);area.appendChild(b)});document.getElementById('magicBtn').onclick=useMagic}else{drawSentence();document.getElementById('checkBtn').onclick=checkSentence;document.getElementById('resetBtn').onclick=resetSentence;document.getElementById('magicBtn').onclick=useMagic}}
function drawSentence(){const q=state.question,a=document.getElementById('answerLine'),p=document.getElementById('tokenPool');if(!a||!p)return;a.innerHTML='';p.innerHTML='';q.pick.forEach((x,idx)=>{const b=document.createElement('button');b.className='token';b.textContent=x.t;b.onclick=()=>{q.pool.push(q.pick.splice(idx,1)[0]);drawSentence()};a.appendChild(b)});q.pool.forEach((x,idx)=>{const b=document.createElement('button');b.className='token';b.textContent=x.t;b.onclick=()=>{q.pick.push(q.pool.splice(idx,1)[0]);drawSentence()};p.appendChild(b)})}
function resetSentence(){const q=state.question;q.pool=shuffle([...q.pool,...q.pick]);q.pick=[];drawSentence()}
function attackDamage(){let dmg=1;if(state.eggBuff){dmg++;state.eggBuff=0}return dmg}
function correctBattle(){const dmg=attackDamage();state.enemy.hp-=dmg;state.question=null;state.message=`Correct! — 正解。Damage ${dmg}`;if(state.enemy.hp<=0){state.loot.push(`${state.enemy.ja}素材`);state.coins+=1;if(state.quest.target==='monster')state.questProgress++;state.enemy=null;if(state.questProgress>=state.questGoal)state.stage='questDone';else state.stage='ruins';save();render();return}state.battleType=Math.random()<.5?'word':'sentence';save();renderBattle()}
function wrongBattle(){state.hp=Math.max(0,state.hp-1);state.question=null;if(state.hp<=0){state.hp=state.maxHp;state.coins=Math.max(0,state.coins-2);state.questProgress=0;state.dungeonStep=0;state.enemy=null;state.stage='evening';state.message='戦闘で倒れ、街へ運ばれました。Money -2';save();render();return}state.battleType=Math.random()<.5?'word':'sentence';save();renderBattle()}
function answerWord(ok){const f=document.getElementById('battleFeedback');f.innerHTML=ok?'<span class="good">Correct! — 正解</span>':'<span class="bad">Wrong. — 不正解</span>';setTimeout(()=>ok?correctBattle():wrongBattle(),250)}
function checkSentence(){const q=state.question,ans=q.pick.map(x=>x.t),f=document.getElementById('battleFeedback');if(ans.length!==q.correct.length){f.innerHTML='<span class="bad">文を最後まで作ってください。</span>';return}const ok=ans.every((x,i)=>x===q.correct[i]);f.innerHTML=ok?'<span class="good">Correct! — 正解</span>':'<span class="bad">Wrong. — 不正解</span>';setTimeout(()=>ok?correctBattle():wrongBattle(),250)}
function useMagic(){const f=document.getElementById('battleFeedback');if(state.mp<=0){f.innerHTML='<span class="bad">MPがありません。</span>';return}state.mp--;const q=state.question;if(q.kind==='word')f.innerHTML=`Hint / ヒント：<strong>${q.ja}</strong>`;else f.innerHTML=`Hint / 次の語：<strong>${q.correct[q.pick.length]||'完成'}</strong>`;save();updateHud()}
function renderQuestDone(){setTime(17);base('MISSION COMPLETE','Mission complete!','依頼達成です。',`<div class="box"><strong>${state.quest.en}</strong><br>${state.quest.ja}<br><br>Progress ${state.questProgress}/${state.questGoal}<br>Magic Classroomへ報告します。</div>${stats()}`);one();btn('Return to town','街へ戻る',()=>nextStage('report'),true)}
function renderReport(){setTime(17,30);base('MAGIC CLASSROOM','Report the mission.','依頼の結果を報告します。',`<div class="box"><strong>Mission complete.</strong><br>Reward / 報酬：Money +3<br>Loot / 戦利品：${state.loot.length?state.loot.join(' / '):'none'}</div>${stats()}`);one();btn('Receive reward','報酬を受け取る',()=>{if(!state.reported){state.coins+=3;state.reported=true}nextStage('evening')},true)}
function renderEvening(){setTime(18);base('EVENING / 夕方','I go back to town.','街へ戻ります。',`<div class="box">${word('evening','夕方')} ${word('town','町')} ${word('restaurant','レストラン')}<br>${state.message||'I walk to a restaurant. — レストランへ歩きます。'}</div>${stats()}`);one();btn('Dinner','夕食へ',()=>nextStage('dinner'),true)}
function renderDinner(){setTime(19);if(!state.dinner)state.dinner=rnd(dinnerFoods);if(!state.dinnerDrink)state.dinnerDrink=rnd(drinks);base('DINNER / 夕食','Dinner at a restaurant.','レストランで夕食です。',`<div class="box"><strong>Food</strong> ${word(state.dinner[0],state.dinner[1])}<br><strong>Drink</strong> ${word(state.dinnerDrink[0],state.dinnerDrink[1])}<br><br>I eat ${state.dinner[0]}.<br>I drink ${state.dinnerDrink[0]}.</div>`);btn('Dinner oracle','引き直す',()=>{state.dinner=rnd(dinnerFoods);state.dinnerDrink=rnd(drinks);render()});btn('Night','夜へ',()=>nextStage('night'),true)}
function renderNight(){setTime(21);base('NIGHT / 夜','I sleep.','眠ります。',`<div class="box">Today is finished. — 今日が終わりました。<br>Tomorrow starts after sleep. — 眠ると明日です。</div>${stats()}`);one();btn('Sleep','眠る',nextDay,true)}
function nextDay(){state.day++;state.weekday=(state.weekday+1)%7;if(state.day>daysInMonth(state.month)){state.day=1;state.month++;if(state.month>11){state.month=0;state.year++}}state.stage='date';state.hp=state.maxHp;state.mp=state.maxMp;state.egg=false;state.eggBuff=0;state.fruit=state.weather=state.lunch=state.lunchDrink=state.dinner=state.dinnerDrink=state.quest=state.tool=state.enemy=state.question=null;state.questProgress=0;state.dungeonStep=0;state.loot=[];state.message='';state.reported=false;save();render()}
render();
</script>
</body>
