y:inline-block;border-radius:999px;background:#ded4c2;padding:2px 7px;font-size:10px;font-weight:900;margin:0 4px 4px 0}.stats{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}.stat{font-size:11px;font-weight:900;border-radius:999px;background:#e9e2d6;padding:4px 8px}.stat.danger{background:#eee0de}.stat.magic{background:#e3e2ee}.stat.money{background:#eee6cb}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions.one{grid-template-columns:1fr}.btn{min-height:46px;border:1px solid #3c372f;border-radius:11px;background:#fff;color:#201e1a;font-size:15px;font-weight:900;padding:7px}.btn.primary{background:#302c26;color:white}.btn.warn{background:#5c342c;color:white}.btn:disabled{opacity:.4}.tiny{font-size:10px;font-weight:600;display:block;margin-top:2px;opacity:.74}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}.mini{background:#fff;border:1px solid #ddd3c4;border-radius:9px;padding:7px}.mini small{font-size:9px;color:#777;display:block}.mini b{font-size:13px}.quest{border-left:4px solid #735b37;padding-left:9px}.enemy{display:flex;justify-content:space-between;align-items:center;gap:8px}.enemy-name{font-size:19px;font-weight:950}.hpbar{height:9px;background:#ded8ce;border-radius:99px;overflow:hidden;margin-top:4px}.hpfill{height:100%;background:#433b34}.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.choice{min-height:43px;border:1px solid #847b70;border-radius:9px;background:#fff;font-size:14px;font-weight:800;padding:6px}.tokens{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.token{border:1px solid #837a6e;border-radius:8px;background:#fff;padding:7px 9px;font-size:14px;font-weight:850}.answerline{min-height:40px;border:1px dashed #a89c8b;border-radius:9px;padding:7px;margin-top:7px}.feedback{font-size:13px;font-weight:850;margin-top:7px}.good{color:#285a34}.bad{color:#8a352a}.loot{font-size:12px;color:#625a50;margin-top:6px}.map{display:grid;grid-template-columns:repeat(5,24px);gap:3px;justify-content:center;margin:8px auto}.tile{width:24px;height:24px;border-radius:5px;background:#e8e0d4;display:grid;place-items:center;font-size:11px}.tile.now{background:#3d3831;color:#fff}.tile.done{background:#cfc3b0}.dept{display:grid;grid-template-columns:1fr 1fr;gap:5px}.dept div{background:#fff;border:1px solid #ddd3c4;border-radius:9px;padding:6px;font-size:11px}.dept b{display:block;font-size:13px}.note{font-size:11px;color:#746c61;margin-top:6px}@media(max-height:690px){.app{padding:5px;gap:4px}.scene{padding:10px}.scene h1{font-size:21px}.btn{min-height:41px}.box{padding:8px}.hud{gap:4px}.card{padding:5px 7px}}

<body>
<div class="app">
  <div class="top">
    <a class="back" href="story-menu.html?v=20260903-3" aria-label="戻る">←</a>
    <div class="title"><strong>Magic School</strong><small>遺跡都市・公営遺跡調査隊</small></div>
  </div>
  <div class="hud">
    <div class="card"><div class="card-label">DATE / 日付</div><div class="date-main" id="dateMain"></div><div class="date-sub" id="dateSub"></div></div>
    <div class="card"><div class="card-label">TIME / 時間</div><div class="clock-main" id="clockMain"></div><div class="clock-parts"><div><small>time / 時間</small><b id="timeVal"></b></div><div><small>hour / 時</small><b id="hourVal"></b></div><div><small>minute / 分</small><b id="minuteVal"></b></div></div></div>
  </div>
  <main class="scene" id="scene"></main>
  <div class="actions" id="actions"></div>
</div>
<script>
const SAVE_KEY='magicSchoolRuinsSave_v2';
const months=[['January','1月'],['February','2月'],['March','3月'],['April','4月'],['May','5月'],['June','6月'],['July','7月'],['August','8月'],['September','9月'],['October','10月'],['November','11月'],['December','12月']];
const weekdays=[['Sunday','日曜日'],['Monday','月曜日'],['Tuesday','火曜日'],['Wednesday','水曜日'],['Thursday','木曜日'],['Friday','金曜日'],['Saturday','土曜日']];
const weeks=[['First week','第1週'],['Second week','第2週'],['Third week','第3週'],['Fourth week','第4週'],['Fifth week','第5週']];
const fruits=[['apple','リンゴ'],['banana','バナナ'],['orange','オレンジ'],['strawberry','イチゴ'],['lemon','レモン']];
const weatherList=[['sun','晴れ'],['rain','雨'],['snow','雪'],['wind','風'],['blue sky','青空'],['hot','暑い'],['cold','寒い'],['warm','暖かい'],['cool','涼しい']];
const lunchFoods=[['salad','サラダ'],['soup','スープ'],['bread','パン'],['rice','ご飯'],['fish','魚'],['cake','ケーキ']];
const dinnerFoods=[['meat','肉'],['beef','牛肉'],['pork','豚肉'],['chicken','鶏肉'],['fish','魚'],['salad','サラダ'],['soup','スープ'],['bread','パン'],['rice','ご飯']];
const drinks=[['water','水'],['milk','牛乳'],['tea','お茶'],['coffee','コーヒー'],['juice','ジュース']];
const monsters=[['slime','スライム',2],['goblin','ゴブリン',3],['orc','オーク',4],['dragon','ドラゴン',6]];
const colors=[['red','赤'],['blue','青'],['green','緑'],['yellow','黄'],['white','白'],['black','黒'],['brown','茶'],['purple','紫']];
const questTypes=[
 {en:'Defeat monsters',ja:'モンスター退治',dept:'PE',target:'monster'},
 {en:'Investigate the ruins',ja:'遺跡調査',dept:'history',target:'ruin'},
 {en:'Open a sealed door',ja:'封印扉の解錠',dept:'science',target:'door'},
 {en:'Recover an old item',ja:'古代アイテム回収',dept:'history',target:'item'},
 {en:'Read an old inscription',ja:'碑文の解読',dept:'English',target:'text'}
];
const departments=[
 ['PE','戦闘','weapon / 武器・戦闘訓練'],
 ['science','理科','key / 鍵・罠・仕掛け'],
 ['history','歴史','old book / 遺跡・古代資料'],
 ['math','数学','ruler / 距離・地図'],
 ['art','美術','paper & pen / 魔法陣・術札'],
 ['music','音楽','sound / 音を使う魔法'],
 ['English','英語','dictionary / 文書・碑文の解読']
];
const tools={PE:['pen','ペン型の魔法ナイフ'],science:['ruler','罠や扉を測る定規'],history:['book','遺跡資料の本'],math:['pencil','地図を書く鉛筆'],art:['paper','術札用の紙'],music:['notebook','音術を記録するノート'],English:['dictionary','碑文を読む辞書']};
const treasures=[['money','お金'],['old book','古い本'],['magic stone','魔石'],['monster material','モンスター素材'],['old coin','古代貨幣'],['jewel','宝石']];
const wordQuestions=[
 ['walk','歩く'],['road','道'],['egg','卵'],['coffee','コーヒー'],['music','音楽'],['door','ドア'],['money','お金'],['good','良い'],['well','上手に'],['happy','幸せな'],['slow','遅い'],['flower','花'],['young','若い'],['safe','安全な'],['busy','忙しい'],['hot','暑い'],['why','なぜ'],['this','これ'],['under','〜の下に'],['but','しかし'],['weather','天気'],['wind','風'],['sky','空'],['history','歴史'],['science','理科'],['water','水'],['milk','牛乳'],['tea','お茶'],['fish','魚'],['meat','肉']
];
const sentences=[
 {jp:'私は道を歩きます。',tokens:['I','walk','on','the','road.']},
 {jp:'私は卵を買います。',tokens:['I','buy','eggs.']},
 {jp:'私はコーヒーを飲みます。',tokens:['I','drink','coffee.']},
 {jp:'私は音楽が聞こえます。',tokens:['I','hear','music.']},
 {jp:'私はドアを引きます。',tokens:['I','pull','the','door.']},
 {jp:'私はお金が欲しいです。',tokens:['I','want','money.']},
 {jp:'私はたいてい幸せです。',tokens:['I','am','usually','happy.']},
 {jp:'私は時々幸せです。',tokens:['I','am','sometimes','happy.']},
 {jp:'私はいつも悲しいです。',tokens:['I','am','always','sad.']},
 {jp:'私はよく忙しいです。',tokens:['I','am','often','busy.']},
 {jp:'なぜこのバッグはテーブルの下にあるのですか？',tokens:['Why','is','this','bag','under','the','table?']},
 {jp:'あなたはサッカーが上手です。',tokens:['You','play','soccer','well.']}
];
const defaultState={year:1,month:8,day:1,weekday:1,hour:7,minute:0,stage:'date',hp:6,maxHp:6,mp:3,maxMp:3,coins:0,egg:false,eggBuff:0,fruit:null,weather:null,lunch:null,lunchDrink:null,dinner:null,dinnerDrink:null,quest:null,tool:null,questProgress:0,questGoal:3,dungeonStep:0,enemy:null,battleType:null,question:null,sentencePick:[],sentencePool:[],loot:[],message:'',reported:false};
let state=loadState();
const scene=document.getElementById('scene'),actions=document.getElementById('actions');
function loadState(){try{return {...defaultState,...JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')}}catch(e){return {...defaultState}}}
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function ordinal(n){const v=n%100;if(v>=11&&v<=13)return n+'th';return n+(n%10===1?'st':n%10===2?'nd':n%10===3?'rd':'th')}
function season(m){if([2,3,4].includes(m))return ['spring','春'];if([5,6,7].includes(m))return ['summer','夏'];if([8,9,10].includes(m))return ['fall / autumn','秋'];return ['winter','冬']}
function daysInMonth(m){return [31,28,31,30,31,30,31,31,30,31,30,31][m]}
function weekIndex(){return Math.min(4,Math.floor((state.day-1)/7))}
function clock(){const h=state.hour,hr=h===0?12:h>12?h-12:h;return `${hr}:${String(state.minute).padStart(2,'0')} ${h>=12?'p.m.':'a.m.'}`}
function setTime(h,m=0){state.hour=h;state.minute=m;updateHud()}
function updateHud(){const s=season(state.month);document.getElementById('dateMain').textContent=`${months[state.month][0]} ${ordinal(state.day)}, ${weekdays[state.weekday][0]}`;document.getElementById('dateSub').textContent=`Year ${state.year} · ${weeks[weekIndex()][0]} · ${s[0]}`;document.getElementById('clockMain').textContent=clock();document.getElementById('timeVal').textContent=clock();document.getElementById('hourVal').textContent=state.hour;document.getElementById('minuteVal').textContent=String(state.minute).padStart(2,'0')}
function word(en,ja){return `<span class="word"><b>${en}</b><small>${ja}</small></span>`}
function stats(){return `<div class="stats"><span class="stat danger">HP ${state.hp}/${state.maxHp}</span><span class="stat magic">MP ${state.mp}/${state.maxMp}</span><span class="stat money">Money ${state.coins}</span>${state.eggBuff?'<span class="stat">Egg Buff +1</span>':''}</div><div class="loot">Bag / かばん：${state.loot.length?state.loot.join(' / '):'empty / 空'}</div>`}
function base(phase,en,jp,body=''){scene.innerHTML=`<div class="phase">${phase}</div><h1>${en}</h1><p class="jp">${jp}</p>${body}`;actions.innerHTML='';actions.className='actions';updateHud();save()}
function btn(en,ja,fn,primary=false,extra=''){const b=document.createElement('button');b.className='btn'+(primary?' primary':'')+(extra?' '+extra:'');b.innerHTML=`${en}<span class="tiny">${ja}</span>`;b.onclick=fn;actions.appendChild(b);return b}
function one(){actions.className='actions one'}
function nextStage(s){state.stage=s;render()}
function render(){
 if(state.stage==='date')return renderDate();
 if(state.stage==='egg')return renderEgg();
 if(state.stage==='breakfast')return renderBreakfast();
 if(state.stage==='weather')return renderWeather();
 if(state.stage==='guild')return renderGuild();
 if(state.stage==='classroom')return renderClassroom();
 if(state.stage==='prepare')return renderPrepare();
 if(state.stage==='lunch')return renderLunch();
 if(state.stage==='ruins')return renderRuins();
 if(state.stage==='battle')return renderBattle();
 if(state.stage==='questDone')return renderQuestDone();
 if(state.stage==='report')return renderReport();
 if(state.stage==='evening')return renderEvening();
 if(state.stage==='dinner')return renderDinner();
 if(state.stage==='night')return renderNight();
}
function renderDate(){setTime(7,0);const s=season(state.month);base('DATE / 日付','Today','今日',`<div class="grid2"><div class="mini"><small>year / 年</small><b>Year ${state.year}</b></div><div class="mini"><small>month / 月</small><b>${months[state.month][0]}</b></div><div class="mini"><small>week / 週</small><b>${weeks[weekIndex()][0]}</b></div><div class="mini"><small>day / 日</small><b>${ordinal(state.day)}</b></div><div class="mini"><small>today / 今日</small><b>${weekdays[state.weekday][0]}</b></div><div class="mini"><small>season / 季節</small><b>${s[0]}</b></div></div><div class="note">tomorrow＝明日 / yesterday＝昨日</div>${stats()}`);one();btn('Morning','朝を始める',()=>nextStage('egg'),true)}
function renderEgg(){setTime(7,0);base('MORNING / 朝','I take an egg.','私は卵を取ります。',`${word('egg','卵')}<div id="eggResult" class="box">鶏から egg を取ります。<br>Roll / 判定をします。</div>${stats()}`);one();btn('Roll','判定',()=>{const d=1+Math.floor(Math.random()*6);state.egg=d>=3;document.getElementById('eggResult').innerHTML=`🎲 ${d} — <strong>${state.egg?'Success':'Fail'}</strong><br>${state.egg?'I get an egg. — 卵を手に入れました。':'I do not get an egg. — 卵を取れませんでした。'}`;actions.innerHTML='';btn('Breakfast','朝食へ',()=>nextStage('breakfast'),true);save()},true)}
function renderBreakfast(){setTime(7,30);if(!state.fruit)state.fruit=rnd(fruits);const f=state.fruit;state.mp=state.maxMp;if(state.egg){state.eggBuff=1;state.egg=false}base('BREAKFAST / 朝食','I make fruit juice.','私はフルーツジュースを作ります。',`<span class="badge">FRUIT ORACLE</span><div class="box">${word(f[0],f[1])}<br><strong>${f[0]} juice</strong> — ${f[1]}ジュース<br><br>Juice → <strong>MP full / MP全回復</strong><br>${state.eggBuff?'Egg → <strong>Egg Buff +1</strong>（次の戦闘で最初の正解攻撃+1）':'No egg buff today. — 今日はegg buffなし。'}</div>${stats()}`);btn('Fruit oracle','果物を引き直す',()=>{state.fruit=rnd(fruits);renderBreakfast()});btn('Weather','天気を見る',()=>nextStage('weather'),true)}
function renderWeather(){setTime(8,0);if(!state.weather)state.weather=rnd(weatherList);const w=state.weather;base('WEATHER / 天気','How is the weather?','天気はどうですか？',`<span class="badge">WEATHER ORACLE</span><div class="box">${word('weather','天気')} ${word(w[0],w[1])}<br><strong>Weather: ${w[0]}</strong> — ${w[1]}</div>${stats()}`);btn('Weather oracle','天気を引き直す',()=>{state.weather=rnd(weatherList);renderWeather()});btn('Go to Magic School','Magic Schoolへ行く',()=>nextStage('guild'),true)}
function renderGuild(){setTime(9,0);base('MAGIC SCHOOL','Public Ruins Survey Corps','公営遺跡調査隊',`<div class="box"><strong>Magic School</strong> は学校ではありません。<br>街の地下に広がる遺跡を調査し、地上へ上がる monsters を防ぐ公的組織です。<br><br>遺跡の treasure・古代品・monster materials が街を発展させています。</div><div class="dept">${departments.map(d=>`<div><b>${d[0]} — ${d[1]}</b>${d[2]}</div>`).join('')}</div>${stats()}`);one();btn('Magic Classroom','依頼斡旋所へ',()=>nextStage('classroom'),true)}
function newQuest(){state.quest=rnd(questTypes);state.questProgress=0;state.questGoal=3;state.tool=null;state.dungeonStep=0;state.enemy=null;state.reported=false}
function renderClassroom(){setTime(9,15);if(!state.quest)newQuest();const q=state.quest;base('MAGIC CLASSROOM','Mission Counter','依頼斡旋所',`<span class="badge">MISSION ORACLE</span><div class="box quest"><strong>${q.en}</strong><br>${q.ja}<br><br>Department / 担当：${word(q.dept,departments.find(d=>d[0]===q.dept)?.[1]||'')}</div><div class="note">Magic Classroom は classroom という名前ですが、実際は退治・調査・回収依頼の受付所です。</div>${stats()}`);btn('New mission','別の依頼を引く',()=>{newQuest();renderClassroom()});btn('Take mission','依頼を受ける',()=>nextStage('prepare'),true)}
function renderPrepare(){setTime(10,0);const q=state.quest,t=tools[q.dept]||['bag','かばん'];state.tool=t;base('PREPARE / 準備','Prepare for the ruins.','遺跡へ行く準備をします。',`<div class="box"><strong>${q.dept} equipment</strong><br>${word(t[0],t[1])}<br><br>${word('bag','かばん')} ${word('paper','紙')} ${word('notebook','ノート')} ${word('pencil','鉛筆')} ${word('eraser','消しゴム')}<br><br>Mission: <strong>${q.en}</strong></div>${stats()}`);one();btn('Lunch','昼食へ',()=>nextStage('lunch'),true)}
function renderLunch(){setTime(12,0);if(!state.lunch)state.lunch=rnd(lunchFoods);if(!state.lunchDrink)state.lunchDrink=rnd(drinks);state.hp=Math.min(state.maxHp,state.hp+1);base('AFTERNOON / 昼','Lunch','昼食',`<div class="box"><strong>Food</strong> ${word(state.lunch[0],state.lunch[1])}<br><strong>Drink</strong> ${word(state.lunchDrink[0],state.lunchDrink[1])}<br><br>Lunch → HP +1</div>${stats()}`);btn('Lunch oracle','昼食を引き直す',()=>{state.lunch=rnd(lunchFoods);state.lunchDrink=rnd(drinks);renderLunch()});btn('Go to the ruins','遺跡へ',()=>nextStage('ruins'),true)}
function dungeonMap(){let html='<div class="map">';for(let i=0;i<15;i++){let c='tile';if(i<state.dungeonStep)c+=' done';if(i===Math.min(state.dungeonStep,14))c+=' now';html+=`<div class="${c}">${i===Math.min(state.dungeonStep,14)?'●':''}</div>`}return html+'</div>'}
function renderRuins(){setTime(Math.min(17,13+Math.floor(state.dungeonStep/2)),state.dungeonStep%2?30:0);if(state.questProgress>=state.questGoal)return nextStage('questDone');base('RUINS / 遺跡','Explore the ruins.','遺跡を探索します。',`<div class="box"><strong>Mission:</strong> ${state.quest.en}<br>Progress / 進行：${state.questProgress} / ${state.questGoal}<br>Depth / 探索歩数：${state.dungeonStep}</div>${dungeonMap()}${stats()}<div id="ruinMessage" class="note">前・左・右のどこかへ進みます。</div>`);btn('Forward','前へ進む',()=>explore('forward'),true);btn('Left','左へ進む',()=>explore('left'));btn('Right','右へ進む',()=>explore('right'));btn('Return','街へ戻る',()=>nextStage('evening'))}
function explore(dir){state.dungeonStep++;const roll=Math.random();let msg='';if(roll<.38){const m=rnd(monsters),c=rnd(colors);state.enemy={en:m[0],ja:m[1],color:c[0],colorJa:c[1],hp:m[2],maxHp:m[2]};state.battleType=Math.random()<.5?'word':'sentence';state.stage='battle';render();return}else if(roll<.58){const t=rnd(treasures);state.loot.push(t[1]);state.coins+=t[0]==='money'||t[0]==='old coin'?2:0;state.questProgress++;msg=`Treasure! ${t[0]} — ${t[1]} を見つけました。`}else if(roll<.72){const d=1+Math.floor(Math.random()*6);if(d>=3){state.questProgress++;msg=`Trap / 罠。science check 🎲${d} Success — 仕掛けを解除しました。`}else{state.hp=Math.max(0,state.hp-1);msg=`Trap / 罠。science check 🎲${d} Fail — HP -1`}}else if(roll<.88){state.questProgress++;msg=`Old room / 古い部屋を調査しました。history + investigation.`}else{state.questProgress++;msg=`A sealed passage opens. — 封印された通路が開きました。`}
 save();if(state.hp<=0){state.hp=state.maxHp;state.coins=Math.max(0,state.coins-2);state.questProgress=0;state.dungeonStep=0;state.stage='evening';state.message='倒れて街へ運ばれました。Money -2';render();return}renderRuins();const e=document.getElementById('ruinMessage');if(e)e.textContent=msg}
function makeWordQuestion(){const q=rnd(wordQuestions),wrong=shuffle(wordQuestions.filter(x=>x[0]!==q[0])).slice(0,3);return {kind:'word',en:q[0],ja:q[1],choices:shuffle([q,...wrong])}}
function makeSentenceQuestion(){const q=rnd(sentences);return {kind:'sentence',jp:q.jp,correct:[...q.tokens],pool:shuffle(q.tokens.map((t,i)=>({t,id:i}))),pick:[]}}
function ensureQuestion(){if(!state.question)state.question=state.battleType==='word'?makeWordQuestion():makeSentenceQuestion()}
function enemyBox(){const e=state.enemy,p=Math.max(0,Math.round(e.hp/e.maxHp*100));return `<div class="box"><div class="enemy"><div><span class="badge">MONSTER</span><div class="enemy-name">${e.color} ${e.en}</div><div>${e.colorJa}い${e.ja}</div></div><b>HP ${e.hp}/${e.maxHp}</b></div><div class="hpbar"><div class="hpfill" style="width:${p}%"></div></div></div>`}
function renderBattle(){ensureQuestion();const q=state.question;setTime(state.hour,state.minute);let body=enemyBox()+stats();if(q.kind==='word'){body+=`<div class="box"><span class="badge">WORD BATTLE / 英単語</span><br><strong>${q.en}</strong> の意味は？<div class="choices" id="choices"></div><div id="battleFeedback" class="feedback"></div></div>`}else{body+=`<div class="box"><span class="badge">SENTENCE BATTLE / 英文</span><br><strong>${q.jp}</strong><div class="answerline" id="answerLine"></div><div class="tokens" id="tokenPool"></div><div id="battleFeedback" class="feedback"></div></div>`}base('BATTLE / 戦闘','Fight!','英語で戦います。',body);if(q.kind==='word'){const area=document.getElementById('choices');q.choices.forEach(ch=>{const b=document.createElement('button');b.className='choice';b.textContent=`${ch[1]}`;b.onclick=()=>answerWord(ch[1]===q.ja);area.appendChild(b)})}else drawSentence();one();btn('Use Magic -1 MP','ヒントを使う',useMagic)}
function attackDamage(){let dmg=1;if(state.eggBuff){dmg++;state.eggBuff=0}return dmg}
function correctBattle(){const dmg=attackDamage();state.enemy.hp-=dmg;state.question=null;state.message=`Correct! — 正解。Damage ${dmg}`;if(state.enemy.hp<=0){state.loot.push(`${state.enemy.ja}素材`);state.coins+=1;state.questProgress++;state.enemy=null;state.stage=state.questProgress>=state.questGoal?'questDone':'ruins';save();render();return}state.battleType=Math.random()<.5?'word':'sentence';save();renderBattle()}
function wrongBattle(){state.hp=Math.max(0,state.hp-1);state.question=null;state.message='Wrong. — 不正解。HP -1';if(state.hp<=0){state.hp=state.maxHp;state.coins=Math.max(0,state.coins-2);state.questProgress=0;state.dungeonStep=0;state.enemy=null;state.stage='evening';state.message='戦闘で倒れ、街へ運ばれました。Money -2';save();render();return}state.battleType=Math.random()<.5?'word':'sentence';save();renderBattle()}
function answerWord(ok){const f=document.getElementById('battleFeedback');if(f)f.innerHTML=ok?'<span class="good">Correct! — 正解</span>':'<span class="bad">Wrong. — 不正解</span>';setTimeout(()=>ok?correctBattle():wrongBattle(),250)}
function drawSentence(){const q=state.question,a=document.getElementById('answerLine'),p=document.getElementById('tokenPool');if(!a||!p)return;a.innerHTML='';p.innerHTML='';q.pick.forEach((x,idx)=>{const b=document.createElement('button');b.className='token';b.textContent=x.t;b.onclick=()=>{q.pool.push(q.pick.splice(idx,1)[0]);drawSentence()};a.appendChild(b)});q.pool.forEach((x,idx)=>{const b=document.createElement('button');b.className='token';b.textContent=x.t;b.onclick=()=>{q.pick.push(q.pool.splice(idx,1)[0]);drawSentence()};p.appendChild(b)});actions.innerHTML='';btn('Check','答え合わせ',checkSentence,true);btn('Reset','並べ直す',()=>{q.pool=shuffle([...q.pool,...q.pick]);q.pick=[];drawSentence()});btn('Use Magic -1 MP','ヒントを使う',useMagic)}
function checkSentence(){const q=state.question,ans=q.pick.map(x=>x.t);if(ans.length!==q.correct.length){document.getElementById('battleFeedback').innerHTML='<span class="bad">文を最後まで作ってください。</span>';return}const ok=ans.every((x,i)=>x===q.correct[i]);document.getElementById('battleFeedback').innerHTML=ok?'<span class="good">Correct! — 正解</span>':'<span class="bad">Wrong. — 不正解</span>';setTimeout(()=>ok?correctBattle():wrongBattle(),250)}
function useMagic(){if(state.mp<=0){const f=document.getElementById('battleFeedback');if(f)f.innerHTML='<span class="bad">MPがありません。</span>';return}state.mp--;const q=state.question;if(q.kind==='word'){const f=document.getElementById('battleFeedback');if(f)f.innerHTML=`Hint / ヒント：<strong>${q.ja}</strong>`}else{const next=q.correct[q.pick.length];const f=document.getElementById('battleFeedback');if(f)f.innerHTML=`Hint / 次の語：<strong>${next||'完成'}</strong>`}save();updateHud()}
function renderQuestDone(){setTime(17,0);base('MISSION COMPLETE','Mission complete!','依頼達成です。',`<div class="box"><strong>${state.quest.en}</strong><br>${state.quest.ja}<br><br>Ruins progress: ${state.questProgress}/${state.questGoal}<br>街へ戻って Magic Classroom に報告します。</div>${stats()}`);one();btn('Return to town','街へ戻る',()=>nextStage('report'),true)}
function renderReport(){setTime(17,30);if(!state.reported){state.coins+=5;state.reported=true}base('MAGIC CLASSROOM','Report the mission.','依頼を報告します。',`<div class="box"><strong>Mission complete.</strong><br>報酬：Money +5<br><br>Loot / 戦利品：${state.loot.length?state.loot.join(' / '):'なし'}</div>${stats()}`);one();btn('Evening','夕方へ',()=>nextStage('evening'),true)}
function renderEvening(){setTime(18,0);base('EVENING / 夕方','I go back to town.','私は街へ戻ります。',`<div class="box">${word('evening','夕方')} ${word('town','町')} ${word('restaurant','レストラン')}<br><br>${state.message||'I walk to a restaurant. — レストランへ歩いて行きます。'}</div>${stats()}`);one();btn('Dinner','夕食へ',()=>nextStage('dinner'),true)}
function renderDinner(){setTime(19,0);if(!state.dinner)state.dinner=rnd(dinnerFoods);if(!state.dinnerDrink)state.dinnerDrink=rnd(drinks);state.hp=state.maxHp;base('DINNER / 夕食','Dinner at a restaurant','レストランで夕食',`<div class="box"><strong>Food</strong> ${word(state.dinner[0],state.dinner[1])}<br><strong>Drink</strong> ${word(state.dinnerDrink[0],state.dinnerDrink[1])}<br><br>I eat ${state.dinner[0]}.<br>I drink ${state.dinnerDrink[0]}.<br>Dinner → HP full / HP全回復</div>${stats()}`);btn('Dinner oracle','夕食を引き直す',()=>{state.dinner=rnd(dinnerFoods);state.dinnerDrink=rnd(drinks);renderDinner()});btn('Night','夜へ',()=>nextStage('night'),true)}
function renderNight(){setTime(21,0);base('NIGHT / 夜','I sleep.','私は眠ります。',`${word('night','夜')} ${word('sleep','眠る')}<div class="box">Today is finished. — 今日が終わりました。<br>Tomorrow starts after sleep. — 眠ると明日が始まります。</div>${stats()}`);one();btn('Sleep','眠る',nextDay,true)}
function nextDay(){state.day++;state.weekday=(state.weekday+1)%7;if(state.day>daysInMonth(state.month)){state.day=1;state.month++;if(state.month>11){state.month=0;state.year++}}state.stage='date';state.hour=7;state.minute=0;state.egg=false;state.eggBuff=0;state.fruit=null;state.weather=null;state.lunch=null;state.lunchDrink=null;state.dinner=null;state.dinnerDrink=null;state.quest=null;state.tool=null;state.questProgress=0;state.dungeonStep=0;state.enemy=null;state.question=null;state.loot=[];state.message='';state.reported=false;save();render()}
render();
</script>
</body>
</html>
