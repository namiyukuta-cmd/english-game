<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Magic School Adventure</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3efe5;color:#25231f}body{overflow:hidden}.app{height:100dvh;max-width:760px;margin:auto;display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;padding:10px}.top{display:flex;align-items:center;gap:8px}.back{width:42px;height:42px;border:1px solid #b8ad98;border-radius:12px;background:#fff;color:#222;text-decoration:none;display:grid;place-items:center;font-size:22px;font-weight:900}.title{flex:1}.title strong{display:block;font-size:17px}.title small{display:block;color:#726b61;font-size:12px}.status{display:grid;grid-template-columns:1fr 1fr;gap:6px}.status-card{background:#fff;border:1px solid #d0c7b8;border-radius:12px;padding:7px 9px;min-width:0}.status-card b{font-size:12px;display:block;color:#665f55}.status-card span{font-size:13px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:4px}.time-grid div{background:#f5f1e9;border-radius:7px;text-align:center;padding:2px}.time-grid small{display:block;font-size:9px;color:#777}.time-grid strong{font-size:12px}.scene{min-height:0;background:#fff;border:1px solid #d0c7b8;border-radius:18px;padding:14px;display:flex;flex-direction:column;justify-content:center;overflow:auto}.phase{font-size:13px;font-weight:900;letter-spacing:.08em;color:#7a5c2e;text-transform:uppercase;margin-bottom:7px}.english{font-size:27px;line-height:1.25;font-weight:900;margin:0 0 5px}.jp{font-size:15px;color:#5f5950;margin:0 0 12px}.info{background:#f6f2e8;border-radius:13px;padding:10px 11px;font-size:14px;line-height:1.55;margin-top:5px}.info strong{font-size:17px}.word{display:inline-block;background:#fff;border:1px solid #ded5c6;border-radius:8px;padding:2px 7px;margin:2px}.word b{font-size:15px}.word small{font-size:11px;color:#766f66;margin-left:5px}.roll{font-size:13px;margin-top:7px;color:#675f55}.stats{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.stat{background:#eee8dc;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions.one{grid-template-columns:1fr}.btn{min-height:48px;border:1px solid #3e392f;border-radius:12px;background:#fff;font-size:16px;font-weight:850;padding:7px 10px;color:#222}.btn.primary{background:#2f2b25;color:#fff}.btn:active{transform:translateY(1px)}.tiny{font-size:11px;font-weight:600;display:block;opacity:.75;margin-top:2px}.oracle-badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:#e4dccb;color:#5c503d;font-weight:900;margin-bottom:6px}.calendar-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}.calendar-list div{background:#f6f2e8;border-radius:10px;padding:7px}.calendar-list small{font-size:10px;color:#777;display:block}.calendar-list b{font-size:14px}.notice{font-size:12px;color:#756e64;margin-top:8px}.inventory{font-size:12px;margin-top:5px;color:#665f55}@media(max-height:680px){.app{padding:6px;gap:5px}.scene{padding:10px}.english{font-size:22px}.jp{margin-bottom:7px}.btn{min-height:42px}.status-card{padding:5px 7px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a class="back" href="story-menu.html?v=20260903-2" aria-label="戻る">←</a>
    <div class="title"><strong>Magic School Adventure</strong><small>魔法学校と冒険の英語ゲーム</small></div>
  </div>
  <div class="status">
    <div class="status-card"><b>DATE / 日付</b><span id="dateShort"></span><span id="weekShort"></span></div>
    <div class="status-card"><b>TIME / 時間</b><span id="clockText"></span><div class="time-grid"><div><small>time<br>時間</small><strong id="timeVal"></strong></div><div><small>hour<br>時</small><strong id="hourVal"></strong></div><div><small>minute<br>分</small><strong id="minuteVal"></strong></div></div></div>
  </div>
  <main class="scene" id="scene"></main>
  <div class="actions" id="actions"></div>
</div>
<script>
const months=[['January','1月'],['February','2月'],['March','3月'],['April','4月'],['May','5月'],['June','6月'],['July','7月'],['August','8月'],['September','9月'],['October','10月'],['November','11月'],['December','12月']];
const weekdays=[['Sunday','日曜日'],['Monday','月曜日'],['Tuesday','火曜日'],['Wednesday','水曜日'],['Thursday','木曜日'],['Friday','金曜日'],['Saturday','土曜日']];
const weekNames=[['First week','第1週'],['Second week','第2週'],['Third week','第3週'],['Fourth week','第4週'],['Fifth week','第5週']];
const fruits=[['apple','リンゴ'],['banana','バナナ'],['orange','オレンジ'],['strawberry','イチゴ'],['lemon','レモン']];
const weather=[['sun','太陽'],['rain','雨'],['snow','雪'],['wind','風'],['blue sky','青空'],['hot','暑い'],['cold','寒い'],['warm','暖かい'],['cool','涼しい']];
const schoolItems=[['pen','ペン'],['pencil','鉛筆'],['notebook','ノート'],['book','本'],['textbook','教科書'],['dictionary','辞書'],['eraser','消しゴム'],['ruler','定規'],['pencil case','筆箱'],['bag','かばん'],['paper','紙']];
const lessons=[['history','歴史','Mind'],['science','理科','Mind'],['math','数学','Mind'],['music','音楽','Magic'],['art','美術','Magic'],['PE','体育','Body']];
const lunchFoods=[['salad','サラダ'],['soup','スープ'],['cake','ケーキ'],['bread','パン'],['rice','ご飯'],['egg','卵'],['fish','魚']];
const drinks=[['water','水'],['milk','牛乳'],['tea','お茶'],['coffee','コーヒー'],['juice','ジュース']];
const places=[['park','公園'],['sea','海'],['beach','浜辺'],['station','駅'],['library','図書館'],['shop','店'],['supermarket','スーパー'],['restaurant','レストラン'],['museum','博物館'],['zoo','動物園']];
const animals=[['dog','犬'],['cat','猫'],['bird','鳥'],['bear','クマ'],['horse','馬'],['cow','牛'],['pig','豚'],['sheep','羊'],['monkey','サル'],['rabbit','ウサギ']];
const plants=[['tree','木'],['flower','花'],['plant','植物'],['grass','草']];
const monsters=[['goblin','ゴブリン'],['orc','オーク'],['slime','スライム'],['dragon','ドラゴン']];
const colors=[['red','赤'],['blue','青'],['yellow','黄'],['green','緑'],['white','白'],['black','黒'],['brown','茶'],['orange','橙'],['pink','桃'],['purple','紫']];
const dinnerFoods=[['meat','肉'],['beef','牛肉'],['pork','豚肉'],['chicken','鶏肉'],['fish','魚'],['salad','サラダ'],['soup','スープ'],['bread','パン'],['rice','ご飯']];
const state={year:1,month:8,day:1,weekday:1,hour:7,minute:0,stage:'date',egg:0,body:0,mind:0,magic:0,fruit:null,weather:null,desk:null,item:null,lesson:null,lunch:null,drink:null,place:null,encounter:null,color:null,dinner:null,dinnerDrink:null};
const scene=document.getElementById('scene'),actions=document.getElementById('actions');
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function ordinal(n){const v=n%100;if(v>=11&&v<=13)return n+'th';switch(n%10){case 1:return n+'st';case 2:return n+'nd';case 3:return n+'rd';default:return n+'th'}}
function season(m){if([2,3,4].includes(m))return ['spring','春'];if([5,6,7].includes(m))return ['summer','夏'];if([8,9,10].includes(m))return ['fall / autumn','秋'];return ['winter','冬']}
function daysInMonth(m){return [31,28,31,30,31,30,31,31,30,31,30,31][m]}
function weekIndex(){return Math.min(4,Math.floor((state.day-1)/7))}
function ampm(){const h=state.hour;const hr=h===0?12:h>12?h-12:h;return `${hr}:${String(state.minute).padStart(2,'0')} ${h>=12?'p.m.':'a.m.'}`}
function updateTop(){document.getElementById('dateShort').textContent=`${months[state.month][0]} ${ordinal(state.day)}, ${weekdays[state.weekday][0]}`;document.getElementById('weekShort').textContent=`Year ${state.year} · ${weekNames[weekIndex()][0]} · ${season(state.month)[0]}`;document.getElementById('clockText').textContent=ampm();document.getElementById('timeVal').textContent=ampm();document.getElementById('hourVal').textContent=state.hour;document.getElementById('minuteVal').textContent=String(state.minute).padStart(2,'0')}
function setTime(h,m=0){state.hour=h;state.minute=m;updateTop()}
function word(en,ja){return `<span class="word"><b>${en}</b><small>${ja}</small></span>`}
function btn(label,jp,fn,primary=false){const b=document.createElement('button');b.className='btn'+(primary?' primary':'');b.innerHTML=`${label}<span class="tiny">${jp}</span>`;b.onclick=fn;actions.appendChild(b)}
function base(phase,en,jp,body=''){scene.innerHTML=`<div class="phase">${phase}</div><h1 class="english">${en}</h1><p class="jp">${jp}</p>${body}`;actions.innerHTML='';updateTop()}
function stats(){return `<div class="stats"><span class="stat">Body ${state.body}</span><span class="stat">Mind ${state.mind}</span><span class="stat">Magic ${state.magic}</span><span class="stat">Egg ${state.egg}</span></div>`}
function render(){
 if(state.stage==='date'){
  setTime(7,0);const s=season(state.month),w=weekNames[weekIndex()];
  base('DATE / 日付','Today','今日',`<div class="calendar-list"><div><small>year / 年</small><b>Year ${state.year}</b></div><div><small>month / 月</small><b>${months[state.month][0]}（${months[state.month][1]}）</b></div><div><small>week / 週</small><b>${w[0]}（${w[1]}）</b></div><div><small>day / 日</small><b>${ordinal(state.day)}（${state.day}日）</b></div><div><small>today / 今日</small><b>${weekdays[state.weekday][0]}（${weekdays[state.weekday][1]}）</b></div><div><small>season / 季節</small><b>${s[0]}（${s[1]}）</b></div></div><div class="notice">tomorrow＝明日 / yesterday＝昨日</div>`);
  btn('Morning','朝を始める',()=>{state.stage='egg';render()},true);return;
 }
 if(state.stage==='egg'){
  setTime(7,0);base('MORNING / 朝','I take an egg.','私は卵を取ります。',`${word('egg','卵')}<div id="result" class="info">鶏から egg を取ります。判定してください。</div>${stats()}`);
  btn('Roll','判定',()=>{const d=1+Math.floor(Math.random()*6);const ok=d>=3;if(ok)state.egg++;document.getElementById('result').innerHTML=`🎲 ${d} — <strong>${ok?'Success':'Fail'}</strong><br>${ok?'I get an egg.（卵を手に入れます。）':'I do not get an egg.（卵を取れません。）'}`;actions.innerHTML='';btn('Breakfast','朝食へ',()=>{state.stage='breakfast';render()},true)});return;
 }
 if(state.stage==='breakfast'){
  setTime(7,30);if(!state.fruit)state.fruit=rnd(fruits);const f=state.fruit;
  base('BREAKFAST / 朝食','I make fruit juice.','私はフルーツジュースを作ります。',`<span class="oracle-badge">FRUIT ORACLE / 果物オラクル</span><div class="info">${word(f[0],f[1])}<br><strong>${f[0]} juice</strong> — ${f[1]}ジュース<br>${state.egg?`I eat an egg.（私は卵を食べます。）`:'No egg.（卵はありません。）'}</div>`);
  btn('Fruit oracle','果物を引き直す',()=>{state.fruit=rnd(fruits);render()});btn('Weather','天気を見る',()=>{state.stage='weather';render()},true);return;
 }
 if(state.stage==='weather'){
  setTime(8,0);if(!state.weather)state.weather=rnd(weather);const w=state.weather;
  base('WEATHER / 天気','How is the weather?','天気はどうですか？',`<span class="oracle-badge">WEATHER ORACLE / 天気オラクル</span><div class="info">${word('weather','天気')} ${word(w[0],w[1])}<br><strong>Weather: ${w[0]}</strong> — 天気：${w[1]}</div>`);
  btn('Weather oracle','天気を引き直す',()=>{state.weather=rnd(weather);render()});btn('Go to magic school','魔法学校へ行く',()=>{state.stage='school';render()},true);return;
 }
 if(state.stage==='school'){
  setTime(9,0);if(!state.desk)state.desk=1+Math.floor(Math.random()*100);if(!state.item)state.item=rnd(schoolItems);const i=state.item;
  base('MAGIC SCHOOL / 魔法学校','Magic classroom','魔法教室',`<div class="info">${word('school','学校')} ${word('classroom','教室')} ${word('desk','机')} ${word('chair','椅子')}<br><strong>This is the ${ordinal(state.desk)} desk.</strong><br>これは${state.desk}番目の机です。<br><br><strong>“Open the textbook.”</strong><br>「教科書を開いてください」<br><br>Today’s item / 今日の学用品：${word(i[0],i[1])}</div>`);
  btn('School item oracle','学用品を引き直す',()=>{state.item=rnd(schoolItems);render()});btn('Special lesson','特別授業へ',()=>{state.stage='lesson';render()},true);return;
 }
 if(state.stage==='lesson'){
  setTime(10,0);if(!state.lesson)state.lesson=rnd(lessons);const l=state.lesson;
  base('SPECIAL LESSON / 特別授業',l[0],l[1],`<span class="oracle-badge">LESSON ORACLE / 授業オラクル</span><div class="info">Today’s special lesson is ${word(l[0],l[1])}.<br>今日の特別授業は${l[1]}です。<br><br>Finish the lesson → <strong>${l[2]} +1</strong></div>${stats()}`);
  btn('Lesson oracle','授業を引き直す',()=>{state.lesson=rnd(lessons);render()});btn('Finish class','授業を終える',()=>{if(l[2]==='Body')state.body++;if(l[2]==='Mind')state.mind++;if(l[2]==='Magic')state.magic++;state.stage='lunch';render()},true);return;
 }
 if(state.stage==='lunch'){
  setTime(12,0);if(!state.lunch)state.lunch=rnd(lunchFoods);if(!state.drink)state.drink=rnd(drinks);
  base('AFTERNOON / 昼','Lunch','昼食',`<div class="info"><strong>Food / 食べ物</strong><br>${word(state.lunch[0],state.lunch[1])}<br><br><strong>Drink / 飲み物</strong><br>${word(state.drink[0],state.drink[1])}</div>`);
  btn('Lunch oracle','昼食を引き直す',()=>{state.lunch=rnd(lunchFoods);state.drink=rnd(drinks);render()});btn('Adventure','冒険へ',()=>{state.stage='adventure';render()},true);return;
 }
 if(state.stage==='adventure'){
  setTime(15,0);if(!state.place)state.place=rnd(places);if(!state.color)state.color=rnd(colors);if(!state.encounter){const cat=rnd(['animal','plant','monster']);const pool=cat==='animal'?animals:cat==='plant'?plants:monsters;state.encounter={cat,val:rnd(pool)}}const e=state.encounter.val,c=state.color,p=state.place;
  base('ADVENTURE / 冒険','I walk to the '+p[0]+'.',`私は${p[1]}へ歩いて行きます。`,`<span class="oracle-badge">PLACE + ENCOUNTER ORACLE</span><div class="info">${word(p[0],p[1])}<br><br><strong>I see a ${c[0]} ${e[0]}.</strong><br>私は${c[1]}い${e[1]}を見ます。<br>${word(c[0],c[1])} ${word(e[0],e[1])}<br><br>Magic tools / 魔法道具：<br>${word('pen','ペン → 魔法の小型ナイフ')} ${word('pencil','鉛筆 → 魔法を書く')} ${word('notebook','ノート → 術札を記録')}</div>`);
  btn('Adventure oracle','場所と遭遇を引き直す',()=>{state.place=rnd(places);state.color=rnd(colors);state.encounter=null;render()});btn('Evening','夕方へ',()=>{state.stage='evening';render()},true);return;
 }
 if(state.stage==='evening'){
  setTime(18,0);base('EVENING / 夕方','I go back to town.','私は町へ戻ります。',`<div class="info">${word('evening','夕方')} ${word('town','町')} ${word('restaurant','レストラン')}<br><br>I walk to a restaurant.<br>私はレストランへ歩いて行きます。</div>`);
  btn('Dinner','夕食へ',()=>{state.stage='dinner';render()},true);return;
 }
 if(state.stage==='dinner'){
  setTime(19,0);if(!state.dinner)state.dinner=rnd(dinnerFoods);if(!state.dinnerDrink)state.dinnerDrink=rnd(drinks);
  base('DINNER / 夕食','Dinner at a restaurant','レストランで夕食',`<div class="info"><strong>Food / 食べ物</strong><br>${word(state.dinner[0],state.dinner[1])}<br><br><strong>Drink / 飲み物</strong><br>${word(state.dinnerDrink[0],state.dinnerDrink[1])}<br><br>I eat ${state.dinner[0]}. / I drink ${state.dinnerDrink[0]}.</div>`);
  btn('Dinner oracle','夕食を引き直す',()=>{state.dinner=rnd(dinnerFoods);state.dinnerDrink=rnd(drinks);render()});btn('Night','夜へ',()=>{state.stage='night';render()},true);return;
 }
 if(state.stage==='night'){
  setTime(21,0);base('NIGHT / 夜','I sleep.','私は眠ります。',`${word('night','夜')} ${word('sleep','眠る')}<div class="info">Today is finished. — 今日が終わりました。<br>Tomorrow starts after sleep. — 眠ると明日が始まります。</div>${stats()}`);
  btn('Sleep','眠る',nextDay,true);return;
 }
}
function nextDay(){state.day++;state.weekday=(state.weekday+1)%7;if(state.day>daysInMonth(state.month)){state.day=1;state.month++;if(state.month>11){state.month=0;state.year++}}state.stage='date';state.fruit=state.weather=state.desk=state.item=state.lesson=state.lunch=state.drink=state.place=state.encounter=state.color=state.dinner=state.dinnerDrink=null;render()}
render();
</script>
</body>
</html>
