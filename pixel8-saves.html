<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7fb">
  <title>ドット絵セーブ</title>
  <link rel="stylesheet" href="css/style.css?v=20260823-1401">
  <style>
    .menu-head{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;margin-bottom:18px}
    .menu-head h1{margin:0;text-align:center;font-size:22px}
    .back{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--brown);font-size:21px;font-weight:900;text-decoration:none}
    .note{margin:4px 4px 16px;text-align:center;font-size:13px;line-height:1.7;color:#977582}
    .save-list{display:grid;gap:10px}
    .save-card{display:grid;grid-template-columns:78px 1fr 28px;gap:12px;align-items:center;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px}
    .preview{width:72px;height:72px;border:1px solid #d8ccd2;border-radius:10px;background:#f2eef0;image-rendering:pixelated}
    .save-copy{min-width:0}
    .save-copy strong{display:block;font-size:16px;margin-bottom:4px}
    .save-copy small{display:block;color:#977582;font-size:12px}
    .arrow{font-size:24px;color:#b68798}
    .empty{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 16px;text-align:center;color:#977582}
    .new-link{display:inline-flex;margin-top:14px;min-height:44px;align-items:center;justify-content:center;padding:0 18px;border-radius:12px;background:#3e3037;color:#fff;text-decoration:none;font-weight:800}
  </style>
<link rel="stylesheet" href="pixel-editor.css?v=20261007-4">
</head>
<body>
  <main class="app-shell">
    <header class="menu-head">
      <a class="back" href="pixel8-start.html" aria-label="戻る">←</a>
      <h1>続きから</h1>
      <span aria-hidden="true"></span>
    </header>

    <p class="note">保存したドット絵を選んでください。</p>
<div id="cloudSettingsMount"></div><p id="cloudListStatus" role="status"></p><button id="refreshCloud" type="button" class="new-link">GitHubの一覧を更新</button><h2>GitHubのセーブ</h2>
    <div id="saveList" class="save-list"></div>
    <h2>この端末の旧セーブ</h2><p class="note">開いて「GitHubへセーブ」を押すと新しい保存先へ移せます。</p><div id="legacyList" class="save-list"></div>
  </main>

<script src="js/pixel-cloud.js?v=20261007-4"></script>
<script src="js/pixel-save-list.js?v=20261007-4" data-size="8"></script>
</body>
</html>
