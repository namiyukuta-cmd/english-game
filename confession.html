<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#17100c">
  <title>手紙屋</title>
  <link rel="stylesheet" href="css/confession.css?v=20260823-0704">
</head>
<body>
  <main class="confession-stage" aria-label="手紙屋">
    <header class="confession-header">
      <a class="confession-back" href="story.html" aria-label="物語に戻る">←</a>
      <h1>手紙屋</h1>
      <span class="confession-header-space" aria-hidden="true"></span>
    </header>

    <section class="confession-panel" aria-label="依頼人">
      <p id="confessionText" class="confession-text"></p>
      <p id="speakerLine" class="speaker-line"></p>
    </section>

    <section class="word-rain-panel" aria-label="単語">
      <div class="confession-label-row">
        <p class="confession-label">単語</p>
        <p id="confessionProgress" class="confession-progress">会話 1 / 3</p>
      </div>
      <div id="wordRain" class="word-bank" aria-label="並び替える単語"></div>
    </section>

    <section class="answer-panel" aria-label="英文作成欄">
      <p class="answer-label">英文を作る</p>
      <div id="confessionAnswer" class="answer-box"></div>
      <div id="completedSentences" class="completed-sentences" aria-label="完成した英文"></div>
      <p id="confessionFeedback" class="confession-feedback" aria-live="polite"></p>
      <div class="confession-actions">
        <button id="resetConfession" class="confession-button secondary" type="button">選びなおす</button>
        <button id="submitConfession" class="confession-button" type="button">決定</button>
      </div>
      <button id="writeLetterButton" class="write-letter-button hidden" type="button">手紙を書く</button>
    </section>

    <section id="letterPanel" class="letter-panel hidden" aria-hidden="true" aria-label="完成した手紙">
      <p class="letter-kicker">完成した手紙</p>
      <div id="letterText" class="letter-text"></div>
      <a class="letter-return" href="story.html">店に戻る</a>
    </section>
  </main>

  <script src="data/words/grade1/term1.js"></script>
  <script src="data/words.js"></script>
  <script src="js/storage.js?v=20260822-2115"></script>
  <script src="data/requesters.js?v=20260822-2238"></script>
  <script src="data/letter-content.js?v=20260822-2238"></script>
  <script src="js/confession.js?v=20260822-2238"></script>
</body>
</html>
