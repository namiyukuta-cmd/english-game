<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#17100c">
  <title>懺悔</title>
  <link rel="stylesheet" href="css/confession.css?v=20260822-2047">
</head>
<body>
  <main class="confession-stage" aria-label="懺悔">
    <header class="confession-header">
      <a class="confession-back" href="story.html" aria-label="物語に戻る">←</a>
      <h1>懺悔</h1>
      <span class="confession-header-space" aria-hidden="true"></span>
    </header>

    <section class="confession-panel" aria-label="訪問者">
      <p id="confessionText" class="confession-text"></p>
    </section>

    <section class="word-rain-panel" aria-label="語られる言葉">
      <p class="confession-label">語られる言葉</p>
      <div id="wordRain" class="word-rain"></div>
    </section>

    <section class="answer-panel" aria-label="聞き取り欄">
      <p class="answer-label">聞き取った言葉</p>
      <div id="confessionAnswer" class="answer-box"></div>
      <p id="confessionFeedback" class="confession-feedback" aria-live="polite"></p>
      <div class="confession-actions">
        <button id="resetConfession" class="confession-button secondary" type="button">やり直す</button>
        <button id="submitConfession" class="confession-button" type="button">神に渡す</button>
      </div>
    </section>
  </main>

  <script src="data/words/grade1/term1.js"></script>
  <script src="data/words.js"></script>
  <script src="js/storage.js"></script>
  <script src="data/confessions.js"></script>
  <script src="js/confession.js"></script>
</body>
</html>
